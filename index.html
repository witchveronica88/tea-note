산업용 부품으로 활용된다. (예: 애자, 내화물, 전자부품용 기판)","ind":22,"bul":true},{"k":"h2","text":"□ 도기와 자기의 분류"},{"k":"h3","text":"1. 도기와 자기의 분류"},{"k":"p","html":"<b>Keyword:</b> 유약의 유무, 소성온도(자화 여부), 태토의 종류","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>구분</b></div></th><th><div><b>시기</b></div></th><th><div><b>조건 (원인)</b></div></th><th><div><b>경과</b></div></th><th><div><b>결과 및 대표 예</b></div></th></tr><tr><td><div>토기</div></td><td><div>선사 시대</div><div>(구석기~신석기)</div></td><td><div>* 점토 사용</div><div>* 노천소성 (600~1000도)</div></td><td><div>가마가 없어 온도 상승 한계, 자화(자기화) 미발생</div></td><td><div>* 경도 및 내구력 매우 낮음</div><div>* 예: 빗살무늬토기, 민무늬토기</div></td></tr><tr><td><div>도기</div></td><td><div>고대 시대</div><div>(청동기~철기 이후)</div></td><td><div>* 점토 사용</div><div>* 가마 산화소성 (800~1200도)</div></td><td><div>소성 중 재가 붙어 코팅되는 현상에서 착안, 인위적 유약 사용 시작</div></td><td><div>* 부분적 자화 발생</div><div>* 예: 옹기, 기와, 도기타일</div></td></tr><tr><td><div>연질자기</div></td><td><div>근세 이전</div><div>(~1800년대 이전)</div></td><td><div>* 점토 사용 및 유약 도포</div><div>* 가마·풀무 사용 (1200도 안팎)</div></td><td><div>초고온 화도를 확보하지 못해 충분한 자화가 이루어지지 못함</div></td><td><div>* 자기 형태이나 무르고 내구성 낮음</div><div>* 예: 마욜리카, 델프트, 메디치 자기</div></td></tr><tr><td><div>경질자기</div></td><td><div>근현대</div><div>(1800년대 이후)</div><div> ※ 동양은 11세기 선행</div></td><td><div>* 고령토 등 특수 소재, 유약 도포</div><div>* 1350도 이상 초고온 환원소성</div></td><td><div>초고온을 견디는 재질과 화학 공정 결합으로 완벽한 자화(유리화) 달성</div></td><td><div>* 흡수율 없음, 경도·내구성 극대화</div><div>* 예: 백자, 청자, 이마리·마이센 자기</div></td></tr><tr><td><div>산업용자기</div></td><td><div>현대</div><div>(20세기 이후~)</div></td><td><div>* 알루미나, 티탄, 활석 등 고도로 정제된 원료 사용</div></td><td><div>절연, 내열 등 공업/산업적 목적에 맞춰 물리적 특성을 인위적으로 조정</div></td><td><div>* 식기가 아닌 산업용 특수 부품 활용</div><div>* 예: 애자, 내화물, 전자부품용 기판</div></td></tr></table>"},{"k":"h4","text":"가. 토기 [시기: 선사 시대 (구석기~신석기)]"},{"k":"p","html":"<b>조건:</b> 점토를 빚어 가마 없이 불에 직접 굽는 노천소성 방식을 사용한다. (600~1000도, 불에 직접 닿는 부분은 주로 600도 이하).","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 가마가 없어 온도를 일정 수준 이상 높일 수 없으므로 자화가 일어나지 않는다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 경도와 내구력이 크게 떨어진다. (대표 예: 빗살무늬토기, 민무늬토기)","ind":22,"bul":true},{"k":"h4","text":"나. 도기 [시기: 고대 시대 (청동기~철기 이후)]"},{"k":"p","html":"<b>조건:</b> 점토를 사용하며, 가마의 발명으로 800~1200도의 산화소성이 가능해진다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 소성 중 가마 속의 흩날리는 재가 기물에 붙어 자연적으로 코팅(자연유)되는 현상에서 착안하여, 인위적인 유약 사용이 시작된다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 부분적인 자화가 일어난다. 목적에 따라 유약을 바르기도 하고 바르지 않기도 한다. (대표 예: 옹기, 기와, 도기타일)","ind":22,"bul":true},{"k":"h4","text":"다. 연질자기 [시기: 근세 이전 (~1800년대 이전)]"},{"k":"p","html":"<b>조건:</b> 점토에 유약을 바르고 가마와 풀무를 이용해 1200도 안팎에서 소성한다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 초고온의 화도를 확보하지 못해 충분히 자화되지 못하는 과도기적 한계가 있다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 자기의 형태를 띠나 경질자기에 비해 무르고 내구성이 낮다. (대표 예: 마욜리카 도기, 델프트 도기, 메디치 자기)","ind":22,"bul":true},{"k":"h4","text":"라. 경질자기 [시기: 근현대 (1800년대 이후 보편화)]"},{"k":"p","html":"<b>조건:</b> 고령토(카올린) 등 특수 소재를 빚어 유약을 바른 후, 가마와 풀무를 이용해 1350도 이상의 초고온에서 환원소성한다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 초고온 소성을 견디는 재질과 화학공정 기술이 결합하여 기물이 완벽한 자화(유리화)를 이룬다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 흡수율이 없고 경도와 내구성이 극대화된 완성형 자기로 발전한다. (대표 예: 백자, 청자, 이마리 자기, 마이센 자기, 자기타일)","ind":22,"bul":true},{"k":"h4","text":"마. 산업용·특수 자기 [시기: 현대 (20세기 이후~)]"},{"k":"p","html":"<b>조건:</b> 알루미나, 티탄, 활석 등 고도로 정제된 원료를 사용한다.","ind":22,"bul":true},{"k":"p","html":"<b>경과 및 결과:</b> 식기가 아닌 절연, 내열 등 공업/산업적 목적에 맞춘 특수 자기로 활용된다.","ind":22,"bul":true},{"k":"h3","text":"2. 자기와 사기"},{"k":"h4","text":"가. 용어의 이해"},{"k":"p","html":"<b>개념:</b> &#x27;사기(沙器)&#x27;와 &#x27;자기(磁器)&#x27;는 실질적으로 동일한 도자기를 지칭하므로 엄격히 구분할 필요가 없다.","ind":22,"bul":true},{"k":"p","html":"<b>대표 예:</b> 분청사기(분청자) 등 역사적 명칭에서도 사기와 자기가 혼용되어 쓰인다.","ind":22,"bul":true},{"k":"h4","text":"나. 원료에 따른 재질 특성 (원인 및 결과)"},{"k":"p","html":"<b>도기 (점토 기반):</b> 흙의 성질이 일반적인 &#x27;점토(찰흙)&#x27;에 가까움.","ind":22,"bul":true},{"k":"p","html":"<b>자기 (고령토 기반):</b> 자기가 되기 위해서는 고온을 견디는 &#x27;고령토(카올린)&#x27; 등의 특수 광물이 필수적으로 들어가야 하며, 이 원료의 특성상 대부분 굽고 난 후 백색을 띤다.","ind":22,"bul":true},{"k":"p","html":"<b>고백자 (최상급 자기):</b> 흙 속의 불순물을 극도로 제한하고 굉장히 고도로 정제된 백색 흙만을 사용하여 제작한다.","ind":22,"bul":true},{"k":"h4","text":"다. 경덕진 삼보(三寶)의 의의"},{"k":"p","html":"중국의 대표적 자기(백자) 생산지인 경덕진의 &#x27;삼보&#x27;(고품질 도석 원료 산지 및 도자 마을) 사례에서 보듯, 우수한 자기의 완성은 흙의 정제도와 우수한 백색 원료 확보에 좌우된다.","ind":22,"bul":true},{"k":"h2","text":"□ 가마의 의미와 종류"},{"k":"p","html":"자사기는 소성 중에 물리·화학적 변화를 거치며 중량 및 체적의 감소, 기공률과 흡수율의 확정, 색상의 변화, 경도의 증가 등의 변화가 발생하게 되는데, 소성에 사용되는 가마의 종류는 이러한 소결의 결과에 큰 영향을 미치게 된다.","ind":0,"bul":false},{"k":"h3","text":"1. 가마의 의미"},{"k":"p","html":"열을 가두어 도자기를 굽는(소성) 단열 상자 형태의 핵심 설비.","ind":22,"bul":true},{"k":"h3","text":"2. 열 흐름의 형태에 따른 가마 분류"},{"k":"p","html":"<b>승염식(昇焰式):</b> 열이 아래에서 위로 바로 빠져나가는 구조.","ind":22,"bul":true},{"k":"p","html":"<b>도염식(倒焰式):</b> 열이 위로 올라갔다가 다시 아래로 순환하며 빠져나가는 구조.","ind":22,"bul":true},{"k":"h3","text":"3. 소성 진행 방식에 의한 분류"},{"k":"p","html":"기물의 로테이션(가마 내부 이동 및 교체 방식)을 어떻게 처리하는가에 따른 구분.","ind":22,"bul":true},{"k":"h3","text":"4. 사용 연료에 따른 구분"},{"k":"h4","text":"가. 전기가마"},{"k":"p","html":"전기를 열원으로 사용하며, 레일(컨베이어 벨트)식 적용이 가능하다.","ind":22,"bul":true},{"k":"p","html":"오븐처럼 순식간에 고온에 도달한다.","ind":22,"bul":true},{"k":"p","html":"특정 색감을 내는 데 유리하다.","ind":22,"bul":true},{"k":"h4","text":"나. 가스가마"},{"k":"p","html":"가스를 연료로 사용하며, 갑발(보호 용기)을 씌우지 않고 기물을 직접 굽는다.","ind":22,"bul":true},{"k":"p","html":"재가 날리지 않는 환경에서 장시간 구워내어 기물 표면의 기포를 조밀하게 만든다.","ind":22,"bul":true},{"k":"p","html":"재 자국이 남지 않으며, 인위적인 &#x27;불맛&#x27;을 낼 수 있다.","ind":22,"bul":true},{"k":"h4","text":"다. 기름가마"},{"k":"p","html":"중유를 연료로 사용하며, 순간 온도 및 평균 온도를 높게 설정한다.","ind":22,"bul":true},{"k":"p","html":"천천히 온도를 높여가며 소성한다.","ind":22,"bul":true},{"k":"p","html":"기물의 그림이나 발색이 더욱 선명하게(쨍하게) 나온다.","ind":22,"bul":true},{"k":"h4","text":"라. 장작가마"},{"k":"p","html":"목재를 연료로 쓰는 가장 원시적 형태. (다량의 목재와 넓은 공간 필요)","ind":22,"bul":true},{"k":"p","html":"충분한 예열을 거쳐 장시간 구워내며, 흩날리는 재로부터 기물을 보호하기 위해 반드시 &#x27;갑발&#x27; 안에 넣는다.","ind":22,"bul":true},{"k":"p","html":"그림이 부드럽게 발색된다.","ind":22,"bul":true},{"k":"note","html":"※ 현재 중국에서는 환경오염 문제로 금지하는 추세다","ind":22,"bul":false},{"k":"h3","text":"5. 불꽃과 피소성물과의 접속 상황에 따른 분류"},{"k":"p","html":"불꽃이 기물에 직접 닿는지에 따라 나눈다. 직접 닿게 굽는 방식은 재가 내려앉아 자연유나 불맛이 생기고, 갑발 등으로 기물을 감싸 불꽃과 재를 차단하는 방식은 색이 균일하게 나온다. 앞의 「라. 장작가마」에서 갑발을 쓴다고 한 것이 후자에 해당한다.","ind":0,"bul":false},{"k":"h3","text":"6. 가마 형태(형식)에 따른 분류"},{"k":"p","html":"가마 몸체의 생김새와 배치에 따른 분류다. 경사면을 따라 여러 칸을 이어 올린 등요·용요, 하나의 방으로 된 단실요, 열이 위에서 아래로 도는 원형 도염요, 기물을 실어 통과시키는 터널요 등으로 나뉜다. 뒤의 「의흥의 현대 자사가마」에 나오는 터널식 가스가마와 용요가 이 분류에 해당한다.","ind":0,"bul":false},{"k":"h3","text":"7. 소성 목적에 따른 분류"},{"k":"h2","text":"□ 산화소성과 환원소성 (소성분위기)"},{"k":"p","html":"소성의 온도는 자사기의 기공률과 흡수율 즉 소결도를 결정하며, 가마 내부의 분위기는 자사기의 표면 색감과 관련된 예술성을 좌우한다.","ind":0,"bul":false},{"k":"h3","text":"1. 산화소성과 환원소성"},{"k":"h4","text":"가. 산화소성 (Oxidation Firing)"},{"k":"p","html":"<b>방식:</b> 가마 내부에 충분한 산소가 공급되는 환경(완전연소)에서 기물을 굽는 방식. 전기가마는 발열에 산소를 소모하지 않기 때문에, 공기가 부족하지 않아 기본적으로 산화소성 환경이 된다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 가마 내의 풍부한 산소가 기물 내부의 광물 성분과 결합하여 산화 반응을 일으킨다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 기물이 산소를 얻으면서 흙 속의 철 성분이 산화되어 주로 노란색·붉은색 계열로 발색된다.","ind":22,"bul":true},{"k":"h4","text":"나. 환원소성 (Reduction Firing)"},{"k":"p","html":"<b>방식:</b> 가마 내부로 들어가는 공기(산소)를 의도적으로 차단하여 산소가 부족한 불완전연소 상태로 굽는 방식.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 불완전연소로 인해 생성된 일산화탄소(CO)가 이산화탄소(CO₂)로 변하기 위해, 기물(태토) 속에 포함된 철의 산소를 강제로 빼앗는 환원 반응이 일어난다.","ind":22,"bul":true},{"k":"p","html":"Fe₂O₃ + CO → 2FeO + CO₂ (삼산화이철 + 일산화탄소 → 산화제일철 + 이산화탄소)","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 철이 산소를 잃으면서 기물이 푸른색이나 회흑색 계열로 발색된다. (푸른빛을 얻고자 할 때 산소를 막아버린다)","ind":22,"bul":true},{"k":"h4","text":"다. 중성소성 및 환경 통제 (Neutral Firing)"},{"k":"p","html":"<b>개념:</b> 산소가 넘치지도 부족하지도 않게 조절하여 산화와 환원의 중간 상태를 유지하는 소성 방식.","ind":22,"bul":true},{"k":"p","html":"<b>가스가마 통제:</b> 가스가마의 경우 외부 공기 주입구를 조절하여 소성 환경을 인위적으로 통제한다. (공기 주입구 개방 = 산화소성 / 공기 주입구 차단 = 환원소성)","ind":22,"bul":true},{"k":"h3","text":"2. 각 소성법의 특징"},{"k":"p","html":"산화소성은 산소가 충분한 상태에서 구워 철분이 산화되므로 노란색·붉은색 계열이 나오고, 가마 안의 분위기를 관리하기 쉬워 색이 안정적이다. 환원소성은 산소를 차단해 불완전연소를 유도하고, 그렇게 생긴 일산화탄소가 기물에서 산소를 빼앗아 가면서 푸른색 계열이 나온다. 그 중간이 중성소성이다.","ind":0,"bul":false},{"k":"h2","text":"□ 의흥의 현대 자사가마의 종류와 가마별 특징"},{"k":"h3","text":"1. 가마의 종류"},{"k":"p","html":"소유 방식에 따라 개인 가마와 소성실(공용) 가마, 소성 원료와 방법에 따라 전기가마, 가스가마, 터널식 가스가마, 장작가마, 용요(龍窯) 등으로 나뉜다.","ind":0,"bul":false},{"k":"h3","text":"2. 가마별 특징"},{"k":"h4","text":"가. 전기가마"},{"k":"p","html":"현대에 이르러 대량생산을 벗어나, 작가 스스로 흙의 배합부터 불의 온도까지 완벽히 통제하기 위해 개인 가마 체제(전기가마 등)로 전환된다.","ind":22,"bul":true},{"k":"h4","text":"나. 가스가마 (식요)"},{"k":"p","html":"기물을 넣고 빼는 셔틀(Shuttle) 방식의 가마","ind":22,"bul":true},{"k":"p","html":"일반적인 가스가마 형태로 작동한다.","ind":22,"bul":true},{"k":"h4","text":"다. 터널식 가스가마 (추판요)"},{"k":"p","html":"공산주의 체제 하에서 국가 주도의 대량생산이 요구되어 의흥에 자사창(1창~5창) 공장이 설립된다.","ind":22,"bul":true},{"k":"p","html":"50~100m에 이르는 거대하고 긴 터널식 가마를 통해 기물을 끊임없이 밀어내며 구워냄.","ind":22,"bul":true},{"k":"p","html":"막대한 물량의 자사호가 쏟아져 나온다.","ind":22,"bul":true},{"k":"p","html":"90년대 주니는 지금처럼 밝지 않았다","ind":22,"bul":true},{"k":"h4","text":"라. 장작가마"},{"k":"p","html":"가마를 통제할 수 있게 되면서, 좋은 진흙(니, 泥)을 찾고 그 안에서 우수한 모래(사, 砂)를 추출 및 배합하는 기초 작업의 중요성이 더욱 커진다.","ind":22,"bul":true},{"k":"p","html":"현재 경덕진이나 의흥에서는 비효율적인 장작가마를 거의 쓰지 않으며, 가끔 불완전 연소나 흩날리는 재의 효과(자연유)를 연출하기 위해 작은 장작가마만 제한적으로 사용한다.","ind":22,"bul":true},{"k":"h2","text":"□ 소성 후의 가공 — 정구와 포광"},{"k":"h3","text":"1. 정구(整口: 뚜껑과 입구 다듬기)"},{"k":"p","html":"<b>도입 배경 (이유):</b> 자사호 소성 시 몸통과 뚜껑의 수축률이 달라 형태 통제가 어려우며, 굽는 동안 둘이 들러붙는 것을 막기 위해 접합부에 알루미나 가루(내화재)를 바르기 때문이다.","ind":22,"bul":true},{"k":"p","html":"<b>작업의 변화 (과거 → 현대)</b>","ind":22,"bul":true},{"k":"p","html":"<b>과거:</b> 예전 골동 자사호들은 소성을 한 번만 진행했기 때문에 물리적으로 입구를 갈아내는 &#x27;정구&#x27; 과정을 거치지 않았다.","ind":40,"bul":true},{"k":"p","html":"<b>현대:</b> 2000년 전후부터 &#x27;정구호&#x27;가 본격적으로 시작됨. 요즘은 소성을 여러 번 거치며 어긋난 입구를 갈아내고 다시 흙물을 바르는 복잡한 과정을 거침.","ind":40,"bul":true},{"k":"p","html":"<b>최종 결과:</b> 형태적 완성도와 밀폐력은 높아졌으나, 인위적인 가공이 반복되어 자사 본래의 자연스러운 본질에서 조금 벗어난다는 평가를 받는다.","ind":22,"bul":true},{"k":"note","html":"※ 최근에는 골동 느낌을 살리기 위해 마케팅 목적으로 '정구하지 않음'을 내세워 판매하기도 한다."},{"k":"h3","text":"2. 포광(抛光: 표면 연마)"},{"k":"p","html":"<b>가공 목적 및 과정:</b> 차를 우려내며 자연스럽게 윤기가 도는 현상(양호)을 기다리지 않고, 빠른 판매를 목적으로 기물의 표면을 인위적으로 갈아 억지로 광을 냄.","ind":22,"bul":true},{"k":"p","html":"<b>최종 결과:</b> 물과 연마재를 이용해 표면을 매끄럽게 갈아낸 &#x27;수마호(水磨壺)&#x27; 등의 형태로 시장에 유통된다.","ind":22,"bul":true},{"k":"h1","text":"2강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 산화소성과 환원소성의 차이에 관하여 설명해 보세요."},{"k":"p","html":"가마 안의 산소 공급량에 따라 도자기의 소성 방식이 결정된다. 산화소성은 산소가 충분한 환경에서 도자기를 굽는 방식이다. 흙이 산소와 결합해 주로 붉거나 노란빛을 띤다. 산소를 소모하지 않는 전기가마에서 기본적으로 일어난다. 환원소성은 의도적으로 공기를 차단해 불완전연소를 유도하는 방식이다. 이때 발생한 일산화탄소가 흙 속에 있는 산소마저 뺏어오며, 도자기는 푸른빛이나 회흑색으로 변한다. 작업자는 가스가마의 밸브로 공기량을 조절해 산화와 환원, 그리고 중간 단계인 중성소성까지 자유롭게 통제한다. 전기가마에서도 내부에 특수 물질을 넣어 인위적인 환원 효과를 만들어낼 수 있다.","ind":0,"bul":false},{"k":"h3","text":"2. 도자기의 종류를 시유 유무와 소성 온도에 따라 분류해 보세요."},{"k":"p","html":"도자기는 도기와 자기를 합쳐 부르는 말이다. 유약의 유무와 굽는 온도에 따라 그 특성이 나뉜다. 상대적으로 낮은 온도에서 굽는 토기와 도기는 목적에 따라 유약을 바르기도 하고 바르지 않기도 한다. 반면 고온에서 구워내는 자기는 대부분 유약을 입혀 완성한다. 참고로 유약의 바탕이 되는 유리는 고대 사막에서 모래가 열에 녹아 유리구슬로 굳어진 것을 발견하면서 인류에게 알려졌다.","ind":0,"bul":false},{"k":"h3","text":"3. 중국의 각 시기별 제다 방법의 변천을 간략하게 설명해 보세요."},{"k":"h2","text":"□ 도자기의 정의와 변천"},{"k":"p","html":"도기 + 자기 = 도자기","ind":22,"bul":true},{"k":"h2","text":"□ 전통 도자기의 제작 과정"},{"k":"p","html":"① 원료채취","ind":22,"bul":false},{"k":"p","html":"② 원료선별","ind":22,"bul":false},{"k":"p","html":"③ 반죽","ind":22,"bul":false},{"k":"p","html":"④ 형태만들기 (조형)","ind":22,"bul":false},{"k":"p","html":"⑤ 문양새기기","ind":22,"bul":false},{"k":"p","html":"⑥ 1차건조","ind":22,"bul":false},{"k":"p","html":"⑦ 초벌구이","ind":22,"bul":false},{"k":"p","html":"⑧ 문양그리기 — 유하채(釉下彩) = 유약 밑에 그림 / 유상채(釉上彩) = 유약 위에 그림","ind":22,"bul":false},{"k":"p","html":"⑨ 유약입히기 — 자사호처럼 무유(無釉)도 있다. 유약을 구워내는 과정의 온도가 가장 높다.","ind":22,"bul":false},{"k":"p","html":"⑩ 재벌구이 (2차 소성) 및 완성 — 바른 유약을 완전히 녹여 기물에 코팅하고 완벽한 자화(자기화)를 이루기 위해, 초벌구이보다 훨씬 높은 최고 온도에서 구워내어 최종 완성","ind":22,"bul":false},{"k":"h2","text":"□ 도자기의 제조과정"},{"k":"h3","text":"1. 배토의 제작"},{"k":"p","html":"불순물을 거르고 원료를 배합해 성형하기 좋은 흙덩이를 만든다. 자사호는 원석 채굴 후 분쇄, 조합, 숙성의 과정을 거친다.","ind":0,"bul":false},{"k":"h3","text":"2. 성형"},{"k":"p","html":"물레나 틀을 이용해 기물의 형태를 잡는다. 자사호는 물레를 쓰지 않고 흙판을 두드리거나 이어 붙이는 수공예 방식(전수공법)으로 형태를 빚는다. 수축 속도 차이로 인한 기물의 균열을 막기 위해 그늘에서 서서히 수분을 뺀다.","ind":0,"bul":false},{"k":"h3","text":"3. 건조"},{"k":"p","html":"수축 속도 차이로 인한 기물의 균열을 막기 위해 그늘에서 서서히 수분을 뺀다.","ind":0,"bul":false},{"k":"h3","text":"4. 장식"},{"k":"p","html":"표면에 문양을 조각하거나, 유약의 아래(유하채) 또는 위(유상채)에 그림을 그린다.","ind":0,"bul":false},{"k":"h3","text":"5. 1차 소성"},{"k":"p","html":"기물이 부서지지 않을 정도의 강도를 주고, 이후 유약이 잘 스미도록 흡수성을 남겨 굽는다.","ind":0,"bul":false},{"k":"h3","text":"6. 시유"},{"k":"p","html":"기물에 유약을 바른다. 유약을 전혀 쓰지 않는 자사호는 이 과정을 생략한다.","ind":0,"bul":false},{"k":"h3","text":"7. 2차 소성"},{"k":"p","html":"고온에서 유약을 완전히 녹여 흙에 밀착시키고, 완벽한 자화(자기화)를 이루어 도자기를 최종 완성한다.","ind":0,"bul":false},{"k":"h2","text":"□ 도자기 재료(원료)의 종류와 특성"},{"k":"h3","text":"1. 가소성(점토질) 원료의 종류와 특성"},{"k":"p","html":"물을 머금으면 찰흙처럼 형태를 빚을 수 있는 도자기의 기본 뼈대(1차 원료)","ind":22,"bul":true},{"k":"p","html":"점토나 황토가 대표적이며, 실리카(규사)를 바탕으로 여러 물질과 결합해 기물의 형태를 유지한다.","ind":22,"bul":true},{"k":"h3","text":"2. 비가소성 원료 및 금속산화물의 종류와 특성"},{"k":"p","html":"물과 섞어도 점성이 생기지 않아 단독으로는 형태를 빚을 수 없는 원료다. 규석이나 장석 같은 광물이 대표적이며, 가소성 원료에 섞어 도자기가 고온을 견디는 힘(내화도)과 단단한 강도를 높이는 데 사용한다.","ind":22,"bul":true},{"k":"p","html":"도자기의 뼈대가 되는 &#x27;고령석&#x27; 자체는 점성이 없는 비가소성 원료지만, 이것이 오랜 시간 자연에서 풍화되어 찰기를 띠게 된 것이 가소성 원료인 &#x27;고령토&#x27;다. 특히 중국 경덕진 고령(高嶺) 지역에서 나는 양질의 고령토는 단단한 뼈대를 갖추고 있어 자기를 가장 높은 온도에서 구워낼 수 있게 한다.","ind":22,"bul":true},{"k":"p","html":"또한 도자기에 색을 낼 때는 금속산화물을 발색제로 사용하며, 이를 유약과 섞어 기물 표면에 안정적으로 정착시킨다. 한편, 과거부터 동물의 뼈를 태운 재(골회)를 흙에 섞어 굽는 본차이나(Bone China) 방식도 존재한다. 이는 일반 도자기보다 약간 낮은 온도에서 구워지며, 특유의 광택과 함께 옅은 노란빛이 도는 유백색을 띠는 것이 특징이다.","ind":22,"bul":true},{"k":"h2","text":"□ 유약의 사용 목적과 유약의 종류"},{"k":"p","html":"유약을 바르기 전 흙으로 빚은 바탕 몸체를 '태(胎)'라 하고, 태를 빚는 데 사용된 흙의 배합을 '소지'라 한다.","ind":22,"bul":true},{"k":"p","html":"유약을 바르지 않으면 기물이 물을 흡수해 오염되거나 팽창해 깨질 수 있다. 이를 막고 표면을 단단하게 코팅(유리화)하기 위해 유약을 바른다.","ind":22,"bul":true},{"k":"p","html":"유약을 사용하는 두 가지 이유","ind":22,"bul":true},{"k":"p","html":"<b>① 미적인 목적</b> — 기물 표면에 광택을 주고 다양한 색을 낸다.","ind":22,"bul":false},{"k":"p","html":"<b>② 기능성</b> — 기물 표면을 덮어 방수, 내산성, 위생성을 높인다.","ind":22,"bul":false},{"k":"p","html":"도자기에 색을 내는 발색제는 태(흙)에 직접 섞어 쓰기도 하고 유약에 타서 쓰기도 한다.","ind":22,"bul":true},{"k":"p","html":"주로 동(銅), 코발트, 망간, 철 등의 금속산화물을 발색제로 포함해 사용한다.","ind":22,"bul":true},{"k":"p","html":"같은 발색제라도 가마 내부가 산화냐 환원이냐에 따라 전혀 다른 색을 낸다.","ind":22,"bul":true},{"k":"p","html":"동 성분은 산화소성에서 녹색, 환원소성에서 붉은색을 띤다.","ind":22,"bul":true},{"k":"h2","text":"□ 원료와 배토의 조제"},{"k":"p","html":"공정은 원료 채광(선광·정제) → 분쇄 → 조합 → 혼합 및 수분 조절의 순서다.","ind":22,"bul":true},{"k":"p","html":"흙을 가공하는 기초 단계로, 채굴한 광석을 분류하고 이물질을 철저히 제거한다.","ind":22,"bul":true},{"k":"p","html":"뭉쳐지는 성질을 가진 가소성 원료(점토)가 도자기 흙의 베이스가 된다.","ind":22,"bul":true},{"k":"p","html":"점토는 입자가 미세하여 오랜 시간 퇴적층에 쌓여 만들어지므로, 주로 지층이 발달한 지역에서 도자기 문화가 발달했다.","ind":22,"bul":true},{"k":"p","html":"채광한 흙은 바로 쓰지 않고, 밖에서 몇 년간 비바람을 맞히며 잘게 부서지도록 풍화시키는 과정을 거친다.","ind":22,"bul":true},{"k":"p","html":"자사 원료는 채광할 때 원석의 층위와 상태를 꼼꼼히 살펴 우수한 것을 골라낸다.","ind":22,"bul":true},{"k":"p","html":"자사니(紫砂泥) 안에는 점성이 있는 점토질과 뼈대 역할을 하는 모래 성분(사질)이 자연스럽게 모두 포함되어 있다.","ind":22,"bul":true},{"k":"p","html":"물을 섞어 반죽하고 숙성하는 단계에서는 흙의 찰기를 높이고 내부 공기를 빼기 위해 수천 번 이상 강하게 두드린다(타니 공정).","ind":22,"bul":true},{"k":"p","html":"이 흙으로 형태를 빚어 가마에 구우면, 소성 과정에서 점토가 수축하며 표면에 모래 입자가 오톨도톨하게 도드라지는 융기(과립) 현상이 나타나기도 한다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사호의 가격지표"},{"k":"p","html":"X[흙] / Y[가공의 완성도, 기공] / Z[예술성, 작가]","ind":22,"bul":true},{"k":"h2","text":"□ 자사니의 가공"},{"k":"p","html":"자사 원광(원석)은 덩어리 크기가 클수록 가치가 높고 비싸다.","ind":22,"bul":true},{"k":"p","html":"반면 공장에서 미리 반죽해 놓은 흙은 잡물이 많이 섞여 있어 상대적으로 가격이 저렴하다.","ind":22,"bul":true},{"k":"p","html":"현대의 자사호 작가들은 흙을 직접 채광하고 가공하는 기술을 모르는 경우가 대부분이며, 주로 가공이 완료된 흙을 구입하여 조형 작업에만 집중한다.","ind":22,"bul":true},{"k":"p","html":"자사니는 불순물이 없는 순도가 가장 중요하다. 유명한 산지(예: 황룡산)의 흙이라도 이물질이 많이 섞이면 좋은 흙이 아니다. 비록 외곽 지역(외산)의 흙일지라도 순도만 높다면 훨씬 훌륭한 자사니가 될 수 있다.","ind":22,"bul":true},{"k":"p","html":"좋은 흙을 바탕으로 완성도 높은 자사호를 빚어내는 작가의 조형 기술과 불을 다루는 실력이 최종적인 품질을 좌우한다.","ind":22,"bul":true},{"k":"h3","text":"노니(老泥)의 의미 — 노자니 / 노주니"},{"k":"p","html":"노니가 함축하는 4가지 의미","ind":22,"bul":true},{"k":"p","html":"① 과거의 전통적인 방식으로 채광된 광석","ind":40,"bul":false},{"k":"p","html":"② 과거의 전통적인 방식으로 가공된 흙","ind":40,"bul":false},{"k":"p","html":"③ 과거 특유의 전통적인 느낌(색감, 입자, 형태)이 살아 있는 흙","ind":40,"bul":false},{"k":"p","html":"과거 골동호와 현대 시장의 차이","ind":22,"bul":true},{"k":"p","html":"<b>과거:</b> 골동 도록에 등장하는 훌륭한 옛 자사호들은 대부분 순도가 높은 진짜 노니로 제작되었다.","ind":40,"bul":true},{"k":"p","html":"<b>현대:</b> 최근 시장에서 &#x27;조장주니&#x27;나 &#x27;조장노주니&#x27;라는 타이틀을 달고 판매되는 흙들은 진짜 과거의 흙이라기보다, 현대의 흙을 배합하여 과거 노니 특유의 질감과 색감을 비슷하게 재현해 낸 경우가 많다.","ind":40,"bul":true},{"k":"h1","text":"3강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 광신소면의 의미와 관련하여 좋은 니료와 좋은 자사 차호의 조건을 설명해 보세요."},{"k":"p","html":"좋은 자사 차호의 바탕이 되는 흙(니료)의 가치는 '광신소면(光身素面)'이라는 말로 요약할 수 있다. 이는 '빛나는 몸체와 꾸밈없는 표면'을 뜻하며, 인위적으로 표면을 갈아내어 억지로 낸 광택이 아니라 흙 본연의 성질에서 자연스럽게 우러나오는 깊고 은은한 윤기를 의미한다.","ind":0,"bul":false},{"k":"p","html":"이러한 깊은 광택을 내는 좋은 니료가 되기 위해서는 먼저 태생적으로 불순물이 없는 높은 순도를 지녀야 한다. 또한 아무리 뛰어난 원료라도 오랜 시간 비바람을 맞으며 풍화되고 숙성(진부)되는 과정을 거쳐야만 비로소 그 진가를 발휘한다. 과거의 흙이 오늘날 가장 훌륭한 재료로 평가받는 이유 역시 흙 속에 이러한 긴 시간의 가치가 온전히 담겨 있기 때문이다.","ind":0,"bul":false},{"k":"p","html":"결국 좋은 자사 차호란 순도 높고 잘 숙성된 훌륭한 흙을 바탕으로 만들어진 기물을 말한다. 나아가 &#x27;보기 좋은 것이 기능도 좋다&#x27;는 원리에 따라, 우수한 재료 위에 뛰어난 조형미(디자인)와 차를 우리기 좋은 실용성이 완벽하게 조화를 이룰 때 비로소 진정한 명품 자사 차호가 완성된다.","ind":0,"bul":false},{"k":"h3","text":"2. 자사니료의 가공 과정을 간단히 설명해 보세요."},{"k":"note","html":"※ 2강 「□ 원료와 배토의 조제」·「□ 자사니의 가공」과 연관.","ind":14,"bul":false},{"k":"h2","text":"□ 도자기초이론 6 — 도자기의 성형방법"},{"k":"h3","text":"③ 형태만들기"},{"k":"p","html":"<b>핀칭 (Pinching):</b> 손으로 흙을 꼬집고 주무르면서 형태를 만들어 간다.","ind":22,"bul":true},{"k":"p","html":"<b>코일링 (Coiling):</b> 흙을 길고 둥글게 비벼 띠를 만든 뒤, 이를 층층이 쌓아 올려 형태를 만든다.","ind":22,"bul":true},{"k":"p","html":"<b>판성형 (Slab forming):</b> 흙을 얇고 납작한 판 모양으로 자른 뒤, 이 판들을 서로 이어 붙여 조형한다.","ind":22,"bul":true},{"k":"p","html":"<b>주입성형:</b> 정해진 틀(석고 등)에 묽은 흙물을 부어 넣어 굳혀서 형태를 떠낸다.","ind":22,"bul":true},{"k":"p","html":"<b>가압성형:</b> 틀(거푸집)에 흙을 넣고 압력을 가해 찍어내는 방식이다.","ind":22,"bul":true},{"k":"note","html":"※ 자사호 제작 시 틀을 보조적으로 활용하는 &#x27;반수공법&#x27;이 이에 해당한다.","ind":22,"bul":false},{"k":"p","html":"<b>속파기성형:</b> 흙덩이로 겉모양을 통째로 먼저 빚어둔 뒤, 기물 내부의 흙을 깎아 파내어 빈 공간을 만드는 비교적 최근의 방식이다.","ind":22,"bul":true},{"k":"p","html":"<b>물레성형:</b> 회전하는 물레의 원심력을 이용해 형태를 뽑아내는 일반적인 방식이다. 단, 자사(紫砂) 작업에서는 흙의 특성상 물레 성형법을 전혀 사용하지 않는다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사차호의 제작방법"},{"k":"h3","text":"1. 전수공법"},{"k":"p","html":"날축법(捏筑法) · 반축법(盤筑法) · 수날법(手捏法) · 타신통(打身筒) · 양신통(镶身筒)","ind":0,"bul":false},{"k":"p","html":"<b>수날법(手捏法):</b> 손으로 흙을 꼬집고 주무르면서 형태를 잡는 핀칭(Pinching) 기법이다.","ind":22,"bul":true},{"k":"p","html":"<b>날축법(捏筑法):</b> 흙을 길게 뽑아낸 뒤 쌓아 올려 형태를 만드는 방식이다.","ind":22,"bul":true},{"k":"p","html":"<b>반축법(盤筑法):</b> 흙을 둥글게 말아서 쌓아 올리는 코일링 기법으로, 형태를 잡을 때 물레성형과 비슷한 느낌을 준다.","ind":22,"bul":true},{"k":"p","html":"<b>타신통(打身筒):</b> 흙판을 나무 도구 등으로 때리고 두드려 곡선형의 둥근 몸통을 만들어 내는 전통 기법이다.","ind":22,"bul":true},{"k":"note","html":"※ 최근에는 흙벽을 세워 형태를 잡는 방식도 응용된다.","ind":22,"bul":false},{"k":"p","html":"<b>양신통(镶身筒):</b> 흙을 평평한 판으로 자른 뒤, 이 판들을 서로 이어 붙여 각진 기물을 만드는 판성형(Slab forming) 기법이다.","ind":22,"bul":true},{"k":"h3","text":"2. 반수공법"},{"k":"p","html":"전통 수작업에 거푸집(틀)을 보조적으로 결합하여 효율을 높인 모구성형(模具成型) 방식이다.","ind":22,"bul":true},{"k":"p","html":"몸통은 전수공 방식으로 직접 두드려 만들고, 손잡이나 차호의 부리(물대) 등 덧붙이는 부위는 형태가 일정한 틀을 이용해 찍어내는 식으로 작업한다.","ind":22,"bul":true},{"k":"h3","text":"3. 비정통적 방법"},{"k":"p","html":"전통적인 자사호 제작에서는 절대 쓰지 않으며, 오직 흙을 대량생산 공정에 맞게 가공하여 찍어낼 때만 사용하는 방식이다.","ind":0,"bul":false},{"k":"p","html":"<b>관장호(灌漿壺):</b> 묽은 흙물을 석고 틀 등에 부어 넣고 굳혀 떠내는 주입성형 방식으로 만든 차호다.","ind":22,"bul":true},{"k":"p","html":"<b>수랍배호(手拉坏壺):</b> 흙을 회전하는 물레에 올리고 원심력을 이용해 뽑아내는 물레성형 방식으로 만든 차호다.","ind":22,"bul":true},{"k":"h3","text":"4. 전수공 기법과 반수공 기법의 장단점"},{"k":"h4","text":"가. 전수공과 반수공 기법의 장단점 비교"},{"k":"p","html":"<b>전수공(全手工)</b>","ind":22,"bul":true},{"k":"p","html":"<b>장점:</b> 오직 손과 전통 도구만으로 빚어내어 세상에 하나뿐인 독창성과 예술적 희소성을 지닌다. 수많은 두드림(타신통)과 정성스러운 명침 과정을 통해 흙 본연의 결이 살아나며, 기물 내부에 수작업의 자연스러운 흔적이 남아 소장 가치가 높다.","ind":40,"bul":true},{"k":"p","html":"<b>단점:</b> 과정이 고되고 제작 시간이 오래 걸려 대량 생산이 불가능하며 가격이 비싸다. 또한, 작가의 숙련도에 따라 형태의 대칭이나 완성도에 편차가 크게 나타날 수 있다.","ind":40,"bul":true},{"k":"p","html":"<b>반수공(半手工)</b>","ind":22,"bul":true},{"k":"p","html":"<b>장점:</b> 거푸집(틀)을 보조적으로 사용하여 기물의 형태가 일정하고 대칭이 정확하다. 뚜껑과 몸통의 맞물림 등 기능적 안정성을 쉽게 확보할 수 있으며, 제작 속도가 빨라 생산 효율이 높고 가격이 합리적이다.","ind":40,"bul":true},{"k":"p","html":"<b>단점:</b> 규격화된 틀에 맞추어 제작하므로 전수공 특유의 자연스러운 선이나 작가 고유의 개성이 다소 반감된다. 공산품 같은 인상을 줄 수 있어 예술적 희소성 측면에서는 평가가 낮다.","ind":40,"bul":true},{"k":"h4","text":"나. 성형 방식과 지역적 니료 특성"},{"k":"p","html":"자사(紫砂)는 모래 성분(사질)이 많아 물레를 돌리기 어렵기 때문에 주로 전수공이나 반수공 방식을 쓴다.","ind":22,"bul":true},{"k":"p","html":"반면, 조주(潮州) 지역의 붉은색 공부차용 다구(조주호)는 물레를 이용한 수랍호 방식을 주로 사용한다.","ind":22,"bul":true},{"k":"h4","text":"다. 니료의 사(砂) 성분과 수축률"},{"k":"p","html":"<b>사질의 역할:</b> 사(砂)는 이색사(여러 색)와 단색사로 나뉜다. 사질은 흙 안에서 고정된 뼈대 역할을 하므로 많을수록 소성 시 수축이 적다.","ind":22,"bul":true},{"k":"p","html":"<b>주니와 사질:</b> 주니처럼 사질이 적은 흙은 수축이 아주 심하다. 주니는 색상만으로는 구분하기 어려우며 표면의 울퉁불퉁한 질감을 보고 판단한다. 굽기 전의 흙인 생사(生砂)와 한 번 구워서 깬 뒤 인위적으로 주입한 숙사(熟砂)를 혼합해 쓴다. (현대에는 기술이 발달해 과거보다 수축을 잘 통제한다.)","ind":22,"bul":true},{"k":"p","html":"<b>단니:</b> 단니에는 갈아 쓸 베이스 사질이 섞여 있다.","ind":22,"bul":true},{"k":"note","html":"※ 기물에 보이는 검은 점은 사질이 아닐 수 있으며 다양한 색을 내지 않는다.","ind":22,"bul":false},{"k":"h4","text":"라. 소결(Sintering)과 통기성"},{"k":"p","html":"1250도 이상의 고온에서 구우면 흙 입자가 유리처럼 녹아붙어 소결이 잘 이루어진다.","ind":22,"bul":true},{"k":"p","html":"반면 완전히 소결되지 않은 부분은 미세한 틈이 남아 기물이 숨을 쉴 수 있으며, 이 틈으로 찻물이 스며들어 차때가 생기는 등 양호가 될 여유 공간이 된다.","ind":22,"bul":true},{"k":"h4","text":"마. 명침(明針) 공정 (전수공의 핵심 마무리)"},{"k":"p","html":"자사호 제작의 완성도와 품격을 결정하는 매우 고된 마무리 작업이다.","ind":22,"bul":true},{"k":"p","html":"소뿔, 플라스틱, 천 등 매끄러운 도구로 덜 건조된 기물 표면을 수없이 문지른다. 이때 거친 모래 입자는 안으로 밀어 넣고 고운 진흙(니질)을 겉으로 끌어올려 표면을 매끄럽게 하고 은은한 윤기를 낸다.","ind":22,"bul":true},{"k":"p","html":"<b>전수공의 흔적:</b> 명침을 하며 거친 사질과 이물질이 기물 안쪽으로 밀려 들어가는데, 내부에 남은 이 흔적이 바로 전수공으로 만들었다는 결정적 증거가 된다.","ind":22,"bul":true},{"k":"p","html":"과거에는 뼈처럼 단단하고 사질이 많은 흙을 써서 강하게 명침했으나, 흙이 부드러워진 현대에는 플라스틱이나 천으로도 작업이 가능하다.","ind":22,"bul":true},{"k":"h2","text":"□ 전수공과 반수공의 구별"},{"k":"h3","text":"1. 외관 특징"},{"k":"p","html":"<b>흙물과 수축:</b> 밑판과 벽면 사이가 이어지는 부분의 흙물 마감 상태를 확인하고, 흙판을 두드려 만들 때 발생하는 자연스러운 표면 수축 형태를 살핀다.","ind":22,"bul":true},{"k":"p","html":"<b>도장과 글씨:</b> 기물에 찍힌 도장과 내부 글씨체도 구별의 참고 기준이 된다.","ind":22,"bul":true},{"k":"p","html":"<b>태양문의 한계:</b> 뚜껑 안쪽의 방사형 무늬인 &#x27;태양문&#x27;은 전수공과 반수공 모두에서 나타날 수 있어 결정적인 구별 기준이 되지 못한다.","ind":22,"bul":true},{"k":"p","html":"<b>전수공호의 인정 범위:</b> 엄밀하게는 주전자 뚜껑까지 모두 수작업이어야 하나, 일반적으로는 몸통만 전수공으로 제작되어도 전수공호로 인정하는 추세다.","ind":22,"bul":true},{"k":"h3","text":"2. 내부 특징"},{"k":"p","html":"<b>전수공의 내부:</b> 몸통을 두드려 만들기 때문에 안쪽에 흙판을 이어 붙인 자국, 두들긴 흔적, 도구 자국이나 손자국이 자연스럽게 남는다. 부위마다 두께도 미세하게 고르지 않다.","ind":22,"bul":true},{"k":"p","html":"<b>반수공의 내부:</b> 석고 틀을 사용해 누르기 때문에 내부 표면이 매끄럽고 두께가 균일하다. 간혹 석고 틀이 맞물렸던 이음선이 곧고 희미하게 남아 있는 경우가 있다.","ind":22,"bul":true},{"k":"p","html":"<b>기타 확인 요소:</b> 손잡이와 부리(물대)를 몸통에 접합할 때 밀려 나온 안쪽 흙의 마감 상태, 출수를 위해 뚫은 기공의 방향과 흔적 등을 종합적으로 살핀다.","ind":22,"bul":true},{"k":"h1","text":"4강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 자차, 자아차, 자조차에 대해 설명해 보세요."},{"k":"p","html":"<b>자견차(紫娟茶):</b> 인공적으로 품종을 개량하여 찻잎과 줄기가 모두 짙은 자줏빛을 띠게 만든 재배종 차나무를 말한다. 안토시아닌 함량이 매우 높은 것이 특징이다.","ind":22,"bul":true},{"k":"p","html":"<b>자아차(紫芽茶):</b> 야생 차나무가 햇빛 등 자연환경의 영향을 받아 돌연변이를 일으켜, 새순(싹) 부분만 자줏빛으로 변한 찻잎을 말한다.","ind":22,"bul":true},{"k":"p","html":"<b>자조차(紫條茶):</b> 돌연변이의 일종으로, 잎뿐만 아니라 뻗어 나온 줄기(조) 부분까지 전체적으로 붉은 자줏빛을 띠는 찻잎을 말한다.","ind":22,"bul":true},{"k":"h3","text":"2. 자사니의 가공 중 쇄니와 진부의 역할에 대해 설명해 보세요."},{"k":"p","html":"<b>쇄니(曬泥) — 노천 풍화</b>","ind":22,"bul":true},{"k":"p","html":"채광한 자사 원광(돌덩어리)을 노천에 쌓아두고 오랜 시간 햇빛과 비바람에 노출시켜 자연적으로 풍화시키는 과정이다.","ind":40,"bul":true},{"k":"p","html":"단단한 광석이 자연스레 잘게 부서지도록 만드는 기초 단계로, 찻잎을 햇빛에 말리는 보이차의 &#x27;쇄청(曬靑)&#x27;과 유사한 개념이다.","ind":40,"bul":true},{"k":"p","html":"<b>진부(陳腐) — 숙성 및 안정화</b>","ind":22,"bul":true},{"k":"p","html":"풍화와 분쇄를 거친 흙을 물과 섞어 반죽한 뒤, 햇빛이 들지 않는 서늘한 그늘에 일정 기간 두어 숙성시키는 과정이다.","ind":40,"bul":true},{"k":"p","html":"보이차가 후숙 과정을 거치듯, 이 과정을 통해 흙 안의 유기물이 미생물에 의해 분해되면서 형태를 빚기 좋은 찰기(가소성)가 생기고 흙의 내부 구조가 단단하게 안정화된다.","ind":40,"bul":true},{"k":"note","html":"※ 2강 「□ 원료와 배토의 조제」의 '쌓아놓고 몇 년이 지남(풍화를 시킴)'과 연관.","ind":14,"bul":false},{"k":"h3","text":"3. 숙차의 악퇴 과정에서의 카페인 함량 변화 및 차 카페인과 커피 카페인의 작용상의 차이에 관해 설명해 보세요."},{"k":"p","html":"숙차를 만드는 약 한 달간의 악퇴(미생물 발효) 과정에서 찻더미 내부 온도는 60도 이상까지 올라간다.","ind":22,"bul":true},{"k":"p","html":"이 고온 다습한 환경에서 폴리페놀이나 카테킨 등 떫고 쓴맛을 내는 성분들은 분해되어 약 70%가 사라지고 30% 정도만 남는다.","ind":22,"bul":true},{"k":"p","html":"반면 카페인은 열에 비교적 안정적이어서 소실량이 적기 때문에, 다른 성분들이 줄어든 만큼 생차에 비해 숙차의 상대적인 카페인 함량 비율은 오히려 늘어난다.","ind":22,"bul":true},{"k":"p","html":"카페인은 뜨거운 물에 수초 내로 빠르게 녹아나오는 특성이 있으므로, 카페인 섭취를 낮추고 싶다면 첫 탕(세차)을 버린 후 마시는 것이 좋다.","ind":22,"bul":true},{"k":"p","html":"커피(에스프레소)는 고온·고압으로 짧은 시간에 카페인을 강하게 쥐어짜듯 추출하지만, 차는 물에 천천히 우려내므로 탕에 녹아드는 용출도 자체가 다르다.","ind":22,"bul":true},{"k":"note","html":"※ 커피의 경우 로스팅 시 수분이 날아가기 때문에 무게를 기준으로 재면 다크 로스팅 원두의 카페인 함량이 더 높게 측정되기도 한다.","ind":22,"bul":false},{"k":"p","html":"차에는 커피에 없는 아미노산 성분인 &#x27;테아닌(L-theanine)&#x27;과 &#x27;폴리페놀&#x27; 등이 풍부하다. 이 성분들이 카페인과 결합하여 카페인의 체내 흡수 속도를 늦추고 배출을 돕기 때문에, 커피처럼 가슴이 두근거리거나 급격한 각성(Caffeine Crash) 현상이 오지 않고 부드럽고 은은하게 작용한다.","ind":22,"bul":true},{"k":"note","html":"※ 보이차 길라잡이 교재의 숙차·악퇴 항목과 연관.","ind":14,"bul":false},{"k":"h2","text":"□ 자사 차호의 시대적 흐름과 조형의 분류"},{"k":"p","html":"명호, 주춘, 차별, 명병, 와호, 니호, 차구, 사기 등은 고금의 다양한 문헌에 기재된 자사 차호를 지칭하는 명칭들로, 각 시기별로 나타나는 자사 차호의 조형은 그 시대의 제작 성형 방법의 발달과 사회상을 함께 반영하고 있다.","ind":0,"bul":false},{"k":"h3","text":"1. 자사호 발전의 역사적 흐름"},{"k":"p","html":"<b>명나라 정덕 연간 (기원):</b> 공춘(供春)이라는 인물이 흙으로 나무 혹 모양을 본떠 차호를 빚으면서 본격적인 자사호의 역사가 시작된다.","ind":22,"bul":true},{"k":"p","html":"<b>명나라 말기 (기법의 집대성):</b> 동한(董翰), 조량(趙梁), 원창(元暢), 시붕(時朋) 등 명말 4대가가 등장해 자사호 제작의 기틀을 다진다. 특히 시붕의 아들인 시대빈(1573~1648)이 제작 기법을 정립하고 집대성하여, 실용구였던 자사호를 예술의 경지로 끌어올린다.","ind":22,"bul":true},{"k":"p","html":"<b>명말 청초 (소호의 유행):</b> 혜맹신(惠孟臣)이 등장하여, 진하게 우려 마시는 공부차(工夫茶) 문화에 알맞은 작은 크기의 자사호(소호) 시대를 새롭게 연다.","ind":22,"bul":true},{"k":"p","html":"<b>청나라 가경 연간 (문인호의 탄생):</b> 진홍수(호 만생)를 비롯한 당대 문인들이 차호의 설계와 장식에 직접 참여하면서, 문인의 정취와 시서화가 담긴 &#x27;만생호(曼生壺)&#x27;가 탄생한다.","ind":22,"bul":true},{"k":"p","html":"<b>민국 시기 (명인 공방 시대):</b> 뛰어난 기술을 가진 명가들이 개인 공방을 중심으로 활동하며 자사호 제작이 널리 성행한다.","ind":22,"bul":true},{"k":"p","html":"<b>현대 (국영 체제와 민영화):</b> 1950년대 이후 국가가 집중적으로 관리하는 국영 &#x27;자사창(紫砂廠)&#x27; 체제로 편입되어 생산되다가, 1997년에 자사창이 해산되면서 오늘날과 같은 개인 작가 중심의 민영화 시대로 넘어간다.","ind":22,"bul":true},{"k":"h3","text":"2. 자사 차호의 조형"},{"k":"p","html":"자사차호의 조형은 기하형체조형, 자연형체조형, 사물추상형체조형, 기타 조형 등으로 나뉜다. 위에서 살펴보았듯이 기하형체조형의 자사 차호는 시대를 불문하고 꾸준히 생산되었으나 다른 조형의 호들은 시기별로 편중되는 경향이 있으므로, 각각의 조형 스타일과 발전 추세 및 공예의 특징과 장식 예술 등을 간단하게 분류하여 정리할 필요가 있다.","ind":0,"bul":false},{"k":"p","html":"자사가 처음 시작된 명대에는 당시 널리 쓰이던 청동기나 경덕진 도자기의 일반적인 형태를 본떠 차호를 만들기 시작했다.","ind":22,"bul":true},{"k":"h4","text":"가. 기하형체조형 (= 광화 光貨)"},{"k":"p","html":"표면에 장식이 없고 매끄러운 형태(정면·소면)를 말한다. 장식이 많은 화기(花器)보다 오히려 완벽한 대칭과 균형을 잡아야 해서 만들기가 더 어렵다.","ind":22,"bul":true},{"k":"p","html":"<b>1) 원형차호 (원기조형 / 원호류):</b> 철구호, 방고호, 한편호 등이 있다. 기하학적 형태를 띠지만 다양한 변형이 존재한다. &#x27;원불일상(圓不一相)&#x27;이라는 말처럼 옥과 같이 둥글고 윤기가 나며 모든 부위가 둥근 것이 특징이다.","ind":22,"bul":true},{"k":"p","html":"<b>2) 방형차호 (방기조형 / 방호류):</b> 전로호, 승모호, 설화호 등 사각형이나 육각형 형태의 차호다. 모난 형태 안에도 둥근 느낌이 깃들어 있는 &#x27;방중우원(方中寓圓)&#x27;, 같은 방형이라도 형식이 다채로운 &#x27;방비일식(方非一式)&#x27;을 특징으로 한다.","ind":22,"bul":true},{"k":"h4","text":"나. 자연형체조형 (= 화화 花貨) — 어화룡호, 송죽매호, 하화호 등"},{"k":"p","html":"어화룡호, 송죽매호, 하화호 등 자연물(꽃, 나무 등)의 형태를 따온 조형이다.","ind":22,"bul":true},{"k":"p","html":"정형화되지 않은 형태에 나무의 결이나 꽃잎 등 세부 디테일 장식을 얼마나 섬세하게 잘 살리느냐가 관건이다. 역대 유명 작가들의 대표작 중에는 화기가 많다.","ind":22,"bul":true},{"k":"p","html":"세밀한 장식을 내야 하므로 흙에 모래(사질)가 너무 많으면 작업하기 어렵다. 따라서 화기에는 입자가 곱고 밋밋한 니료를 주로 쓴다. (반대로 니료 자체의 퀄리티를 볼 때는 사질이 잘 드러난 광기를 보는 것이 좋다.)","ind":22,"bul":true},{"k":"h4","text":"다. 사물추상형차호 — 합국호, 과릉호, 규화호 등"},{"k":"p","html":"합국호, 과릉호, 규화호 등 사물의 형태를 추상화하거나 국화꽃잎처럼 규칙적인 주름(골)을 낸 조형이다.","ind":22,"bul":true},{"k":"note","html":"※ 위로 손잡이가 달린 &#x27;제량호(提梁壺)&#x27; 형태를 띠기도 한다.","ind":22,"bul":false},{"k":"p","html":"작업 시간이 오래 걸려 흙이 마를 수 있으므로, 꽃잎 여러 장을 붙이거나 규칙적인 골을 내는 근문조형(筋紋造型)을 만들 때는 대부분 틀을 이용하는 반수공법을 쓴다. (무늬가 적을 때 극히 드물게 전수공으로 작업하는 작가도 있다.)","ind":22,"bul":true},{"k":"p","html":"틀로 찍어낸 장식을 얼마나 정교하게 다듬어 마무리하는지를 중요하게 평가한다. 조형과 마감이 뛰어나면서 훌륭한 니료까지 갖춘 작품은 찾기 힘들다.","ind":22,"bul":true},{"k":"h4","text":"라. 기타조형"},{"k":"h2","text":"□ 도자기 소지의 종류"},{"k":"p","html":"도자기 제작에 적합한 소지는 점력이 좋아야 하며, 높은 내화도, 낮은 수축률, 최소한의 철분 함량(색상이 좋아야 하기 때문)을 가질 것이 요구된다.","ind":0,"bul":false},{"k":"p","html":"소지란 도자기의 형태를 빚기 위해 흙과 돌(광물) 등의 재료를 인위적으로 배합하고 강제로 혼합한 바탕 흙을 말한다.","ind":22,"bul":true},{"k":"p","html":"화학적으로는 주로 실리카(SiO₂), 알루미나(Al₂O₃), 수분(H₂O) 등으로 구성되며, 배합 비율에 따라 다양하게 분류할 수 있다.","ind":22,"bul":true},{"k":"p","html":"&#x27;자사&#x27; 역시 세상에 존재하는 수많은 도자기 재료 중 하나에 속한다.","ind":22,"bul":true},{"k":"p","html":"특히 중국 의흥(宜興, 이싱) 지역에서 채광되는 고유의 광석을 가공하고 배합한 흙이 자사기(자사 차호)를 만드는 전용 재료가 된다.","ind":22,"bul":true},{"k":"h2","text":"□ 의흥의 3대 도토 (도기의 원료)"},{"k":"p","html":"의흥의 3대 도토와 특징 자사니가 본격적으로 쓰이기 전부터 중국 의흥(이싱) 지역에서 도자기 원료로 널리 쓰이던 대중적인 흙으로, 다음 세 가지가 대표적이다.","ind":22,"bul":true},{"k":"p","html":"<b>갑니(甲泥):</b> 껍질 흙 같은 느낌을 주는 가장 대중적인 흙으로, 갈색이나 고동색 등 다양한 색을 띤다.","ind":40,"bul":true},{"k":"p","html":"<b>눈니(嫩泥):</b> 질감이 부드러운 진흙으로, 황색이나 붉은색을 띤다.","ind":40,"bul":true},{"k":"p","html":"<b>백니(白泥):</b> 입자가 곱고 부드러운 백색 흙이다.","ind":40,"bul":true},{"k":"p","html":"이 일반적인 도토들은 자사니를 품고 있는 원석이자 &#x27;모태&#x27;가 된다. 도토(모태)의 질이 뛰어나야 그 안에서 좋은 자사니를 얻을 수 있으며, 질 좋은 원석일수록 순도 높은 흙을 더 많이 생산할 수 있다.","ind":22,"bul":true},{"k":"p","html":"갑니 덩어리 안에서 가장 고운 핵심 부분만을 선별하고 정제하여 자사호의 주원료인 자니(紫泥)를 만든다.","ind":22,"bul":true},{"k":"p","html":"자니로 쓸 부분을 빼낸 나머지 흙은 &#x27;폐토&#x27;가 된다. 이 폐토가 다시 섞여 들어가는 비율에 따라 자사니의 최종 순도와 품질이 결정된다. (자사니는 불순물이 없는 순도가 매우 중요하다.)","ind":22,"bul":true},{"k":"p","html":"<b>녹니(綠泥):</b> 푸른빛(청색)을 띠는 진흙으로, 구워내면 고동색 자사나 전통 옹기처럼 질감이 다소 거친 느낌을 준다.","ind":22,"bul":true},{"k":"p","html":"<b>자사기의 소성:</b> 송나라 때부터 만들어지기 시작한 자사기는 표면에 유약을 바르지 않는 무유도기(無釉陶器)다. 통상 1,100~1,200도 구간에서 구워내며, 니료의 물성에 따라 최대 1,350도 이상의 아주 높은 온도에서 소성되기도 한다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사 니료의 특징"},{"k":"p","html":"외산 / 석영·운모 계통의 퇴적형 점토","ind":0,"bul":false},{"k":"p","html":"자사니는 기본적으로 석영과 운모 계통의 광물이 퇴적되어 형성된 점토다.","ind":22,"bul":true},{"k":"p","html":"흙이 채광된 지역에 따라 정통 산지에서 캔 &#x27;본산(本山)&#x27;과 그 외곽 지역에서 캔 &#x27;외산(外山)&#x27;으로 나뉜다.","ind":22,"bul":true},{"k":"p","html":"&#x27;본산&#x27;은 곧 &#x27;정산(正山)&#x27;, 즉 오리지널 정통 산지를 뜻한다.","ind":22,"bul":true},{"k":"note","html":"※ 보이차의 이무정산, 자사호의 이싱 정촉진(丁蜀鎭) 등이 훌륭한 원료가 나는 대표적인 정통 산지다.","ind":22,"bul":false},{"k":"p","html":"본산의 흙이 좋다는 것은 자사의 모태가 되는 기본 도토의 품질 자체가 우수하다는 뜻이다.","ind":22,"bul":true},{"k":"p","html":"하지만 흙을 가공할 때 도토에서 핵심 자사니만 선별하고 남은 &#x27;폐토&#x27;가 얼마나 섞이느냐에 따라 최종 흙의 순도가 결정된다. 따라서 산지의 이름값(본산)보다 흙의 순도가 훨씬 중요하며, 불순물 없이 정제가 잘 되었다면 외산 흙이 본산 흙보다 질적으로 더 우수할 수도 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사호의 부위별 호칭"},{"k":"p","html":"신(身) · 취·류(觜/流) · 개(盖) · 기공(气孔) · 개판(盖板) · 연·장·순·경고·경(延/墙/唇/颈箍/颈) · 견(肩) · 구(扣) · 허판구(虚板口) · 편선(片线) · 적·개면(的/盖面) · 뉴(钮) · 저(底) · 취공·안(嘴空/眼) · 저편(底片) · 복·두(腹/肚) · 파·병(把/柄) · 수이(垂耳) · 족·각·권족(足/脚/圈足) · 저선(底线)","ind":0,"bul":false},{"k":"h3","text":"1. 뚜껑 부위 (개 蓋)"},{"k":"p","html":"<b>뉴(鈕):</b> 뚜껑 맨 위에 달린 손잡이(꼭지)다.","ind":22,"bul":true},{"k":"p","html":"<b>기공(氣孔):</b> 출수가 원활하도록 뚜껑에 공기가 통하게 뚫어 놓은 작은 구멍이다.","ind":22,"bul":true},{"k":"h3","text":"2. 몸통 부위 (신 身 / 복 腹)"},{"k":"p","html":"<b>구(口/扣):</b> 뚜껑이 덮이는 몸통 위쪽의 입구(주둥이)다.","ind":22,"bul":true},{"k":"p","html":"<b>경(頸):</b> 입구 아래쪽의 잘록하게 들어간 목 부분이다.","ind":22,"bul":true},{"k":"p","html":"<b>견(肩):</b> 몸통 위쪽의 완만하게 꺾이는 어깨 부분이다.","ind":22,"bul":true},{"k":"p","html":"<b>신(身)·복(腹/肚):</b> 찻물이 담기는 차호의 몸통(배) 전체를 말한다.","ind":22,"bul":true},{"k":"h3","text":"3. 출수 부위 (부리 / 취 嘴 / 류 流)"},{"k":"p","html":"<b>취(嘴)·류(流):</b> 차호의 몸통에서 뻗어 나와 찻물이 나오는 부리(물대)다.","ind":22,"bul":true},{"k":"p","html":"<b>취공(嘴空)·망공(網孔):</b> 찻잎을 거르고 물이 통과하도록 몸통 쪽에 뚫어 놓은 구멍이다. 과거에는 주로 구멍이 하나인 &#x27;단공(單孔)&#x27; 형태를 많이 썼다.","ind":22,"bul":true},{"k":"h3","text":"4. 손잡이 부위 (파 把 / 병 柄)"},{"k":"p","html":"<b>파(把)·병(柄):</b> 차호를 쥘 수 있도록 몸통 뒤쪽에 달린 손잡이다.","ind":22,"bul":true},{"k":"p","html":"<b>수이(垂耳):</b> 손잡이의 맨 아래쪽 끝부분에 코끼리 코 모양처럼 살짝 튀어나오게 장식한 부위다.","ind":22,"bul":true},{"k":"h3","text":"5. 바닥 부위 (저 底 / 족 足)"},{"k":"p","html":"<b>저(底):</b> 차호의 바닥 부위 전체를 통틀어 말한다.","ind":22,"bul":true},{"k":"p","html":"<b>저편(底片)·저선(底线):</b> 바닥 안쪽이 살짝 오목하게 들어가거나 경계를 이루는 부위다.","ind":22,"bul":true},{"k":"p","html":"<b>족(足)·각(脚)·권족(圈足):</b> 바닥을 지탱하기 위해 달린 다리 형태나 둥근 테두리 모양의 굽을 말한다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사 광구 개관"},{"k":"p","html":"<b>주요 광산 구역</b>","ind":22,"bul":true},{"k":"p","html":"향산(香山), 사산(砂山/沙山), 복우산(伏牛山), 조장, 보산, 청룡산(青龍山), 촉산(蜀山), 황룡산(黃龍山) 등 여러 지역에 걸쳐 자사 광구가 형성되어 있다.","ind":40,"bul":true},{"k":"p","html":"<b>채광 방식과 기술의 변화</b>","ind":22,"bul":true},{"k":"p","html":"<b>노천광 (표토채광):</b> 지표면 근처의 표층토(표토)를 캐내는 방식이다. 1950년대 이전에는 깊이 파고들어 갈 기술이 부족했기 때문에 주로 이 방식을 썼으며, 눈으로 보고 원하는 흙만 골라내는 이른바 &#x27;핀셋 채광&#x27;이 가능했다.","ind":40,"bul":true},{"k":"p","html":"<b>심정(深井) 채굴:</b> 레일 등을 이용해 땅속 깊은 곳으로 파고 내려가는 방식(예: 태서광구)이다. 1950년대 이후 국영 &#x27;자사창&#x27; 시기에 들어서며 본격적으로 도입되었다. 어두운 심정에서는 현장에서 흙을 정밀하게 골라내기(핀셋 채광)가 불가능하므로, 고도의 기술력을 이용해 채광하거나 일단 캐낸 후에 밖에서 흙을 선별하는 과정을 거쳐야 한다.","ind":40,"bul":true},{"k":"p","html":"<b>최고의 광석 산지, 4호정(四号井)</b>","ind":22,"bul":true},{"k":"p","html":"자사 광구의 여러 갱구 중에서도 4호정이 땅속으로 가장 깊게 들어간 곳이었다.","ind":40,"bul":true},{"k":"p","html":"역사상 가장 품질이 좋은 자사니가 생산된 전설적인 곳으로 꼽히나, 자원 보호 등을 이유로 2004년 이후 채광이 전면 금지되었다.","ind":40,"bul":true},{"k":"p","html":"<b>시대별 자사 시장과 재료의 흐름</b>","ind":22,"bul":true},{"k":"p","html":"<b>1950년대 이전:</b> 기술의 한계로 노천광에서 표토채광 위주로 작업했다.","ind":40,"bul":true},{"k":"p","html":"<b>1950년대 이후:</b> 자사창 시기에 진입하며 심정 채굴로 방식이 넘어갔다.","ind":40,"bul":true},{"k":"p","html":"<b>2000년대 초반:</b> (자사창 해산 후) 여러 시행착오가 있던 과도기적 시기다.","ind":40,"bul":true},{"k":"p","html":"<b>2005~2010년:</b> 대만 상인들의 집중적인 주문이 자사 재료와 시장 생산에 큰 영향을 미쳤다.","ind":40,"bul":true},{"k":"p","html":"<b>2010년 이후:</b> 중국 내수 시장의 급격한 성장으로 생산이 늘면서 품질의 편차가 매우 심해졌다. 그럼에도 불구하고 오늘날 시장에서는 품질에 상관없이 일단 좋은 흙임을 강조하기 위해 무분별하게 &#x27;정산(正山)&#x27;이라는 이름을 가져다 붙이는 경향이 있다.","ind":40,"bul":true},{"k":"h1","text":"5강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 본산흙과 외산흙의 차이에 대해 간략하게 설명해 보세요."},{"k":"p","html":"<b>본산과 외산의 개념 및 기본 품질</b>","ind":22,"bul":true},{"k":"p","html":"본산(本山)은 황룡산 일대 등에서 채굴된 정통 오리지널 흙을, 외산(外山)은 그 외곽 지역에서 캔 흙을 말한다.","ind":40,"bul":true},{"k":"p","html":"자사의 모태가 되는 바탕 도토의 품질 자체는 일반적으로 외산보다 본산이 질적으로 더 우수하다고 알려져 있다.","ind":40,"bul":true},{"k":"p","html":"<b>채광 방식의 변화와 순도의 중요성</b>","ind":22,"bul":true},{"k":"p","html":"과거에는 원하는 흙만 정밀하게 골라내는 &#x27;핀셋 채광&#x27;이 가능했으나, 대량으로 캐내는 현대의 방식은 잡석이 섞일 수밖에 없어 채광 직후 원광 자체의 순도가 상대적으로 떨어진다.","ind":40,"bul":true},{"k":"p","html":"따라서 현대에는 흙의 산지(본산 여부)보다 가공 과정에서 불순물을 제거해 순도를 얼마나 높였는지가 훨씬 중요해졌다.","ind":40,"bul":true},{"k":"p","html":"불순물을 잘 걸러내어 정제했다면, 순도가 낮은 본산 흙보다 오히려 외산 흙이 기능과 질적인 측면에서 더 우수할 수 있다.","ind":40,"bul":true},{"k":"p","html":"<b>종합적 평가 (흙과 소성 기술)</b>","ind":22,"bul":true},{"k":"p","html":"원료(흙) 자체만 놓고 보면 핀셋 채광을 하던 과거의 흙이 더 훌륭하다.","ind":40,"bul":true},{"k":"p","html":"하지만 현대에는 가마의 불길(소성)을 균일하게 맞추고 온도를 세밀하게 조절하는 기술이 과거보다 크게 발달했다.","ind":40,"bul":true},{"k":"p","html":"결과적으로 완성된 자사호를 평가할 때는 맹목적인 &#x27;본산&#x27; 선호에서 벗어나, 흙의 정제 순도와 발전된 소성 기술 등을 종합적으로 고려하여 판단해야 한다.","ind":40,"bul":true},{"k":"h3","text":"2. 자사니의 발색을 도드라지게 하는 첨가물의 예를 들어보세요."},{"k":"p","html":"<b>금속 산화물 (착색제)의 도입</b>","ind":22,"bul":true},{"k":"p","html":"산화철, 산화망간, 산화코발트 등 다양한 금속 산화물을 발색 첨가제로 사용한다.","ind":40,"bul":true},{"k":"p","html":"이는 본래 일반 도자기 제작에 범용적으로 쓰이던 화학 안료들인데, 자사호의 다채로운 색감을 내기 위해 자사기 제작에도 자연스럽게 도입된 것이다.","ind":40,"bul":true},{"k":"p","html":"<b>1980년대 자사 1창 시대와 탄산바륨</b>","ind":22,"bul":true},{"k":"p","html":"1980년대 국영 &#x27;자사 1창&#x27; 시기에 대량 생산이 본격화되면서 금속 산화물 첨가가 널리 쓰였다.","ind":40,"bul":true},{"k":"p","html":"특히 발색제와 함께 탄산바륨을 첨가했는데, 이는 표면의 얼룩(백화 현상 등)을 잡아주어 깔끔한 광택을 내게 하고, 가마 소성 시 기물이 흠결 없이 안정적이고 균일하게 구워지도록 돕는 역할을 했다.","ind":40,"bul":true},{"k":"p","html":"<b>첨가물 사용에 대한 인식</b>","ind":22,"bul":true},{"k":"p","html":"자사니에 발색 첨가물을 섞는 것 자체는 도자 공예 기법상 크게 문제 될 것이 없다.","ind":40,"bul":true},{"k":"p","html":"화공 안료가 발달하기 이전인 과거 전통 방식에서도, 자연 광물 등 자연물에서 얻은 천연 안료(착색제)를 흙에 배합하여 색을 내는 방식을 이미 사용해 왔기 때문이다.","ind":40,"bul":true},{"k":"h3","text":"3. 암중암, 암중니, 니중니의 의미에 대해 설명해 보세요."},{"k":"p","html":"자사 광석의 분포 형태 자사 광석이 광산 안에서 어떤 지질학적 형태(모태)로 자리 잡고 있는지를 가리키는 용어다. 자사 광맥을 품고 있는 바탕 모태는 단단한 암석(암)일 수도 있고, 부드러운 진흙(니)일 수도 있다.","ind":22,"bul":true},{"k":"p","html":"<b>암중암(巖中巖):</b> 단단한 암석층 안에 또 다른 암석 형태로 자사 광맥이 분포하는 경우다.","ind":40,"bul":true},{"k":"p","html":"<b>암중니(巖中泥):</b> 단단한 암석층 안에 부드러운 진흙 형태로 자사 광맥이 분포하는 경우다.","ind":40,"bul":true},{"k":"p","html":"<b>니중니(泥中泥):</b> 부드러운 진흙층 안에 또 다른 성질의 진흙 형태로 자사 광맥이 분포하는 경우다.","ind":40,"bul":true},{"k":"p","html":"<b>니료의 특성과 조장주니(趙莊朱泥)</b>","ind":22,"bul":true},{"k":"p","html":"최상급 단니(段泥) 등 특정한 흙들은 성질상 가마에서 너무 높은 온도(고온)를 받으면 소성 과정에서 형태를 완성하기 어려워질 수 있다.","ind":40,"bul":true},{"k":"p","html":"<b>조장주니:</b> 주니 전용으로 유통되는 이름난 흙이다. 과거에는 품질이 뛰어난 원광이 많았으나 현재는 매우 희소해졌다. 따라서 과거에 캤던 원광 조장주니와 현대에 (다른 흙이나 첨가물을 섞는 등의 방법으로) 만들어지는 것은 질적으로 완전히 다르다.","ind":40,"bul":true},{"k":"p","html":"<b>현대의 니료 블렌딩(병배)</b>","ind":22,"bul":true},{"k":"p","html":"좋은 원광이 줄어들면서 여러 흙을 섞어 만든 블렌딩(병배) 니료가 시중에 엄청나게 많이 유통된다.","ind":40,"bul":true},{"k":"p","html":"단순히 여러 흙을 섞었다고 해서 나쁜 것은 아니며, 완성된 결과물의 품질이 좋다면 크게 문제 되지 않는다.","ind":40,"bul":true},{"k":"p","html":"다만, 순도 높은 여러 흙의 장점을 살려 훌륭한 품질로 배합해 내기 위해서는 고도의 전문적인 기술이 필요하다.","ind":40,"bul":true},{"k":"h2","text":"□ 자사 니료의 형성 시기와 황룡산 광구 개관"},{"k":"h3","text":"1. 자사광료의 형성시기와 특징"},{"k":"p","html":"<b>형성 시기:</b> 약 2억~3억 년 전(고생대) 지각 변동 시기에 황룡산 일대의 지질이 형성되면서 자사 광료도 함께 만들어졌다.","ind":22,"bul":true},{"k":"p","html":"<b>지질 특징:</b> 자사 광맥을 품고 있는 황룡산은 오랜 세월 다양한 광물이 물과 바람에 의해 쌓이고 굳어져 형성된 퇴적암 형태의 돌산이다.","ind":22,"bul":true},{"k":"h3","text":"2. 황룡산 광구 개설"},{"k":"p","html":"황룡산 광구는 역사적으로 가장 질 좋은 자사니가 생산된 핵심 산지(정산/본산)다.","ind":22,"bul":true},{"k":"p","html":"<b>채광 방식의 변화:</b> 1950년대 이전에는 얕은 지표면의 흙을 캐내는 노천광(표토채광) 방식이었으나, 1950년대 국영 자사창 시기 이후부터는 레일을 깔고 땅속 깊이 파고 들어가는 심정(深井, 심층채굴) 방식으로 발전했다.","ind":22,"bul":true},{"k":"p","html":"<b>대표 갱구:</b> 역사상 가장 뛰어난 자사니를 생산했던 &#x27;4호정(四号井)&#x27;과, 채굴 터가 수몰되어 거대한 호수가 된 &#x27;대수담(大水潭)&#x27; 등이 대표적인 황룡산의 갱구들이다. (현재는 자원 고갈과 보호를 이유로 채광이 전면 금지되어 있다.)","ind":22,"bul":true},{"k":"h3","text":"3. 자사 광료의 매장 형태 — 채광지역"},{"k":"p","html":"<b>암중암(巖中巖):</b> 단단한 암석층 안에 또 다른 암석 형태의 자사 광맥이 분포하는 형태다.","ind":22,"bul":true},{"k":"p","html":"<b>암중니(巖中泥):</b> 단단한 암석층 안에 부드러운 진흙 형태의 자사 광맥이 묻혀 있는 형태다.","ind":22,"bul":true},{"k":"p","html":"<b>니중니(泥中泥):</b> 부드러운 진흙층 안에 또 다른 성질의 진흙 형태로 자사 광맥이 자리 잡은 형태다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사 니료의 특징 — 쌍중기공결구(雙重氣孔結構)"},{"k":"h3","text":"1. 쌍중기공결구(이중기공구조)의 개념"},{"k":"p","html":"자사니는 모래(사 砂)와 진흙(니 泥)이 결합한 독특한 구조를 지니며, 가마에서 구워낸 후 내부에 두 가지 형태의 기공(구멍)이 형성되는 &#x27;이중기공구조&#x27;를 갖는다.","ind":22,"bul":true},{"k":"p","html":"<b>① 사질 내부의 기공:</b> 모래 입자 자체의 내부에 존재하는 미세한 기공이다.","ind":22,"bul":false},{"k":"p","html":"<b>② 자사 외벽의 기공:</b> 흙과 모래 입자들이 서로 결합하면서 입자들 사이에 생기는 외벽의 기공이다.","ind":22,"bul":false},{"k":"p","html":"기공 구조는 크게 사질, 파편, 토질로 나뉘며, 오랜 시간 풍화와 퇴적을 거친 진흙과 모래에서 자연스럽게 만들어진다.","ind":22,"bul":true},{"k":"h3","text":"2. 모래(砂)와 흙(泥)의 관계 및 입도"},{"k":"p","html":"자사니에서 모래(사)는 진흙(니)에서 비롯되므로, 바탕이 되는 니의 품질이 좋아야 훌륭한 사질을 얻을 수 있다.","ind":22,"bul":true},{"k":"p","html":"모래의 밀도(사질의 함량과 비율)가 높고, 사와 니가 결합하는 친화력이 좋아야 훌륭한 니료다.","ind":22,"bul":true},{"k":"p","html":"흙 입자의 굵기(입도)는 보통 60목(Mesh)에서 120목 사이로 가공하며, 차호 제작에는 80~100목을 가장 널리 쓴다.","ind":22,"bul":true},{"k":"h3","text":"3. 투기성과 흡수성 (숨 쉬는 자사호)"},{"k":"p","html":"쌍중기공결구의 가장 큰 특징은 미세한 공극(틈)을 통해 물은 빠져나가지 못하고 공기만 통과할 수 있다는 점이다. (이 때문에 찻물을 &quot;공기로 두드려준다&quot; 또는 &quot;차호가 숨을 쉰다&quot;고 표현한다.)","ind":22,"bul":true},{"k":"p","html":"공극이 미세하여 물의 흡수율은 낮고 투기성(공기가 통하는 성질)은 강하므로, 차를 우릴 때 차의 향미를 과도하게 빼앗지 않는다.","ind":22,"bul":true},{"k":"p","html":"<b>기공이 너무 클 경우의 문제점:</b> 파편 등을 섞어 인공적으로 거칠게 만든 저렴한 자사호는 기공이 너무 커서 투기성과 흡수성이 지나치게 높아진다. 이 경우 차의 향과 맛을 다 빨아들여 차가 탁해지고, 물이 샐 수도 있으며, 표면에 윤기가 나는 차때(양호)가 제대로 형성되지 않는다.","ind":22,"bul":true},{"k":"h3","text":"4. 소성 전후의 물성 변화와 가공"},{"k":"p","html":"<b>자연 사질 vs 인공 사질:</b> 좋은 흙은 오랜 자연의 풍화와 퇴적 과정을 거친다. 자연 과정을 거치지 않고 인공적으로 입자 크기를 맞춰 억지로 뭉쳐낸 사질로 우려내면, 위와 같이 찻물의 맛을 너무 많이 빨아들이는 부작용이 생긴다.","ind":22,"bul":true},{"k":"p","html":"<b>소성 전 (기본 점토의 질):</b> 굽지 않은 자연 생니(生泥) 덩어리를 물에 넣었을 때 스르르 자연스럽게 풀어지는 것이 좋은 흙이다.","ind":22,"bul":true},{"k":"note","html":"※ 물에 넣어도 풀어지지 않는 것은 자연 니료의 특성이 아니다.","ind":22,"bul":false},{"k":"p","html":"<b>소성 후 (명침의 중요성):</b> 가마의 불을 받아 수축하면서 표면이 울퉁불퉁해지는 성질이 있다. 사질이 많을수록 이러한 현상이 두드러지므로, 제작 마무리 단계에서 표면을 매끄럽게 다듬는 &#x27;명침(明針)&#x27; 작업을 반드시 정성껏 해야 한다.","ind":22,"bul":true},{"k":"p","html":"<b>[참고] 자사 니료의 일반 물성 요약</b>","ind":22,"bul":true},{"k":"p","html":"투기성(통기)은 높고, 형태를 빚는 찰기(점력)는 매우 뛰어나며, 소성 시 수축률은 낮다","ind":40,"bul":true},{"k":"h2","text":"□ 자사원료의 화학성분"},{"k":"h3","text":"1. 자사 광료의 광물 조성"},{"k":"table","html":"<table><tr><th><div><b>광물</b></div></th><th><div><b>비율</b></div></th><th><div><b>비고 (특징) </b></div></th></tr><tr><td><div>석영</div></td><td><div>50%</div></td><td><div>자사의 뼈대 역할을 하는 주성분 </div></td></tr><tr><td><div>고령석</div></td><td><div>25% ~ 30%</div></td><td><div>고령토(Kaolin) 계열의 기본 점토 성분 </div></td></tr><tr><td><div>수운모와 연운모</div></td><td><div>3~5%</div></td><td><div>표면의 윤기(기름기)를 냄 </div></td></tr><tr><td><div>운모</div></td><td><div>3~5%</div></td><td></td></tr><tr><td><div>장석</div></td><td><div>1~2%</div></td><td></td></tr><tr><td><div>규질암설(硅質岩屑)</div></td><td><div>약 1%</div></td><td></td></tr><tr><td><div>갈철광</div></td><td><div>약 1%</div></td><td></td></tr><tr><td><div>전기석(電氣石, 규산염) · 백태석(白鈦石, 티타늄)</div></td><td><div>미량</div></td><td><div>규산염 및 티타늄 성분 </div></td></tr><tr><td><div>녹니석(綠泥石) · 해록석(海綠石)</div></td><td><div>간혹 발견됨</div></td><td></td></tr></table>"},{"k":"p","html":"석영·운모·장석·규질암설·갈철광 등은 알갱이를 이루는 <b>쇄설부(사질)</b>에, 고령석·수운모와 연운모는 이를 붙잡아 주는 <b>교결부(니질)</b>에 속한다.","ind":22,"bul":true},{"k":"h3","text":"2. 자사 광료의 화학 성분"},{"k":"p","html":"자사니의 주요 화학 성분과 역할","ind":22,"bul":true},{"k":"table","html":"<table><tr><th><div><b>성분</b></div></th><th><div><b>평균</b></div></th><th><div><b>범위</b></div></th><th><div><b>성분의 주요 역할 </b></div></th></tr><tr><td><div>SiO₂ (이산화규소)</div></td><td><div>56.96%</div></td><td><div>50% ~ 60%</div></td><td><div>뼈대를 형성하는 규사 성분 </div></td></tr><tr><td><div>Al₂O₃ (산화알루미늄)</div></td><td><div>-</div></td><td><div>-</div></td><td><div>가마의 고온을 버티게 하는 내화도를 높여줌 </div></td></tr><tr><td><div>Fe₂O₃ (산화철)</div></td><td><div>9.43%</div></td><td><div>8% ~ 12%</div></td><td><div>흙이 녹는 온도(융점)를 낮추는 융제 역할을 하며, 붉은색 등 자사 고유의 발색을 결정함 </div></td></tr></table>"},{"k":"p","html":"자사니는 일반적인 다른 도자기 흙(도토)과 비교했을 때 기본적인 화학 성분 자체는 크게 다르지 않다.","ind":22,"bul":true},{"k":"p","html":"그러나 화학 성분이 아닌 물리적 조성, 즉 독특한 기공을 형성하는 모래 성분(사질)의 존재 여부가 자사니를 다른 흙과 구별되는 특별한 재료로 만든다.","ind":22,"bul":true},{"k":"p","html":"<b>전기석(電氣石):</b> 원료에 미량 포함된 육방정계 규산염 광물의 총칭이다. 흑색, 청록색, 흑갈색, 홍색 등을 띠며, 마찰하거나 열을 가하면 전기가 발생하는 특성이 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사니와 철의 관계"},{"k":"p","html":"철(Fe) 성분은 흙 속에서 입자들을 단단하게 뭉치게 하는 응집의 중심 역할을 한다.","ind":22,"bul":true},{"k":"p","html":"흙이 철분을 통해 응집할 수 있으므로, 만약 흙 속에 철분이 없다면 자사 특유의 사질 구조 자체가 제대로 형성되지 않는다.","ind":22,"bul":true},{"k":"p","html":"철 성분은 형태를 응집시키는 역할뿐만 아니라, 가마에서 불을 맞을 때(소성) 일어나는 산화·환원 반응을 통해 완성된 자사호의 최종 색상을 결정하는 중요한 역할도 한다.","ind":22,"bul":true},{"k":"p","html":"주니나 주사니 같은 붉은 니료는 입자가 엄청나게 고와서 겉보기에는 모래(사질)가 전혀 없는 찰흙처럼 보인다. 하지만 이는 실제 사질이 없는 것이 아니라, 사질 입자의 크기가 매우 미세하고 고운 것일 뿐이다.","ind":22,"bul":true},{"k":"h2","text":"□ 상등니료와 소성 후의 표면 특징 — 폭자(爆疵)"},{"k":"p","html":"<b>폭자(爆疵)의 의미와 형태</b>","ind":22,"bul":true},{"k":"p","html":"&#x27;폭발할 폭(爆)&#x27;에 &#x27;하자 자(疵)&#x27;를 써서 &#x27;폭발하는 덩이&#x27;라는 뜻이다.","ind":40,"bul":true},{"k":"note","html":"※ 폭자(爆子), 폭니(爆泥) 등으로도 불린다.","ind":40,"bul":false},{"k":"p","html":"가마에서 구워진 뒤 기물 표면에 툭 튀어나온 볼록한 무늬나, 철분이 녹아 눌어붙은 것처럼 터진 자국을 말한다.","ind":40,"bul":true},{"k":"p","html":"<b>발생 원인</b>","ind":22,"bul":true},{"k":"p","html":"사질과 철분이 많이 포함된 흙에서 주로 발생하며, 특히 주니(朱泥)에서 아주 흔하게 나타난다.","ind":40,"bul":true},{"k":"p","html":"흙 속의 사질 입자들이 완전히 단단하게 결합한 것이 아니라 다소 느슨한 연탄 같은 구조를 띠고 있다가, 가마의 고온을 받으면 내부에서 불균일하게 팽창·수축하며 미세하게 폭발하듯 겉으로 터져 나오는 현상이다.","ind":40,"bul":true},{"k":"p","html":"사질이 너무 많을 경우 폭자가 생기며 표면이 찢어지는 미세한 균열이 발생하기도 한다.","ind":40,"bul":true},{"k":"p","html":"<b>가치 평가와 명침(明針)의 중요성</b>","ind":22,"bul":true},{"k":"p","html":"하급 니료에서도 간혹 생길 수 있으나, 일반적으로는 좋은 사질이 풍부하게 함유된 상급 니료(상등니료)의 자연스러운 특징이자 긍정적인 신호로 간주한다.","ind":40,"bul":true},{"k":"p","html":"따라서 표면이 조금 툭 튀어나온 것이 유일한 단점이고 출수 등 기능상에 큰 문제가 없다면 구매해도 무방하다.","ind":40,"bul":true},{"k":"p","html":"이처럼 좋은 흙일수록 소성 과정에서 입자가 불규칙하게 튀어나오기 쉬우므로, 제작 단계에서 기물 표면의 사질을 안으로 밀어 넣고 매끄럽게 다듬는 명침(明針) 공정이 더욱더 중요해진다.","ind":40,"bul":true},{"k":"h2","text":"□ 황룡산 광구 일대의 노천 채광의 연혁"},{"k":"p","html":"<b>초기 표토 채광 (청나라 시기)</b>","ind":22,"bul":true},{"k":"p","html":"황룡산은 역사적으로 볼 때 노천 채광이 흔하게 이루어진 지역은 아니다.","ind":40,"bul":true},{"k":"p","html":"초기 채굴은 황룡산 표면에 노출된 광구 위주였으며, 주로 청나라 시대에 호미와 곡괭이로 겉에 드러난 돌(광석)을 캐내는 원시적인 방식으로 이루어졌다.","ind":40,"bul":true},{"k":"note","html":"※ 명·청 시대 옛 광구 터에서 단니가 생산된 것으로 추정된다.","ind":40,"bul":false},{"k":"p","html":"<b>심층 채굴의 도입과 현대화 (1950년대 이후)</b>","ind":22,"bul":true},{"k":"p","html":"1950년대에 국영 자사창이 설립된 이후부터는 땅속 깊이 들어가는 심층 채굴이 성행했다.","ind":40,"bul":true},{"k":"p","html":"다이너마이트 등 폭발물을 사용하는 현대식 채굴 공법으로 완전히 넘어갔다.","ind":40,"bul":true},{"k":"p","html":"청나라 시기의 소규모 표층 채굴을 제외하면, 황룡산 일대에서 땅을 넓게 파내는 형태의 본격적인 노천 채광은 모두 현대에 들어서 진행된 것이다.","ind":40,"bul":true},{"k":"p","html":"<b>황룡산 일대의 주요 출토 니료</b>","ind":22,"bul":true},{"k":"p","html":"<b>대수담(大水潭):</b> 채굴 터가 수몰되어 거대한 호수가 된 곳으로, 역사상 가장 훌륭한 흙으로 꼽히는 천청니(天靑泥)와 자니(紫泥)가 발굴된 핵심 산지다.","ind":40,"bul":true},{"k":"p","html":"<b>주니(朱泥)의 희소성:</b> 황룡산 광구 내에서는 주니가 굉장히 귀했다. 따라서 전통적으로 주니는 대부분 황룡산이 아닌 인근의 조장(趙莊) 지역에서 생산되었다.","ind":40,"bul":true},{"k":"p","html":"<b>채광 금지 조치 (연도 표기의 차이)</b>","ind":22,"bul":true},{"k":"p","html":"자원 고갈과 환경 보호를 이유로 2010년 전후에 황룡산 일대의 자사 채굴이 전면 금지되었다.","ind":40,"bul":true},{"k":"note","html":"※ 4강 교재의 &#x27;2004년 금지&#x27; 기록과의 차이: 2004년은 4호정 등 특정 핵심 심층 갱구의 채광이 금지된 시점이고, 2010년 전후는 황룡산 일대 전체의 광구(노천 채광 포함)에 대한 전면적인 보호 및 폐쇄 조치가 내려진 시점으로 이해할 수 있다.","ind":40,"bul":false},{"k":"h2","text":"□ 주니와 홍니의 물성 구분"},{"k":"h3","text":"1. 흙의 기본 분류와 모태"},{"k":"p","html":"<b>기본 성질:</b> 크게 자사니와 일반 도토로 나뉘며, 대부분 점토(니) 성분을 띤다. 자사니는 공기가 통하는 이중기공구조를 갖는다.","ind":22,"bul":true},{"k":"p","html":"<b>모태의 차이:</b> 의흥의 3대 도토 중 &#x27;갑니&#x27;를 모태로 하는 것이 자니 계열이고, 부드러운 &#x27;눈니&#x27;를 모태로 하는 것이 주니와 홍니 계열이다.","ind":22,"bul":true},{"k":"p","html":"<b>색상별 분류:</b> 백니(고령토 계열, 훗날 단니 등 밝은색과 연관), 자니(어두운 색), 단니(밝은색).","ind":22,"bul":true},{"k":"h3","text":"2. 홍니와 주니의 물성 비교"},{"k":"p","html":"<b>홍니 (자사홍니):</b> 붉은색 자사니의 통칭. 바탕은 눈니 계열이나 성질은 갑니에 가까워 입자가 비교적 굵고 사질이 여러 색을 띤다.","ind":22,"bul":true},{"k":"p","html":"<b>순주니:</b> 진흙 속 진흙인 &#x27;니중니&#x27; 형태로 산출된다. 붉은색 단일 사질에 입자가 매우 곱다. 수축률이 커서 만들기 매우 까다롭고, 완성 후 팽팽하면서도 자글거리는 주름(막) 질감이 나타난다.","ind":22,"bul":true},{"k":"p","html":"<b>원시주니 (노주니):</b> 과거 정제 기술이 부족할 때의 주니. 순주니와 자사홍니의 중간 형태로, 사질이 풍부하면서도 진흙 성질이 부드러워 형태를 빚기 어렵다.","ind":22,"bul":true},{"k":"h3","text":"3. '주니' 명칭의 역사적 변질"},{"k":"p","html":"<b>자사 1창 시기:</b> 1980년대 이전 국영 시기에는 만들기 까다로운 주니를 거의 생산하지 않았다.","ind":22,"bul":true},{"k":"p","html":"<b>명칭의 상업화:</b> 당시 노천 채광으로 얻은 붉은 흙(홍니)으로 만든 차호가 1980~1990년대 대만으로 대량 수출되었다. 이때 수출된 홍니가 대만 시장에서 &#x27;주니&#x27;로 불리며 상업적 유행을 탔고, 이후 홍니가 주니라는 명칭으로 굳어지는 원인이 되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 역사 주니와 현대 주니"},{"k":"p","html":"<b>역사 주니와 현대 주니의 특성 비교</b>","ind":22,"bul":true},{"k":"p","html":"<b>역사 주니 (노주니):</b> 전통적인 방식으로 채광하고 가공하여 흙 속에 자사 성질이 풍성하게 남아 있으며, 모래의 성질(사성)이 강하게 살아 있는 주니다.","ind":40,"bul":true},{"k":"p","html":"<b>현대 주니:</b> 발달한 현대 기술로 정제하여 불순물을 걸러냈기 때문에 입자가 매우 곱고, 모래보다는 진흙의 성질(니성)이 우선시되는 주니다.","ind":40,"bul":true},{"k":"p","html":"<b>주니 관련 세부 니료 및 용어</b>","ind":22,"bul":true},{"k":"p","html":"<b>주사니(朱砂泥):</b> 주니 중에서도 특히 사질을 강조한 흙이다. 인공적으로 모래 성질을 더욱 강하게 만들었기 때문에 가마에서 구워내기가 너무 어려워 소성 과정을 여러 차례 거쳐야 한다.","ind":40,"bul":true},{"k":"p","html":"<b>원광주니(原礦朱泥):</b> 진흙의 성질(니성)과 모래의 성질(사성)을 모두 강하게 지니고 있는 내추럴한 천연 원광 흙이다.","ind":40,"bul":true},{"k":"p","html":"<b>대홍포(大紅袍):</b> 구워냈을 때 아주 짙고 강렬한 붉은색을 띠는 극강의 붉은 니료다.","ind":40,"bul":true},{"k":"p","html":"<b>이피니(梨皮泥):</b> 주사니의 일종으로, 사질이 매우 많아 표면이 마치 배 껍질처럼 오돌토돌한 질감을 띠는 흙을 부르는 말이다.","ind":40,"bul":true},{"k":"p","html":"<b>생사(生砂)와 숙사(熟砂):</b> 흙에 섞는 모래(사)를 가공 방식에 따라 나눈 것이다. 그중 &#x27;숙사&#x27;는 모래 입자를 가마에서 한 번 구워낸 뒤 잘게 부수어(crush) 사용하는 것을 말한다.","ind":40,"bul":true},{"k":"p","html":"<b>주니 생산의 역사적 흐름</b>","ind":22,"bul":true},{"k":"p","html":"<b>1950년대 ~ 1990년대 말:</b> 국영 공장(자사창) 중심의 공산 중국 시기에는 제작이 까다롭고 불량률이 높은 순주니 대신, 작업성이 좋고 대량 생산에 유리한 &#x27;자사홍니&#x27;를 주로 사용했다.","ind":40,"bul":true},{"k":"p","html":"<b>2000년대 이후:</b> 차 문화가 발달한 대만 시장 등에서 전통 주니에 대한 수요와 요구가 커지면서, 끊겼던 순주니 제작이 본격적으로 다시 부활하여 만들어지기 시작했다.","ind":40,"bul":true},{"k":"h2","text":"※ 부속 자료 — 품질검사 성적서 4종 (스캔 9~13쪽)"},{"k":"h3","text":"1. 질량검측보고(質量檢測報告) — 황룡산 주니(黃龍山朱泥) 완제품 용출시험"},{"k":"p","html":"국가경공업 도자내화재료 품질감독검측 의흥참 / 보고 (2023)위자 제6700호(委字第6700)","ind":0,"bul":false},{"k":"p","html":"황룡산 주니로 만든 180ml 차호 완제품(1건)을 대상으로 한 국가 공인 유해 물질 용출 검사다.","ind":22,"bul":true},{"k":"p","html":"차호에 액체를 담아두고 시간을 둔 뒤 유해 물질이 우러나오는지 확인하는 일반적인 도자 검출 방식을 거쳤다.","ind":22,"bul":true},{"k":"p","html":"검사 결과 납(Pb)과 카드뮴(Cd) 모두 기준치를 훌쩍 밑도는 0.01 mg/L로 측정되어 안전 기준에 완벽히 부합(합격)했다.","ind":22,"bul":true},{"k":"table","html":"<table><tr><th><div><b>항목</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>위탁단위 / 샘플명</div></td><td><div>전주 자사 / 추수 황룡산 주니(专注 紫砂 / 秋水 黄龙山朱泥)</div></td></tr><tr><td><div>샘플 상태 · 용량 · 수량</div></td><td><div>제품 · 180ml · 1건</div></td></tr><tr><td><div>샘플 번호 · 송부일</div></td><td><div>2023-6700 · 2023.12.29</div></td></tr><tr><td><div>검사 근거 · 기간</div></td><td><div>GB4806.4-2016 · 2023.12.29 ~ 2024.01.05</div></td></tr><tr><td><div>납(Pb) 용출</div></td><td><div>기준 2.0 mg/L → 결과 0.01 (부합)</div></td></tr><tr><td><div>카드뮴(Cd) 용출</div></td><td><div>기준 0.30 mg/L → 결과 0.01 (부합)</div></td></tr></table>"},{"k":"h3","text":"2. 검험보고(檢驗報告) — 자사 니료 화학성분 (2008년)"},{"k":"p","html":"보고 편호 0429 / 의흥시 정촉진 북로(宜兴市丁蜀镇北路)39-151 / 샘플 200g (니) / 2008년 2월 26일~28일 / GB/T4734-1996","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>성분</b></div></th><th><div><b>평균값 (%)</b></div></th></tr><tr><td><div>SiO₂ (이산화규소)</div></td><td><div>53.37</div></td></tr><tr><td><div>Fe₂O₃ (산화철)</div></td><td><div>23.46</div></td></tr><tr><td><div>Al₂O₃ (산화알루미늄)</div></td><td><div>14.68</div></td></tr><tr><td><div>CaO</div></td><td><div>0.82</div></td></tr><tr><td><div>MgO</div></td><td><div>0.20</div></td></tr><tr><td><div>K₂O</div></td><td><div>2.14</div></td></tr><tr><td><div>Na₂O</div></td><td><div>0.16</div></td></tr><tr><td><div>LOI (강열감량)</div></td><td><div>4.10</div></td></tr></table>"},{"k":"h3","text":"3. 산품검험보고(産品檢驗報告) — 수세 고령토(水洗高嶺), 2022-03-02"},{"k":"h4","text":"2·3번 비교 — 자사 니료(2008년)와 고령토(2022년)의 화학 성분"},{"k":"p","html":"자사니와 일반 도자기 흙(수세 고령토)의 성분을 직접 대조하고 비교하기 위한 자료다.","ind":22,"bul":true},{"k":"p","html":"두 흙은 이산화규소(SiO₂)·산화알루미늄(Al₂O₃) 등 기본 성분 구조는 크게 다르지 않으나, 철분(Fe₂O₃) 함량에서 결정적인 차이가 난다.","ind":22,"bul":true},{"k":"p","html":"일반 고령토의 산화철 함량은 0.08%에 불과한 반면, 자사니 샘플은 23.46%에 달한다. 이 풍부한 철분이 사질(모래)을 뭉치게 하고 자사 특유의 성질을 만든다.","ind":22,"bul":true},{"k":"note","html":"※ 자사기와 같은 경질토기는 일반 도기보다 훨씬 높은 소성 온도가 요구된다.","ind":22,"bul":false},{"k":"table","html":"<table><tr><th><div><b>항목</b></div></th><th><div><b>기준</b></div></th><th><div><b>측정결과</b></div></th></tr><tr><td><div>SiO₂ (%)</div></td><td><div>58</div></td><td><div>56.50</div></td></tr><tr><td><div>Al₂O₃ (%)</div></td><td><div>35</div></td><td><div>27.06</div></td></tr><tr><td><div>Fe₂O₃ (%)</div></td><td><div>0.1</div></td><td><div>0.08</div></td></tr><tr><td><div>pH</div></td><td><div>7.0</div></td><td><div>7.1</div></td></tr><tr><td><div>수분 (%)</div></td><td><div>0.4</div></td><td><div>0.4</div></td></tr><tr><td><div>300목 과사 잔량 (%)</div></td><td><div>98</div></td><td><div>98.6</div></td></tr><tr><td><div>흡수율 (%)</div></td><td><div>44</div></td><td><div>39</div></td></tr><tr><td><div>백도 (%)</div></td><td><div>80</div></td><td><div>82</div></td></tr><tr><td><div>평균 입경 (um)</div></td><td><div>6</div></td><td><div>5</div></td></tr><tr><td><div>비중</div></td><td><div>2.8</div></td><td><div>2.7</div></td></tr><tr><td><div>체적밀도 (g/cm³)</div></td><td><div>0.45</div></td><td><div>0.39</div></td></tr><tr><td><div>혼합산화물 (%)</div></td><td><div>2.4</div></td><td><div>1.6</div></td></tr><tr><td><div>결론</div></td><td></td><td><div>합격품</div></td></tr></table>"},{"k":"h3","text":"4. 강서성 도자검측중심 위탁검험보고 — 강파니(降坡泥), 2022-08"},{"k":"p","html":"보고 편호 CSY2022270 / 송부단위 수사(守砂) / 샘플 7건 / 2022-08-18 송부 / 검사 2022-08-22~23 / GB/T14506.28-2010","ind":0,"bul":false},{"k":"h4","text":"강파니(降坡泥) 화학 성분 및 용출 위탁 검사(2022년)"},{"k":"p","html":"<b>화학 성분 검사:</b> SiO₂ 50.30%, Al₂O₃ 28.34%, Fe₂O₃ 12.11% 등으로 자사니의 전형적인 성분 비율을 띤다.","ind":22,"bul":true},{"k":"table","html":"<table><tr><th><div><b>성분</b></div></th><th><div><b>함량(%)</b></div></th><th><div><b>성분</b></div></th><th><div><b>함량(%)</b></div></th></tr><tr><td><div>SiO₂</div></td><td><div>50.30</div></td><td><div>P₂O₅</div></td><td><div>0.04</div></td></tr><tr><td><div>Al₂O₃</div></td><td><div>28.34</div></td><td><div>SO₃</div></td><td><div>0.08</div></td></tr><tr><td><div>Fe₂O₃</div></td><td><div>12.11</div></td><td><div>Cl</div></td><td><div>0.04</div></td></tr><tr><td><div>MgO</div></td><td><div>1.10</div></td><td><div>NiO</div></td><td><div>0.02</div></td></tr><tr><td><div>CaO</div></td><td><div>0.38</div></td><td><div>CuO</div></td><td><div>0.02</div></td></tr><tr><td><div>Na₂O</div></td><td><div>0.10</div></td><td><div>SrO</div></td><td><div>2.01</div></td></tr><tr><td><div>K₂O</div></td><td><div>2.54</div></td><td><div>PbO</div></td><td><div>0.04</div></td></tr><tr><td><div>TiO₂</div></td><td><div>1.17</div></td><td><div>강열감량(燒失量)</div></td><td><div>0.17</div></td></tr><tr><td><div>MnO</div></td><td><div>0.17</div></td><td><div>(검출하한 0.02%)</div></td><td></td></tr></table>"},{"k":"p","html":"<b>유해 물질 용출 시험:</b> (보고 편호 CSY2022279-1, 검사 2022-08-23~24 / SN/T 4131-2015)","ind":0,"bul":false},{"k":"p","html":"100℃로 끓인 4% 초산(산성) 용액에 30분간 노출하는 가혹 조건으로 검사했다. 그 결과 납(Pb)과 카드뮴(Cd) 이행량이 전혀 없는 0.0 으로 나타나, 적절한 소성 온도를 거쳐 찻물을 담아 마시기에 매우 안전함을 입증했다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>검사항목</b></div></th><th><div><b>조건</b></div></th><th><div><b>결과 (mg/dm²)</b></div></th></tr><tr><td><div>납(Pb) 이행량</div></td><td><div>4% 초산, 100℃, 30분</div></td><td><div>0.0</div></td></tr><tr><td><div>카드뮴(Cd) 이행량</div></td><td><div>4% 초산, 100℃, 30분</div></td><td><div>0.0</div></td></tr></table>"},{"k":"h3","text":"품질검사 결과가 시사하는 실질적 의미"},{"k":"h3","text":"1. 무유도기(無釉陶器)로서의 완벽한 식기 안전성 증명"},{"k":"p","html":"<b>유약이 없는 특수성:</b> 일반적인 도자기는 표면에 유리질 유약을 발라 흙과 내용물을 차단하지만, 자사호는 유약을 바르지 않고 구워내어 뜨거운 찻물과 흙이 직접 맞닿는다.","ind":22,"bul":true},{"k":"p","html":"<b>중금속 불검출의 의미:</b> 1번(주니 완제품)과 4번(강파니)의 용출 검사 결과는 100℃의 뜨거운 끓는 물이나 산성을 띠는 찻물을 장시간 담아두어도 납(Pb)이나 카드뮴(Cd) 같은 치명적인 유해 물질이 녹아 나오지 않음을 뜻한다. 즉, 화학 안료나 불순물에 대한 우려 없이 매일 안심하고 차를 우려 마실 수 있는 훌륭한 식기임을 과학적으로 입증한 것이다.","ind":22,"bul":true},{"k":"h3","text":"2. 자사호 고유의 '이중기공구조'를 만드는 결정적 요인 확인"},{"k":"p","html":"<b>압도적인 철분(Fe₂O₃) 함량:</b> 2번(자사니)과 3번(고령토)의 대조 검사는 일반 도자기 흙과 자사니의 결정적인 차이를 보여준다. 0.08%에 불과한 고령토와 달리 23.46%에 달하는 자사니의 풍부한 철분은 흙 입자들을 강하게 응집시켜 자사 특유의 모래 성질(사질)을 만든다.","ind":22,"bul":true},{"k":"p","html":"<b>차의 향미를 살리는 기능성:</b> 이 철분을 매개로 뭉친 사질 덕분에 자사호 내부에 미세한 &#x27;쌍중기공결구(이중기공구조)&#x27;가 형성된다. 이 구멍들을 통해 차호가 숨을 쉬며(투기성), 보이차나 무이암차 같은 깊은 맛의 차를 우릴 때 잡내를 잡아주고 찻물이 기물에 아름답게 배어드는 &#x27;양호(養壺)&#x27;가 가능해진다.","ind":22,"bul":true},{"k":"h3","text":"3. 단단한 경질토기를 완성하는 고온 소성의 바탕"},{"k":"p","html":"<b>산화알루미늄(Al₂O₃)의 역할:</b> 검사 결과에 나타난 14%~28%대의 산화알루미늄 성분은 흙이 녹아내리는 온도를 높여주는 내화도(耐火度) 역할을 한다.","ind":22,"bul":true},{"k":"p","html":"<b>형태 유지와 내구성:</b> 자사호는 1,100~1,200도 이상의 아주 높은 온도에서 구워내야 제 기능을 발휘하는데, 이 산화알루미늄 성분 덕분에 고온의 가마 속에서도 흙이 주저앉거나 녹아내리지 않고 단단한 경질토기로 완성될 수 있다.","ind":22,"bul":true},{"k":"h1","text":"6강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 고령토와 자사니의 차이를 비교해 보고, 자사 광석 내의 함철량이 사질의 형성과 발색에 미치는 영향에 대해서 간략하게 설명해 보세요."},{"k":"p","html":"<b><b>성분 차이:</b></b> 고령토는 산화철(Fe₂O₃) 함량이 0.08%로 극히 낮지만, 자사니는 약 23.46%에 달할 정도로 철분이 매우 풍부하다.","ind":22,"bul":true},{"k":"p","html":"<b><b>철분의 역할:</b></b> 이 풍부한 철분이 흙 입자들을 단단하게 뭉치게 하는 응집의 중심 역할을 하여 자사 특유의 사질(모래) 구조를 형성하며, 가마 소성 시 산화·환원 반응을 통해 최종적인 색상(발색)을 결정한다.","ind":22,"bul":true},{"k":"h3","text":"2. 장작가마 소성과 가스가마 소성의 표현상의 차이에 대해 설명해 보세요."},{"k":"p","html":"<b><b>장작가마 (전통):</b></b> 가마 안에서 흩날리는 재와 불길의 방향에 따라 온도 편차가 생겨, 흙 표면에 예기치 않은 자연스러운 색상 변화(요변)와 깊고 거친 질감이 만들어진다.","ind":22,"bul":true},{"k":"p","html":"<b><b>가스가마 (현대):</b></b> 불길과 온도를 미세하고 일정하게 통제할 수 있어, 기물 표면의 색상과 질감이 얼룩 없이 매우 균일하고 깔끔하게 완성된다.","ind":22,"bul":true},{"k":"h3","text":"3. 주니 광상의 두 종류 매장 형태를 아래 단층을 기준으로 설명해 보세요."},{"k":"p","html":"지질학적 단층(모태)을 기준으로 자사 광맥이 어떻게 묻혀 있는지를 분류한 것이다.","ind":0,"bul":false},{"k":"p","html":"<b><b>니중니(泥中泥):</b></b> 부드러운 진흙(눈니) 지층 안에 또 다른 성질의 진흙 형태로 주니 광맥이 묻혀 있는 형태다. (순주니가 주로 이 형태로 산출된다.)","ind":22,"bul":true},{"k":"note","html":"※ </b> 단단한 암석을 모태로 할 경우 암석 속 암석인 암중암(巖中巖), 암석 속 진흙인 암중니(巖中泥)로 나뉜다.","ind":14,"bul":false},{"k":"h3","text":"4. 우루(雨漏) 현상 (= 물샘 현상 / 물꽃, 물번짐)에 대해 설명해 보세요."},{"k":"p","html":"가마에서 구워질 때 흙 입자들이 완전히 녹아붙는 &#x27;소결&#x27;이 제대로 이루어지지 않았을 때 나타나는 하자로, 주로 녹니류 등에서 발생하기 쉽다.","ind":0,"bul":false},{"k":"p","html":"기물 외벽의 미세하게 덜 구워진 틈새를 통해 찻물이 밖으로 삐져나오거나 표면으로 번지듯 배어 나오는 현상을 말한다.","ind":0,"bul":false},{"k":"h2","text":"□ 사의 종류와 판단기준"},{"k":"h3","text":"1. 니(泥)와 사(砂)의 관계 및 품질 기준"},{"k":"p","html":"자사의 진정한 기준은 인공적으로 섞은 파편이 아닌, 자연적인 &#x27;사(砂, 모래)&#x27;의 유무에 있다.","ind":22,"bul":true},{"k":"p","html":"자사는 뼈대에 해당하는 사(砂)와 살에 해당하는 니(泥)로 이루어지며, 이를 통해 고유의 이중기공구조(쌍기공구조)를 갖는다.","ind":22,"bul":true},{"k":"p","html":"바탕이 되는 니(泥)가 좋아야 훌륭한 사(砂)가 나올 수 있으므로 니의 품질이 절대적이며, 동일한 품질의 니라면 사가 많이 포함된 쪽이 더 우수하다.","ind":22,"bul":true},{"k":"h3","text":"2. 색상에 따른 사(砂)의 분류"},{"k":"p","html":"<b>단색사(單色砂):</b> 흙(니)과 모래(사)의 색이 동일한 경우다. 붉은 바탕에 붉은 사질을 지닌 주니(朱泥)가 대표적이며, 흙과 모래 사이에 약간의 색조 차이만 존재한다.","ind":22,"bul":true},{"k":"p","html":"<b>이색사(異色砂):</b> 흙과 모래의 색이 다른 경우다. 자니(紫泥) 계열에서 흔히 볼 수 있으며, 갈색 바탕에 노란색이나 흰색 등 이질적인 색의 사질이 박혀 있는 형태다.","ind":22,"bul":true},{"k":"h3","text":"3. 사(砂)의 세부 명칭"},{"k":"p","html":"<b>계안사(鷄眼砂):</b> 자니 계열의 흙을 구웠을 때 마치 닭의 눈처럼 콕콕 박혀 노란색을 띠는 사질이다.","ind":22,"bul":true},{"k":"p","html":"<b>산사:</b> 노란색을 중심으로 여러 색이 섞여 있는 사질이다.","ind":22,"bul":true},{"k":"p","html":"<b>주사:</b> 주니에 포함된 사질로, 단일한 붉은색을 띠며 입자가 매우 치밀하다.","ind":22,"bul":true},{"k":"h3","text":"4. 최고의 자니, 저조청(底皂靑)"},{"k":"p","html":"<b>특징:</b> 이색사를 띠는 자니 중 단연 최고의 니료다. 순정한 갈색 바탕에 노란 &#x27;계안사&#x27;가 박혀 있으며, 자니임에도 주니처럼 밀도가 치밀하고 표면에 아름다운 광택이 난다. 가마의 소성 온도가 높아질수록 은은한 청색을 띤다.","ind":22,"bul":true},{"k":"note","html":"※ 과거 대수담에서 캤던 전설적인 &#x27;천청니&#x27;가 곧 저조청이 아니냐는 가설도 제기된다.","ind":22,"bul":false},{"k":"p","html":"<b>산출 및 명칭:</b> 지각 변동으로 인해 대수담 지형 아래 박혀 있던 저조청 지층이 위로 솟아오르며 발굴되었다. 그중에서도 4호 갱구(광정) 심층부에서 캔 &#x27;사호광정저조청&#x27;을 최고로 치며, 현대 자사의 대부 고경주(顧景舟)가 역대 가장 좋은 흙이라고 극찬했다.","ind":22,"bul":true},{"k":"p","html":"<b>분류의 변화:</b> 2000년대 중반 이전에는 심층부의 고운 흙을 상등(자니), 중간을 중등(청수니), 아래를 하등(병자니)으로 뭉뚱그려 분류했다. 니료가 세분화된 현대에는 최상급 &#x27;특급청수니&#x27;를 만들 때 질 좋은 저조청을 섞어 배합하기도 한다.","ind":22,"bul":true},{"k":"h3","text":"5. 역사 속 자사 전문 서적과 옛 지명"},{"k":"p","html":"<b>『양선명호계(陽羨茗壺系)』:</b> 명나라 말기에 주고기(周高起)가 저술한 자사호 전문 서적이다.","ind":22,"bul":true},{"k":"p","html":"<b>양선(陽羨):</b> 예로부터 차밭이 많기로 유명한 자사호의 본고장 의흥(이싱)의 옛 지명이다.","ind":22,"bul":true},{"k":"h2","text":"□ 입자와 점토의 배열 구조가 차의 포다에 미치는 영향 — 자사와 차종의 궁합"},{"k":"h3","text":"1. 기공(氣孔)과 공극(空隙)에 따른 품질과 차 맛의 변화"},{"k":"p","html":"흙에 모래(사)가 많더라도 진흙(니)의 품질이 떨어지거나 둘의 결합 친화도가 맞지 않으면, 입자 사이의 빈틈인 &#x27;공극&#x27;이 지나치게 커진다.","ind":22,"bul":true},{"k":"p","html":"공극이 크면 차의 잡미를 흡수하는 장점은 있지만, 차의 유효 성분과 향까지 과도하게 빨아들여 맛이 밍밍해지기 쉽다.","ind":22,"bul":true},{"k":"p","html":"차를 우리기에 가장 훌륭한 자사니는 불필요하게 큰 틈새인 공극은 최소화하고, 미세하게 숨을 쉬는 기공은 최대로 가지고 있는 흙이다.","ind":22,"bul":true},{"k":"h3","text":"2. 니료의 물성과 차종의 궁합"},{"k":"p","html":"<b>주니(朱泥)와 향 중심의 차:</b> 주니는 기공과 공극이 모두 적어 숨을 덜 쉬고 차의 향을 뺏어가지 않는다. 따라서 산화 발효도가 낮아 맑은 향을 즐기는 청향(淸香) 철관음 등 향이 중요한 차를 우리기에 매우 어울린다.","ind":22,"bul":true},{"k":"p","html":"<b>자니(紫泥)와 맛 중심의 노차:</b> 자니는 숨을 많이 쉬고 향을 적절히 머금어 탕색과 맛이 한층 농후하게 우려진다. 맛이 중심이 되는 농향(濃香) 계열의 차나 최소 5년 이상 묵은 노차(老茶)를 우리기에 아주 좋다.","ind":22,"bul":true},{"k":"h3","text":"3. 자사호의 향미 왜곡 현상과 역이용"},{"k":"p","html":"묵은 노차를 우릴 때 공극이 커서 오히려 질이 약간 떨어지는 자사호를 쓰면, 차의 불쾌한 잡내나 습내를 강력하게 빨아들여 묵직한 약향처럼 기분 좋게 느껴지게 하는 효과를 볼 수 있다. (단, 찻물이 맹맹해지기 쉬우므로 찻잎의 양을 평소보다 많이 넣어야 한다.)","ind":22,"bul":true},{"k":"p","html":"미네랄 함량이 높은 &#x27;경수(경도 높은 물)&#x27;로 우려내어 &#x27;자사호&#x27;를 거친 뒤 &#x27;은잔&#x27;에 따라 마시는 조합은, 차 본연의 향미를 가장 극적으로 변화시키는 이른바 &#x27;왜곡의 최고봉&#x27;으로 불린다.","ind":22,"bul":true},{"k":"h2","text":"□ 의흥 자사기의 기본 3종 자사토와 부수 광료 개요"},{"k":"p","html":"<b>인공적으로 사(砂)를 섞는 장식 기법: 조사(調砂)와 포사(鋪砂)</b>","ind":22,"bul":true},{"k":"p","html":"<b>개념과 목적:</b> 시판되는 자사호 중에는 흙에 인공적으로 모래(사)를 더하는 &#x27;조사&#x27;와 &#x27;포사&#x27; 기법을 쓴 것들이 있다. 주로 기물에 남성적이고 거칠며 강렬한 느낌을 주거나 공예적인 장식 효과를 내기 위해 사용한다.","ind":40,"bul":true},{"k":"note","html":"※ 단, 인공적으로 모래를 더하면 입자 간 공극이 많아지는 특징이 있다.","ind":40,"bul":false},{"k":"p","html":"<b>조사(調砂):</b> 흙을 반죽하는 과정에서 흙 내부까지 모래를 섞어 넣는 기법이다.","ind":40,"bul":true},{"k":"p","html":"<b>포사(鋪砂):</b> 형태를 빚은 뒤 차호의 표면에만 모래를 흩뿌려 박아 넣는 기법이다.","ind":40,"bul":true},{"k":"p","html":"<b>분류가 모호한 니료와 합니(合泥)</b>","ind":22,"bul":true},{"k":"p","html":"단일 원광(독니)과 순수니의 중간 성격을 띠거나, 갑니, 녹니, 백니, 원광주니 등 다양한 성질이 혼재된 자사들이 존재한다.","ind":40,"bul":true},{"k":"p","html":"<b>합니(合泥):</b> 흙에 섞어 천연 광택을 부여하는 역할을 하는 배합 니료로 추정된다.","ind":40,"bul":true},{"k":"p","html":"<b>부수 광료 — 석황(石黃)</b>","ind":22,"bul":true},{"k":"p","html":"<b>형태와 성질:</b> 자사 광맥 안에서 발견되는 철분 덩어리로, 흙층 안에 둥근 노란 달걀처럼 박혀 있으며 깨보면 단면이 달걀노른자 같다. 형태를 빚는 가소성이나 숨을 쉬는 기공이 거의 없다.","ind":40,"bul":true},{"k":"p","html":"<b>첨가 효과:</b> 이 석황을 깨서 곱게 간 뒤 자사니에 섞어 쓰면, 가마에서 흙이 녹아붙는 온도(소성 온도)를 낮춰주어 소결이 잘 되게 하고 기물 표면의 윤기와 광택을 크게 끌어올려 준다.","ind":40,"bul":true},{"k":"p","html":"<b>포다(泡茶) 시의 특징:</b> 석황을 섞으면 본래 흙의 사(砂)와 니(泥) 사이의 결합 친밀도가 떨어져 입자 간 공극이 많아진다. 이 때문에 차를 우릴 때 찻물을 훨씬 더 많이 빨아들이는 특성을 띠게 된다.","ind":40,"bul":true},{"k":"p","html":"<b>현대의 대체제:</b> 과거에는 석황을 천연 광택 및 융제로 썼으나, 현대에는 이 역할을 화학 첨가물인 탄산바륨이 대체하여 쓰이는 추세다.","ind":40,"bul":true},{"k":"h2","text":"□ 상등니료와 소성 후의 표면 특징 — 폭자(爆疵) · 폭자(爆子) · 폭니(爆泥)"},{"k":"p","html":"폭자(爆疵), 폭자(爆子), 폭니(爆泥)는 자사호를 가마에서 구워낸 뒤 기물 표면에 툭 튀어나온 볼록한 무늬나 철분이 녹아 터진 자국이 생기는 현상을 말한다.","ind":0,"bul":false},{"k":"p","html":"이는 흙 속에 사질(모래)과 철분이 풍부할 때 주로 발생하며, 특히 주니(朱泥)에서 흔하게 나타난다. 고온의 가마 속에서 다소 느슨하게 뭉쳐 있던 내부의 사질 입자들이 불균일하게 팽창하고 수축하며 밖으로 미세하게 폭발하듯 터져 나오는 원리다.","ind":0,"bul":false},{"k":"p","html":"외관상 흠처럼 보일 수 있으나, 차를 따르는 출수 등 기능에 큰 하자가 없다면 오히려 훌륭한 사질을 품은 상급 니료라는 긍정적인 증거로 평가한다. 좋은 흙일수록 이처럼 입자가 튀어나오기 쉬우므로, 제작 단계에서 튀어나온 사질을 안으로 매끄럽게 밀어 넣고 다듬는 명침(明針) 공정이 매우 중요해진다.","ind":0,"bul":false},{"k":"h3","text":"금준미(홍차) 관련 필기"},{"k":"p","html":"<b>① 제다 공정의 난이도:</b> 찻잎을 덖고 제다하는 전체 공정이 매우 까다로우며 공임(노동력)이 많이 들어간다.","ind":22,"bul":false},{"k":"p","html":"<b>② 동목촌과 노총수선:</b> 금준미는 우이산 자연보호구역으로 지정된 &#x27;동목촌(통목관)&#x27; 내 12개 자연 마을에서 생산된다. 차나무 수령은 평균 50년 정도로 생산량이 많지 않다. 특히 12개 마을 중 환경이 가장 좋고 나무 수령이 높은 마속(麻粟) 마을 주변의 200년 이상 된 늙은 차나무에서 딴 잎을 &#x27;노총수선&#x27;이라 부른다.","ind":22,"bul":false},{"k":"p","html":"<b>③ 정산소종과 외산 금준미:</b> 동목촌 안에서 전통 방식으로 생산된 것이 정통 &#x27;정산소종&#x27;이다. 반면 금준미를 처음 개발한 유명 브랜드 정산당(正山堂) 등은, 수요를 맞추기 위해 동목촌 외부의 찻잎을 수급하여 가공만 동목촌 내에서 하는 이른바 &#x27;외산 금준미&#x27;를 생산하기도 한다.","ind":22,"bul":false},{"k":"h3","text":"천청니(자사) 관련 필기"},{"k":"p","html":"<b>천청니의 기본 특징:</b> 하늘처럼 푸른색을 띠며 흙 속에 사석(모래 입자)이 많이 박혀 있는 귀한 흙이다. 소성 온도에 따라 저온에서는 갈색, 중온에서는 회색, 고온에서는 청색을 띤다. (청나라 중후기에 부유층이 주로 사용했다.)","ind":22,"bul":true},{"k":"p","html":"<b>저조청과의 비교:</b> 최고의 자니인 저조청 역시 기본적으로 약간 회색빛을 띠며, 고온에서 구울수록 청색으로 변하는 특징이 있다.","ind":22,"bul":true},{"k":"p","html":"<b>현대의 다양한 천청니 해석:</b> 오리지널 천청니 원광이 고갈된 현대에는 그 실체에 대한 해석이 분분하여 다양한 방식의 천청니가 명명되거나 인공적으로 개발되었다.","ind":22,"bul":true},{"k":"p","html":"<b>주금림(周金林):</b> 하늘에 떠 있는 별처럼 사석이 반짝이는 자신의 니료에 &#x27;천청니&#x27;라는 이름을 붙여 사용했다.","ind":40,"bul":true},{"k":"p","html":"<b>갈명상(葛明祥):</b> 산화코발트 등 화공 안료를 섞어 흑청색이 나도록 인공적으로 조배(배합)한 니료를 &#x27;천청니&#x27;라 명명했다. (이 초기 배합작들은 가마 소성 후에도 화공 안료 냄새가 많이 나는 단점이 있었다.)","ind":40,"bul":true},{"k":"p","html":"<b>용어의 현대적 쓰임:</b> 오늘날 시중에서 부르는 &#x27;자니&#x27;, &#x27;청회니&#x27;, &#x27;천청니&#x27; 등의 명칭은 특정 원광의 고유 명사라기보다는, 청색과 회색이 섞인 빛깔을 띠는 니료들을 두루 가리키는 포괄적인 용어로 쓰인다.","ind":22,"bul":true},{"k":"h2","text":"□ 자니 광료의 분류"},{"k":"h3","text":"1. 자니 광료 개관"},{"k":"p","html":"가장 대중적이고 널리 쓰이는 도자기 흙(자사)이다.","ind":22,"bul":true},{"k":"p","html":"자니 원광 자체를 모태로 하여 흙 속에 고유의 사질(모래) 구조를 형성하고 있는 것이 특징이다.","ind":22,"bul":true},{"k":"h3","text":"2. 역사상 최고의 니료라고 평가받는 천청니"},{"k":"p","html":"상등 자니로 분류되며, 청나라 중·후기에 부유층이 주로 쓰던 귀한 흙이다.","ind":22,"bul":true},{"k":"p","html":"현대에는 그 실체를 추측하며 자니, 주홍, 노니 등 다양한 흙을 바탕으로 여러 종류의 천청니를 개발한 바 있다.","ind":22,"bul":true},{"k":"p","html":"<b>갈명상 천청니 / 천해 천청니:</b> 모두 옛 천청니의 색감을 모방하고 재현하기 위해 배합 등의 방식을 시도하여 만들어낸 니료다.","ind":40,"bul":true},{"k":"h3","text":"3. 갑니 광층 내부의 자사 니층 분포"},{"k":"p","html":"<b>청수니(淸水泥):</b> 다른 흙이나 첨가물을 섞지 않고, 자니 원광에 물만 섞어 순수하게 만든 갈색 톤의 흙이다. (과거에는 대부분의 자니가 청수니였다.)","ind":22,"bul":true},{"k":"p","html":"<b>저조청 (특청수니):</b> 청수니 중에서 최상급(특급)으로 꼽히는 니료가 곧 저조청이다.","ind":22,"bul":true},{"k":"p","html":"<b>대량생산과 순도:</b> 1970~1980년대 조기에 생산된 저조청은 희석이 덜 되어 순도가 매우 좋고 훌륭한 사질의 청수니였으나, 1980~1990년대 대량생산 시기를 거치며 90년대에 끝난다.","ind":22,"bul":true},{"k":"h3","text":"4. 문혁 청수니의 탄생과 병배니의 개발"},{"k":"p","html":"<b>청수니의 한계와 배합의 필요성:</b> 자사 1창 초기에는 기존의 청수니(자니)만 썼는데, 갈색 톤에 부드러운 정도라 시각적인 임팩트가 부족했다. 이에 예쁜 색을 내기 위해 흙을 섞기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>병배니(拼配泥) / 병자니:</b> 두 종류 이상의 원광을 섞어 만든 흙이다. 사질은 많지만 니질이 부족한 흙들을 섞어 특이한 이색(異色)을 내기도 한다. (인공 색료를 넣는 조배니와 구분되며, 주니 역시 계속 섞어 쓰곤 한다.)","ind":22,"bul":true},{"k":"p","html":"<b>조배니(調配泥):</b> 자연계 흙에 없는 특이한 발색을 내기 위해 망간, 철분 등 일반적이지 않은 화학 물질(색료)을 투여해 배합한 흙이다.","ind":22,"bul":true},{"k":"p","html":"<b>1창 시기의 가치:</b> &#x27;민국녹니&#x27; 역시 조배니의 일종이다. 국영 자사 1창 시기에 만들어진 조배니들은 당시의 특별한 배합 비율을 가진 &#x27;오리지널 1창 니료&#x27;로서 가치를 지닌다.","ind":22,"bul":true},{"k":"note","html":"※ 저조청은 늙은 특급 청수니, 곧 특청수니라고도 부른다.","ind":22,"bul":false},{"k":"h3","text":"5. 저조청 (극품청수니 혹은 특청수니)"},{"k":"p","html":"광맥의 깊이에 따른 등급은 저조청 &gt; 중조청 &gt; 두조청 순으로 깊은 곳에 있는 저조청을 최고로 친다.","ind":22,"bul":true},{"k":"h2","text":"□ 민국 시기의 조배니"},{"k":"h3","text":"1. 민국녹니와 묵녹니"},{"k":"p","html":"<b>민국녹니(民國綠泥):</b> 노랑이나 초록빛을 띠는 단니 바탕에 코발트 계열의 청화 안료를 첨가하여 인공적으로 짙은 초록이나 청색을 내려고 만든 조배니다.","ind":22,"bul":true},{"k":"p","html":"<b>묵녹니(墨綠泥):</b> 어두울 묵(墨) 자를 쓰는 짙은 녹니로, 과거의 민국녹니를 재현하기 위해 고온 소성에 견디는 청화 안료를 섞어 만든 조배니의 일종이다. 민국녹니와는 구별되며 공극이 덜한 특징이 있다.","ind":22,"bul":true},{"k":"p","html":"<b>조배니의 품질:</b> 바탕이 되는 원광의 품질이 좋다면 조배니 자체는 기능상 문제가 되지 않으며, 조배니의 최종 품질은 결국 베이스가 되는 원광이 결정한다.","ind":22,"bul":true},{"k":"h3","text":"2. 흑니"},{"k":"p","html":"<b>천연 흑니 (본색오회니):</b> 자연적으로 철분과 망간이 풍부하여 아주 짙은 고동색(흑색)을 띠는 천연 원광을 본색오회니라 부른다.","ind":22,"bul":true},{"k":"note","html":"※ 7강에서 다루는 인공 환원 소성인 &#x27;오회 기법&#x27;과 연관된 개념이다.","ind":22,"bul":false},{"k":"p","html":"<b>병자사의 시작:</b> 이 천연 흑니의 아름다운 색감을 인공적으로 구현해 보려는 시도에서, 청수니를 베이스로 다른 흙을 배합하는 병자사(배합니) 기술이 본격적으로 시작되었다.","ind":22,"bul":true},{"k":"p","html":"<b>철상홍(鐵星紅):</b> 조배니에 철가루 등을 의도적으로 첨가하여 완전히 이색적인 색깔을 유도한 흙으로, 기물 표면에 붉은 점이 마치 별처럼 박혀 있는 것이 특징이다.","ind":22,"bul":true},{"k":"h1","text":"7강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 자사니의 발색을 도드라지게 하는 인공의 첨가물 혹은 가공 기법의 예를 들어보세요."},{"k":"p","html":"<b>탄산바륨 (화학 첨가물):</b> 기물 표면의 광택을 높여주며, 흙의 가소성(찰기)을 증가시켜 가마 소성 시 차호가 터지지 않게 돕는 역할을 한다.","ind":22,"bul":true},{"k":"p","html":"<b>석황 (천연 부수 광료 첨가):</b>","ind":22,"bul":true},{"k":"p","html":"철분 함량이 아주 높은 천연 광물 덩어리로, 좋은 자사니와 최고의 궁합을 자랑한다.","ind":40,"bul":true},{"k":"p","html":"흙에 소량 첨가하면 발색이 훨씬 깊고 진해지며 표면에 윤기(기름기)가 돌아 미적으로 매우 훌륭해진다.","ind":40,"bul":true},{"k":"p","html":"다만 물에 잘 녹지 않고 둥둥 떠서 반죽 등 흙의 가공이 어려워지며, 완성 후 상대적으로 깨지기 쉽다는 단점이 있다.","ind":40,"bul":true},{"k":"p","html":"석황이 첨가되면 사(砂)와 니(泥) 사이의 공극이 커져, 차를 우릴 때 차의 향미를 많이 흡수하는 특성을 띠게 된다.","ind":40,"bul":true},{"k":"h3","text":"2. 흑니를 구현하는 방법으로써의 오회(烏灰) 기법에 대해 설명해 보세요."},{"k":"p","html":"<b>천연 흑니 (내추럴 흑니):</b> 과거의 오리지널 흑니는 갈색 바탕 흙에 검은 입자(점)가 자연스럽게 들어 있는 짙은 고동색을 띠었다.","ind":22,"bul":true},{"k":"note","html":"※ 최근 시중의 본산 흑니 중에는 백토와 유사한 성분으로 이루어진 것들도 있다.","ind":22,"bul":false},{"k":"p","html":"<b>망간 첨가 (조배니):</b> 1970~1980년대에 이르러 천연 흑니의 짙은 색을 흉내 내기 위해 흙에 화학 물질인 망간을 넣어 인공 흑니를 만들기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>오회(捂灰/烏灰) 기법의 개념과 특징:</b>","ind":22,"bul":true},{"k":"p","html":"망간 등 안료를 섞는 대신, 가마 속에 연기를 먹여 산소를 차단하는 환원 소성 방식(연훈 기법 등)을 통해 인공적으로 검은색(흑니)을 구현해 내는 가공 공법이다.","ind":40,"bul":true},{"k":"p","html":"오회 기법으로 구워낸 차호는 고온 소성에 취약하다는 특징이 있다.","ind":40,"bul":true},{"k":"note","html":"※ 너무 높은 온도로 다시 굽게 되면 연기 먹은 것이 빠져나가 본래의 흙 색깔로 돌아가거나 기물에 문제가 생길 수 있다.","ind":40,"bul":false},{"k":"h2","text":"※ 광료의 위치와 광층의 성격"},{"k":"h3","text":"1. 광료의 위치와 용(龍)의 비유"},{"k":"p","html":"자사 광료를 파악할 때는 흙의 색상, 광맥이 형성된 지층, 그리고 광료가 묻혀 있는 위치를 종합적으로 살핀다.","ind":22,"bul":true},{"k":"p","html":"<b>자니(紫泥):</b> 돌산인 황룡산을 용의 뼈(용골, 龍骨)로 보았을 때, 자니는 용의 껍질인 &#x27;용피(龍皮)&#x27;나 용의 살인 &#x27;용지(龍脂)&#x27;에 비유될 정도로 산에 넓고 두텁게 분포하는 광층이다.","ind":22,"bul":true},{"k":"p","html":"<b>녹니(綠泥)와 단니(段泥):</b> 용의 뼈대와 살 사이에 띠 모양으로 얇게 뻗어 있는 힘줄, 곧 &#x27;용근(龍筋)&#x27;에 해당한다. 자니 층 사이에 얇게 샌드위치처럼 끼어 있으며 선명한 색을 띠는 것이 특징이다.","ind":22,"bul":true},{"k":"h3","text":"2. 광층의 성격: 단일광과 공생광"},{"k":"p","html":"<b>단일광(單一鑛):</b> 하나의 지층에서 동일한 성격의 광물만 순수하게 산출되는 경우를 말한다.","ind":22,"bul":true},{"k":"p","html":"<b>공생광(共生鑛):</b> 하나의 지층(광상)에 성질이 서로 다른 광물이 자연적으로 섞여서 함께 산출되는 경우를 말한다.","ind":22,"bul":true},{"k":"h3","text":"3. 공생광의 대표 사례 — 단니(段泥)"},{"k":"p","html":"<b>단니의 특성:</b> 단니는 대표적인 공생광으로, 기본적으로 사질(모래)은 풍부하지만 여러 흙이 섞여 있어 자사의 순도가 상대적으로 떨어지고 색이 탁한 편이다.","ind":22,"bul":true},{"k":"note","html":"※ 예외적으로 아주 품질이 좋은 최상급 &#x27;본산단니&#x27;는 사실상 녹니에 가깝다.","ind":22,"bul":false},{"k":"p","html":"<b>단니의 활용과 형성:</b> 과거 대형 화분이나 큰 물건을 빚을 때, 사질이 풍부한 단일 흙만으로는 양이 턱없이 부족하여 자니 등 다른 흙을 섞어 썼다. 이처럼 여러 흙과 사질이 대량으로 섞이게 되면 자연스럽게 단니의 성격을 띠게 된다. (비록 섞인 흙이라도 그중에서 좋은 부위를 잘 골라 만들면 품질이 나쁘지 않다.)","ind":22,"bul":true},{"k":"h2","text":"□ 자사 광료의 분류 3 — 녹니류"},{"k":"h3","text":"1. 녹니(綠泥)의 산출과 성질"},{"k":"p","html":"<b>용근(龍筋):</b> 갑니(甲泥) 안의 자니 광층 내부에 얇은 띠 형태로 존재하는 흙이다. 눈으로 보면 뼈대 사이의 힘줄 같다고 하여 &#x27;용근&#x27;이라 불린다.","ind":22,"bul":true},{"k":"p","html":"<b>특성:</b> 색이 선명하고 맑으며 다른 불순물이 섞이지 않은 순수한 백색의 띠 부위만을 녹니라 부른다. 전체 산출량이 매우 적다.","ind":22,"bul":true},{"k":"p","html":"<b>가공의 난이도:</b> 백색이 짙을수록 백토와 성분이 비슷해져 가마의 소성 온도를 매우 높게 잡아야 한다. 본질적으로 &#x27;사질이 많은 백토&#x27;와 같아서 단독으로 형태를 빚기 어려워 다른 흙과 섞어 쓰는 경우가 많다.","ind":22,"bul":true},{"k":"h3","text":"2. 공생광으로서의 단니(段泥)"},{"k":"p","html":"단니는 여러 광석이 함께 섞여 있는 공생광(共生鑛)이다.","ind":22,"bul":true},{"k":"p","html":"이것저것 자연스럽게 섞인 광석이므로 시중에 판매하는 단니 중 성분이 완벽히 똑같은 흙은 존재하지 않는다.","ind":22,"bul":true},{"k":"note","html":"※ 광맥이 아래로 내려가면서 발굴되는 특성이 있다.","ind":22,"bul":false},{"k":"p","html":"사질이 너무 많으면 흙이 잘 붙지 않고, 반대로 니질(점토)이 너무 많으면 진득거려 다루기 까다롭다.","ind":22,"bul":true},{"k":"h3","text":"3. 이피녹니(梨皮綠泥)와 이피니"},{"k":"p","html":"<b>이피니:</b> 표면이 서양배 껍질처럼 오돌토돌한 흙을 말한다. 뼈대인 사질의 비중이 높지만 베이스 자체는 니질이라서 밝은 색깔을 띠며 소성 온도가 높다.","ind":22,"bul":true},{"k":"p","html":"<b>이피녹니:</b> 사질과 니질이 둘 다 풍부하여 제작 시 고도의 숙련도가 요구된다. 만들어내기가 매우 힘들어 시중에서 보기 힘든 귀한 니료다.","ind":22,"bul":true},{"k":"h3","text":"4. 소성 불량: 우루(雨漏) 현상"},{"k":"p","html":"가마에서 구울 때 흙 입자들이 완전히 녹아붙는 소결이 제대로 되지 않아, 그 미세한 틈새를 뚫고 찻물이 밖으로 삐져나오거나 새어 나오는 불량 현상이다.","ind":22,"bul":true},{"k":"h3","text":"5. 녹니·단니와 차종의 궁합"},{"k":"p","html":"<b>녹니:</b> 흡수성과 통기성이 모두 뛰어나다. 향을 잘 살려주므로 향이 좋은 고산 우롱차나 철관음 등 산화도가 낮은 청차류를 우리기에 가장 어울린다.","ind":22,"bul":true},{"k":"p","html":"<b>단니:</b> 녹니에 비해 흡수성은 높으나 통기성이 상대적으로 낮다.","ind":22,"bul":true},{"k":"h2","text":"※ 강파니(降坡泥)"},{"k":"h3","text":"1. 강파니의 유래와 특징"},{"k":"p","html":"<b>발견과 명칭:</b> 단니 계열의 흙으로, 이름의 &#x27;강파(降坡)&#x27;는 비탈진 언덕을 의미한다. 2007년 언덕에서 도로 공사를 위해 굴착기(포크레인)로 땅을 파다가 우연히 발견된 자사니다.","ind":22,"bul":true},{"k":"p","html":"<b>물성:</b> 서로 다른 성질의 흙이 섞여 있는 공생광(共生鑛)이라 모래(사)와 진흙(니) 입자 사이의 결합 친화도가 떨어진다.","ind":22,"bul":true},{"k":"p","html":"<b>색상 분류:</b> 주로 붉은색을 띠는 홍강파(紅降坡)와, 황룡산 계열로 노란색이나 짙은 주황색을 띠는 황강파(黃降坡) 등으로 나뉜다.","ind":22,"bul":true},{"k":"h3","text":"2. 특수 광료: 용혈사(龍血砂)"},{"k":"p","html":"<b>개념:</b> 강파니 광석 중에서 붉은색을 띠는 부위만 특별히 골라낸 흙이다. 마치 용의 피(용혈)와 용의 뼈로 빚어낸 자사호라는 상징적인 의미를 담고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>제작의 난이도:</b> 사질이 극도로 많으면서도 끈적이는 점성을 지녀, 반죽 시 수분이 너무 빨리 날아가는 치명적인 단점이 있다.","ind":22,"bul":true},{"k":"p","html":"<b>갈라짐 현상:</b> 본래 수축이 심한 주니 태생이 아님에도 불구하고, 수분 증발이 빨라 가마에 굽기도 전부터 표면이 쉽게 갈라지므로 기물을 만들어내기가 극도로 어렵다.","ind":22,"bul":true},{"k":"note","html":"※ 앞서 정리한 5강 부속 자료 4번의 &#x27;강파니 화학 성분 및 용출 위탁 검사 성적서&#x27;가 이 강파니의 안전성과 물성을 뒷받침하는 실물 자료다.","ind":14,"bul":false},{"k":"h2","text":"□ 자사 광료의 분류 4 — 단니류"},{"k":"h3","text":"1. 단니(段泥)의 개념과 기본 성질"},{"k":"p","html":"<b>모태와 형성:</b> 기본 모태는 자니(紫泥)다. 단니는 특정한 단일 흙을 가리키기보다는, 성질이 다른 여러 흙의 띠가 겹치는 구간인 공생광(共生鑛)에서 채굴된 혼합토의 성격을 띤다.","ind":22,"bul":true},{"k":"p","html":"<b>물성과 색상:</b> 뼈대인 사질(모래) 함량이 아주 많고 색상이 매우 밝은 흙이다. 가마에서 고온으로 구울수록 명도가 더욱 높아진다.","ind":22,"bul":true},{"k":"p","html":"<b>제작의 특징:</b> 사질이 많은 데다 사(砂)와 니(泥) 입자 사이의 친화도가 떨어져 차호를 빚어내기가 까다롭다. 일반적으로 섞인 흙이라 색이 탁한 편이며, 과거에는 주로 대형 화분 등을 만드는 데 사용되었다.","ind":22,"bul":true},{"k":"h3","text":"2. 단니 계열의 세부 니료"},{"k":"p","html":"<b>홍피룡(紅皮龍)과 단수니:</b> 단니와 청수니 계열이 섞인 &#x27;단수니&#x27; 중 최상품이 &#x27;갑동&#x27;이라는 곳에서 나온다. 그중 홍피룡은 &#x27;껍질이 붉은 산(용)&#x27;이라는 뜻으로, 황룡산의 표층(껍질) 부위에 분포하는 약간 붉은빛의 흙을 가리킨다.","ind":22,"bul":true},{"k":"p","html":"<b>강파니(降坡泥):</b> 앞서 다룬 강파니 역시 단니 계열에 속하는 공생광(갑니)이다. 여러 광석이 섞여 있어 부드러운 진흙 성질과 풍부한 사질을 동시에 가지고 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사의 역사와 제호 명가 1 — 명대"},{"k":"p","html":"자사를 활용한 차기는 북송 시기에 처음 탄생한 것으로 추정하며, 명나라 중기인 무종 정덕 연간에 이르러서는 자사를 이용하여 차호를 제호하기 시작하였다. 자사니를 이용한 차구의 역사와 자사 명호, 시대별 제호 명가의 흐름을 짚어보면 다음과 같다.","ind":0,"bul":false},{"k":"h3","text":"1. 자사 차구의 시작"},{"k":"p","html":"<b>자사호의 창시자:</b> 명나라 정덕 연간에 &#x27;공춘(供春)&#x27;이라는 인물이 처음으로 자사니를 이용해 자사호를 만든 것으로 알려져 있다.","ind":22,"bul":true},{"k":"p","html":"<b>가공 기술의 차이:</b> 흙을 정제하고 차호를 빚어내는 기술이 부족했던 명대 초기 당시의 실제 완성도와 달리, 현대에 이르러 복원된 공춘호들은 매우 정교하게 가공되어 있는 차이를 보인다.","ind":22,"bul":true},{"k":"h3","text":"2. 명대 공춘호와 공춘의 생몰에 관한 논의"},{"k":"p","html":"<b>공춘호의 유래:</b> 공춘의 본명은 정확히 알려져 있지 않다. 그가 모시던 주인이 금사사(金沙寺)에 공부하러 들어갔을 때 함께 따라갔다가, 심심함을 달래기 위해 절을 돌아다니던 중 노스님이 흙으로 차호를 빚는 것을 구경하고 이를 모방하여 만들어낸 것이 최초의 &#x27;공춘호&#x27;라고 전해진다.","ind":22,"bul":true},{"k":"p","html":"<b>공춘호 뚜껑 복원 일화:</b> 1900년대 초반, 여러 수장가들이 협력하여 박물관에 공춘호를 기증했으나 몸통만 있고 뚜껑이 유실된 상태였다. 이에 당대의 작가들에게 복원을 의뢰하여, 두 작가가 각각 버섯 모양과 가지 모양의 뚜껑을 새롭게 만들어낸 일화가 있다.","ind":22,"bul":true},{"k":"p","html":"<b>현존 여부:</b> 현재 오리지널(진품) 공춘호 원작은 온전히 전해 내려오는 것이 없다.","ind":22,"bul":true},{"k":"h3","text":"3. 가장 오래된 자사 출토기 — 명대 남경 오경 제량호"},{"k":"p","html":"<b>최초의 연대 확인 유물:</b> 중국 남경(난징)에 있는 오경(吳經)이라는 인물의 무덤에서 발굴된 &#x27;제량호(提梁壺)&#x27;다. 1533년(명나라 가정 12년) 하장묘에서 출토되어, 현재 연대가 명확히 확인되는 가장 오래된 자사기로 꼽힌다.","ind":22,"bul":true},{"k":"p","html":"<b>제량(提梁)의 의미:</b> 차호의 몸통 위쪽으로 무지개처럼 넘어가게 달려 있는 손잡이 형태를 뜻한다.","ind":22,"bul":true},{"k":"note","html":"※ 앞서 다룬 4강 사물추상형 차호의 &#x27;제량호&#x27; 개념과 이어진다.","ind":22,"bul":false},{"k":"h4","text":"『양선명호계(陽羨茗壺系)』의 의의"},{"k":"p","html":"<b>최초의 자사 기록:</b> 자사에 대한 최초의 문헌 기록이자 도록이다.","ind":22,"bul":true},{"k":"p","html":"<b>명칭의 의미:</b> &#x27;양선&#x27;은 의흥의 옛 지명이며, &#x27;양선명호&#x27;는 곧 의흥의 자사 차호를 뜻한다.","ind":22,"bul":true},{"k":"note","html":"※ 저술 시기는 명말청초에 해당한다.","ind":22,"bul":false},{"k":"h3","text":"4. 명말 4대 명인 (4대가)"},{"k":"p","html":"<b>명말 4대가:</b> 공춘 이후 명나라 말기에는 자사 제호를 이끌어간 4대 명인으로 동한(董翰), 조량(趙梁), 원창(元暢), 시붕(時朋)이 활동했다. (그중 시붕의 아들이 유명한 시대빈이다.) 이 시기에는 이무림(李茂林)이라는 인물도 함께 등장했다.","ind":22,"bul":true},{"k":"p","html":"<b>문인·사대부의 참여와 만생호(曼生壺):</b> 이 시기 이후 문인과 사대부들이 차호 제작에 직접 참여하기 시작해 서법, 시화, 전각 등을 새겨넣었다. 그 결과 청나라 가경 연간에 진홍수(陳鴻壽, 호 만생(曼生))가 설계한 문인풍 차호인 '만생호'가 탄생하게 되었다.","ind":22,"bul":true},{"k":"p","html":"<b>혜맹신과 소호(小壺):</b> 청나라 초기에 활동한 것으로 전해지는 혜맹신은, 공부차(工夫茶)를 우릴 때 쓰이는 작고 정교한 주니 소호(小壺)의 대명사로 유명하다.","ind":22,"bul":true},{"k":"note","html":"※ 근현대에는 대가 고경주 등이 활발하게 활동했다. 또한 1950년대 후반(1956년 공사합영 등)부터 국영 자사창이 설립되어 장인들을 체계적으로 교육하고 현대의 자사 제조 기법을 정립하기 시작했다.","ind":22,"bul":false},{"k":"h3","text":"5. 3대 명인 (3대 국수) — 시대빈, 이중방, 서우천"},{"k":"p","html":"명나라 말기 자사호의 제작 기법을 체계적으로 정립하며, 단순한 식기를 넘어 차호를 하나의 예술품의 반열로 끌어올린 시기다.","ind":22,"bul":true},{"k":"h4","text":"시대빈(時大彬, 1573~1648)"},{"k":"p","html":"<b>업적:</b> 3대 국수의 수장으로, 자사 제작 기술을 대폭 발전시키고 예술적 경지로 끌어올렸다.","ind":22,"bul":true},{"k":"note","html":"※ &#x27;사빈&#x27; 등으로 불리기도 했다.","ind":22,"bul":false},{"k":"p","html":"<b>지역과 장식 기법:</b> 의흥의 또 다른 옛 이름인 형계(荊溪, 형계현) 출신이며, 조양(條陽)이나 포사(鋪砂) 같은 다양한 표면 장식 기법을 고안했다.","ind":22,"bul":true},{"k":"p","html":"<b>낙관(도장)의 도입:</b> 차호 바닥 등에 직접 도장을 찍어 작가의 인장을 남기는 &#x27;낙관&#x27; 제도를 처음으로 정착시켰다.","ind":22,"bul":true},{"k":"h4","text":"시대빈의 제자들과 낙관의 위치"},{"k":"p","html":"<b>3대 국수 (제자들):</b> 시대빈의 뛰어난 제자 중에서도 이중방과 서우천이 가장 유명한 두 명의 대가로 꼽힌다. (당시에는 실력이 뛰어난 제자가 스승의 이름을 대신 새겨 넣는 것을 허락받는 것이 가장 큰 영예였다.)","ind":22,"bul":true},{"k":"p","html":"<b>낙관의 위치별 명칭:</b>","ind":22,"bul":true},{"k":"p","html":"<b>저관(底款):</b> 차호의 바닥면에 찍은 낙관","ind":40,"bul":true},{"k":"p","html":"<b>파관(把款):</b> 손잡이 부근에 찍은 낙관","ind":40,"bul":true},{"k":"p","html":"<b>내관(內款):</b> 차호 몸체 안쪽(또는 뚜껑 안쪽)에 새긴 낙관","ind":40,"bul":true},{"k":"h4","text":"후대의 제호 명가와 형태별 명칭"},{"k":"p","html":"<b>반씨 집안의 차호:</b> 청나라 때 활약한 반사성(潘仕成 등) 집안에서 만든 차호들로, 모양에 따라 고반호(高潘壺), 중반호(中潘壺), 왜반호(矮潘壺) 등으로 불린다.","ind":22,"bul":true},{"k":"note","html":"※ 의흥 일대의 명칭인 형계 및 혜맹신 등의 낙관 명칭과 함께, 1강에서 다루었던 국가 공인 자사명인 제도의 역사적 맥락과도 이어진다.","ind":22,"bul":false},{"k":"h3","text":"6. 공부차의 시대를 연 혜맹신(惠孟臣)"},{"k":"p","html":"명말청초에 활약한 제호가로, 오늘날 남방의 진한 차 문화인 공부차(工夫茶)를 우릴 때 쓰이는 작고 정교한 주니 소호(小壺)의 시대를 연 인물이다. 현재도 공부차용 소호가 다수 남아 있다.","ind":22,"bul":true},{"k":"p","html":"<b>맹신적안(孟臣赤眼):</b> 혜맹신이 만든 대표적인 붉은색 주니 소호를 가리키며, 최초의 제작 시기는 1600년대 경(청나라 초기)으로 추정된다.","ind":22,"bul":true},{"k":"p","html":"<b>낙관 문구:</b> 차호에 주로 &#x27;형계혜맹신제(荊溪惠孟臣製)&#x27;라는 도장(낙관)이 새겨져 있는 것이 특징이다. (여기서 &#x27;형계&#x27;는 의흥의 옛 지명을 뜻한다.)","ind":22,"bul":true},{"k":"p","html":"<b>독특한 낙관 위치:</b> 일반적인 자사호들과 달리 바닥면에 큼직하게 도장을 찍지 않고, 주로 차호의 몸체 안쪽(또는 뚜껑 안쪽)에만 은밀하게 낙관을 찍어둔 경우가 많다.","ind":40,"bul":true},{"k":"p","html":"<b>구성:</b> 혜맹신의 대표적인 적안호는 작가의 인장을 뜻하는 낙관, 정밀한 인상을 주는 정안(政安), 그리고 흙을 파서 새긴 도각(刀刻) 등의 요소로 이루어져 있다.","ind":40,"bul":true},{"k":"p","html":"<b>공부삼보(工夫三寶):</b> 자사호 연구와 차 문화 맥락에서 차를 우릴 때 필수적인 세 가지 도구(차필무이, 배필약침, 호필맹신) 중 &#x27;호는 반드시 맹신 것을 쓴다&#x27;는 말에서 맹신호의 위상을 엿볼 수 있다.","ind":22,"bul":true},{"k":"h2","text":"※ 자사 공예사 등급과 시장 메모"},{"k":"p","html":"자사 공예사 직급 체계 (상위 등급부터 하위 순): 중국의 자사 공예사 등급은 국가에서 엄격하게 관리하며, 경력과 실력에 따라 아래와 같은 체계로 나뉜다.","ind":22,"bul":true},{"k":"p","html":"<b>국가대사:</b> 국가에서 지정하는 명예직이다.","ind":40,"bul":true},{"k":"p","html":"<b>성대사:</b> 명예직(국가대사) 바로 아래 실무 등급 중에서는 가장 높은 최고 등급이다.","ind":40,"bul":true},{"k":"p","html":"<b>정고급 공예사 (정고공):</b> 연구원급 고급 공예사와 함께 실질적인 최고위 장인 그룹에 속한다.","ind":40,"bul":true},{"k":"p","html":"<b>고급 공예사</b>","ind":40,"bul":true},{"k":"p","html":"일반 공예사 (중급 공예사)","ind":40,"bul":true},{"k":"p","html":"조리 공예사 (보조 공예사)","ind":40,"bul":true},{"k":"p","html":"<b>공예원:</b> 자사 공예 입문 4~5년 차 정도가 받는 가장 기초적인 등급이다.","ind":40,"bul":true},{"k":"p","html":"<b>자사호 시장 가격 및 지역별 선호도</b>","ind":22,"bul":true},{"k":"p","html":"<b>등급별 가격 형성:</b>","ind":40,"bul":true},{"k":"note","html":"※ 화폐 단위는 중국 위안화(元/RMB)로 추정된다.","ind":22,"bul":false},{"k":"p","html":"정고급 공예사(정고공)의 작품은 작가의 이름값이 덜 알려졌더라도 기본 7,000 이상에서 거래된다.","ind":56,"bul":true},{"k":"p","html":"중급 공예사의 작품은 보통 1,000 이상에서 가격이 형성된다.","ind":56,"bul":true},{"k":"p","html":"실사용으로 쓸 만한 품질의 차호는 대략 500~600 이상부터 시작하며, 이 정도 금액대면 실용기로서 충분히 훌륭하다.","ind":56,"bul":true},{"k":"p","html":"<b>지역별 크기 선호도:</b> 차 문화와 기후의 차이로 인해, 북방 지역은 큼직한 &#x27;대호(大壺)&#x27;를 선호하고 남방 지역은 오밀조밀한 &#x27;소호(小壺)&#x27;를 선호하는 경향이 뚜렷하다.","ind":40,"bul":true},{"k":"p","html":"<b>시장 소비 성향:</b> 대륙의 북방/남방이 최신 작가의 명성이나 화려한 작품 자체를 위주로 선호한다면, 대만 등 일부 노차(老茶) 중심 시장에서는 정교한 소호나 오래된 골동(노호)을 더욱 선호하는 식으로 소비 성향이 나뉜다.","ind":40,"bul":true},{"k":"h2","text":"※ 자사창의 시대별 흐름"},{"k":"h3","text":"1. 1970년대: 수출의 시대 개막과 외화벌이"},{"k":"p","html":"<b>수출 호황:</b> 1970년대에 이르러 자사호 수출의 시대가 본격적으로 열렸다. 홍콩 등지로 대량 수출을 하면서 국가적인 외화벌이 수단이 되었고, 해외 관광객들이 공장을 직접 관람하러 방문하기도 했다.","ind":22,"bul":true},{"k":"p","html":"<b>생산량 증대:</b> 이러한
