 수출 수요와 국가적 지원 덕분에 1970년대에 제조된 자사호 물량이 다수 시중에 남아 유통될 수 있었다.","ind":22,"bul":true},{"k":"note","html":"※ 80년대 이전까지는 공식 자사 공장이 &#x27;자사 1창&#x27; 하나만 존재했다.","ind":22,"bul":false},{"k":"h3","text":"2. 1980년대: 2창 설립과 고급호(특예반)의 탄생"},{"k":"p","html":"<b>자사 2창의 신설:</b> 1980년대에 들어서며 수요 폭증으로 자사 2창이 새로 생겨났다.","ind":22,"bul":true},{"k":"p","html":"<b>특예반(우수반) 개설:</b> 1창의 공장장이 이제는 대량생산품을 넘어 예술성 높은 &#x27;고급호&#x27;를 제작해야 한다고 판단하여, 사내에 우수 장인들을 모은 &#x27;특예반&#x27;을 개설하고 고급 주문 제작을 받기 시작했다. 이 과정에서 당대 최고의 대가인 고경주의 위상이 더욱 높아져 최초의 자사대사로 임명되었다.","ind":22,"bul":true},{"k":"p","html":"<b>원광의 변화:</b> 1980년대 이전까지는 주로 순수한 청수니를 많이 사용했다.","ind":22,"bul":true},{"k":"h3","text":"3. 1980년대 후반 이후: 3·4창 설립과 원광의 고갈"},{"k":"p","html":"<b>생산 과열과 광석 부족:</b> 1980년대 후반에 이르러 생산량이 지나치게 많아지고 천연 자사 광석이 부족해지면서, 흙의 순도가 점차 떨어지기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>추가 공장 신설:</b> 수요를 감당하기 위해 3창, 4창 등 추가 공장들이 계속해서 생겨났다.","ind":22,"bul":true},{"k":"h2","text":"□ 1창 시절의 대표적인 병배니"},{"k":"p","html":"연고토(年糕土) · 흑성토(黑星土) · 병자니(拼紫泥)","ind":0,"bul":false},{"k":"p","html":"<b>배합의 활성화:</b> 1980년대부터 천연 원광의 부족과 다양한 표현 욕구로 인해 여러 흙을 섞는 병배니가 본격적으로 많이 쓰이기 시작하며 다양한 시도들이 이루어졌다.","ind":22,"bul":true},{"k":"h3","text":"1. 대표적인 병배니의 종류"},{"k":"p","html":"<b>연고토(年糕土):</b> 떡(연고)처럼 흙을 아주 곱게 갈아서 반죽한 흙이다.","ind":22,"bul":true},{"k":"p","html":"<b>흑성토(黑星土):</b> 거친 자니 입자를 살짝 섞어 만든 흙이다.","ind":22,"bul":true},{"k":"note","html":"※ 노트에는 망간 등을 첨가하여 기물 표면에 검은 별(점)이 박힌 효과를 낸 흙으로도 적혀 있다.","ind":22,"bul":false},{"k":"p","html":"<b>병자니(拼紫泥):</b> 자니 계열의 흙을 서로 섞은 것으로, 검은 입자(흑성)를 많이 넣어 질감을 살린 일반적인 병자니다. 그중에서도 최상급 병자니는 앞서 언급한 1창의 &#x27;특예반&#x27;에서 고급 차호를 만들 때 사용하였다.","ind":22,"bul":true},{"k":"h3","text":"2. 1990년대 이후 자사창의 변화와 민영화"},{"k":"p","html":"<b>조배니의 성행:</b> 1990년대에 들어서며 다양한 디자인 추구와 함께 색료 활용이 늘어나 여러 가지 색을 내는 조배니와 이색니들이 크게 성행했다.","ind":22,"bul":true},{"k":"p","html":"<b>국영 시대의 마침표 (1997년):</b> 1990년대 중후반으로 갈수록 천연 원료 수급이 어려워지고 채산성이 급격히 떨어지면서 결국 공장이 민영화의 길을 걷게 되었고, 1997년에 자사창이 공식 해산하면서 국영 자사 시대가 막을 내렸다.","ind":22,"bul":true},{"k":"h3","text":"3. 2000년대 이후의 상황"},{"k":"p","html":"<b>원광 고갈과 채광 금지 (2004년):</b> 2000년대 중반에 이르러 자사 흙이 극도로 부족해졌다. 특히 2004년에는 황룡산의 무분별한 채굴을 막고 흙의 가치를 높이기 위해 4호정 등 핵심 갱구의 채광을 금지하고 보호 조치에 들어갔다.","ind":22,"bul":true},{"k":"note","html":"※ 황룡산 일대 전체의 채굴이 전면 금지된 것은 2010년 전후다(5강 「황룡산 광구 일대의 노천 채광의 연혁」 참고).","ind":14,"bul":false},{"k":"h2","text":"※ 자사 차통(茶筒)"},{"k":"p","html":"자사 차통에는 무이암차를 넣어야 한다.","ind":22,"bul":true},{"k":"p","html":"완성된 차를 정돈하고 안 좋은 향기를 빼는 용도다. 숙성과 진화를 구분해서 생각해야 한다.","ind":22,"bul":true},{"k":"p","html":"숙성의 용도로 쓴다.","ind":22,"bul":true},{"k":"p","html":"생차의 경우 진화를 해야 하므로 자사 차통을 쓰지 않는 게 좋다.","ind":22,"bul":true},{"k":"h2","text":"□ 1창 홍니 수평호의 시기별 특징"},{"k":"h2","text":"※ 자사 성질에 의한 분류"},{"k":"table","html":"<table><tr><th><div><b>도토</b></div></th><th><div><b>자사</b></div></th></tr><tr><td><div>갑니</div></td><td><div>자니</div></td></tr><tr><td><div>눈니</div></td><td><div>(X 표시) → 자사홍니, 순주니</div></td></tr><tr><td><div>백니</div></td><td><div>녹니</div></td></tr></table>"},{"k":"h3","text":"수축률과 사질(모래)에 따른 성질 비교"},{"k":"p","html":"<b>갑니와 자니:</b> 수축률이 상대적으로 적으며, 사질이 많아 질감이 사각사각하고 거칠다.","ind":22,"bul":true},{"k":"note","html":"※ 순주니에 비해 거칠지만, 갑니 특유의 거친 입자 성질을 지닌다.","ind":22,"bul":false},{"k":"p","html":"<b>청수니 계열:</b> 청수니, 도청수니, 홍청수니 등은 1창 이전 시기에 주로 쓰였다.","ind":22,"bul":true},{"k":"p","html":"<b>원시홍니:</b> 사질이 많다. 현대의 흙으로 오면서 사질이 고와졌지만 과거 갑니만큼 거칠지는 않다. 표면에 미세한 주름이 있으며 부드러우면서도 우수한 질감을 띤다.","ind":22,"bul":true},{"k":"p","html":"<b>순수주니:</b> 수축률과 사성(砂性)이 압도적으로 높다. 반면 원시주니는 상대적으로 부들부들한 성질을 가진다.","ind":22,"bul":true},{"k":"h3","text":"1창 시기의 제작 환경과 주니의 역사"},{"k":"p","html":"<b>1창 시절의 성형 방식:</b> 자사 1창 말기(1990~1997년)에 만들어진 차호들은 모두 반수공(半手工) 방식을 취했다. 이 시기에는 현대식 순주니나 까다로운 현대 주니가 거의 없었으며, 주로 (자사홍니 + 주니) 형태의 배합니가 존재했다. (전반적으로 예전 시대에 만들어진 것들의 흙 품질이 더 우수하다.)","ind":22,"bul":true},{"k":"p","html":"<b>오리지널 홍니:</b> 저조청 계열 등에 가깝고 사질이 많아, 극단적인 주니에 비해서는 소성 수축률이 아주 터무니없이 높지는 않다.","ind":22,"bul":true},{"k":"p","html":"<b>주니의 완성 시기:</b> 자사 주니 제호 기법은 1700년대에 이르러 완전히 틀을 잡았으며, 다양한 배합과 병배 기법 역시 이 시기에 완성되었다. 자사호의 미적 완성도가 가장 뛰어난 최전성기는 1800년대 이전으로 평가받는다.","ind":22,"bul":true},{"k":"h2","text":"□ 1창 시기의 상품호"},{"k":"h2","text":"※ 자사의 색깔에 의한 3대분류"},{"k":"p","html":"<b>순주니:</b> 주니 계열과 갑니 계열의 중간적 성격을 띠며, 관련 니료들을 폭넓게 포함하는 개념이다.","ind":22,"bul":true},{"k":"p","html":"<b>원시홍주니:</b> 표면의 질감은 부드러우면서도 내부의 자사(사질)는 거친 특성을 가진다.","ind":22,"bul":true},{"k":"p","html":"<b>청수니 계열:</b> 청수니와 홍청수니 등이 있으며, 자니를 베이스로 한다. (청대에도 홍청수니 등이 활용되었다.)","ind":22,"bul":true},{"k":"p","html":"<b>갑니 계열:</b> 갑니층에서 채굴되는 흙들로 전반적으로 붉은 갈색 톤을 띤다.","ind":22,"bul":true},{"k":"p","html":"<b>원시홍니:</b> 1980년대 등의 시기에 주로 다뤄졌다.","ind":22,"bul":true},{"k":"p","html":"<b>주니 계열의 분류:</b> 순주니, 원시주니, 표준적 주니 및 현대 주니 등으로 구분된다.","ind":22,"bul":true},{"k":"p","html":"<b>옛 흙과 현대 흙의 물성 차이:</b>","ind":22,"bul":true},{"k":"p","html":"옛날에 쓰이던 흙들은 기본적으로 니질(점토의 질)이 우수했다.","ind":40,"bul":true},{"k":"p","html":"다만 과거에는 소성 수축률을 높여가며 가마 안에서 고온으로 밀어붙일 만한 기술적·설비적 능력이 상대적으로 부족했다.","ind":40,"bul":true},{"k":"p","html":"과거 1창 시절에 쓰인 &#x27;최대 주사니&#x27; 등이 바로 그러한 시대적 특성을 보여주는 대표적인 흙이다.","ind":40,"bul":true},{"k":"h2","text":"□ 자사 1창의 연혁 (1952년 ~ 1997년)"},{"k":"p","html":"<b>민영과 관영의 공존 (1950년대 이전):</b> 공사합영(공산주의 체제 하의 국유화) 이전인 민국 시기에는 관영 자장과 민영 자장이 함께 존재했다. 이후 국가 주도로 산업을 발달시키고 자사 예술을 보존하기 위해 노력했다.","ind":22,"bul":true},{"k":"h3","text":"1. 연대별 자사1창의 전개 과정"},{"k":"p","html":"<b>1950년대:</b>","ind":22,"bul":true},{"k":"p","html":"1950년대 이전의 준비 기간을 거쳐, 1958년 &#x27;자사공예창&#x27;이 정식 명칭인 자사1창으로 개칭되며 설립되었다.","ind":40,"bul":true},{"k":"p","html":"중국의흥 도장을 새겨 판매를 시작했으며, 초기에는 대품과 항아리 등을 주로 개발했다.","ind":40,"bul":true},{"k":"p","html":"고경주, 주가심, 왕인춘 등 민국 시기의 명인들을 기술원으로 초빙하여 후대를 양성하고 기술을 전수했다. 이 시기에는 흙의 품질과 제작 실력이 매우 뛰어났다.","ind":40,"bul":true},{"k":"p","html":"<b>1960년대:</b>","ind":22,"bul":true},{"k":"p","html":"설립 초기인 데다 1966년부터 시작된 문화대혁명의 영향으로 5~60년대는 큰 변동 없이 다소 침체기를 겪었다.","ind":40,"bul":true},{"k":"p","html":"초반에는 경제 실험과 함께 소품을 만들었는데 당시의 소량 생산품들은 품질이 매우 우수했다. 60년대 중반부터는 실험실과 연구소를 개발하며 수출을 위한 노력을 기울였다.","ind":40,"bul":true},{"k":"p","html":"<b>1970년대:</b>","ind":22,"bul":true},{"k":"p","html":"홍콩, 일본 등지로의 수출이 본격적으로 열리면서 국가의 주요 외화벌이 수단이 되었다.","ind":40,"bul":true},{"k":"p","html":"대량생산을 위해 터널식 가마(수도요)를 건설하고 생산 효율을 높이기 위한 병배니 개발이 활발해졌으며, 품질 좋은 창호(廠壺)가 많이 생산되었다.","ind":40,"bul":true},{"k":"p","html":"<b>1980년대:</b>","ind":22,"bul":true},{"k":"p","html":"개혁개방 노선과 함께 사회주의 시장경제 체제로 접어들며 자사호의 인기가 높아져 2창, 3창 등 추가 공장들이 설립되었다.","ind":40,"bul":true},{"k":"p","html":"노 공예가들이 후대 양성에 힘쓰며 대량생산 위주로 가던 중, 고경주의 주도로 우수 인재를 모은 특예반(우수반)이 개설되어 고급 주문 제작을 시작했다.","ind":40,"bul":true},{"k":"p","html":"다만 80년대 후반으로 갈수록 과도한 생산량으로 인해 원광이 부족해지고 재료의 질이 점차 떨어지기 시작했다.","ind":40,"bul":true},{"k":"p","html":"<b>1990년대 (국영 시대의 마침표):</b>","ind":22,"bul":true},{"k":"p","html":"1990년대 초반 이후 사회주의 시장경제 체제로 완전히 전환되면서 채산성이 악화되었다.","ind":40,"bul":true},{"k":"p","html":"결국 원료 수급의 어려움과 채산성 문제로 인해 1997년에 자사1창이 공식 해산하였고, 자사 산업은 다시 민영화 시대로 접어들었다.","ind":40,"bul":true},{"k":"h3","text":"2. 자사1창 관련 주요 인명 목록 (민·관 시기 및 역대 명인·기술원)"},{"k":"p","html":"<b>고경주(顧景舟):</b> 현대 자사계의 최고 거장(호예태두)이자 전통 기법을 예술로 승화시킨 일대종사.","ind":22,"bul":true},{"k":"p","html":"<b>왕인춘(王寅春):</b> 근현대 자사계에서 정교한 각과 주름이 돋보이는 근문기(筋紋器) 제작의 최고 권위자.","ind":22,"bul":true},{"k":"p","html":"<b>주가심(朱可心):</b> 자연물의 형태를 생동감 있고 우아하게 표현하는 화기(花器) 제작의 전설적인 대가.","ind":22,"bul":true},{"k":"p","html":"<b>류품화(劉品華):</b> 국영 자사1창 시기 실무 생산과 공예 기술 전수에 기여한 중견 공예사.","ind":22,"bul":true},{"k":"p","html":"<b>당현상(唐玄湘):</b> 자사1창 체제에서 차호 제작 및 성형 기술을 이끌며 활동했던 공예가.","ind":22,"bul":true},{"k":"p","html":"<b>저립지(儲立之):</b> 민국 시기부터 자사 업계에 몸담으며 도각과 차호 제작 등 다방면으로 활동한 장인.","ind":22,"bul":true},{"k":"p","html":"<b>월토(月兔):</b> 자사창 시기 공방의 생산 라인이나 특정 기법·공방 호칭과 연관된 인물 또는 명칭.","ind":22,"bul":true},{"k":"p","html":"<b>중화(仲和):</b> 전통 자사 공예 기술을 이어받아 실무 제작에 참여했던 역사 속 장인.","ind":22,"bul":true},{"k":"p","html":"<b>설여우(薛如友):</b> 자사창 시기 현장에서 차호 성형과 공예 기술을 담당했던 공예사.","ind":22,"bul":true},{"k":"p","html":"<b>만감근(滿淦勤):</b> 자사 생산 현장에서 숙련된 기술로 차호를 빚어내던 실무 장인.","ind":22,"bul":true},{"k":"p","html":"<b>주사걸(朱士傑):</b> 자사 예술의 이론적 토대와 교육, 디자인 부문에서 큰 역할을 한 도예가이자 교육자.","ind":22,"bul":true},{"k":"p","html":"<b>오진(吳震):</b> 현대 자사계에서 연구와 행정, 제작 실무를 두루 거치며 업계를 이끈 중견 대가.","ind":22,"bul":true},{"k":"p","html":"<b>길덕보(吉德寶):</b> 자사창 체제 하에서 차호 제작 기술을 연마하고 생산에 참여한 공예사.","ind":22,"bul":true},{"k":"p","html":"<b>정귀상(程貴祥):</b> 현장에서 묵묵히 전통 자사 제호 기법을 이어온 공예가.","ind":22,"bul":true},{"k":"p","html":"<b>범반충(范盤沖):</b> 자사 공예 가문 출신이거나 1창 시기 현장에서 활약한 숙련된 제호 장인.","ind":22,"bul":true},{"k":"p","html":"<b>류여례(劉汝禮):</b> 자사1창 시기 실무 공예가로 활동하며 후대 양성과 제작에 기여한 인물.","ind":22,"bul":true},{"k":"p","html":"<b>진소경(陳小庚):</b> 1창 시기 등에서 차호 성형 및 공예 실무를 담당했던 장인.","ind":22,"bul":true}]}]);
</script>
<script>window.__TEA_LESSONS=(window.__TEA_LESSONS||[]).concat([{"id":"p6","label":"보이차 Part.6","blocks":[{"k":"h1","text":"1강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 전통 악퇴 방식과 비교한 균종(효모) 발효의 장점을 폴리페놀 성분의 조성 변화와 향미의 관점에서 설명해 보세요."},{"k":"p","html":"<b><b>전통 악퇴 방식의 한계:</b></b> 전통적인 악퇴(渥堆) 방식은 자연 습도와 잡균에 의존하여 발효시키기 때문에 미생물 제어가 어렵고, 발효 과정에서 폴리페놀 성분이 불균일하게 산화되며 떫고 텁텁한 맛이나 잡미가 발생하기 쉽다.","ind":22,"bul":true},{"k":"p","html":"<b>균종(순수 효모·미생물) 발효의 장점:</b>","ind":22,"bul":true},{"k":"p","html":"<b>폴리페놀 조성 변화:</b> 카테킨 등 폴리페놀 성분이 유익한 미생물(흑국균, 효모 등)에 의해 체계적으로 분해·전환되어 테아플라빈(TF), 테아루비긴(TR), 테아브라우닌(TB) 등의 가용성 색소 및 긍정적 성분으로 조화롭게 바뀐다.","ind":40,"bul":true},{"k":"p","html":"<b>향미의 관점:</b> 풋내와 떫은맛이 빠르게 감쇠하고, 맑고 부드러운 단맛(회감)과 깊은 진향(陳香)을 안정적으로 이끌어내어 차의 풍미가 훨씬 깨끗하고 고급스러워진다.","ind":40,"bul":true},{"k":"h3","text":"2. 칠자원차(七子圓茶)의 연혁과 과세 기준이 되는 도량형 및 시용제(市用制)에 대해서 설명해 보세요."},{"k":"p","html":"<b>시용제(市用制)의 도입:</b> 민국 시대에 서구의 미터법 등 근대적 단위에 맞추기 위해 새로운 도량형 제도인 시용제가 도입되었다.","ind":22,"bul":true},{"k":"p","html":"<b>근(斤)의 기준 확립:</b> 1929년 시행된 시용제 규정에 따라 1근 = 500g으로 공식 제정되었다.","ind":22,"bul":true},{"k":"note","html":"※ 이 도량형 기준이 향후 차의 중량 산정과 세금 징수의 근간이 되었다.","ind":22,"bul":false},{"k":"h3","text":"3. 마방이 말 한 필에 60kg의 차를 싣는 경우, 오늘날과 청나라 시기에 각각 실리는 병차(원차)의 총 편수를 계산해 보세요."},{"k":"p","html":"<b>보이부 설치와 과세의 시작:</b> 청나라 옹정제 시기(1729년) 개토귀류 정책의 일환으로 보이부가 설치되면서 차에 대한 국가 차원의 과세가 본격화되었다.","ind":22,"bul":true},{"k":"p","html":"<b>문헌상 세금 징수 기록:</b> 『대청회전사례(大淸會典事例)』 등에 따르면, 전남(滇南) 지역 등에서 차 100근당 자인(茶引, 유통 허가증) 한 장을 발급하고 3전 2분의 세금을 징수했다. (당시 차인 3천 매가 발급되기도 했다.)","ind":22,"bul":true},{"k":"h3","text":"4. 교소원차(僑銷圓茶)와 변소차(邊銷茶)의 유래에 대해 설명해 보세요."},{"k":"p","html":"<b>교소원차(僑銷圓茶):</b>","ind":22,"bul":true},{"k":"p","html":"청나라 말기 무렵부터 태국, 말레이시아, 싱가포르, 홍콩, 마카오, 미얀마, 라오스, 베트남 등지로 수출되던 차다.","ind":40,"bul":true},{"k":"p","html":"주된 소비 대상이 해외의 화교(華僑)들이었기에 &#x27;교소&#x27;라는 이름이 붙었으며, 나름 품질이 좋은 차로 분류되었다. (후대인 2001년 무렵 대만 수출용이나 말레이시아·중국 수교 기념병 등으로 그 명맥이 이어지기도 했다.)","ind":40,"bul":true},{"k":"p","html":"<b>변소전차(邊銷磚茶):</b>","ind":22,"bul":true},{"k":"p","html":"사천성 등 중국의 변방(邊) 지역으로 보내기 위해 생산된 벽돌 모양의 전차(磚茶)다.","ind":40,"bul":true},{"k":"p","html":"상대적으로 등급이 낮은 저급차 위주로 만들어졌으며, 주로 내수용으로 공급되었다.","ind":40,"bul":true},{"k":"h2","text":"※ 도록 진위 판별의 착안점"},{"k":"h3","text":"1. 맹해차창(대익)의 생산 이력 확인"},{"k":"p","html":"<b>시기와 방식:</b> 2004년 민영화 이후 &#x27;대익(大益)&#x27;으로 이름이 바뀐 맹해차창의 제품인지 확인한다. 2004년 이전이라면, 국영 차창 시절의 생산 방식과 찻잎 수매 방법을 따르고 있는지 점검한다.","ind":22,"bul":true},{"k":"p","html":"<b>출품 표기와 내비(內飛):</b> 포장지에 &#x27;맹해차창 출품&#x27;이라고 정확히 적혀 있는지, 차 병면에 압인된 종이(내비)가 맹해차창의 오리지널이 맞는지 타 공장의 것인지 대조한다.","ind":22,"bul":true},{"k":"h3","text":"2. 포장지와 인쇄 디테일 분석"},{"k":"p","html":"<b>공사 명칭의 변천:</b> 운남성차엽공사의 이름이 시대별로 총공사, 성공사 등으로 계속 바뀌었으므로, 해당 연도의 정확한 명칭이 인쇄되었는지 대조한다.","ind":22,"bul":true},{"k":"p","html":"<b>중차패(中茶牌) 상표 디테일:</b> 칠자병차의 &#x27;칠(七)&#x27; 자가 작게 인쇄된 &#x27;소칠(小七)&#x27;인지, &#x27;중(中)&#x27; 자 도안이 찌그러진 형태(편중)인지 등 특정 시기의 인쇄 특징을 살핀다.","ind":22,"bul":true},{"k":"p","html":"<b>지질(종이)의 상태:</b> 세월의 흐름에 맞게 포장 종이가 자연스럽게 낡고 나달나달해졌는지 확인한다. (2000년대 이후 복원된 제품들은 개별 포장 등 포장 방식에서 차이를 보인다.)","ind":22,"bul":true},{"k":"h2","text":"※ 홍콩 유통과 습창, 숙차 관련 메모"},{"k":"h3","text":"1. 홍콩의 보이차 유통과 대타 '육보차'"},{"k":"p","html":"<b>역사적 배경:</b> 청나라 두문수의 난 이후 보이차가 홍콩으로 적극 수출되기 시작했다. 그러나 1970년대에 보이차 공급이 일시적으로 끊기면서, 홍콩에서는 광서성(廣西省)에서 생산되는 흑차인 &#x27;육보차(六堡茶)&#x27;를 보이차의 대타로 널리 마셨다. 이후 1970년대 중후반에 이르러 보이차가 다시 수입되기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>진국의(陳國義)와 차예낙원:</b> 이 시기 홍콩에서 보이차 유통으로 유명해진 인물이 진국의다. 그가 설립한 &lt;차예낙원(茶藝樂園)&gt;이라는 찻집 브랜드는 홍콩에 여러 지점을 두었으며, 캐나다 토론토에서도 그의 여동생이 지점을 운영하고 있다.","ind":22,"bul":true},{"k":"h3","text":"2. 숙차의 발효와 미생물 대사"},{"k":"p","html":"<b>카페인과 미생물:</b> 찻잎이 햇빛을 많이 받을수록 카페인 함량이 높아진다. 숙차를 만드는 악퇴(渥堆) 발효 과정에서 유익한 미생물들은 카페인을 제외한 찻잎의 다른 성분들을 집중적으로 대사시켜 차의 풍미를 바꾼다.","ind":22,"bul":true},{"k":"note","html":"※ 자사호 길라잡이 교재의 &#x27;숙차 악퇴와 카페인&#x27; 내용과 이어지는 원리다.","ind":22,"bul":false},{"k":"p","html":"<b>향미의 발현:</b> 발효가 제대로 이루어지면 기분 좋은 숙향(熟香)과 부드러운 숙미(熟味)가 난다. 반대로 발효가 잘못되면 불쾌한 잡미가 섞이게 된다.","ind":22,"bul":true},{"k":"p","html":"<b>지역별 발효의 차이:</b> 차를 생산하는 지역마다 서식하는 미생물의 종류와 환경이 모두 다르기 때문에, 미생물 발효 과정과 숙차를 만드는 방식 역시 지역마다 고유한 차이를 보인다.","ind":22,"bul":true},{"k":"h3","text":"3. 기타 미생물 발효 흑차"},{"k":"p","html":"<b>복전(茯磚)과 천량차(千兩茶):</b> 복전차는 숙모차를 이용하여 벽돌 모양으로 찍어낸 뒤 미생물(금화)을 띄워 만들며, 1,000냥의 무게를 지닌 기둥 모양의 천량차 역시 이러한 혐기성/호기성 미생물 발효 과정을 거치는 대표적인 흑차류다.","ind":22,"bul":true},{"k":"h2","text":"□ 차에 대한 접근 관점"},{"k":"h2","text":"□ 보이차 이해의 기본 index"},{"k":"p","html":"X [찻잎] · Y [제다] · Z [보관]","ind":0,"bul":false},{"k":"h3","text":"1. 3대 핵심 지표 (X, Y, Z)"},{"k":"p","html":"<b>X [찻잎]:</b> 찻잎 원료를 의미하며, 현재 차의 완성도와 바탕을 결정짓는다. (과거 공산 중국 시절에는 국영 체제하에 공급되는 원료가 대체로 비슷하여 X에 따른 품질 차이가 크게 부각되지 않았다.)","ind":22,"bul":true},{"k":"p","html":"<b>Y [제다]:</b> 찻잎을 가공하는 기술이다. (과거 남방 사람들은 제다 방식인 Y에 상대적으로 크게 신경을 쓰지 않는 경향이 있었다.)","ind":22,"bul":true},{"k":"p","html":"<b>Z [보관]:</b> 창고의 보관 환경(온도·습도·통풍)을 가리킨다.","ind":22,"bul":true},{"k":"h3","text":"2. 홍콩과 남방의 창고 중심 패러다임 (Z의 강조)"},{"k":"p","html":"<b>무창불성차(無倉不成茶):</b> &#x27;창고 보관을 거치지 않으면 차가 완성되지 않는다&#x27;는 남방과 홍콩 지역의 핵심 사고방식이다. 햇차는 반드시 익혀서 마셔야 하며, &#x27;오래 묵었을 때 맛있는 차가 좋은 차&#x27;라는 인식이 강했다.","ind":22,"bul":true},{"k":"p","html":"<b>창고가 곧 기술:</b> 똑같은 원료(X)로 만든 차라도 창고의 보관 기술(Z)에 따라 맛이 완전히 달라지므로 보관이 가장 중요한 핵심으로 여겨졌다.","ind":22,"bul":true},{"k":"p","html":"<b>유통의 영향:</b> 대만은 주로 홍콩에서 차를 수입했으며, 우리나라와 동남아시아의 보이차 시장 역시 이러한 홍콩의 보관 방식과 차 문화에 지대한 영향을 받았다.","ind":22,"bul":true},{"k":"h3","text":"3. 패러다임의 진화와 원료중심주의 (X, Y, Z의 융합)"},{"k":"p","html":"<b>변화의 흐름 [(Y) → (X, Z) → (X, Y, Z)]:</b> 2000년대 이후 시장이 발전하면서 차를 평가하는 기준이 세 가지 축을 모두 고려하는 방향으로 진화했다.","ind":22,"bul":true},{"k":"p","html":"<b>건창(乾倉)과 원료중심주의:</b> 곰팡이와 위생에 대한 우려가 커지면서 고온다습한 습창 대신 깨끗한 &#x27;건창&#x27; 보관을 선호하게 되었다. 이와 함께 맑은 탕색(밝음)과 향기가 차의 품질을 결정하는 핵심 척도로 떠오르며, 좋은 찻잎 자체를 중시하는 &#x27;원료중심주의&#x27;로 패러다임이 크게 바뀌었다.","ind":22,"bul":true},{"k":"p","html":"<b>시장 주도권의 이동:</b> 1997년 무렵 국영 차창들의 민영화와 중국의 시장 개방(개혁개방 노선) 흐름이 맞물리면서, 현재는 홍콩이 아닌 중국 본토 대륙의 상인들이 보이차 시장의 주도권을 쥐고 있다.","ind":22,"bul":true},{"k":"h2","text":"※ 자사·차 혼합 메모"},{"k":"h3","text":"1. 자사(紫砂) 및 니료 관련 메모"},{"k":"p","html":"<b>부수광료(광택제)의 첨가:</b> 흙(니)에 광택 효과를 내는 부수광료가 들어가면 입자 간의 결합도가 떨어져 기물을 성형하기가 매우 힘들어진다. 완성된 차호는 검붉은 색을 띠며 표면의 광택이 높게 나타난다.","ind":22,"bul":true},{"k":"p","html":"<b>가마 기술과 제작의 한계:</b> 위처럼 결합도가 낮은 니료는 다루기가 워낙 까다로워 과거의 전통 장작가마 방식으로는 온전히 구워내기가 불가능했다. 온도 제어가 수월해진 현대 가마 기술에 이르러서야 비로소 제작이 가능해졌다.","ind":22,"bul":true},{"k":"p","html":"<b>고령토의 물성:</b> 도자기의 주원료인 고령토는 자사 니료에 비해 점성이 부족하여, 물레를 쓰지 않고 두드려 빚어내는 자사호 성형 기법으로는 다루기 어렵다.","ind":22,"bul":true},{"k":"h3","text":"2. 보이차(普洱茶) 차원(茶園) 관련 메모"},{"k":"p","html":"<b>원생태(原生態) 차원:</b> 인위적인 간섭이나 농약 사용 없이 자연 본연의 원시적인 생태 환경을 그대로 유지하고 있는 다원(차밭)을 뜻한다. 이무(易武) 지역의 차원들이 대표적이며, 만송(曼松) 지역의 차원 역시 원생태에 가까운 훌륭한 환경을 지니고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>야다(野茶):</b> 인공적으로 재배하지 않고 야생에서 자연스럽게 자라난 차나무의 잎을 말하며, 마치 사람의 발길이 닿지 않은 깊은 국유림(자연림) 같은 느낌을 준다.","ind":22,"bul":true},{"k":"h2","text":"□ 보이차의 시대 구분"},{"k":"h3","text":"1. 보이차의 생산 시대 구분"},{"k":"p","html":"<b>1세대:</b> 호급차(號級茶, 1950년대 이전)","ind":22,"bul":true},{"k":"p","html":"청나라 말기부터 국가 통폐합 이전까지, 개인 찻집(차장)들이 가내수공업 형태로 차를 만들던 민영 시대다.","ind":40,"bul":true},{"k":"p","html":"상표 이름 끝에 동경호(同慶號), 송빙호(宋聘號)처럼 &#x27;~호(號)&#x27;자가 붙어 호급차라 부른다.","ind":40,"bul":true},{"k":"p","html":"<b>2세대:</b> 인급차(印級茶, 1950년대 ~ 1960년대)","ind":22,"bul":true},{"k":"p","html":"공산화 이후 개인 차장들이 &#x27;국영 차창&#x27;으로 통폐합된 시기다.","ind":40,"bul":true},{"k":"p","html":"포장지 한가운데 &#x27;차(茶)&#x27; 자를 찍고 주변을 &#x27;중(中)&#x27; 자 8개가 감싸는 중차패(中茶牌) 도안을 썼으며, 홍인(紅印), 녹인(綠印) 등 도장 인주 색깔에 따라 차를 분류했다.","ind":40,"bul":true},{"k":"p","html":"<b>3세대:</b> 병급차(餠級茶) / 숫자차 (1970년대 ~ 1990년대)","ind":22,"bul":true},{"k":"p","html":"수출과 대량생산을 위해 찻잎 배합표(배방)를 시스템화·규격화한 시기다.","ind":40,"bul":true},{"k":"p","html":"7542, 7572 등 4자리의 &#x27;숫자(배방 번호)&#x27;로 정체성을 표기하여 &#x27;마크차&#x27; 또는 &#x27;숫자차&#x27;라 부른다.","ind":40,"bul":true},{"k":"p","html":"<b>수출 경로와 대량생산:</b> 과거에는 베트남이나 광동성 등을 거쳐 우회 수출되었으나, 이후 운남성이 직접 수출 권한을 부여받았다. 1980년대에 이르러 기계 대량생산과 다원의 밀식 재배가 본격화되며 수출이 크게 늘었다.","ind":22,"bul":true},{"k":"p","html":"<b>민영화와 개인 차창의 재등장:</b> 1990년대 후반부터 민영화 물결이 일며 개인 생산이 다시 활발해졌고, 과거 명차를 모방한 제품들도 등장했다. 2004년 맹해차창(대익) 등의 전면 민영화 이후에는 특정 산지(지역 개념)와 단일 다원 원료(싱글)를 중시하는 트렌드가 생겼다.","ind":22,"bul":true},{"k":"p","html":"<b>유통망의 변화:</b> 2010년대 이후 및 코로나 시국을 거치며 오프라인 판매망이 위축되고 온라인 직접 판매 비중이 크게 늘어났다.","ind":22,"bul":true},{"k":"h3","text":"2. 보이차의 유통 시대 구분"},{"k":"p","html":"<b>보관 기준의 변화:</b> 1990년대 이후를 기점으로, 과거 홍콩 중심의 습창 보관 방식에서 벗어나 건창(乾倉) 보관을 기준으로 삼는 유통 패러다임이 자리 잡았다.","ind":22,"bul":true},{"k":"p","html":"<b>진기(陳期, 묵은 정도)에 따른 분류:</b>","ind":22,"bul":true},{"k":"p","html":"<b>일반 노차(老茶):</b> 보통 40년 이상 묵은 차를 이른다.","ind":40,"bul":true},{"k":"p","html":"<b>노차 및 숙차 노차:</b> 30년 이상 묵은 차도 노차로 분류하며, 숙차 역시 30년 이상 된 것을 귀하게 친다.","ind":40,"bul":true},{"k":"p","html":"<b>중보차(중기차):</b> 20년 이상 묵은 차로, 1990년대 초반에 생산된 숫자차들이 주로 여기에 해당한다.","ind":40,"bul":true},{"k":"p","html":"<b>보관 환경과 향미(香)의 발현:</b>","ind":22,"bul":true},{"k":"p","html":"<b>장향(樟香)과 삼향(蔘香):</b> 1970년대 노차 등에서 미생물이 제대로 생성·작용하면 장향(녹나무 향)이나 삼향이 발현된다. (미생물만 잘 주입·형성되면 삼향이나 장향은 비교적 쉽게 난다.)","ind":40,"bul":true},{"k":"p","html":"<b>조향(棗香):</b> 대추 향을 뜻하는 조향은 완전한 건창 보관이 아닌, 다소 습도가 있는 환경에서 보관되었을 때 주로 발생한다.","ind":40,"bul":true},{"k":"p","html":"<b>최고의 향에 대한 오해:</b> 시장에서는 종종 특정 향(상향 등)이 나는 것을 최고로 치지만, 순수한 생차에서는 인위적인 개입 없이 그런 특이한 향이 자연적으로 날 수 없으며, 보통 목향(木香, 나무 향)이나 백향(柏香) 선에서 마무리된다.","ind":40,"bul":true},{"k":"h2","text":"※ 중국 왕조 연표와 보이차 유통사"},{"k":"h3","text":"1. 체제 전환과 홍콩 유통의 전개"},{"k":"p","html":"<b>홍콩 수출의 본격화:</b> 1949년 중화인민공화국 수립을 거쳐 1950년대 공산 중국 체제로 완전히 전환되면서, 보이차는 주로 홍콩을 통해 수출되었다.","ind":22,"bul":true},{"k":"p","html":"<b>거상 중심의 독점 유통:</b> 아무나 차를 사고팔 수 없었으며, 당시에 국가로부터 수출입 면허를 허가받은 일부 거상들만이 보이차를 독점적으로 유통할 수 있었다.","ind":22,"bul":true},{"k":"p","html":"<b>홍콩의 지리적 환경:</b> 홍콩은 산이 많고 평지가 적은 지리적 한계를 지니고 있어, 한정된 공간에 찻잎을 빽빽하게 쌓아두고 익히는 특유의 창고 보관 문화가 발달하는 배경이 되었다.","ind":22,"bul":true},{"k":"h3","text":"2. 창고 개방과 노차(老茶) 시장의 형성"},{"k":"p","html":"<b>&#x27;창고털이&#x27;와 노차의 등장:</b> 소비자들이 원래부터 묵은 차(노차)를 귀하게 여기며 즐겨 마셨다기보다는, 1980년대 중후반 무렵부터 상인들이 창고에 오랫동안 방치되듯 쌓여 있던 묵은 물량을 털어내어 시장에 유통하면서부터 노차 소비가 본격화된 측면이 크다.","ind":22,"bul":true},{"k":"p","html":"<b>노차 가격의 급등:</b> 1990년대 중후반에 이르러 찐 노차의 실제 유통량은 점차 고갈되어 가는 반면, 노차의 가치에 대한 정보와 수요는 폭발적으로 늘어나면서 가격이 급격하게 치솟기 시작했다.","ind":22,"bul":true},{"k":"h3","text":"3. 이무(易武)의 부상과 지역별 선호도 차이"},{"k":"p","html":"<b>대만 상인들의 마케팅과 호급차 재현:</b> 과거부터 구(舊) 6대 차산의 집산지이자 유통의 중심지였던 이무(易武) 지역에는 오래된 차들이 상대적으로 많이 남아 있었다. 이를 눈여겨본 대만 상인들이 &#x27;이무에서 생산된 오래된 찻잎이 좋다&#x27;는 마케팅을 주도했고, 과거 이무 중심의 최고급 명차였던 &#x27;호급차&#x27;를 재현해 내는 유행을 이끌었다.","ind":22,"bul":true},{"k":"p","html":"<b>한국과 대만의 기호 차이:</b> 대만 시장이 부드럽고 유서 깊은 이무 지역의 차를 선호하며 시장을 주도한 것과 달리, 한국 시장에서는 특유의 묵직하고 강렬한 기운을 지닌 &#x27;노반장(老班章)&#x27; 지역의 차를 더 높게 평가하고 선호하는 경향이 뚜렷하게 나뉜다.","ind":22,"bul":true},{"k":"h2","text":"□ 각 시기별 칠자원차의 제작 형태"},{"k":"h3","text":"1. 청대 칠자원차의 제작 방법"},{"k":"p","html":"완복(阮福)의 『보이차기(普洱茶記)』 기록은 다음과 같다.","ind":0,"bul":false},{"k":"p","html":"<i>①于二月間采蕊極細而白，謂之毛尖，以作貢，貢后方許民間販賣。采而蒸之，揉為團餅；其葉之少放而猶嫩者，名芽茶；采于三四月者，名小滿茶；采于六七月者，名谷花茶。②大而圓者，名緊團茶；小而圓者，名女兒茶，女兒茶為婦女所采，于雨前得之，即四兩重團茶也。③其入商販之手，而外細內粗者，名改造茶；將揉時預擇其內之勁黃而不捲者，名金玉天；其固結而不改者，名疙瘩茶。④味極厚難得，種茶之家，芟鋤備至，旁生草木，則味劣難售，或與他物同器，則染其氣而不堪飲矣。</i>","ind":22,"bul":false},{"k":"note","html":"※ 결락과 오자는 완복(阮福) 『보이차기(普洱茶記)』 원문과 대조해 바로잡았다.","ind":14,"bul":false},{"k":"h4","text":"가. 보이공차(貢茶)의 엄격한 유통 통제"},{"k":"p","html":"<b>선(先)납공 후(後)유통:</b> 황실에 최고급 찻잎(모첨 등)을 바치는 납공(納貢) 절차가 모두 끝난 뒤에야 비로소 민간에서 차를 유통하고 판매할 수 있었다. 당대 시중에 도는 차 중에서도 공납용으로 만들어진 차가 가장 고급차로 취급받았다.","ind":22,"bul":true},{"k":"p","html":"<b>형태에 따른 주력 차종:</b> 둥글게 뭉쳐낸 단차(團茶, 긴압차), 부녀자들이 이른 봄에 딴 여아차(女兒茶), 찻물을 끓여 액상을 굳혀 만든 차고(茶膏) 등으로 나뉜다.","ind":22,"bul":true},{"k":"h4","text":"나. 채엽 시기에 따른 분류"},{"k":"p","html":"<b>소만차(小滿茶):</b> 3~4월(봄)에 채엽하여 만든 차.","ind":22,"bul":true},{"k":"p","html":"<b>곡화차(穀花茶):</b> 6~7월(여름~가을)에 채엽하여 만든 차.","ind":22,"bul":true},{"k":"h4","text":"다. 품질과 성형 방식에 따른 분류"},{"k":"p","html":"<b>개조차(改造茶):</b> 겉부분(포면)은 가늘고 좋은 잎으로 싸고, 속은 거친 잎을 넣어 섞어 만든 차다.","ind":22,"bul":true},{"k":"p","html":"<b>금옥천(金玉天):</b> 유념(비비기)을 할 때 미리 선별하여 찻잎이 말리거나 꼬이지 않고 펴져 있는 상태의 차를 말한다.","ind":22,"bul":true},{"k":"p","html":"<b>흘탑차(疙瘩茶):</b> 찻잎을 꼼꼼히 골라내거나 풀어주지 않아 단단하게 뭉치고 덩어리진 차다.","ind":22,"bul":true},{"k":"h4","text":"라. 왕사신(汪士愼)의 기록과 산차(散茶) 추정"},{"k":"p","html":"<b>왕사신의 「보이예차(普洱蕊茶)」:</b> 청나라 서법가이자 양주팔괴(揚州八怪) 중 한 명인 왕사신(1686~1759)의 시문을 통해 당시 고급 보이차의 형태를 짐작할 수 있다.","ind":22,"bul":true},{"k":"p","html":"<b>산차 형태의 공차:</b> 1700년대 옹정제의 개토귀류 정책과 함께 공차 제도가 시행되며 차의 위상이 크게 높아졌다. 일반적으로 꽉 눌러 만든 긴압차는 특유의 짙은 탕색(수색)이 우러나오는데 반해, 당시 황실에 진상되던 최상급 공차는 긴압을 거치지 않은 현대의 산차(散茶)와 같은 고급 잎차 형태였을 것으로 추정된다.","ind":22,"bul":true},{"k":"note","html":"※ 현존하는 가장 오래된 보이차 실물은 1911년 무렵 생산되어 홍콩 등지에서 유통된 것으로 알려져 있다.","ind":22,"bul":false},{"k":"note","html":"※ 보이차 길라잡이 Part.3 2강 「4. 청대」의 완복 『보이차기』 인용과 연관. 보이차 길라잡이 Part.3 4 &amp; 5강 「공명산」과도 연결된다.","ind":14,"bul":false},{"k":"h3","text":"2. 민국 시기 칠자원차의 제작 방법"},{"k":"p","html":"이불일(李拂一, 1901~2010) 선생이 1937년 『교육과 과학(敎育與科學)』이라는 잡지에 당시의 보이차 제다 과정을 기고하였는데, 그 내용은 다음과 같다.","ind":0,"bul":false},{"k":"p","html":"普洱茶經曬干初制后，或零星担入市場售賣，或分別品質裝入竹籃。 보이차는 햇볕에 말려 초제(初制, 초벌 가공)를 거친 후, 조금씩 지게에 지고 시장에 나가 팔거나, 품질별로 나누어 대나무 바구니(죽람)에 담는다.","ind":22,"bul":true},{"k":"p","html":"入籃須得濕以少許水分，以防變脆。 바구니에 담을 때는 찻잎이 말라 바스러지는(變脆) 것을 방지하기 위해 반드시 약간의 수분을 적셔 주어야 한다.","ind":22,"bul":true},{"k":"p","html":"竹籃四周，範以大竹籜，一人立筐外，逐次加茶，以拳或棒擣壓使其盡之緊密，是為築茶。 바구니 사방에는 큰 대나무 껍질(죽탁(竹籜), 흔히 죽순 껍질)을 두르고, 한 사람이 광주리 밖에 서서 찻잎을 차례대로 더하며, 주먹이나 막대기로 찧어 눌러(도압(擣壓)) 최대한 틈 없이 단단하게 밀착시킨다. 이것을 축차(築茶)라 한다.","ind":22,"bul":true},{"k":"p","html":"然后分口堆放，任其發酵，任其蒸發自行干燥。 그런 다음 무더기로 쌓아두고(堆放), 찻잎이 스스로 발효되도록 내버려 두며, 수분이 증발하여 자연적으로 건조되도록 둔다.","ind":22,"bul":true},{"k":"p","html":"所以遵循綠茶方法制造之普洱茶葉，其結果反變為不規則發酵之暗褐色紅茶葉。 따라서 본래 녹차 제조 방법(살청·유념·쇄청)을 따라 만들었던 보이차 찻잎이, 결과적으로는 오히려 불규칙하게 발효된 암갈색의 홍차엽(발효차)으로 변하게 되는 것이다.","ind":22,"bul":true},{"k":"h4","text":"이불일(李拂一, 1901~2010)의 생애와 업적"},{"k":"p","html":"<b>인물 정보:</b> 본명은 이승양(李承陽)이며, 보이시에서 태어나 110세까지 장수했다.","ind":22,"bul":true},{"k":"p","html":"<b>학자이자 차인:</b> 서쌍판납으로 이주하여 태족(傣族)의 문화와 역사를 깊이 연구했으며, 직접 차창(복흥차창 등)을 운영하기도 했던 지식인(공산주의 반대 성향)이었다.","ind":22,"bul":true},{"k":"p","html":"<b>맹해차창 설립의 기틀 마련:</b> 불해(佛海)는 오늘날의 &#x27;맹해(勐海)&#x27;를 가리키는 옛 지명이다. 1930년대 후반에 그가 조사하여 제출한 보고서(『불해차업개황』 등)는 이후 &#x27;불해실험차창&#x27;이 건립되고, 1950년대에 이르러 맹해차창 등 국영 차창이 본격적으로 성행하게 되는 중요한 학술적·산업적 계기가 되었다.","ind":22,"bul":true},{"k":"note","html":"※ 교재 Part.3 1강의 맹해차창 관련 내용과 이어진다.","ind":22,"bul":false},{"k":"h4","text":"1930년대 보이차 제다 과정 (1937년 『교육과 과학』 기고문 풀이)"},{"k":"p","html":"이불일이 묘사한 당시 칠자원차(보이차)의 제작 및 발효 원리는 다음과 같다.","ind":0,"bul":false},{"k":"p","html":"<b>포장과 수분 조절 (초제):</b> 찻잎을 햇볕에 말려(쇄청) 초벌 가공을 마친 후, 품질별로 대나무 바구니(죽람)에 담는다. 이때 찻잎이 말라 바스러지는 것을 막기 위해 수분을 살짝 더해준다.","ind":22,"bul":true},{"k":"p","html":"<b>긴압(壓)과 보관:</b> 바구니 안쪽에 대나무 잎을 두르고 찻잎을 층층이 채워 넣으면서, 주먹이나 막대기로 단단하게 눌러 다진다(긴압). 그 후 무더기로 쌓아두고 자연스럽게 발효가 일어나며 수분이 증발해 스스로 건조되도록 내버려 둔다.","ind":22,"bul":true},{"k":"p","html":"<b>발효의 결과 (녹차에서 흑차로):</b> 이불일은 &quot;처음에는 녹차를 만드는 제다법(살청·유념·쇄청)을 따랐으나, 수분을 머금은 채 단단히 뭉쳐 쌓아두는 과정 때문에 결과적으로는 불규칙하게 발효된 암갈색의 찻잎(발효차)으로 변하게 된다&quot;고 기록하며 보이차 특유의 후발효 메커니즘을 정확히 묘사했다.","ind":22,"bul":true},{"k":"h3","text":"3. 신중국 성립 후의 제작 방법"},{"k":"h4","text":"국영 차창 체제와 채엽 기준의 변화"},{"k":"p","html":"<b>국영 차창의 등장:</b> 1949년 신중국(중화인민공화국) 성립 이후, 기존의 민간 차장들이 통폐합되며 국가가 주도하는 국영 차창 체제가 처음으로 세워졌다.","ind":22,"bul":true},{"k":"p","html":"<b>채엽의 확대:</b> 청나라 시대의 엄격했던 공차 규정에 비해 찻잎 수매 기준이 다소 느슨해졌으며, 3월부터 10월까지 폭넓게 채엽이 이루어졌다.","ind":22,"bul":true},{"k":"p","html":"<b>시기 및 찻잎에 따른 분류:</b>","ind":22,"bul":true},{"k":"p","html":"<b>춘차(春茶):</b> 3~4월에 따는 봄 차로 품질이 좋아, 뭉치지 않고 잎차 형태인 산차(散茶)로도 많이 보관한다.","ind":40,"bul":true},{"k":"p","html":"<b>이수차(二水茶):</b> 춘차 이후, 여름철 등 다소 애매한 시기에 채엽하는 두물차를 뜻한다.","ind":40,"bul":true},{"k":"p","html":"<b>곡화차(穀花茶):</b> 9월(가을) 무렵에 나오는 어린잎을 따서 만든 차다.","ind":40,"bul":true},{"k":"p","html":"<b>조차(粗茶):</b> 늙고 쇤 황색 찻잎(황편 등)으로 만들며, 주로 티백용이나 하급 차로 쓰인다.","ind":40,"bul":true},{"k":"h4","text":"제조 공정의 간소화와 유통 거점의 이동"},{"k":"p","html":"<b>공정 간소화:</b> 청나라 공납차처럼 복잡한 과정을 거치지 않았다. 초제(초벌 가공)를 거친 차를 산차 형태로 판매하거나, 이후 필요에 따라 다양한 형태로 긴압(압축)하여 만들었다.","ind":22,"bul":true},{"k":"p","html":"<b>죽람(대바구니) 포장:</b> 대바구니 안에 찻잎을 층층이 담으며 중간에 수분을 더해주는 전통적인 포장 및 후발효 유도 방식도 일부 이어졌다.","ind":22,"bul":true},{"k":"p","html":"<b>유통망 재편:</b> 국공내전에서 패한 국민당 잔당과 차 상인들이 태국(동남아) 등으로 피신하고, 이후 홍콩으로 이주하여 정착하면서 홍콩이 보이차의 새로운 최대 유통 및 소비 거점이 되었다.","ind":22,"bul":true},{"k":"h4","text":"생산·소비지의 분리와 '숙차(熟茶)' 악퇴 공법의 개발"},{"k":"p","html":"<b>생산지와 소비지의 괴리:</b> 보이차는 생산지(운남)와 중간 경유지 및 주 소비지(홍콩 등)가 다르다. 본래 갓 만든 차는 푸른빛을 띠지만, 홍콩 소비자들은 오랜 창고 보관을 거쳐 부드럽게 익은 &#x27;붉은 찻잎(노차)&#x27;을 선호했다.","ind":22,"bul":true},{"k":"p","html":"<b>악퇴(渥堆) 발효의 도입:</b> 오랜 창고 보관 없이도 처음부터 익은 차를 만들기 위해 운남의 생산지에서 연구를 거듭했다. 그 결과 1973~1975년 무렵, 물을 뿌리고 찻잎을 무더기로 쌓아 미생물 발효를 인위적으로 촉진하여 &#x27;붉은 찻잎&#x27;을 빠르게 만들어내는 숙차 악퇴 공법이 개발(복원)되었다.","ind":22,"bul":true},{"k":"p","html":"<b>대량생산의 본격화:</b> 1950년대부터 1970년대 초반까지는 찻잎의 발효를 홍콩 등의 창고 보관에 의존했으나, 1980년대부터는 산지(운남)에서 직접 만든 숙차의 대량생산과 수출이 본격화되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 이무차의 부활"},{"k":"h3","text":"1. 대만 차인들의 '호급차' 재현 운동 (1990년대)"},{"k":"p","html":"<b>배경:</b> 1980년대 이전의 전설적인 최고급 호급차(동경호, 송빙호 등)들은 본래 이무(易武) 지역을 중심으로 생산되었다.","ind":22,"bul":true},{"k":"p","html":"<b>전통의 부활:</b> 1996년을 기점으로 여례진(呂禮臻) 등 대만 차인 연합회가 주도하여 멸실되었던 이무 전통 호급차 제다법을 본격적으로 재현하기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>진순아호(眞淳雅號):</b> 1996년에 만들어진 대표적인 복원 호급차다.","ind":22,"bul":true},{"k":"p","html":"옛 방식을 살려 이무 지역의 고수차 원료로 제작되었으며, 대만과 홍콩 등지에서 큰 열광을 이끌어낸 기념비적인 의미를 지닌 차다.","ind":40,"bul":true},{"k":"p","html":"화교들이 주 수요층이었던 말레이시아 등지에서도 큰 인기를 끌며 유통되었다. ('이무정산 야생차 특급품' 역시 이 시기 이무차 부활을 상징하는 명차로 꼽힌다.)","ind":40,"bul":true},{"k":"h3","text":"2. 이무차 부흥의 핵심 인물과 대표작"},{"k":"p","html":"<b>여례진(呂禮臻):</b> 대만 차인 연합회 소속으로 진미다원(臻味茶苑)을 이끌며 진순아호를 기획하고 제작했다.","ind":22,"bul":true},{"k":"p","html":"<b>장의(張毅):</b> 당시 이무향장으로 재직하며 대만 상인들의 옛 전통 방식 복원을 적극 도왔고, 이후 본인도 이무춘첨(易武春尖) 등의 명차를 만들었다.","ind":22,"bul":true},{"k":"p","html":"<b>진회원(陳懷遠):</b> 대만 가목당(嘉木堂)을 이끌며 이무 마흑 지역의 찻잎 등을 활용해 진원호(眞元號)를 제작했다.","ind":22,"bul":true},{"k":"h3","text":"3. 최고급 보이차 시장의 트렌드 변화"},{"k":"p","html":"보이차 시장에서 선호하는 최고급 산지와 명차의 유행은 시대별로 다음과 같이 변천해 왔다.","ind":0,"bul":false},{"k":"p","html":"<b>1990년대 후반 (이무의 부활):</b> &lt;진순아호&gt; 등 부드럽고 유서 깊은 이무 지역 호급차의 부활이 시장을 주도했다.","ind":22,"bul":true},{"k":"p","html":"<b>2000년대 (반장의 득세):</b> 강렬한 기운을 지닌 노반장(老班章) 지역의 차가 급부상하며, 진승차창(陳升茶廠) 등에서 만든 &lt;진승 반장&gt; 류의 차가 최고급으로 군림했다.","ind":22,"bul":true},{"k":"p","html":"<b>2010년대 이후 (다시 이무로):</b> 최근에는 다시 이무 지역으로 회귀하여, 사람의 발길이 닿지 않은 깊은 국유림(자연림)이나 빛을 보기 위해 경쟁하며 높게 자란 고간(高杆) 차나무 등 소규모 원생태 자연 환경에서 채엽한 차들이 최고급품으로 각광받고 있다.","ind":22,"bul":true},{"k":"note","html":"※ 보이차 길라잡이 Part.3 1강 「차순호(車順號)의 서공천조(瑞貢天朝) — 3. 두문수의 난과 그 이후」의 '2010년 이후 옛 차를 만들기 위해 다시 이무로', 2강 「개토귀류의 수정과 차산의 발전」의 진순아호 대목과 연관.","ind":14,"bul":false},{"k":"h2","text":"□ 홍콩으로의 유통"},{"k":"h3","text":"1. 전통적 보관과 '습창(濕倉)'의 등장"},{"k":"p","html":"<b>홍콩의 보관 문화:</b> 홍콩에서는 갓 만든 떫은 생차를 바로 마시지 않고, 보통 5~10년 이상 창고에 보관하여 부드럽게 익혀 마시는 것이 일반적이었다.","ind":22,"bul":true},{"k":"p","html":"<b>인공 입창(습창)의 부작용:</b> 자연적으로 차가 익기를 기다리지 않고 인위적으로 노차(老茶)의 묵은 맛을 빠르게 내기 위해 고온 다습한 환경에 차를 밀어 넣는 &#x27;인공 입창(습창)&#x27; 방식이 등장했다. 그러나 이 방식은 훗날 연도를 속이거나 가짜 노차를 대량으로 만들어내는 수단으로 심각하게 변질되었다.","ind":22,"bul":true},{"k":"p","html":"<b>습창차에 대한 평가:</b> 홍콩의 기후 속에서 자연스럽게 익어간 &#x27;자연 습창차&#x27; 중에는 간혹 품질이 훌륭한 것도 있으나 매우 드물다. 반면, 인위적으로 습을 과하게 먹여 띄운 인공 습창차는 위생과 향미 면에서 피하는 것이 좋다.","ind":22,"bul":true},{"k":"h3","text":"2. 고온 다습한 환경과 발효(산화)의 가속화"},{"k":"p","html":"<b>발효 속도의 차이:</b> 차를 건조한 곳에서 30년간 자연 산화(발효)시키는 것과 달리, 홍콩처럼 평균 온도와 습도가 월등히 높은 환경에서는 산화 속도가 비약적으로 빠르다.","ind":22,"bul":true},{"k":"p","html":"<b>탕색의 변화:</b> 이러한 기후적 특성 덕분에 홍콩에서 보관된 차는 미생물과 산화 작용이 활발히 일어나 찻잎과 탕색이 붉은색(홍색)으로 빠르게 변하며 익게 된다.","ind":22,"bul":true},{"k":"h3","text":"3. 80년대와 90년대 차의 품질 및 중기차(中期茶)"},{"k":"p","html":"<b>90년대 차와 중기차:</b> 1990년대 중후반에 생산되어 온도 30도, 습도 80% 전후의 홍콩 환경 등에서 보관되며 익어온 차들이 오늘날 시장에서 유통되는 대표적인 &#x27;중기차&#x27;에 해당한다.","ind":22,"bul":true},{"k":"note","html":"※ 시장 수요가 폭발하던 90년대 차들 중에는 보관이 불량하거나 조악한 가짜 습창차가 많아 주의가 필요하다.","ind":22,"bul":false},{"k":"p","html":"<b>80년대 수출차의 우수성:</b> 1980년대에 수출용으로 만들어진 차들은 국가 차원에서 품질 관리에 신경을 많이 썼기 때문에 전반적인 품질이 90년대 차들보다 훨씬 낫다.","ind":22,"bul":true},{"k":"note","html":"※ 당시 복건성 등지에서 수출하던 자스민차—녹차에 자스민 꽃향을 입힌 차—역시 수출용으로서 꽤 높은 품질을 유지했다.","ind":22,"bul":false},{"k":"h1","text":"2강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 도자기의 명명법 방식과 고분묘 미술 및 청화 자기에 자주 등장하는 기린문에 대해 설명해 보세요."},{"k":"h4","text":"도자기의 명명법 (이름 짓는 순서)"},{"k":"p","html":"도자기의 이름은 겉보기엔 복잡해 보이지만, 철저하게 약속된 공식에 따라 지어진다. 기본 순서는 [종류(재질)] + [장식(기법)] + [문양] + [형태(기형)]이다.","ind":0,"bul":false},{"k":"p","html":"<b>종류:</b> 청자, 백자, 분청사기 등 도자기의 바탕 재질","ind":22,"bul":true},{"k":"p","html":"<b>장식:</b> 상감, 투각, 청화 등 문양을 새겨 넣거나 칠한 기법","ind":22,"bul":true},{"k":"p","html":"<b>문양:</b> 파도, 모란, 용, 산수 등 표면에 그려진 주제","ind":22,"bul":true},{"k":"p","html":"<b>형태:</b> 병, 호(항아리), 함(상자) 등 도자기의 생김새","ind":22,"bul":true},{"k":"p","html":"<b>(명명 예시)</b>","ind":22,"bul":true},{"k":"p","html":"<b>청자 상감 파도문 병:</b> 청자 재질에 + 상감 기법으로 + 파도 무늬를 새긴 + 병","ind":40,"bul":true},{"k":"p","html":"<b>조선백자 투각 모란문 호:</b> 조선 백자에 + 뚫어 조각하는 투각 기법으로 + 모란 무늬를 새긴 + 항아리","ind":40,"bul":true},{"k":"p","html":"<b>청화백자 용봉문 함:</b> 푸른 안료(청화)로 그린 백자에 + 용과 봉황 무늬를 그린 + 상자","ind":40,"bul":true},{"k":"p","html":"<b>청화 자금유 강희 산수문 [병/호]:</b> 푸른 청화와 갈색 자금유를 바르고 + 청나라 강희제 시기의 + 산수화를 그린 + 그릇","ind":40,"bul":true},{"k":"h4","text":"고분묘 미술과 사령수(四靈獸)"},{"k":"p","html":"<b>천마총 말다래(1973년 출토):</b> 고분묘 미술에 자주 등장하는 상서로운 동물 중, 우리나라 경주 천마총에서 발굴된 말다래(장니, 말의 배를 가리는 판)에 그려진 동물은 하늘을 나는 상상 속의 말인 &#x27;천마(天馬)&#x27;다. (종종 기린과 혼동되나 천마로 분류된다.)","ind":22,"bul":true},{"k":"p","html":"<b>사령수(四靈獸):</b> 예로부터 동양 미술에서 신령스럽게 여겨 온 네 가지 상상 속 동물을 뜻하며, 용, 봉황, 거북이, 기린이 이에 해당한다.","ind":22,"bul":true},{"k":"h4","text":"기린(麒麟)의 형태와 상징"},{"k":"p","html":"<b>시대별 형태의 변화:</b> 청화 자기 등 도자기 문양에 자주 등장하는 기린은 시대에 따라 그리는 방식과 형태가 조금씩 다르게 나타난다.","ind":22,"bul":true},{"k":"p","html":"<b>마신우미 일각(馬身牛尾 一角):</b> 전통적으로 기린은 말의 몸(마신)에 소의 꼬리(우미)를 달고 있으며, 머리에는 뿔이 하나(일각) 돋아난 모습으로 묘사된다.","ind":22,"bul":true},{"k":"p","html":"<b>문치주의(文治主義)의 상징:</b> 기린은 살아있는 풀을 밟지 않고 살아있는 벌레를 먹지 않는다는 어진 동물, 즉 인수(仁獸)다. 어진 성군이 다스리는 태평성대에만 나타난다고 믿어졌기에, 무력보다는 학문과 덕을 중시하는 &#x27;문치주의&#x27;의 이상향을 상징하는 문양으로 도자기에 널리 쓰였다.","ind":22,"bul":true},{"k":"note","html":"※ 자사호 길라잡이 Part.4의 도자 기초 이론과 연관되는 문항이다.","ind":14,"bul":false},{"k":"h3","text":"2. 알코올 발효에서 곰팡이와 효모의 역할을 각각 생각해 보고, 이를 악퇴 발효 시의 우세균 발현과 연관하여 설명해 보세요."},{"k":"h4","text":"발효에서 곰팡이와 효모의 역할 (당화작용)"},{"k":"p","html":"<b>효모(Yeast):</b> 포도주처럼 이미 당분이 있는 상태에서 당을 분해하여 알코올을 만드는 역할을 한다. 단당류 등 먹이 구조가 맞아야 작용하며, 번식 환경 조성이 상대적으로 까다롭다.","ind":22,"bul":true},{"k":"p","html":"<b>곰팡이(Mold/누룩)와 병행복발효:</b> 곡물처럼 분자가 큰 다당류(전분)는 효모가 바로 먹을 수 없다. 따라서 곰팡이(누룩)나 엿기름(맥아)을 먼저 투입해 다당류를 단당류로 잘게 쪼개는 &#x27;당화(糖化) 작용&#x27;을 일으켜야 한다. 고추장을 담글 때 좁쌀을 분해하려 엿기름을 넣는 것이나, 곡물주를 빚을 때 누룩과 효모를 함께 써서 발효(병행복발효)시키는 것이 이 원리다.","ind":22,"bul":true},{"k":"h4","text":"맥주의 효모 발효 방식 비교"},{"k":"p","html":"효모가 당분을 분해하며 발효하는 방식과 온도에 따라 맥주의 종류가 나뉜다.","ind":0,"bul":false},{"k":"note","html":"※ 자연 상태로 발효시킬 경우 특유의 쿰쿰한 향이 발생하기도 한다.","ind":14,"bul":false},{"k":"p","html":"<b>상면발효 (에일, Ale):</b> 비교적 높은 온도에서 짧은 기간 발효시키며, 발효가 끝난 뒤 효모가 위로 떠오르는 방식이다.","ind":22,"bul":true},{"k":"p","html":"<b>하면발효 (라거, Lager):</b> 낮은 온도(냉장)에서 장기간 보관하며 발효시키며, 발효가 끝난 뒤 효모가 아래로 가라앉는 방식이다.","ind":22,"bul":true},{"k":"h4","text":"보이차 악퇴 발효와 우세균(優勢菌)의 통제"},{"k":"p","html":"<b>전통 악퇴의 2중 발효와 한계:</b> 보이차의 전통적인 악퇴 발효 과정에서는 찻잎에 먼저 곰팡이류가 작용하여 성분을 분해(당화)하고, 이후 효모가 작용하는 복합적인 발효가 일어난다. 하지만 곰팡이가 발효의 우세균으로 너무 강하게 작용하면, 차에서 불쾌한 쿰쿰한 곰팡이 냄새(지푸라기 냄새 등)가 남게 된다.","ind":22,"bul":true},{"k":"p","html":"<b>균종(효모) 단발효의 개발:</b> 이러한 곰팡이 냄새의 단점을 없애기 위해, 유익한 효모나 특정 미생물만을 배양하여 단독으로 찻잎에 투입하는 방식(균종 발효)이 개발되었다. 곰팡이 단계를 통제하고 맑은 향미를 내는 효모를 최우선 &#x27;우세균&#x27;으로 만들어 발효시킴으로써, 잡미 없이 깔끔하고 고급스러운 맛을 끌어내는 원리다.","ind":22,"bul":true},{"k":"note","html":"※ 요리할 때 마늘이나 파 같은 향신 채소를 넣으면 유해균의 부패나 과도한 발효는 억제하면서 좋은 향기를 내듯, 차의 발효 역시 어떤 미생물과 환경이 주도하느냐에 따라 맛과 향의 방향성이 완전히 달라진다.","ind":22,"bul":false},{"k":"note","html":"※ 1강 복습 Quiz 1(균종 발효의 장점) 및 자사호 Part.4 1강 복습 Quiz 2(호기성·혐기성 발효)와 연관.","ind":14,"bul":false},{"k":"h2","text":"※ 대만차 · 백차 관련"},{"k":"h3","text":"대만차: 동방미인과 철관음"},{"k":"p","html":"<b>동방미인(東方美人)의 생태와 제다:</b> 해발고도가 비교적 낮은 곳에서 생산된다. 소록엽선이라는 벌레가 찻잎을 갉아먹어야만 특유의 꿀향(밀향)이 생성되므로 비료나 농약을 칠 수 없다. 벌레에게 공격받아 생장 속도가 느려지면 찻잎 내 폴리페놀류 등 화학 물질의 축적 방식이 완전히 달라진다. (한의학적 관점에서는 이렇게 열악한 환경에서 고생하며 자란 찻잎일수록 본래의 찬 성질이 깎이고 따뜻한 성질을 지니게 된다고 본다.)","ind":22,"bul":true},{"k":"p","html":"<b>완성도와 가성비:</b> 찻잎의 녹색 성분이 고도로 산화되어 붉고 아름다운 금빛(금사색)을 띤다. 자연(벌레)에 철저히 의존하기 때문에 제다 기술로 더 이상 발전시킬 여지가 한정적이지만, 무농약이라는 신뢰도와 독특한 풍미 덕분에 뛰어난 가성비로 시장에서 가장 많이 팔리는 차 중 하나다.","ind":22,"bul":true},{"k":"p","html":"<b>대만 차 품평 대회 등급제:</b> 대만의 차 경연 대회에서는 1등장(상), 2등장, 3등장, 우량상 등으로 등급을 매기며, 패키지에 매화꽃 3매(개), 2매, 1매 도안을 찍어 소비자에게 직관적으로 등급을 표기한다.","ind":22,"bul":true},{"k":"p","html":"<b>목책철관음과 안계철관음의 대비:</b> 대만의 목책(木柵)철관음은 본토 복건성(민남 지역)에서 넘어온 옛 전통 방식을 유지하여 묵직하게 구워낸 &#x27;농향(濃香)&#x27;으로 판매된다. 반면 본토의 안계(安溪)철관음은 1980년대 이후 현대에 들어서면서 산화도를 대폭 낮춰 녹차에 가깝게 푸르고 가볍게 만드는 트렌드로 변화했다.","ind":22,"bul":true},{"k":"h3","text":"제다(製茶)의 원리와 백차(白茶)"},{"k":"p","html":"<b>제다는 곧 법제(法製):</b> 한의학에서 약재의 독성을 빼고 약성을 높이는 &#x27;법제&#x27; 과정처럼, 찻잎도 제다를 통해 잎 본연의 차가운 독성(한성)을 제거하고 인체에 유익한 약성을 극대화한다.","ind":22,"bul":true},{"k":"p","html":"<b>탕색과 법제의 강도:</b> 우려낸 탕색이 연할수록 법제가 약하게 된 차이고, 탕색이 진할수록 법제가 강하게 된 차다. 찻잎이 단순히 산화되는 것보다 미생물 발효를 거치는 것이 찻잎을 훨씬 더 강력하게 법제한다.","ind":22,"bul":true},{"k":"p","html":"<b>차가운 차의 인체 반응:</b> 법제가 덜 된 차가운 성질의 차를 마시면, 위장이 이를 방어하기 위해 스스로 위장 보호막을 내보내고 몸에서 다시 대사 열을 발생시키는 작용을 한다.","ind":22,"bul":true},{"k":"p","html":"<b>백차의 후천적 법제 (시간의 힘):</b> 백차는 덖거나 비비는 복잡한 과정 없이 볕에 널어 말리는 위조(시들이기)만 하기 때문에 초기의 법제가 매우 약하다. 하지만 열처리(살청)를 하지 않아 효소가 살아있으므로 보관 중 산화가 지속적으로 빠르게 진행된다. 즉, 백차는 &#x27;시간의 힘&#x27;을 빌려 후천적으로 서서히 법제가 이루어지며, &quot;30년이 지나면 귀한 약차가 된다&quot;는 이야기가 나오는 것도 이 원리 때문이다.","ind":22,"bul":true},{"k":"p","html":"<b>차를 보는 3요소:</b> 결국 차의 품질과 성질은 원료의 &#x27;원래 성질&#x27;, 제다라는 &#x27;법제&#x27;, 그리고 시간이라는 &#x27;보관&#x27;의 세 가지 축으로 완성된다.","ind":22,"bul":true},{"k":"h2","text":"□ 홍콩으로의 보이차 유통과 골동보이차의 등장"},{"k":"p","html":"보이차는 오랜 시간 중국 본토를 넘어 티베트, 베트남, 라오스, 미얀마, 태국 등 아시아, 멀리는 프랑스 등 서구권까지 수출되어 소비되었다. 다만 진년차(노차와 골동차)라는 개념은 90년대 홍콩에서 최초로 등장하였고, 현재 시중에서 볼 수 있는 진년차의 자료들 역시 홍콩에서 나온 시대적·역사적 산물이다. 즉 통상적인 방법으로 생산되고 유통되었던 차가 홍콩으로 유통된 이후 특정 시점을 기준으로 보관과 소비 형태에 드라마틱한 변화가 생긴 것인데, 이와 관련하여 홍콩으로의 보이차 진입과 유통, 특유의 보관 형태 등을 살펴볼 필요가 있다.","ind":0,"bul":false},{"k":"h3","text":"1. 차 집산지로서의 홍콩의 등장"},{"k":"h4","text":"개항과 상업 중심지의 형성"},{"k":"p","html":"<b>홍콩(香港)의 어원과 개항:</b> 홍콩은 본래 광동 지역에서 생산된 &#x27;향(香)을 실어 나르던 항구&#x27;라는 뜻에서 유래했다. (인근의 마카오는 일찍이 포르투갈이 차지하고 있었다.)","ind":22,"bul":true},{"k":"p","html":"<b>아편전쟁과 난징조약 (1842년):</b> 홍콩이 서양에 본격적으로 알려지고 국제 무역항으로 발돋움한 계기는 아편전쟁(1840~1842)이다. 1842년 난징조약 체결로 홍콩섬이 영국에 할양되었다.","ind":22,"bul":true},{"k":"p","html":"<b>영국의 통치와 양행(洋行):</b> 영국은 홍콩을 넘겨받은 뒤 이를 &#x27;빅토리아 시티(Victoria City)&#x27;라 명명하고, 관청과 군대를 배치해 식민 통치의 기틀을 다졌다. 지금의 센트럴(Central) 지역인 중환(中環) 일대가 중심지가 되었으며, 영국 등 서양에서 장사를 위해 넘어온 상인들의 무역 회사를 &#x27;양행&#x27;이라 불렀다.","ind":22,"bul":true},{"k":"h4","text":"중국 상인들의 이주와 차 유통망 구축"},{"k":"p","html":"<b>다양한 출신의 상인 집단:</b> 홍콩이 무역 허브로 성장하자 중국 본토에서 수많은 사람들이 장사를 위해 이주해 왔다. 광동 사람들을 주축으로 복건성 사람, 객가(客家) 사람, 그리고 조주(潮州) 지역의 상인 집단인 &#x27;조주상방&#x27; 등이 홍콩의 차 유통을 장악했다.","ind":22,"bul":true},{"k":"p","html":"<b>상호명과 찻장(茶莊):</b> 이들은 주로 찻잎 도소매를 하며 찻장(차 상점)을 열었다.","ind":22,"bul":true},{"k":"p","html":"<b>상호명 해설:</b> 당시 상점 이름은 도매상을 뜻하는 '~란(欄)'(예: 진춘란(陳春蘭)), 혹은 전통 상호명에 붙는 '~호(號)'(예: 동경호), '~기(記)' 등으로 지어졌다. 홍콩역사박물관에 가면 당시 성행했던 차창들의 옛 간판들을 확인할 수 있다.","ind":22,"bul":true},{"k":"h4","text":"20세기 홍콩 차 시장의 변천사 (연대별 정리)"},{"k":"p","html":"<b>1910년대 (이민과 경영권 이전):</b> 1911년 신해혁명(청나라 멸망) 전후로 혼란기를 겪으며 홍콩에 자리 잡았던 일부 거상들이 1910년대 무렵 미국 등으로 이민을 떠나게 되고, 이 과정에서 차창의 경영권이 다른 상인들에게 넘어가며 세대교체가 일어나기도 했다. (앞에서 현존하는 가장 오래된 보이차가 1911년산이라고 언급된 것도 이 시기다.)","ind":22,"bul":true},{"k":"p","html":"<b>1980년대 (공산 중국의 진출):</b> 1983~1984년 무렵 중영공동선언(홍콩 반환 협정)이 가시화되면서, 중국 대륙(공산 중국)의 국영 자본이나 광동의 차창들이 1997년 홍콩 반환을 앞두고 홍콩 시장에 대거 거점을 마련하여 차를 유통·판매하기 시작했다.","ind":22,"bul":true},{"k":"h3","text":"2. 80년대 홍콩 보이차 시장의 부활"},{"k":"h4","text":"시대차품(時代茶品)의 역사적 배경"},{"k":"p","html":"<b>시대차품의 범위:</b> 보통 1800년대 중반부터 1997년(홍콩 반환) 무렵까지 생산·유통된 오래된 보이차들을 일컫는다.","ind":22,"bul":true},{"k":"p","html":"<b>역사적 기점:</b> 1800년대 중반 윈난성 일대에서 일어난 두문수의 난(회족의 반란)을 기점으로 시대차품의 굴곡진 역사가 본격적으로 시작된다.","ind":22,"bul":true},{"k":"p","html":"<b>전쟁과 유통:</b> 청나라가 멸망하고 장제스(장개석)의 국민당과 마오쩌둥(모택동)의 공산당이 대립하던 시기, 정부는 국영 다원을 설립하고 전쟁 군비를 마련하기 위해 찻잎을 적극적으로 유통했다.","ind":22,"bul":true},{"k":"h4","text":"유통 주도권의 이동: 마카오에서 홍콩으로"},{"k":"p","html":"<b>초기 마카오 주도:</b> 아편전쟁 직후 등 초기에는 포르투갈령이었던 마카오가 홍콩보다 차 유통을 더 많이 주도했다.","ind":22,"bul":true},{"k":"p","html":"<b>홍콩의 부상 (1949년 이후):</b> 제2차 세계대전이 끝나고 1949년 국공내전에서 승리한 공산당이 중화인민공화국을 수립하면서 국민당은 대만으로 쫓겨갔다. 이 시기를 기점으로 차 유통의 주도권은 온전히 홍콩으로 넘어오게 된다.","ind":22,"bul":true},{"k":"p","html":"<b>밀무역의 성행:</b> 공산화 이후 운남 산지의 사람들은 엄격한 국영 통제 탓에 자유로운 무역을 하지 못했고, 결국 홍콩을 경유하는 밀무역을 통해 차를 유통해야만 했다.","ind":22,"bul":true},{"k":"h4","text":"80년대 자유무역 개방과 1997년 홍콩 반환"},{"k":"p","html":"<b>개혁개방과 실용주의:</b> 1980년대 들어 덩샤오핑(등소평)의 흑묘백묘론(이념을 떠나 경제적 실리를 우선하는 태도)을 바탕으로, 광동성의 심천 등을 중심으로 자유무역이 시작되었다. (당시 대만이나 한국 등 주변국은 미국과 일본의 경제적 지원 및 식민지 근대화론 등의 복잡한 배경 속에서 경제 성장을 이루고 있었다.)","ind":22,"bul":true},{"k":"p","html":"<b>홍콩 반환과 허브의 이동:</b> 1997년 7월 1일 홍콩이 중국에 반환되면서 무역 환경이 변했고, 상인들은 기존 허브였던 홍콩 대신 광저우(광주) 등을 새로운 도매 및 유통 허브로 삼기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>습창(濕倉)의 쇠퇴:</b> 90년대 후반을 기점으로 소비자들은 시장에 품질이 더 훌륭하고 깨끗한 차들이 많다는 사실을 깨닫게 되면서, 고온다습하게 묵혀 쿰쿰한 냄새가 나는 홍콩식 &#x27;습창차&#x27;를 점차 외면하게 되었다.","ind":22,"bul":true},{"k":"h4","text":"대만과 한국으로의 보이차 유입"},{"k":"p","html":"<b>대만의 복잡한 소비층:</b> 마카오와 홍콩을 거친 보이차는 대만으로 흘러갔다. (대만 내부는 원주민, 일찍 정착한 내성인(본성인), 국공내전 때 건너온 외성인 등 복잡한 인구 구성을 지녔으며, 이들을 중심으로 차 문화와 소비 시장이 성장했다.)","ind":22,"bul":true},{"k":"p","html":"<b>한국의 도입 시기:</b> 1992년 한중 수교 이전에는 중국과 직접 거래를 할 수 없어 알음알음 몰래 차가 오갔다. 주로 1980년대 대구와 부산 지역의 무역이 가장 번성했을 때 보따리상 등을 통해 홍콩의 보이차가 한국으로 대거 유입되었다.","ind":22,"bul":true},{"k":"p","html":"<b>유통망의 현대화:</b> 1990년대에는 거꾸로 대만과 홍콩의 상인들(1·2세대)이 직접 한국 시장에 들어와 차를 팔기도 했으나, 현재는 홍콩이나 대만을 거치지 않고 중국 산지에서 한국으로 직접 수입하는 직수입 유통망이 자리 잡았다.","ind":22,"bul":true},{"k":"h3","text":"3. 90년대 홍콩 보이차 시장의 재발견"},{"k":"p","html":"현존하는 오래된 진년 보이차들은 90년대를 전후하여 홍콩에 위치한 차 창고들에서 우연히 발견되어 본격적으로 유통되기 시작하였다. 국내외의 다양한 지역으로 유통되었음에도 오직 홍콩에서만 수십 년 이상 저장된 보이차가 발견되었다는 점과, 다만 당시에도 홍콩의 모든 차 창고에서 골동 보이차의 존재가 확인된 것은 아니라는 점은 주목할 만하다.","ind":0,"bul":false},{"k":"h4","text":"가. 골동 보이차의 등장 배경"},{"k":"p","html":"<b>홍콩 반환과 창고 정리:</b> 1997년 홍콩의 중국 반환이라는 거대한 역사적 전환점을 앞두고, 홍콩 전역에 산재해 있던 오래된 차 창고들을 대대적으로 정리하고 처분하는 과정에서 수십 년간 잊혀 있던 골동 보이차들이 우연히 대거 발견되었다.","ind":22,"bul":true},{"k":"p","html":"<b>물량 폭증과 가격 폭락:</b> 발견 초기에는 남아 있는 오래된 차의 물량이 매우 적을 것이라 여겨 희소성에 가치가 높게 매겨졌으나, 이후 예상치 못한 엄청난 추가 물량이 계속해서 쏟아져 나오면서 순식간에 시세가 급격히 떨어지는(폭락하는) 현상이 벌어졌다.","ind":22,"bul":true},{"k":"p","html":"<b>홍콩 집중 현상의 의미:</b> 전 세계 여러 지역으로 차가 수출되었음에도 유독 홍콩 지역의 창고들에서만 수십 년 이상 장기 숙성된 골동 보이차가 대량으로 발견된 것은, 홍콩이 수십 년간 차 보관과 후발효의 핵심 거점이었음을 방증한다. 다만 당시의 모든 창고에서 골동 보이차가 고르게 발견된 것은 아니며, 특정 창고들의 보관 여건과 유통 경로에 따라 명암이 갈렸다.","ind":22,"bul":true},{"k":"h4","text":"나. 골동보이차의 유통 형태"},{"k":"note","html":"※ 아래 「※ 노주문과 숙차 기법」 메모와 1강 「2. 창고 개방과 노차(老茶) 시장의 형성」의 '창고털이' 대목이 이 항목과 이어진다.","ind":14,"bul":false},{"k":"h3","text":"4. 홍콩차에 대한 편견"},{"k":"h3","text":"5. 추가적인 검토 요소"},{"k":"h2","text":"※ 대익과 건창 보관"},{"k":"h3","text":"1. 건창(乾倉) 보관 트렌드의 정착과 지역별 차이"},{"k":"p","html":"<b>건창 시대의 도래:</b> 1997년 홍콩 반환을 기점으로 전통적인 습창(인위적 고온다습 보관) 방식이 쇠퇴하기 시작했고, 2000년대 초반부터는 쾌적한 환경에서 차를 보관하는 건창 보관 트렌드가 시장의 주류로 완전히 넘어왔다.","ind":22,"bul":true},{"k":"p","html":"<b>말레이시아 건창과 한국 건창의 차이:</b> 같은 &#x27;건창&#x27;이라 부르더라도 지역의 기후에 따라 습도 차이가 엄청나다. 예컨대 2006년산 8582는 건창 보관의 메카(기준점)로 꼽히는데, 보관지가 말레이시아일 경우 한국의 건창 보관에 비해 기본적으로 훨씬 더 많은 습을 먹고 산화가 빠르게 진행된다.","ind":22,"bul":true},{"k":"h3","text":"2. 맹해차창의 민영화와 대익(大益) 그룹의 출범"},{"k":"p","html":"<b>국영 차창 시기 (2004년 이전):</b> 2004년 이전은 국가가 운영하던 &#x27;맹해차창(맹해정차창)&#x27; 시기다.","ind":22,"bul":true},{"k":"note","html":"※ Part.2 내용 연결: 2000년 맹해차창이 유럽 수출용으로 유기농 인증을 받은 &#x27;대백채(大白菜)&#x27; 시리즈를 수매하여 생산한 것이, 훗날 &#x27;노반장(老班章)&#x27; 지역의 찻잎이 최고급으로 널리 알려지게 된 결정적 계기가 되었다.","ind":22,"bul":false},{"k":"p","html":"<b>2004년 민영화:</b> 2004년 운남박문투자유한공사(雲南博聞投資有限公司)가 맹해차창의 지분을 전면 매입하며 전격적인 민영화가 이루어졌다.","ind":22,"bul":true},{"k":"p","html":"<b>대익(大益) 브랜드의 기업화:</b> 민영화 이후 대익그룹, 대익다도원, 대익연구원 등으로 조직을 체계화하고 생산처는 맹해차창으로 두었다. 경험 많은 전문가들을 대거 영입하고 생산 공정을 기계화·현대화했다.","ind":22,"bul":true},{"k":"p","html":"<b>금융차(투자차)로의 변질:</b> 민영화를 기점으로 생산량과 가격이 과거 국영 시절과 비교할 수 없을 만큼 크게 달라졌다. 이때부터 대익의 보이차는 마시는 음료를 넘어 주식처럼 가격이 오르내리는 &#x27;금융차(투자 개념의 차)&#x27;로 성격이 변질되는 부작용도 낳았다.","ind":22,"bul":true},{"k":"h3","text":"3. 2000년대 초반 생산품의 가치와 특정 차품"},{"k":"p","html":"<b>국영 말기(2000~2003년) 차의 가치:</b> 보이차를 구매할 때, 민영화 직전인 2000년부터 2003년까지 생산된 맹해차창의 차를 구하는 것이 단순히 이름만 남은 이후의 7542나 8582를 사는 것보다 품질이나 소장 가치 면에서 훨씬 낫다.","ind":22,"bul":true},{"k":"p","html":"<b>내수용과 수출용의 포장 표기:</b> 일반적으로 서양이나 홍콩 수출용 차에는 포장지에 영어(YUNNAN SEVEN... 등)가 병기되어 있으나, 중국 내수용이나 일본 수출용 차에는 영어가 적혀 있지 않은 것이 특징이다.","ind":22,"bul":true},{"k":"p","html":"<b>전심(傳心):</b> 대익에서 2019년에 이무(易武) 지역의 고급 원료를 사용해 만든 명차의 이름이다.","ind":22,"bul":true},{"k":"note","html":"※ 이 '전심'이라는 명칭은 우리나라 쌍계제다(쌍계명차) 쪽에서 기획·작명에 관여했다는 얽힌 일화가 있다.","ind":22,"bul":false},{"k":"h2","text":"※ 자사호 유통 관련 (천예명)"},{"k":"h3","text":"천예명과 인사동 자사호 유통의 흐름"},{"k":"p","html":"<b>자사호와의 만남:</b> 흑룡강성(중국과 러시아의 접경) 하얼빈 지역에 의흥(宜興) 자사호를 팔고 알리러 온 상인이 있었고, 흑룡강성 출신의 조선족 천예명이 그 상인의 학생이 되어 자사호를 배우고 판매하기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>인사동 진출과 신진 작가 소개:</b> 2006~2007년 무렵 한국의 인사동에 진출하여 자사호를 본격적으로 유통하기 시작했다. 당시 소현량, 조익군, 왕실봉, 혜상운(惠祥雲), 오일민 등 20대에서 30대 초중반의 전도유망한 젊은 중국 작가들의 작품을 한국 시장에 대거 소개했다.","ind":22,"bul":true},{"k":"p","html":"<b>고급 니료 독점과 유통 전환:</b> 2012년부터 약 10년간 매우 뛰어난 품질의 니료(자사 광석)로 만든 고급 자사호를 독점하다시피 판매했다. 당시 좋은 작품은 한 점에 250만 원을 호가하기도 했으나, 중국 현지의 니료 가격과 작가들의 몸값이 감당하기 힘들 정도로 폭등하자 자사호 유통을 점차 줄이고 현재는 차(茶) 유통에 주력하고 있다.","ind":22,"bul":true},{"k":"h3","text":"자사호의 소성 온도와 공극(기공)"},{"k":"p","html":"<b>고온 소성의 부작용:</b> 당시 유통되던 일부 자사호를 만들 때 가마의 소성 온도(굽는 온도)를 흙이 견딜 수 있는 한계치 이상으로 지나치게 높인 경우가 있었다. 온도가 너무 높으면 자사 니료 특유의 모래 알갱이(사질니)가 전부 녹아버리며 흙 고유의 질감인 &#x27;사성(砂性)&#x27;이 죽어버린다. 이렇게 되면 표면이 유리질화(자기화)되어 자사호의 가장 큰 장점인 숨 쉬는 기능(투기성)을 잃게 된다.","ind":22,"bul":true},{"k":"p","html":"<b>적정 온도와 공극의 역할:</b> 반대로 적정한 온도(혹은 다소 낮은 온도)에서 잘 구워낸 자사호는 흙과 모래 알갱이 사이의 미세한 공극(숨구멍)이 그대로 살아있다. 이 미세한 기공들이 차의 향과 맛을 듬뿍 빨아들이고 머금어, 훗날 차를 우릴 때 맛을 더욱 풍부하게 만들어 준다.","ind":22,"bul":true},{"k":"note","html":"※ 자사호 교재 5~6강의 니료 및 소성 원리와 직결된다.","ind":22,"bul":false},{"k":"h3","text":"자사호 역사의 단편 (명말 4대 명인)"},{"k":"p","html":"<b>시붕(時朋)과 시대빈(時大彬):</b> 명나라 말기의 인물인 시붕과 시대빈은 부자(父子) 지간이다. 시붕이 아버지이고 시대빈이 그 아들이며, 두 사람 모두 자사호 역사상 가장 위대한 반열에 오른 명인들이다. 특히 아들 시대빈은 자사호의 형태와 기법을 완성한 전설적인 인물로 꼽힌다.","ind":22,"bul":true},{"k":"note","html":"※ 자사호 길라잡이 Part.4 7강 「4. 명말 4대 명인」의 '시붕의 아들 시대빈', 「5. 3대 명인」과 연관. 소성온도와 사성·공극 논의는 자사호 5·6강과 연관.","ind":14,"bul":false},{"k":"h2","text":"※ 영국 동인도회사와 차나무 반출"},{"k":"h3","text":"유럽의 차 조우와 동인도회사의 설립"},{"k":"p","html":"<b>17세기의 차 도입:</b> 1600년대(17세기)에 영국 사람들이 동인도회사를 통해 중국의 차를 처음 접하며 수입하기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>양대 동인도회사:</b> 아시아 무역을 위해 영국은 1600년에, 네덜란드는 1602년에 각각 동인도회사를 설립했다. 특히 네덜란드 동인도회사는 역사상 최초의 주식회사 형태를 띠었으며, 단순한 무역 회사를 넘어 독자적인 외교권과 군사권까지 행사하는 막강한 조직이었다. 영국의 동인도회사 역시 아시아 차 무역을 독점하며 거대한 부를 쌓았다.","ind":22,"bul":true},{"k":"h3","text":"로버트 포춘의 잠입과 산업 스파이 활동"},{"k":"p","html":"<b>차 독립을 위한 영국의 야심:</b> 19세기 중반, 중국에 지불하는 막대한 차 수입 대금(은)으로 인해 무역 적자가 심해지자, 영국 동인도회사는 자국의 식민지인 인도에서 직접 차를 재배하기로 계획한다.","ind":22,"bul":true},{"k":"p","html":"<b>로버트 포춘(Robert Fortune):</b> 스코틀랜드 출신의 식물학자인 로버트 포춘이 영국 동인도회사의 의뢰를 받아 1848년부터 1851년까지 중국으로 파견되었다. 그는 중국인으로 위장한 채 안휘성 등 내륙 깊숙한 차 산지에 잠입했다.","ind":22,"bul":true},{"k":"p","html":"<b>두 가지 핵심 임무:</b> 포춘의 목표는 명확했다. 첫째는 중국의 우수한 &#x27;차나무(종자 및 묘목) 반출&#x27;이었고, 둘째는 찻잎을 가공하는 핵심 노하우인 &#x27;제다 기술의 탈취&#x27;였다.","ind":22,"bul":true},{"k":"h3","text":"인도로의 밀반출과 인도 차 산업의 태동"},{"k":"p","html":"<b>종자와 기술자의 유출:</b> 포춘은 수만 그루에 달하는 차나무 묘목과 씨앗을 유리 상자(워디언 케이스)에 담아 인도로 빼돌리는 데 성공했다. 또한, 차를 만드는 데 숙련된 중국인 제다 직공(기술자) 8명을 함께 인도로 데려가 선진 제다 기술을 고스란히 이식했다.","ind":22,"bul":true},{"k":"p","html":"<b>아삼(Assam)종의 결합:</b> 포춘이 훔쳐 온 중국종 차나무와 제다 기술은, 훗날 인도 아삼 지방에서 발견된 인도 자생종 차나무인 &#x27;아삼종&#x27;의 대규모 플랜테이션 재배와 맞물리면서 인도를 세계 최대의 홍차 생산국으로 탈바꿈시키는 결정적 계기가 되었다.","ind":22,"bul":true},{"k":"h2","text":"※ 강파니와 차산"},{"k":"h3","text":"강파니와 특수 니료 용혈사(龍血砂)"},{"k":"p","html":"<b>용혈사의 발견:</b> 2007년 의흥 황룡산 도로(언덕) 개설 공사 중 포크레인으로 파내다 우연히 발견된 니료가 강파니(降坡泥)다. 그중에서도 황룡산 3호 언덕에서 나온 강파니 중 붉은 선지처럼 특이하고 붉은 형태를 띠는 흙을 &#x27;용혈사&#x27;라 부른다.","ind":22,"bul":true},{"k":"p","html":"<b>니료의 물리적 특성:</b> 이 강파니(용혈사) 원광을 갈아서 물에 넣어두면 붉은 물이 잔뜩 배어 나온다.","ind":22,"bul":true},{"k":"p","html":"<b>성형 및 소성의 어려움:</b> 흙 속에 모래 알갱이 성분(사성)이 너무 많아 점력이 떨어지고 소결(불에 구워져 단단하게 결합하는 현상)이 잘되지 않는다. 가마에 굽기도 전인 건조 과정에서부터 형태가 찢어지거나 갈라지고 쉽게 깨져버릴 정도로 다루기 까다로운 니료다.","ind":22,"bul":true},{"k":"h3","text":"시대에 따른 보이차 산지의 이동"},{"k":"p","html":"<b>고(古) 6대 차산 시대:</b> 청나라부터 1912년(민국 시대 초기) 무렵까지는 이무(易武) 지역을 중심으로 한 전통적인 &#x27;고 6대 차산&#x27;이 보이차 생산의 핵심을 담당했다.","ind":22,"bul":true},{"k":"p","html":"<b>신(新) 6대 차산 시대:</b> 1980년대 이후부터는 맹해(勐海) 지역을 중심으로 한 &#x27;신 6대 차산&#x27;이 차의 생산과 유통 주도권을 넘겨받았다. 대량생산을 이끈 맹해차창 역시 이 신 6대 차산 지역에서 주로 찻잎 원료를 공급받아 보이차를 생산했다.","ind":22,"bul":true},{"k":"h2","text":"※ 노주문과 숙차 기법"},{"k":"h3","text":"노주문(盧鑄勳)의 인물 조명"},{"k":"p","html":"<b>인물 정보:</b> 1927년생으로, 홍콩 및 광동 지역의 차 산업에서 독보적인 실력과 영향력을 지녔던 인물이다.","ind":22,"bul":true},{"k":"p","html":"<b>숙수(熟水) 기법의 창안자:</b> 찻잎을 인위적으로 빠르게 익히거나 발효시키는 홍콩식 &#x27;숙수 기법&#x27;을 창안한 핵심 실력자다. 생차 형태의 찻잎에 물을 적셔 창고에 재워두는 방식으로 홍콩 고유의 &#x27;습창(숙차) 스타일&#x27;을 만들어낸 주역이다.","ind":22,"bul":true},{"k":"h3","text":"운남 기술자들의 홍콩·광동 방문과 숙차 기술의 전수 (1973년)"},{"k":"p","html":"<b>기술 전수의 배경:</b> 1970년대 초반, 운남성의 차창(곤명차창 등) 기술자들이 보이차의 인위적 가속 숙성(숙차 제조) 방법을 연구하고 도입하기 위해 홍콩과 광동성 일대로 파견되었다.","ind":22,"bul":true},{"k":"p","html":"<b>노주문과의 만남:</b> 이때 운남의 기술자들이 광동성과 홍콩을 찾아가 당시 습창 보관과 숙수 기법의 대가였던 노주문을 직접 만나 그로부터 찻잎을 익히고 발효시키는 핵심 노하우를 전수받았다. 이 과정이 훗날 운남 산지에서 현대적인 &#x27;숙차 악퇴(渥堆) 공법&#x27;이 정립되는 데 결정적인 밑거름이 되었다.","ind":22,"bul":true},{"k":"h3","text":"1990년대 이후 습식 보관(습창)의 몰락"},{"k":"p","html":"<b>품질 저하와 암초:</b> 노주문의 숙수 기법에서 유래한 홍콩식 습식 보관(습창)은 초창기 빠른 숙성과 부드러운 탕색을 내는 데 기여했으나, 1990년대 이후에는 곰팡이와 잡미를 유발하고 위생적인 품질 저하를 일으키는 주범(치명적인 암초)으로 전락하게 되었다. 이에 따라 시장의 트렌드도 훗날 깨끗한 건창 보관과 산지 직수입 위주로 완전히 재편되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 대만과 본토의 양안 간 삼통"},{"k":"h3","text":"1. 삼통(三通)의 개념과 배경"},{"k":"p","html":"<b>한중 수교와 홍콩 경유:</b> 한국과 중국의 정식 수교는 1992년 8월 24일에 이루어졌으며, 그전까지는 중국과의 모든 물류 및 인적 교류가 주로 홍콩을 우회하는 방식으로 이루어졌다.","ind":22,"bul":true},{"k":"p","html":"<b>삼통(三通)의 정의:</b> 대만(중화민국)과 중국 본토(중화인민공화국) 양안(兩岸) 간의 직접적인 통상(무역), 통항(하늘길·바닷길 열기), 통우(우편 교류) 등 세 가지 교류 방식을 뜻한다.","ind":22,"bul":true},{"k":"h3","text":"2. 소삼통(小三通)과 대삼통(大三通)"},{"k":"p","html":"<b>소삼통(小三通, 2001년 시행):</b>","ind":22,"bul":true},{"k":"p","html":"대만 본섬이 아닌, 대륙에 바짝 붙어 있는 푸젠성 인근의 섬 지역인 금문도(金門島)와 마조도(馬祖島)를 제한적으로 거쳐 본토와 오가는 방식이다. 1990년대 후반 논의를 거쳐 2001년에 공식 시행되었다.","ind":40,"bul":true},{"k":"p","html":"이 지역을 거쳐 들어오는 유명한 특산물로 &#x27;금문고량주&#x27;가 있으며, 과거 대만인들이 대륙으로 건너갈 때 주로 이 섬들을 거쳐 가곤 했다.","ind":40,"bul":true},{"k":"p","html":"<b>대삼통(大三通, 2008년 전면 시행):</b>","ind":22,"bul":true},{"k":"p","html":"소삼통이 일부 부속 섬들에 한정된 제한적·부분적 개방이었다면, 대삼통은 통상·통항·통우의 세 가지 교류를 양안 본섬 전체로 전면 확대한 것이다.","ind":40,"bul":true},{"k":"p","html":"2008년 12월에 직항 항공로, 직접 해운, 직접 우편이 전면 시행되면서 대만과 대륙을 오갈 때 더 이상 홍콩이나 제3지역을 경유할 필요가 없게 되었다.","ind":40,"bul":true},{"k":"h3","text":"3. 보이차 유통 구조에 미친 영향"},{"k":"p","html":"대삼통 시행으로 양안 간 직접 왕래와 물류가 자유로워진 이러한 거대한 변화는, 앞서 다룬 &quot;홍콩을 거치지 않고 산지에서 대만이나 한국으로 직접 차를 수입하게 된 현대의 직수입 유통 구조&quot;와 정확히 맞물려 차 시장의 패러다임을 완전히 바꾸어 놓았다.","ind":22,"bul":true},{"k":"h2","text":"□ 대만으로의 보이차 유통과 골동차 시장의 형성"},{"k":"h3","text":"1. 대만 내 보이차 시장의 형성과 골동 보이차의 재평가"},{"k":"p","html":"<b><b>우롱차 기반에서 보이차로의 확장:</b></b> 1980년대 대만은 목책철관음 등 전통 우롱차를 주로 다루던 차 문화 기반을 가지고 있었다.","ind":22,"bul":true},{"k":"p","html":"<b><b>홍콩 유행의 유입:</b></b> 홍콩에서 먼저 불기 시작한 오래된 보이차(골동차)와 후발효차의 유행이 대만으로 자연스럽게 넘어왔고, 이는 대만 차 시장 전체에 거대한 보이차 열풍을 불러일으켰다.","ind":22,"bul":true},{"k":"h3","text":"2. 대만인에 의한 반세기만의 이무 호급차 부활 시도"},{"k":"p","html":"<b><b>반세기 만의 이무 호급차 부활:</b></b> 대만 차인들(여례진 등)은 단순히 유행을 소비하는 데 그치지 않고, 1996년 이무 지역을 직접 찾아가 옛 호급차의 제다법을 되살린 &lt;진순아호&gt;를 제작하며 반세기 만에 전통 호급차의 부활을 성공적으로 이끌어냈다.","ind":22,"bul":true},{"k":"h2","text":"□ 한국으로의 보이차 유통과 골동차 시장의 형성"},{"k":"p","html":"화교의 정착과 대만차 1세대: 한국의 차 문화 유입 과정에서 화교들의 정착과 상업적 교류는 주로 중국 본토뿐만 아니라 대만 계열과의 연계를 통해 이루어졌으며, 이 시기의 대만차 수입 흐름을 흔히 &#x27;대만차 1세대&#x27;라 부른다.","ind":22,"bul":true},{"k":"p","html":"유통의 이동 경로 (홍콩 → 대만 → 한국): 보이차와 골동차의 유행은 [홍콩] → [대만] → [한국]의 삼각 파도타기 형태로 전파되었다.","ind":22,"bul":true},{"k":"p","html":"한국의 도입 시기: 1980년대 대구와 부산 지역의 무역이 가장 번성했을 당시, 보따리상과 화교 상인을 통해 홍콩과 대만의 보이차가 한국으로 처음 유입되기 시작했다. 이후 1990년대 중후반부터는 대만과 홍콩의 상인들이 직접 한국 시장에 들어와 차를 유통하면서 골동차 및 보이차 시장이 본격적으로 형성되었다.","ind":22,"bul":true},{"k":"h1","text":"부록 — 맹해정창 특강 (1939-2004)"},{"k":"h2","text":"□ 원데이클래스 개요"},{"k":"p","html":"맹해차창이 대익그룹 산하로 편입된다.","ind":22,"bul":true},{"k":"p","html":"국영차창에서 민영화로 넘어간 것이다.","ind":22,"bul":true},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 노반장 다원 내 유성 생식에 의한 차나무 중, 첨차 품종(단나무)과 고차 품종(쓴나무)의 유전적 연혁을 설명해 보세요."},{"k":"p","html":"<b>고차(쓴나무):</b> 노만아에서 유래했다.","ind":22,"bul":true},{"k":"p","html":"<b>첨차(단나무):</b> 한족이 미얀마 쪽에서 들여와 심은 품종이다.","ind":22,"bul":true},{"k":"p","html":"<b>유전적 특징:</b> 유성 생식 과정에서 고차와 첨차가 자연 교잡되어, 복합적인 유전자를 띠게 되었다.","ind":22,"bul":true},{"k":"h3","text":"2. aroma와 flavour의 차이에 대해 설명해 보세요."},{"k":"p","html":"<b>Aroma (아로마):</b> 코로 직접 들이마셔 느끼는 순수한 향(후각)이다. 외형과는 무관하다.","ind":22,"bul":true},{"k":"p","html":"<b>Flavour (플레이버):</b> 입안에서 느껴지는 맛(미각)과 코로 올라오는 향이 결합된 총체적인 풍미이다.","ind":22,"bul":true},{"k":"p","html":"<b>요약:</b> Aroma는 코로만 맡는 향, Flavour는 맛과 함께 복합적으로 느껴지는 향이다. 원료와 제다 기술에 따라 두 가지가 다르게 발현된다.","ind":22,"bul":true},{"k":"h2","text":"□ 민국 시기 차업 연혁"},{"k":"h3","text":"1. 역사 및 시대적 배경"},{"k":"p","html":"<b>민국 시대 (1911~1949):</b> 청나라 멸망 후 1911년 신해혁명을 통해 중화민국이 건국되었다. (자본주의 체제)","ind":22,"bul":true},{"k":"p","html":"<b>혼란기:</b> 사천성 철도 반란, 기존 세력 및 군벌 간의 충돌이 잦았으며, 내각제 정치와 북벌 완수 이후 이념 전쟁(내전)으로 이어졌다.","ind":22,"bul":true},{"k":"p","html":"<b>신중국 수립:</b> 공산당이 승리하며 마르크스주의 기반의 사회주의 일당독재 국가가 되었다. (이후 1973년 숙차 개발)","ind":22,"bul":true},{"k":"h3","text":"2. 맹해차창(대익)의 제다 및 병배 시스템"},{"k":"p","html":"<b>병배차 기반:</b> 대익차는 사람이 직접 찻잎 사이즈(등급)를 세분화하고 섞어 만드는 병배차다.","ind":22,"bul":true},{"k":"p","html":"<b>살면(撒面):</b> 차 앞면에만 어린잎을 뿌려 덮기 때문에, 겉모습만으로는 전체 찻잎의 등급을 파악하기 어렵다.","ind":22,"bul":true},{"k":"p","html":"<b>레시피 배합:</b> 차마다 고유의 메인 등급이 있으며, 전체의 50~70%는 기본 베이스 찻잎으로 구성된다.","ind":22,"bul":true},{"k":"h3","text":"3. 주요 제품군 및 규격 (코드네임차)"},{"k":"p","html":"<b>노차 (코드네임차):</b> 정제창에서 주문 생산한 상급 공품으로, 특정 번호(맥호)가 부여된다. (기준에 따라 연도 유추 가능)","ind":22,"bul":true},{"k":"p","html":"<b>주요 규격:</b> 7542, 7312, 7532, 7262, 8582, 8592 등이 있다.","ind":22,"bul":true},{"k":"p","html":"<b>가치 변화:</b> 초기에는 작은 잎을 쓴 7542가 더 비쌌으나, 이후 맛의 특징 때문에 8582가 더 비싸지기도 했다.","ind":22,"bul":true},{"k":"p","html":"<b>업그레이드:</b> 2005년 출시된 7742는 90년대 7542의 업그레이드 버전이다.","ind":22,"bul":true},{"k":"p","html":"<b>수출용 비상규격차:</b> 산지를 알 수 없는 수출용 차다. 과거 대만·홍콩 사람들의 기호에 맞춰 이무차 위주로 수출했다. (고산보이차특급은 내표가 없음)","ind":22,"bul":true},{"k":"h3","text":"4. 원료 산지 및 풍미적 특징"},{"k":"p","html":"<b>산지 및 고도:</b> 2003년 당시 대익은 해발고도를 중시하여 남나산과 유락산 찻잎을 주로 사용했다.","ind":22,"bul":true},{"k":"p","html":"<b>풍미 변화:</b> 외부에서 사온 찻잎이 많이 섞일수록 떫은맛이 강해진다.","ind":22,"bul":true},{"k":"p","html":"<b>연미:</b> 예전에는 차에 연미(연기 향)가 배어 있어야 고급차로 평가받았다.","ind":22,"bul":true},{"k":"p","html":"<b>반산생태차:</b> 산지 구분이 명확하지 않고 일과수보다는 풍미가 떨어지나, 나쁘지 않은 수준의 차다.","ind":22,"bul":true},{"k":"h2","text":"□ 맹해차창"},{"k":"h3","text":"개요"},{"k":"p","html":"맹해차창은 1939년 운남중국다업공사가 당시의 불해에 실험차창을 설립한 것에서 시작된다. 1940년 정식으로 불해실험차창을 발족하였으나 1941년 태평양전쟁으로 생산이 중단되었고, 신중국 성립 후인 51년부터 소량의 다업 생산을 재개하였다. 54년 운남성공사 서쌍판납차창으로 이름을 바꾸었으며, 56년 사모전구 맹해차창으로 개명한 뒤에는 청모차 등을 광동성차엽공사로 보내어 수출 및 재가공 판매하였다.","ind":0,"bul":false},{"k":"p","html":"1957년부터 설비를 개혁하고 가공능력을 증가한 맹해차창은 새로운 긴압차 신제품을 본격적으로 출시하였다. 73년 악퇴 기술이 개발된 이후 74년에 숙차를 시험 생산하였고, 76년부터는 맥호의 표시가 사용되었다. 이후 숙차의 생산량이 급등하였는데, 1982년에는 1970년부터 사용해 오던 맹해현차창이라는 이름을 맹해차창으로 바꾸었고, 85년에는 홍콩 남천공사의 요청으로 8582와 8592를 처음 생산하였다.","ind":0,"bul":false},{"k":"p","html":"88년 파달과 포랑에 자체 다원을 확보하였고, 89년에는 대익 상표를 정식 등록함으로써 자체 상표를 사용하기 시작하였다. 이후 성공사는 04년 운남박문투자유한공사에 차창을 매각함으로써, 맹해차창은 창립 64년 만에 민영화의 길로 접어든다.","ind":0,"bul":false},{"k":"h3","text":"1. 맹해차창 설립 배경과 초기 (1930년대 ~ 1940년대)"},{"k":"p","html":"<b>1938년:</b> 운남중국차엽무역 고분유한공사(총공사)가 설립되었다. (경제학자가 이사장 취임)","ind":22,"bul":true},{"k":"p","html":"<b>1939년:</b> 운남중국다업공사가 불해(佛海, 맹해의 옛 이름)에 실험차창을 설립했다. 프랑스 유학파 범화균(范和鈞)과 청화대 출신 장식성(張石城)이 파견되었다.","ind":22,"bul":true},{"k":"p","html":"<b>1940년:</b> 불해실험차창이 정식 발족했다. 첫해 생산량은 76톤이었으며, 홍차(90%), 녹차, 긴차 순으로 생산했다. 초기 긴차는 노란 곰팡이(금화)가 피는 발효차 형태였다.","ind":22,"bul":true},{"k":"p","html":"<b>1941년:</b> 태평양전쟁 발발로 일본이 미얀마를 점령하면서 수출길이 막혀 생산이 중단되었다. (이 시기 하관차창에서 후일 쓰일 보이차 도장을 사용하기 시작함)","ind":22,"bul":true},{"k":"p","html":"<b>1942~1943년:</b> 성차사의 철수 명령에 따라 곤명으로 철수했다.","ind":22,"bul":true},{"k":"p","html":"<b>1947~1958년:</b> 생산 설비 확장기이다.","ind":22,"bul":true},{"k":"h3","text":"2. 신중국 성립 후 재건 및 발전 (1950년대 ~ 1960년대)"},{"k":"p","html":"<b>1950~1951년:</b> 신규 인력을 고용하여 맹해차창을 복구하고 재정비하여 소량 생산을 재개했다.","ind":22,"bul":true},{"k":"p","html":"<b>1952년:</b> 홍차 생산을 재개했다.","ind":22,"bul":true},{"k":"p","html":"<b>1954년:</b> 자체적인 긴차 생산 설비를 완성하고 본격 생산에 돌입했다. (&#x27;홍인&#x27; 생산 시작) &#x27;운남성공사 서쌍판납차창&#x27;으로 명칭을 변경했다.","ind":22,"bul":true},{"k":"p","html":"<b>1956년:</b> &#x27;사모전구 맹해차창&#x27;으로 이름을 바꿨다. 청모차 등을 광동성차엽공사로 보내 수출 및 재가공 판매를 진행했다.","ind":22,"bul":true},{"k":"p","html":"<b>1957년:</b> 설비 개혁을 통해 가공 능력을 높이고 새로운 긴압차 신제품을 본격 출시했다.","ind":22,"bul":true},{"k":"p","html":"<b>1959년:</b> 전차, 타차, 긴차 등 다양한 형태의 긴압차를 생산했다.","ind":22,"bul":true},{"k":"h3","text":"3. 기술 혁신과 규격화 (1970년대 ~ 1980년대)"},{"k":"p","html":"<b>1972년:</b> &#x27;중국토산축산 진출구 총공사 운남차엽분공사&#x27;로 상급 기관 명칭이 변경되면서 포장지가 교체되었다.","ind":22,"bul":true},{"k":"p","html":"<b>1973년:</b> 악퇴 기술(숙차 발효 기술)을 개발하고 수출입 권한을 부여받았다.","ind":22,"bul":true},{"k":"p","html":"<b>1974년:</b> 숙차 시험 생산을 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>1976년:</b> 맥호차(코드네임차) 표기를 사용하기 시작했다. 이후 숙차 생산량이 크게 증가했다.","ind":22,"bul":true},{"k":"p","html":"<b>1970년대 이후:</b> 이무 지역 농가들로부터 칠자병차 원료를 납품받기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>1982년:</b> 1970년부터 사용하던 &#x27;맹해현차창&#x27;이라는 이름을 &#x27;맹해차창&#x27;으로 최종 변경했다.","ind":22,"bul":true},{"k":"p","html":"<b>1985년:</b> 홍콩 남천공사의 주문 제작 요청으로 8582와 8592 규격을 첫 생산했다.","ind":22,"bul":true},{"k":"h3","text":"4. 자체 브랜드 확립 및 민영화 (1980년대 후반 ~ 2000년대)"},{"k":"p","html":"<b>1988년:</b> 파달산과 포랑산에 자체 다원을 확보하여 원료 공급망을 강화했다.","ind":22,"bul":true},{"k":"p","html":"<b>1989년:</b> &#x27;대익&#x27; 상표를 정식 등록하고 자체 브랜드를 전면에 내세웠다.","ind":22,"bul":true},{"k":"p","html":"<b>2004년:</b> 성공사가 &#x27;운남박문투자유한공사&#x27;에 차창을 매각하면서, 맹해차창은 창립 64년(1940년 정식 발족 기준) 만에 민영화되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 맥호차 계열의 이해"},{"k":"h3","text":"1. 포장 및 유통의 변화"},{"k":"p","html":"<b>포장의 다양화:</b> 1970년대 초기에는 총공사 포장을 사용했으나, 70년대 후반(중기)부터 기재 정보가 많아지고 포장지가 다양해졌다.","ind":22,"bul":true},{"k":"p","html":"<b>보이차 유통 흐름:</b> 80~90년대 대만 다인들을 거쳐 대만에 처음 보이차가 유통되었다. 그 이전 홍콩에서는 습창으로 익힌 보이차를 따로 찾아 마시지 않고, 일상적인 차로 그냥 마셨다.","ind":22,"bul":true},{"k":"p","html":"<b>홍콩 습창:</b> 당시 홍콩에서는 차의 정체도 모른 채 무작정 차를 사서 습창(고온다습한 환경에 보관)시켰으며, 7542 계열은 명확한 기준조차 없었다.","ind":22,"bul":true},{"k":"p","html":"<b>건창의 가치:</b> 당시에는 건창 보관이 드물었기 때문에, 88청병 같은 건창 차가 매우 특별하게 취급되었고 현재 비싸게 거래된다.","ind":22,"bul":true},{"k":"h3","text":"2. 맹해차창의 내부 변화 (1990년대)"},{"k":"p","html":"<b>조직 변화:</b> 상급 기관의 이름이 차엽분공사에서 차업분공사로 개명되었고, 1994년 주식회사로 체제가 바뀌었다.","ind":22,"bul":true},{"k":"p","html":"<b>주요 인물:</b> 94년에는 운남농대 출신의 최연소 차창 병배사 노국령이 있었고, 98년에는 MBA 출신 완전용(阮殿蓉)이 경영을 맡아 맹해차창을 살려냈다.","ind":22,"bul":true},{"k":"p","html":"<b>품질 저하 시기:</b> 90년대 말은 80년대 후반에 비해 품질이 가장 떨어졌던 시기다. 대백채나 야생수 등이 등장하면서 7542의 상대적 등급이 한 단계 낮아졌다.","ind":22,"bul":true},{"k":"h3","text":"3. [맹해계열 7542] 정창 시절 주요 제품 (민영화 이전)"},{"k":"table","html":"<table><tr><th><div><b>시기</b></div></th><th><div><b>연도</b></div></th><th><div><b>품명</b></div></th><th><div><b>비고</b></div></th></tr><tr><td><div>초기</div></td><td><div>1970년대</div></td><td><div>칠자소녹인</div></td><td></td></tr><tr><td></td><td><div>1970년대</div></td><td><div>칠자소황인</div></td><td></td></tr><tr><td></td><td><div>1970년대(73년)</div></td><td><div>73청병</div></td><td><div>홍콩에서 5년 보관</div></td></tr><tr><td><div>중기~후기</div></td><td><div>1985년</div></td><td><div>후기 7542</div></td><td><div>맛이 좋음</div></td></tr><tr><td></td><td><div>1988~1992년</div></td><td><div>88청병</div></td><td><div>진국의 차예낙원. 건창 보관으로 비싸게 거래됨</div></td></tr><tr><td></td><td><div>1992년</div></td><td><div>92청병</div></td><td></td></tr><tr><td></td><td><div>1993년</div></td><td><div>93청병</div></td><td></td></tr><tr><td></td><td><div>1994년</div></td><td><div>94(업)청병</div></td><td></td></tr><tr><td></td><td><div>1996년</div></td><td><div>매괴자대익</div></td><td><div>최초로 대익 상표 사용 (최초의 자대익 버전)</div></td></tr><tr><td></td><td><div>1997년</div></td><td><div>수지녹인</div></td><td></td></tr><tr><td></td><td><div>1997년</div></td><td><div>수람인</div></td><td><div>물 먹은 색. 홍콩 습창 7542의 거의 마지막 세대</div></td></tr><tr><td></td><td><div>1997~1998년</div></td><td><div>등중록</div></td><td></td></tr><tr><td></td><td><div>1999년</div></td><td><div>구구대도문청병</div></td><td></td></tr><tr><td></td><td><div>2000년</div></td><td><div>무(無)R홍대익</div></td><td></td></tr><tr><td></td><td><div>2001년</div></td><td><div>팔중 간체운 후지</div></td><td><div>두꺼운 종이 사용</div></td></tr><tr><td></td><td><div>2001년</div></td><td><div>팔중 간체운 박지</div></td><td><div>얇은 종이 사용</div></td></tr><tr><td></td><td><div>2003년</div></td><td><div>팔중차자판</div></td><td></td></tr><tr><td></td><td><div>2003년</div></td><td><div>홍대익판</div></td><td></td></tr><tr><td></td><td><div>2004년</div></td><td><div>홍대익간체병</div></td><td></td></tr></table>"},{"k":"h3","text":"4. [대익계열 7542] 민영화 이후 (2004년~)"},{"k":"p","html":"<b>상표 및 포장:</b> 2004년 민영화 이후 &#x27;대익(대익패)&#x27; 상표를 본격적으로 사용했다. 2009년까지는 하얀색 종이(백지)를 포장에 썼다.","ind":22,"bul":true},{"k":"p","html":"<b>시장 상황과 재기:</b> 2007년 보이차 파동으로 차를 사는 사람이 없어져 2년간 암흑기를 겪었다. 이후 2009년 &#x27;보석람&#x27;을 출시하며 재기를 시작했고, 이때 진승 노반장의 부활과 함께 고차수 개념이 뜨기 시작했다.","ind":22,"bul":true},{"k":"h4","text":"민영화 이후 주요 제품"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>품명</b></div></th><th><div><b>비고</b></div></th></tr><tr><td><div>2005년</div></td><td><div>백포조번체병</div></td><td><div>상당히 유명하여 훗날 복각되기도 함</div></td></tr><tr><td><div>2005년</div></td><td><div>백포조간체병 대익(大益)</div></td><td></td></tr><tr><td><div>2009년</div></td><td><div>보석람(寶石藍)</div></td><td><div>남색으로 나온 유일한 제품. 생산량이 크게 증가함</div></td></tr></table>"}]}]);
</script>
<script>window.__TEA_LESSONS=(window.__TEA_LESSONS||[]).concat([{"id":"chr","label":"차의 통합 연대기","blocks":[{"k":"h1","text":"차의 기원과 당(唐)까지"},{"k":"p","html":"차가 약에서 기호 음료로, 다시 문화와 미학의 대상으로 옮겨가는 시기다. 운남은 아직 중원의 변방이었고, 차 문화의 중심은 사천과 중원이었다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>기원전 2737년</div></td><td><div>신농(神農)이 우연히 차의 효능을 발견했다는 신화. 차를 약용 식물로 여기는 인식이 여기서 비롯된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>기원전 206~기원후 220년</div></td><td><div>한(漢) 왕조. 엘리트 계층이 차를 약으로 사용했다는 고고학적 증거가 나온다. 이 무렵 '도(荼)'는 '고(苦)'와 통하는 글자로, 쓴 약초라는 인식이 남아 있었다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>기원전 100년경</div></td><td><div>덕굉 일대에 살던 태족(傣族) 가운데 소나랍이 소수민족 300여 명을 이끌고 임창 방면으로 남하한다. 일부는 란창강 유역에 정착하고, 더 내려간 무리는 경매산에 자리 잡는다. 오늘날 보이차 산지의 주민 구성이 이때 만들어진다.</div><div>· 남하 과정에서 코끼리를 매우 많이 만났다 하여 '백만 마리의 코끼리가 있는 강'이라는 뜻으로 랑창강이라 불렀고(태족어로 100만 = 랑, 코끼리 = 창), 이것이 오늘날의 란창강이다.</div><div class=\"cell-src\">Part.3 1강</div></td></tr><tr><td><div>기원전 53년경</div></td><td><div>중국 차 재배의 기원. 사천성 아안(雅安) 몽정산에서 오리진(吳理眞)이 정상에 일곱 그루를 심었다고 전한다. 야생 차를 따는 데 그치지 않고 사람이 차나무를 길렀다는 최초의 전승으로, 이 차를 신선차 또는 몽정차라 불렀다.</div><div>· 뒷날 송 효종이 오리진에게 '감로보혜선사(甘露普慧禪師)'라는 시호를 내렸다. 자료에 따라 등장하는 '보혜선사'는 사람 이름이 아니라 이 시호에서 온 호칭이다.</div><div class=\"cell-src\">노트 / Part.1</div></td></tr><tr><td><div>225년</div></td><td><div>제갈공명의 남만정벌. 칠종칠금으로 맹획을 굴복시킨다. 이후 고6대 차산에는 '차나무를 공명이 주었다'는 전승이 자리 잡아, 오늘날까지 차산마다 공명을 기리는 사당과 지명이 남아 있다.</div><div class=\"cell-src\">Part.3 3강</div></td></tr><tr><td><div>위·진·남북조</div></td><td><div>차가 약재를 넘어 학자들의 문화적 습관으로 자리 잡는다. 선불교에서 다선일미(茶禪一味) 사상이 확립된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>618~907년</div></td><td><div>당(唐). 차가 기호 음료로 자리 잡고 '차(茶)'라는 글자가 정착한다. 장안에 다관이 등장할 만큼 도시 문화로 퍼진다.</div><div class=\"cell-src\">노트 / Part.3 2강</div></td></tr><tr><td><div>738~902년</div></td><td><div>남조국(南詔國). 서쌍판납 일대는 중원과 별개로 움직였고, 토번과 당 사이에서 외교로 200년 가까이 존속한다.</div><div class=\"cell-src\">Part.3 2강</div></td></tr><tr><td><div>760~780년경</div></td><td><div>육우(陸羽)가 『다경(茶經)』을 저술한다. 찻잎만으로 차를 끓여 본연의 맛을 즐겨야 한다고 주장하며 차를 미학의 대상으로 격상시켰다. 초고는 760년 무렵, 완성과 간행은 780년 전후로 본다.</div><div class=\"cell-src\">노트 / Part.1 3강</div></td></tr><tr><td><div>805년경</div></td><td><div>중국 순례를 마친 불교 승려들이 일본에 차를 소개한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>828년</div></td><td><div>통일신라 흥덕왕 3년, 대렴이 당에서 차 종자를 가져와 지리산에 심는다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>9세기 후반</div></td><td><div>번작(樊綽)의 『만서(蠻書)』. 은생성 일대에서 차가 나지만 제다법도 포다법도 없다고 기록한다. 운남 차에 관한 최초의 기록이자, 당시 운남이 차 문화의 변방이었음을 보여주는 자료다.</div><div class=\"cell-src\">Part.3 2강</div></td></tr></table>"},{"k":"h1","text":"송·원 (960~1368)"},{"k":"p","html":"중원에서는 점다법이 꽃피지만 운남은 여전히 별개의 세계였다. 원의 정복으로 운남이 처음 중원 왕조의 직접 지배에 들어가고, 오늘날 고차수의 나이를 거슬러 올라가면 닿는 시기이기도 하다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>937~1253년</div></td><td><div>대리국(大理國). 남조국이 무너진 뒤 단사평이 세운 나라로 대리를 수도로 삼았다. 불교를 크게 숭상해 묘향불국(妙香佛國)이라 불렸고, 송과는 직접 지배가 아닌 조공·교역 관계를 유지하며 말과 차를 교환했다. 1253년 쿠빌라이의 원정으로 멸망한다.</div><div class=\"cell-src\">Part.3 2강</div></td></tr><tr><td><div>960~1279년</div></td><td><div>송(宋). 중국 차 문화의 황금기로 점다법(말차)이 유행한다. 훗날 일본 말차 문화의 기원이 된다. 범성대의 『계해우형지』, 이석의 『속박물지』에 말과 차를 교환한 기록이 남지만, 운남 차에 관한 서술은 『만서』 수준에서 크게 나아가지 않았다.</div><div class=\"cell-src\">노트 / Part.3 2강</div></td></tr><tr><td><div>북송</div></td><td><div>자사니를 이용한 차기(茶器)가 처음 등장한 것으로 추정된다. 자사호 역사의 출발점이다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>11세기</div></td><td><div>운남에서 티베트로 차를 실어 나르는 차마고도가 형성된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1180년경</div></td><td><div>태족이 경홍 일대에 맹륵(勐泐)왕국을 세운다. 훗날 &#x27;서쌍판납&#x27;이라는 지명이 이 나라에서 갈라져 나온다.</div><div class=\"cell-src\">Part.3 1·2강</div></td></tr><tr><td><div>1191년</div></td><td><div>일본 승려 에이사이가 일본에 처음으로 차나무 씨앗을 도입한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>13세기</div></td><td><div>운남에 살던 소수민족들이 아쌈 지방으로 진출하며 차를 전한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1271~1368년</div></td><td><div>원(元). 대리국이 무너진 이듬해 운남이 원에 편입되면서, 역사상 처음으로 중원 왕조의 직접 행정 지배(운남행성) 안에 들어간다. 선위사가 설치되지만 차에 관한 특별한 기록은 남지 않았다.</div><div class=\"cell-src\">Part.3 2강</div></td></tr><tr><td><div>1200~1300년</div></td><td><div>원 초기. 고6대 차산에 차나무를 심었다고 추정되는 시기다. 오늘날 가장 나이 많은 차나무를 800년으로 보는 계산이 여기서 나온다.</div><div class=\"cell-src\">Part.3 1강</div></td></tr></table>"},{"k":"h1","text":"명(明) (1368~1644)"},{"k":"p","html":"홍무제의 칙령 하나가 중국 차의 형태를 병차에서 잎차로 바꿔놓는다. 운남에는 석병 한족이 들어와 차산을 개발하기 시작하고, 의흥에서는 자사호가 태어난다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>1368년</div></td><td><div>명(明) 건국. 원이 망한 뒤 한족이 운남으로 들어와 석병(石屛)에 정착한다. 이들이 뒷날 고6대 차산 개발과 차 무역의 주역이 된다.</div><div class=\"cell-src\">Part.3 1강</div></td></tr><tr><td><div>1391년</div></td><td><div>홍무제가 병차 제작과 조공을 금지하는 칙령을 내린다. 이후 잎차(산차)가 유통되고 포다법이 대중화되며, 홍차·황차·흑차가 출현하는 계기가 된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1400년대</div></td><td><div>빙도 일대를 지배하던 태족이 이무 지역에서 200년 수령의 나무 천 그루를 옮겨 심는다. 본래 있던 대설산야생군체종과 이무대엽종이 유성생식하면서 빙도노채 특유의 품종이 만들어진다.</div><div class=\"cell-src\">Part.2 2·3강</div></td></tr><tr><td><div>1400~1500년경</div></td><td><div>북쪽에서 애니족(하니족의 분파)이 노반장에 흘러들어와 포랑족과 함께 산다. 이후 포랑족은 노만아로 돌아가고 노반장에는 애니족이 남는다.</div><div class=\"cell-src\">Part.2 4·5강</div></td></tr><tr><td><div>1506~1521년</div></td><td><div>명 무종 정덕 연간. 자사를 이용한 차호 제작이 본격적으로 시작된다. 공춘(供春)이 처음 만들었다고 전한다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1533년</div></td><td><div>남경 오경(吳經)의 묘에 부장된 제량호. 연대가 명확히 확인되는 가장 오래된 자사기다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1570년</div></td><td><div>맹륵왕국이 세금을 효율적으로 걷기 위해 영토를 12개 행정구역으로 나눈다. 태족어로 &#x27;십송(서쌍)&#x27;은 12, &#x27;판납&#x27;은 행정구역 단위를 뜻하니, 곧 &#x27;12개의 판납&#x27;이라는 뜻의 서쌍판납이라는 지명이 여기서 생긴다.</div><div class=\"cell-src\">Part.3 1·2강</div></td></tr><tr><td><div>1573~1648년</div></td><td><div>시대빈(時大彬)의 생몰. 명말 4대가(동한·조량·원창·시붕) 가운데 시붕의 아들로, 자사호 제작 기법을 집대성하고 예술의 경지로 끌어올린 인물로 평가받는다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1590년경</div></td><td><div>푸젠성에서 홍차가 개발된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1600년 12월 31일</div></td><td><div>영국 엘리자베스 1세가 동인도회사에 칙허를 내린다. 1599년 9월 런던 상인들이 모여 청원했고, 회사가 법적으로 선 것은 이날이다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1600년대 (명말청초)</div></td><td><div>고6대 차산에 이미 차 시장이 형성되어 상인들이 들어와 차를 수매한다. 석병의 한족들이 의방으로 들어와 자리를 잡는다.</div><div class=\"cell-src\">Part.3 1·3강</div></td></tr><tr><td><div>1602년</div></td><td><div>네덜란드 동인도회사(VOC) 설립. 외교권과 군사권을 가진 역사상 최초의 주식회사였다.</div><div class=\"cell-src\">노트 / Part.6 2강</div></td></tr><tr><td><div>1610년</div></td><td><div>네덜란드 동인도회사를 통해 일본의 차와 무이산의 차가 암스테르담으로 처음 수입된다. 유럽에 차가 들어온 시작이다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1640년경</div></td><td><div>주고기(周高起)의 『양선명호계(陽羨茗壺系)』. 자사에 관한 최초의 기록이다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1644년</div></td><td><div>이자성이 북경을 함락하고 숭정제가 자결하며 명이 멸망한다. 오삼계가 산해관을 열어 청군을 들인다.</div><div class=\"cell-src\">Part.3 4·5강</div></td></tr></table>"},{"k":"h1","text":"청 전기·중기 (1644~1800)"},{"k":"p","html":"개토귀류로 차산의 지배 구조가 뒤집히고, 보이부 설치와 함께 보이차가 공차(貢茶)의 반열에 오른다. 칠자병차의 규격도 이때 법으로 정해졌다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>1636~1912년</div></td><td><div>청(淸). 운남의 차는 보이시에서 집산되어 두 갈래로 나갔다. 곤명을 거쳐 북경으로 가는 길이 관마대도, 대리를 거쳐 히말라야로 가는 길이 차마고도다.</div><div>· &#x27;차마고도&#x27;라는 명칭 자체는 1990년대에 붙여진 것으로, 당대에 쓰이던 이름은 아니다.</div><div class=\"cell-src\">Part.1 1·2강 / Part.3</div></td></tr><tr><td><div>1657년</div></td><td><div>런던의 커피하우스에서 최초로 중국차가 판매된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1662년</div></td><td><div>영국 찰스 2세가 포르투갈 공주 캐서린 브라간자를 왕비로 맞이하면서 영국 왕실에 차 문화가 유행한다. 같은 해 미얀마로 피신했던 남명의 마지막 황제 영력제가 오삼계에게 붙잡혀 처형된다. 명의 마지막 사대부들이 운남까지 도망쳤고, 황족 한 명이 만송에 숨어들었다는 이야기가 여기서 나온다.</div><div class=\"cell-src\">노트 / Part.3 4·5강</div></td></tr><tr><td><div>청 초기</div></td><td><div>혜맹신(惠孟臣). 공부차용 주니 소호의 대명사로, &#x27;형계혜맹신제(荊溪惠孟臣製)&#x27; 낙관이 찍힌 호가 지금까지 명성을 누린다. 진하게 우려 마시는 공부차 문화에 맞는 작은 자사호의 시대를 열었다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1722~1735년</div></td><td><div>옹정제 재위. 개토귀류(改土歸流)를 실행해 현지 지배자(토사·토관)의 권력을 중앙이 파견한 관리(류관)에게 넘긴다. 차산의 지배 구조가 원주민에서 한족 중심으로 바뀌며 차 산업 전체에 큰 영향을 준다.</div><div class=\"cell-src\">Part.3 2강</div></td></tr><tr><td><div>1728년경</div></td><td><div>망지차산 우곤당에서 강서성(경덕진) 출신 한족 상인이 망지 토관의 부인과 얽힌 일로 목이 베인다. 한족 상인들의 항의를 빌미로 청이 토벌군을 내려보내고, 2년에 걸친 전쟁 끝에 토사 세력이 궤멸한다. 청은 유락동지(攸樂同知) 관청을 세우고 류관을 파견한다.</div><div class=\"cell-src\">Part.3 2강</div></td></tr><tr><td><div>1729년 (옹정 7년)</div></td><td><div>보이부(普洱府) 설치. 차에 대한 국가 차원의 과세가 본격화되고 공차 제도가 시행되면서 보이차의 위상이 크게 높아진다. 황실에 올리던 최상급 공차는 긴압하지 않은 산차(散茶) 형태의 고급 잎차였을 것으로 추정된다.</div><div>· &#x27;선유우곤당 후유보이부(先有牛滾塘 後有普洱府)&#x27;는 우곤당의 번성과 그곳에서 터진 사건이 먼저 있었고 그 결과로 보이부가 서게 되었다는 뜻이다.</div><div class=\"cell-src\">Part.3 2강 / Part.6 1강</div></td></tr><tr><td><div>1735년 (옹정 13년)</div></td><td><div>청 차법이 병차 7개를 대나무 껍질로 묶어 한 통(筒)으로 포장하도록 규정한다. 칠자병차(七子餅茶)라는 이름과 오늘날의 357g·2.5kg·30kg 규격 관행이 여기서 비롯된다.</div><div class=\"cell-src\">Part.3 2강</div></td></tr><tr><td><div>1735년경</div></td><td><div>개토귀류의 수정. 파견 관리들의 부패와 폭정으로 통치가 불가능해지자 유락동지를 철수하고, 토관에게 다시 유락 지역을 맡기되 차는 보이부로 가져오게 한다. 토벌 때 군대에 길을 안내했던 조당제(曹當齋)가 토천총(土千總)의 지위를 받아 차산을 다스리게 된다.</div><div class=\"cell-src\">Part.3 2강 / 4·5강</div></td></tr><tr><td><div>1700년대</div></td><td><div>자사 주니 제호 기법이 완성되고 배합·병배 기법도 함께 자리를 잡는다. 자사호의 미적 완성도가 가장 뛰어난 시기는 1800년대 이전으로 평가받는다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1753년</div></td><td><div>칼 폰 린네가 『식물의 종』 초판에서 차나무를 Thea sinensis로 명명한다. &#x27;중국에서 차로 마시는 나무&#x27;라는 뜻이다.</div><div class=\"cell-src\">Part.2 1·2강</div></td></tr><tr><td><div>1773년</div></td><td><div>보스턴 차 사건. 영국의 높은 관세율에 저항하는 운동이 미국 독립 전쟁을 촉발한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1700년대 후반</div></td><td><div>무역 적자가 심화되자 영국이 중국에 아편을 밀매하기 시작한다. 뒷날 아편전쟁으로 이어지는 씨앗이다.</div><div class=\"cell-src\">노트</div></td></tr></table>"},{"k":"h1","text":"청 후기 (1800~1911)"},{"k":"p","html":"의방의 전성기와 몰락, 그리고 두문수의 난. 북방 유통로가 끊기자 차는 남쪽 홍콩으로 향했고, 그 긴 뱃길이 뜻하지 않게 숙차를 낳는다. 같은 시기 영국은 중국의 차 독점을 깨뜨렸다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>1800년대 전반</div></td><td><div>조당제의 치세로 의방이 고6대 차산의 경제와 무역을 이끌며 최전성기를 맞는다. 도로 양옆으로 1,000가구가 빽빽하게 들어섰고, 조당제가 60세 되던 해에는 각 차산 대표들이 '육산일로(六山一老)' 현판을 달아주었다. 청 황실은 이족 출신인 그의 부인에게 '엽(葉)'이라는 한족 성씨를 하사했다.</div><div class=\"cell-src\">Part.3 4·5강</div></td></tr><tr><td><div>1823년</div></td><td><div>로버트 브루스가 아쌈에서 야생 차나무를 확인한다. 훗날 인도 기원설의 근거가 되며, 중국이 차 종주국의 위상을 두고 반박에 나서는 계기가 된다.</div><div class=\"cell-src\">Part.2</div></td></tr><tr><td><div>1825년경</div></td><td><div>완복(阮福)의 『보이차기(普洱茶記)』. 청대 보이차의 채엽 시기와 등급을 기록한 문헌으로, 당시 차의 분류와 위상을 알려주는 핵심 자료다.</div><div class=\"cell-src\">Part.3 2강 / Part.6 1강</div></td></tr><tr><td><div>1827년</div></td><td><div>인도네시아에서 네덜란드인들에 의해 차 경작이 시작된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1830년경</div></td><td><div>영국에서 얼그레이 제법이 만들어진다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1839년경 (도광 연간)</div></td><td><div>차순래(車順來)가 이무에 차순호(車順號)를 설립한다. 도광제로부터 '서공천조(瑞貢天朝)' 현판을 하사받아 명가로 이름을 알린다. 상서로울 서(瑞)·공물 공(貢)·천조(天朝), 곧 '상서로운 공물을 황제에게 바친 곳'이라는 뜻이다.</div><div>· 석병 한족의 운남 이주는 원말명초의 일이지만, 차순호라는 상호가 선 것은 이때다. 이주와 창업은 400년 넘게 벌어진 별개의 사건이다.</div><div class=\"cell-src\">Part.3 1강</div></td></tr><tr><td><div>1839~1842년</div></td><td><div>제1차 아편전쟁. 1842년 난징조약으로 홍콩섬이 영국에 할양되면서 홍콩이 국제 무역항으로 발돋움한다. 훗날 보이차 유통의 중심지가 되는 출발점이다.</div><div class=\"cell-src\">노트 / Part.6 2강</div></td></tr><tr><td><div>1839년</div></td><td><div>인도 아삼에서 생산된 첫 번째 차가 런던에서 판매된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1848~1851년</div></td><td><div>영국이 식물학자 로버트 포춘을 중국에 파견한다. 그는 중국인으로 위장한 채 안휘성 등 내륙 차 산지에 잠입해 차나무 수만 그루와 제다 기술자 8명을 빼냈고, 이것이 인도와 실론의 대규모 차 재배 성공으로 이어진다. 중국의 차 독점이 무너지는 결정적 사건이다.</div><div class=\"cell-src\">노트 / Part.6 2강</div></td></tr><tr><td><div>1856~1873년</div></td><td><div>운남에서 회족의 난(두문수의 난). 두문수가 대리에서 봉기해 정권을 세우고 17년 넘게 이어진다. 차마고도와 관마대도가 모두 끊기면서 운남 차 산업이 큰 타격을 입고, 의방의 다원은 전란과 전염병으로 황폐해진다.</div><div>· 한족과 회족의 충돌은 1855년 전후로 이어졌으나, 두문수가 봉기해 대리에 정권을 세운 것은 1856년이고 진압은 1873년이다.</div><div class=\"cell-src\">노트 / Part.1 1·2강 / Part.3 1강</div></td></tr><tr><td><div>1856~1860년</div></td><td><div>제2차 아편전쟁.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1800년대 중후반</div></td><td><div>차 무역의 중심이 의방에서 가장 남쪽의 이무로 옮겨간다. 북방 유통로가 막히자 라오스·베트남을 거쳐 홍콩으로 나가는 남방 유통로가 열렸고, 이무는 차순호·동경호·송빙호 같은 호급차 상호들이 번성하는 무대가 된다.</div><div class=\"cell-src\">Part.3 4·5강</div></td></tr><tr><td><div>1800년대 후반</div></td><td><div>새 수출로를 뚫은 차 상인들이 베트남을 거쳐 홍콩으로 향한다. 덥고 습한 기후 속에 8개월을 운반된 생차가 미생물 발효되어 '익은 맛'이 되었고, 이것이 숙차의 시작이 된다. 같은 시기 회족의 반란을 계기로 란창강 서쪽 지역이 개발되기 시작해 훗날 신육대차산으로 불린다.</div><div class=\"cell-src\">Part.1 1·2강 / 노트</div></td></tr><tr><td><div>1859년</div></td><td><div>인도 다즐링 지역에서 차 산업이 태동한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1860년대</div></td><td><div>스리랑카에서 커피 녹병으로 커피 농장이 무너지자 그 자리에 홍차 산업이 들어선다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1868년</div></td><td><div>일본 시즈오카에서 차의 첫 경작이 시작된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1886년</div></td><td><div>중국 차의 생산이 감소하기 시작하고, 영국은 중국보다 식민지에서 차를 더 많이 수입하게 된다. 로버트 포춘 이후 40년 만에 판도가 완전히 뒤집혔다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1887년</div></td><td><div>오토 쿤츠가 차나무와 동백나무속의 유전적 유사성을 밝혀 Camellia sinensis (L.) Kuntze로 재분류한다. 오늘날 쓰이는 학명이다.</div><div class=\"cell-src\">Part.2 1·2강</div></td></tr><tr><td><div>1903년</div></td><td><div>케냐에서 차 재배가 시작된다. 같은 해 위스콘신주에서 개방형 메쉬 찻잎 홀더가 발명된다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1904년 이전</div></td><td><div>빙도노채는 순수한 태족의 마을이었다.</div><div class=\"cell-src\">Part.2 2·3강</div></td></tr><tr><td><div>1908년경</div></td><td><div>토머스 설리번이 티백을 발명한다. 견본을 담아 보낸 비단 주머니를 손님들이 그대로 우려 마신 데서 비롯되었다는 일화가 전한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1910년 전후</div></td><td><div>골동보이차의 시작. 현존하는 가장 오래된 보이차 실물이 이 무렵 생산되어 홍콩 등지에서 유통된 것으로 알려져 있다. 1911년의 송빙호는 경매에 나오는 가장 오래된 차로 이무차창의 것이다.</div><div class=\"cell-src\">Part.1 4강 / Part.3 4·5강</div></td></tr></table>"},{"k":"h1","text":"민국 시기 (1911~1949)"},{"k":"p","html":"전쟁이 차 산업의 배경이 된다. 중일전쟁의 군비를 마련하기 위해 국가가 차 수출에 나서면서, 오늘날 보이차의 뼈대가 되는 국영차창들이 이 시기에 세워졌다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>1911~1949년</div></td><td><div>민국 시대. 1911년 신해혁명으로 청이 망하고 1912년 중화민국이 건국된다. 사천성 철도 반란과 군벌 간 충돌이 잦았고, 북벌 완수 이후에는 이념 전쟁(국공내전)으로 이어진다.</div><div>· 자료에 따라 '1912년에 신중국이 섰다'고 적힌 경우가 있으나, 1912년에 선 것은 중화민국이고 중화인민공화국 수립은 1949년이다.</div><div class=\"cell-src\">Part.6 부록 / Part.1</div></td></tr><tr><td><div>1912년</div></td><td><div>청이 망한 시점에 운남에는 이미 긴차가 있었다. 표고버섯 모양(심장형)과 손잡이가 달린 마고차 형태다. 같은 시기 고육대차산이 이무를 중심으로 차를 생산하고 있었다.</div><div class=\"cell-src\">Part.6 2강</div></td></tr><tr><td><div>1914년</div></td><td><div>민국박람회. 일본에서 새로운 차 제법을 배워온다.</div></td></tr><tr><td><div>1916년</div></td><td><div>홍차가 오늘날의 형태로 자리 잡는다.</div></td></tr><tr><td><div>1919년</div></td><td><div>오각농(吳覺農)이 다시 유학길에 오르고 차업실습소를 세운다. 중국 근대 차학의 개척자로, 뒷날 중국 차 산업의 체계를 세운 인물이다.</div></td></tr><tr><td><div>1920년경</div></td><td><div>일본에서 반차를 불에 볶아 호우지차를 개발한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1923년</div></td><td><div>제1차업 시험장을 남나산에 선정한다. 천가채는 너무 멀어 맹해에서 가까운 남나산을 택했다.</div></td></tr><tr><td><div>1929년</div></td><td><div>시용제(市用制) 시행으로 1근 = 500g이 공식 제정된다. 이 도량형이 이후 차의 중량 산정과 세금 징수의 근간이 된다.</div><div class=\"cell-src\">Part.6 1강</div></td></tr><tr><td><div>1930년경</div></td><td><div>인도에서 영국이 CTC 가공 방식을 개발해 홍차 대규모 생산의 길이 열린다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1930년대</div></td><td><div>이무 차인들의 라오스·베트남·홍콩 유통이 금지되면서 이무의 차창들이 거의 무너진다. 같은 시기 제갈공명이 심었다고 전해지던 혁등차산의 차왕수가 고사해, 지금은 터와 비석만 남아 있다.</div><div class=\"cell-src\">Part.3 1강 / 4·5강</div></td></tr><tr><td><div>1937년</div></td><td><div>운남차 전체 생산량이 20만 담(擔, 1담 = 50kg)에 이른다. 민국 시대 운남에서 차가 가장 많이 생산된 해다. 같은 해 중일전쟁이 발발하면서, 차 수출로 군비를 마련하고 일본의 공격을 피해 운남에 공장을 세운다는 국가적 결정이 내려진다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1938년</div></td><td><div>운남중국차엽무역 고분유한공사(성차사) 설립. 경제학자가 이사장으로 취임한다. 이후 운남 국영 차 산업 전체를 관할하는 상급 기관이 된다.</div><div class=\"cell-src\">Part.6 부록 / 노트</div></td></tr><tr><td><div>1939년</div></td><td><div>운남중국다업공사가 불해(佛海, 오늘날의 맹해)에 실험차창을 설립한다. 최초의 국영차창이자 맹해차창의 시작이다. 프랑스 유학파 범화균(范和鈞)과 청화대 출신 장식성(張石城)이 파견되었다.</div><div>· 같은 해 차 전매제가 실시되면서 이무 쪽 유통로가 끊긴다. 중일전쟁의 여파다.</div><div class=\"cell-src\">Part.6 부록 / Part.3 1강</div></td></tr><tr><td><div>1940년</div></td><td><div>불해실험차창 정식 발족. 첫해 생산량은 76톤이었고 홍차가 90%를 차지했으며 녹차·긴차가 뒤를 이었다. 초기 긴차는 노란 곰팡이(금화)가 피는 발효차 형태였다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1941년</div></td><td><div>태평양전쟁 발발로 일본이 미얀마를 점령하면서 수출길이 막혀 생산이 중단된다. 같은 해 대리시 하관에 강장차창(康藏茶廠)이 설립된다. 하관차창의 전신으로, 티베트와 쓰촨으로 갈 타차를 생산하고 보염패를 상표로 썼다.</div><div class=\"cell-src\">Part.6 부록 / 노트</div></td></tr><tr><td><div>1942~1943년</div></td><td><div>성차사의 철수 명령에 따라 곤명으로 철수한다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1945년</div></td><td><div>일본 패망. 중국은 곧바로 국공내전에 들어간다.</div></td></tr><tr><td><div>1947~1958년</div></td><td><div>맹해차창 생산설비 확장기.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>민국 시기</div></td><td><div>민국녹니 등장. 단니에 코발트 계열 청화안료를 첨가한 조배니로, 원광에 인공 색료를 더하는 방식의 시작이다.</div><div class=\"cell-src\">Part.4 6강</div></td></tr></table>"},{"k":"h1","text":"공산중국과 국영차창의 시대 (1949~1990년대 초)"},{"k":"p","html":"모든 차창이 국영으로 재편되고 팔중패라는 공통 상표 아래 묶인다. 1973년 악퇴 기술의 개발로 숙차가 태어나면서, 수십 년을 기다려야 했던 &#x27;익은 차&#x27;를 몇 달 만에 만들 수 있게 되었다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>1949년 10월 1일</div></td><td><div>중화인민공화국 수립. 국공내전에서 공산당이 이기고 국민당은 대만으로 물러난다. 이 시기를 기점으로 차 유통의 주도권이 홍콩으로 넘어간다.</div><div class=\"cell-src\">Part.6 부록 / Part.6 2강</div></td></tr><tr><td><div>1950~1951년</div></td><td><div>맹해차창이 신규 인력을 고용해 복구·재정비하고 소량 생산을 재개한다. 민간 차장들이 통폐합되며 국가 주도의 국영 차창 체제가 자리 잡는다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1952년</div></td><td><div>팔중패(八中牌)가 공통 상표로 당선된다. 중(中) 자 8개를 두른 도안으로 국영차창의 품질을 보증하는 상징이 되었고, 가운데 차(茶) 자의 색에 따라 붉으면 홍인, 녹색이면 녹인으로 불린다. 같은 해 맹해차창이 홍차 생산을 재개하고, 자사 산업도 국가 주도의 자사창 체제로 재편된다.</div><div class=\"cell-src\">노트 / Part.6 부록 / Part.4 7강</div></td></tr><tr><td><div>1954년</div></td><td><div>맹해차창이 자체 긴차 생산 설비를 완성하고 본격 생산에 들어간다. '홍인' 생산이 시작된 해이며, 이름을 운남성공사 서쌍판납차창으로 바꾼다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1955년</div></td><td><div>하관차창이 긴차 형태를 전차(磚茶) 형태로 바꾼다. 모양으로 치면 초코송이에서 벽돌로 바뀐 셈으로, 이 때문에 70년대 하관 긴차는 존재할 수 없다. 같은 해 홍군 출신 노병들이 국영여명농장을 설립하며 여명차창이 시작된다.</div><div class=\"cell-src\">Part.3 3강 / 노트</div></td></tr><tr><td><div>1956년</div></td><td><div>'사모전구 맹해차창'으로 개명. 청모차 등을 광동성차엽공사로 보내 수출·재가공 판매를 진행한다. 자사 쪽에서는 공사합영이 이루어진다.</div><div class=\"cell-src\">Part.6 부록 / Part.4 7강</div></td></tr><tr><td><div>1957년</div></td><td><div>맹해차창이 설비를 개혁해 가공 능력을 높이고 새 긴압차 신제품을 본격 출시한다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1958년</div></td><td><div>자사공예창이 자사1창으로 정식 명칭을 변경한다. 고경주·주가심 등 민국 시기 명인들을 기술원으로 초빙해 후대를 양성했고, 흙의 품질과 제작 실력이 모두 뛰어났던 시기로 평가받는다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1959년</div></td><td><div>맹해차창이 전차·타차·긴차 등 다양한 형태의 긴압차를 생산한다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1960년대</div></td><td><div>중국이 차 종주국의 위상을 되찾기 위해 1000~1500살 차나무를 발표하며 중국기원설이 힘을 얻는다. 1823년 아쌈 발견 이후 이어진 기원 논쟁에 대한 대응이었다.</div><div class=\"cell-src\">Part.2 1·2강</div></td></tr><tr><td><div>1966~1976년</div></td><td><div>문화대혁명. 자사1창도 침체기를 겪지만, 소량 생산된 소호는 품질이 매우 우수했던 것으로 평가받는다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1972년</div></td><td><div>상급 기관이 '중국토산축산 진출구 총공사 운남차엽분공사
