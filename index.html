루 분량의 찻잎이 나온다.","ind":22,"bul":true},{"k":"p","html":"<b>단주차(單株茶):</b> 수령 300년 이상의 차나무다. 오직 한 그루의 나무에서 채엽한 잎으로만 차를 만든다. 이처럼 단독 제다가 가능하려면 나무 덩치가 충분히 커야 하므로 최소 300년 이상의 수령이 요구된다.","ind":22,"bul":true},{"k":"p","html":"<b>차왕수(茶王樹):</b> 수령 600년 이상이거나, 해당 마을에서 가장 나이가 많고 상징적인 차나무를 뜻한다.","ind":22,"bul":true},{"k":"h3","text":"2. 환경에 따른 구분"},{"k":"p","html":"<b>원시고차림(原始古茶林):</b> 밀림 형태를 유지하고 있는 다원이다. 주로 3세대 야생 차나무로 이루어져 있으며, 주변 식생 속에서 햇빛을 받기 위해 차나무의 키(수고)가 높게 자라는 고간(高杆) 형태를 띤다.","ind":22,"bul":true},{"k":"p","html":"<b>야화고차원(野化古茶園):</b> 인위적으로 조성되었다가 다시 야생화된 다원이다. 과거 사람이 유성생식(씨앗 발아)으로 조성하고 관리하다가 떠난 곳으로, 5세대 재배형 고차수가 자란다. 차 업계에서 흔히 말하는 '국유림'이 주로 이에 해당하며, 박하당(薄荷塘) 다원이 대표적이다.","ind":22,"bul":true},{"k":"p","html":"<b>원생태고차원(原生態古茶園):</b> 조성 이래 사람들이 마을을 떠나지 않고 지속적으로 관리해 온 100년 이상의 다원이다. 본래 차나무가 자연적으로 존재하던 지역을 바탕으로 하며, 빙도(冰島)가 대표적인 예다.","ind":22,"bul":true},{"k":"p","html":"<b>정가채(丁家寨):</b> 정가채 주변에 원생태 고차원이 존재한다. 정가채 마을이 관리하는 구역 중 '백차원(百茶園)'이라는 세부 다원 이름이 붙을 경우 프리미엄이 더해져 더 비싸게 판매된다.","ind":40,"bul":true},{"k":"p","html":"<b>현대차원(現代茶園):</b> 생산량을 높이기 위해 계단식 등 인위적으로 조성한 현대식 인공 다원이다. 촘촘하게 심는 밀식 재배와 꺾꽂이(무성생식) 방식이 특징이다.","ind":22,"bul":true},{"k":"p","html":"<b>이무 마흑(易武 麻黑):</b> 이 지역에는 위에서 언급한 원생태 고차원과 함께, 인위적으로 조성된 현대 밀식 차원이 공존한다.","ind":40,"bul":true},{"k":"h2","text":"□ 순료와 병배의 개념"},{"k":"p","html":"순료는 병배에서 파생된 개념이다. 병배(blended tea)가 아닌 차를 순료(single tea)라고 지칭한다. 그러나 엄격한 의미의 순료는 단주차뿐이고, 지역·계절·수령감이 비슷하면 '순료'라고 사용한다. 병배에는 ① 지역병배 ② 수령병배 ③ 품종병배(대엽종+중소엽종) ④ 계절병배 ⑤ 연수병배(작년차+올해차) ⑥ 제대병배(반생반숙)가 있다. 개량종 밭차는 지역색의 의미가 없다.","ind":0,"bul":false},{"k":"note","html":"※ Part.6 부록 「맹해정창 특강」의 “대익차는 병배차”, “처음부터 병배를 목표로 차를 만들기 시작했다”와 연관."},{"k":"h2","text":"□ 아포차와 황편차"},{"k":"p","html":"제대로 된 차를 만드는 재료가 아닌 부수산물이라 찻잎 물질이 없다. 폴리페놀의 아기자기한 맛이 아니라 뭉근한 단맛이 난다.","ind":0,"bul":false},{"k":"p","html":"<b>아포차:</b> 껍질로 감싸진 싹으로 만든 차다. 고차수에서 싹을 미리 잘라내면 그해 농사를 망칠 위험이 크기 때문에, 주로 일반 밭차나 3세대 야생 차나무의 싹을 채엽하여 만든다.","ind":22,"bul":true},{"k":"p","html":"<b>황편차:</b> 크게 두 가지 경우를 뜻한다.","ind":22,"bul":true},{"k":"p","html":"첫째, 새로 난 찻잎이 크게 자란 성엽(노엽)으로 만든 차다. 보통 일아삼사엽(一芽三四葉)을 꺾어 기존의 차를 만들고, 그 아래쪽에 남은 오엽쯤 되는 거친 잎을 모아 만든다.","ind":40,"bul":true},{"k":"p","html":"둘째, 찻잎을 덖는 살청 공정 중에 솥 바닥에 눌어붙은 잎들을 따로 모아서 만든 차를 의미하기도 한다.","ind":40,"bul":true},{"k":"note","html":"※ Part.3 2강 복습 Quiz 4(황편차의 당뇨에 대한 효능)와 연관."},{"k":"h1","text":"2 & 3강"},{"k":"p","html":"차산 각론의 첫 시간으로, 박하당·노반장과 함께 고수차 시장에서 큰 이슈가 되고 있는 지역인 임창 차구의 빙도촌에 관하여 배워본다.","ind":0,"bul":false},{"k":"h2","text":"□ 임창 차구 개설"},{"k":"p","html":"임창의 3대 차구는 쌍강맹고차구, 영덕·대설산차구, 봉경·운현차구로서, 빙도나 석귀 등을 비롯한 임창 경내의 품질이 뛰어나고 유명한 차산들은 모두 이 3개의 지역 차구에 속한다.","ind":0,"bul":false},{"k":"h2","text":"□ 빙도 고수차의 등장"},{"k":"p","html":"빙도노채의 차가 보이차 시장에 갑작스럽게 등장한 것은 2009년의 일이다(노반장이 뜰 때 같이 뜸). 2012년에 대수차 1kg의 가격은 2,800위안 선으로 올랐고, 14년에는 1kg당 1만 위안 이상으로 치솟았다. 15~16년 사이 보이차 시장은 불황을 맞이하였으나 빙도 선엽의 가격은 전혀 영향을 받지 않았고, 이후에도 매년 10~33% 정도 수직 상승하고 있는 추세이다. 노채 외에 인접한 4개의 마을이 빙도5채로 편입되었으며, 현재는 소호채를 비롯한 주변 지역 모두가 유명세를 타고 있다.","ind":0,"bul":false},{"k":"h2","text":"□ 빙도노채의 모차 가격 추이"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>가격</b></div></th><th><div><b>비고</b></div></th></tr><tr><td><div>2004년</div></td><td><div>38위안/공근(元/公斤)</div></td><td></td></tr><tr><td><div>2007년</div></td><td><div>360위안/공근(元/公斤)</div></td><td></td></tr><tr><td><div>2009년</div></td><td><div>180위안/공근(元/公斤)</div></td><td><div>고수(古樹)</div></td></tr><tr><td><div>2011년</div></td><td><div>1,500~1,800위안/공근(元/公斤)</div></td><td><div>고수(古樹)</div></td></tr><tr><td><div>2013년</div></td><td><div>8,000위안/공근(元/公斤)</div></td><td><div>고수(古樹)</div></td></tr><tr><td><div>2014년</div></td><td><div>18,000~20,000위안/공근(元/公斤)</div></td><td><div>고수(古樹)</div></td></tr><tr><td><div>2017년</div></td><td><div>30,000~50,000위안/공근(元/公斤)</div></td><td><div>고수(古樹)</div></td></tr><tr><td><div>2019년</div></td><td><div>40,000~70,000위안/공근(元/公斤)</div></td><td><div>고수(古樹)</div></td></tr></table>"},{"k":"p","html":"위 가격은 완성된 건차(말린 찻잎) 1kg(공근)을 기준으로 한다.","ind":22,"bul":true},{"k":"p","html":"2009년 이후 &#x27;고수(古樹)&#x27;라는 명칭이 붙어 유통되며 가격이 폭등했으나, 실제로는 100% 순수 고수차가 아니라 여러 수령의 잎이 섞인 혼채(混採)다.","ind":22,"bul":true},{"k":"p","html":"<b>투기 자본 유입과 시장 과열:</b> 2004년 대비 2019년 가격이 최고 1,800배 이상 치솟았다. 이는 차의 본질적인 가치 상승이라기보다 특정 유명 산지에 막대한 투기 자본이 몰리면서 기형적인 거품이 형성되었음을 보여준다.","ind":22,"bul":true},{"k":"p","html":"<b>2007년 보이차 대폭락 사태 반영:</b> 2007년 360위안에서 2009년 180위안으로 가격이 반토막 난 지표는 당시 중국 내 보이차 투기 거품이 붕괴했던 역사적 사실(보이차 파동)을 명확하게 드러낸다.","ind":22,"bul":true},{"k":"p","html":"<b>고수차(古樹茶) 중심의 패러다임 전환:</b> 2009년 폭락장 이후 '고수' 타이틀이 등장하면서 가격이 다시 기하급수적으로 뛰었다. 이는 과거 국영차창이나 다원차 위주였던 시장의 트렌드가 차나무의 수령을 강조하는 고수차 위주로 완전히 재편되었음을 의미한다.","ind":22,"bul":true},{"k":"h2","text":"□ 20년 빙도노채 차왕수의 독점 채엽권"},{"k":"p","html":"2019년 11월 23일 빙도노채 차왕수의 2020년도 독점 채엽권 계약이 체결되었다. 88만 위안에 낙찰되었던 18년에 비해 10% 이상 오른 99만 위안에 낙찰되었는데, 구체적인 내용은 마지막 부분의 계약서 내용을 함께 살펴본다.","ind":0,"bul":false},{"k":"h2","text":"□ 빙도촌의 행정구역 및 자연환경"},{"k":"h3","text":"1. 빙도촌의 행정구역명칭 및 기후환경"},{"k":"p","html":"빙도촌의 행정구역 명칭은 「운남성 임창시 쌍강현 맹고진 빙도촌위원회 빙도촌」이다. 빙도촌은 북위 23도에 위치하며 해발 1,400~2,500m의 아열대 기후에 건기와 우기가 명확히 구분되는 기후 조건을 가지고 있고, 연평균 일조량 2,400시간, 연평균 기온 18~20℃, 연평균 강수량 1,800mm 정도로 알려져 있다.","ind":0,"bul":false},{"k":"note","html":"※ Part.3 3강 「□ 임창시」에도 빙도촌이 '쌍강 랍호족 와족 포랑족 태족 자치현'의 맹고진에 있다고 나온다."},{"k":"h3","text":"2. 빙도촌의 구성"},{"k":"p","html":"빙도노채를 기준으로 주변의 큰 고차수 군락이 있는 4개 마을을 하나로 합쳐 빙도촌민위원회 관할로 두고 빙도5채라고 부르는데, 남박·노채·지계·파왜·나오의 5개 마을이 이에 속한다. 오늘날에는 맹고하(강)의 서쪽을 서반산, 동쪽을 동반산으로 나누어, 파왜와 나오는 대설산의 동반산에, 남박·노채·지계의 3개 마을은 대설산의 서반산에 위치하고 있다고 한다.","ind":0,"bul":false},{"k":"h3","text":"3. 빙도촌(빙도노채)의 역사적 의의"},{"k":"p","html":"1400년대 명나라 시기, 빙도 일대를 지배하던 태족이 사찰 정원수로 쓸 차나무를 구하면서 이무( 易武) 지역의 차나무가 유입되었다. 현지 북쪽의 대설산 야생군체종은 볼품없다고 여겨, 구전에 따르면 수령 200년가량의 이무 지역 어른 나무 약 1,000그루를 통째로 파내어 옮겨왔다고 전해진다.","ind":22,"bul":true},{"k":"p","html":"외부에서 들어온 이무 지역의 대엽종 종자는 수백 년에 걸쳐 현지의 대설산 야생군체종과 유성생식 및 자연 교잡을 거쳤다.","ind":22,"bul":true},{"k":"p","html":"이러한 자연 교잡의 결과로 오늘날 빙도노채 특유의 훌륭한 차나무 품종이 탄생했으며, 현재는 그 우수성을 인정받아 전국적으로 널리 활용되는 국가우량품종으로 지정되었다.","ind":22,"bul":true},{"k":"p","html":"한편, 빙도 5채 중 하나인 남박(南迫) 마을은 험한 산을 넘어가야 하는 깊은 산속이라는 지리적 고립성 덕분에 외부 간섭 없이 과거의 우수한 야생 품종 원형이 그대로 잘 보존될 수 있었다.","ind":22,"bul":true},{"k":"p","html":"그 결과, 남박 마을에는 현재 빙도 지역 내에서 가장 오래된 수령의 대엽종 고차수가 빽빽하게 밀집된 매우 훌륭한 다원이 형성되어 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 맹고대엽종의 발원지로써의 빙도노채 (기원)"},{"k":"h3","text":"1. 빙도촌의 지역별 찻잎 특성"},{"k":"p","html":"남박(南迫)의 찻잎은 대설산 야생군체 품종으로, 빙도촌 내에서 생태 환경이 가장 뛰어나며 이곳에 차왕수(茶王樹)가 위치해 있다.","ind":22,"bul":true},{"k":"p","html":"빙도노채(冰島老寨)의 찻잎은 대설산 야생군체 품종과 이무 대엽종이 결합된 개량종으로, 특유의 와일드함을 갖춘 이무 차의 느낌을 내어 지역 내에서 가장 특이한 풍미를 지닌다.","ind":22,"bul":true},{"k":"h3","text":"2. 맹고대엽종의 시원지(발원지)"},{"k":"p","html":"1400년대(명나라) 때 이무대엽종을 옮겨 심으며 빙도노채 품종이 탄생했고, 이후 태족은 여러 지역의 나무를 교배하기 시작했다. 그중 빙도노채 품종은 화차12호로 불리며 1970~80년대 이후 국가 차원에서 개량을 시도하였고, 1984년 국가우량품종으로 인정받아 맹고대엽종으로 불리게 되었다. 맹고대엽종은 북쪽으로 가서 봉경장엽차종이 되었다.","ind":0,"bul":false},{"k":"h3","text":"3. 맹고대엽종의 품종적 특성 및 우수성"},{"k":"p","html":"① 조생종 ② 냉해에 강함 ③ 병충해에 강함","ind":0,"bul":false},{"k":"h2","text":"□ 빙도5채 1 — 노채"},{"k":"p","html":"맹고진 정부 소재지로부터 30.5km 거리에 위치한 빙도노채는 서반산의 중턱인 해발 1,500~1,600m의 구릉 산지에 위치한 작은 마을이다. 1904년 이전까지 순수한 태족의 마을이었던 빙도(노채)는 태족어로 평도(扁島) 혹은 병도(丙島)로 읽히는데, 푸른색의 이끼가 맞이하는 지역 혹은 대나무 울타리로 마을 입구의 대문을 만들어 단 지역의 뜻을 가진다. 해가 뜨는 방향으로 산세가 이어지는 노채의 고차수 다원의 총면적은 약 100무 정도이다. 2021년 10월 빙도 신채 마을로 이주를 시작했다.","ind":0,"bul":false},{"k":"h2","text":"□ 빙도5채 2 — 남박노채"},{"k":"p","html":"남박노채는 맹고진 최북단 해발 1,700m의 자연촌락이다. 높고 깊은 산속에 위치하며, 2000년 들어 정부가 남박신채를 건설하였고 대다수의 주민들은 신채로 이주하였다. 남박노채는 특히 높은 해발 고도와 원시 환경이 잘 보존된 급격한 지세를 가져 고차수의 품질이 우수하고 고차수의 수도 많은 편이다. 남박노채의 고차수 다원은 높은 해발고도의 가파르고 무성한 원시림 속에 다른 나무들과 온전하게 혼생하고 있으며, 특히 고다원에는 왜화되지 않은 맹고차왕수(대차왕)가 한 그루 생장하고 있는데 오래된 덤불이 감겨 있는 3층 정도의 높이에 나무 둘레는 3미터가 넘는 웅장한 자태를 자랑한다. 남박노채 채엽을 가장 많이 사는 곳은 빙도노채로, 차품이 좋기 때문에 섞어서 빙도차로 판매한다.","ind":0,"bul":false},{"k":"h1","text":"4 & 5강"},{"k":"p","html":"서쌍판납은 란창강을 기준으로 고6대차산(의방, 만전, 혁등, 유락, 망지, 이무/만살)과 신6대차산(맹송, 남나, 하개, 포랑/반장, 파달, 파사)으로 나뉜다. 강외 신6대차산의 핵심 산구라고 할 수 있는 노반장촌에 관하여 살펴본다.","ind":0,"bul":false},{"k":"h2","text":"□ 노반장촌 개요"},{"k":"p","html":"반장5채 중 가장 메인이 되는 곳. 총면적 42.29㎢의 노반장 자연촌은 포랑산의 동북변 해발 1,700~1,900m에 위치하며, 행정구역상 운남성 서쌍판납태족자치주 맹해현 포랑산 포랑족향 반장촌위원회의 관할에 속한다. 맹해현의 동남부에 속하는 노반장촌은 포랑산 포랑족향 정부 소재지로부터 북쪽으로 25km 떨어져 있으며, 맹해현 정부소재지로부터는 60km, 경홍시로부터는 100km 거리에 있다. 140가구 정도 있으며 이는 이 지역 고차수 수와 비슷하다.","ind":0,"bul":false},{"k":"h2","text":"□ 노반장촌의 역사"},{"k":"p","html":"노반장(老班章)은 반장노채라고도 불리며, 행정구역상 반장촌위원회 관할이 맞다. 반장촌위원회가 관할하는 &#x27;반장5채&#x27;는 노반장, 신반장, 노만아, 파카나(坝卡囡), 파카룡(坝卡龙) 등 5개 마을을 가리킨다.","ind":22,"bul":true},{"k":"p","html":"2000년대 초반 마을이 개방될 시기에는 특정 마을의 잎만 단독으로 가공하는 순료(단일 지역 찻잎)의 개념이 희박했다. 노반장의 명성은 2000년 맹해차창이 유럽 수출용 유기농 인증 차(유명한 '대백채' 시리즈)를 만들기 위해 수매를 시작하면서 본격적으로 수면 위로 떠올랐다.","ind":22,"bul":true},{"k":"p","html":"2008~2010년경 진승호(陈升号) 등 대형 자본이 마을과 독점 계약을 맺고 들어오면서 현재의 폭발적인 &#x27;노반장 붐&#x27;과 고차수 열풍이 일어났다. 다만 고차수 열풍 초기에는 여전히 여러 지역 찻잎을 섞는 혼채(병배) 방식이 주를 이루었다.","ind":22,"bul":true},{"k":"p","html":"역사 기록에 따르면 노만아는 1379년경 형성된 맹해현에서 가장 오래된 포랑족 마을이다. 1476년경 북쪽에서 짐승을 쫓아 남하한 애니족(하니족의 분파)이 들어왔을 때, 원래 주인이었던 포랑족이 관대하게 땅과 차밭을 내어주고 자신들은 노만아나 신반장 쪽으로 이주했다. 따라서 현재 노반장 마을 사람들은 애니족이지만, 그들이 자랑하는 수백 년 된 대엽종 고차수들은 애니족이 아닌 원주민 포랑족이 심고 가꾼 위대한 유산이라는 것이 차계의 정설이다. 노반장이 과거 듣지도 보지도 못한 완벽한 오지였다는 사실도 맞다.","ind":22,"bul":true},{"k":"p","html":"1992년 전신주 설치와 2000년 맹해차창 수매는 오지 마을이었던 노반장이 자본과 만나 급격히 부유해지는 결정적 전환점이 되었다.","ind":22,"bul":true},{"k":"p","html":"노반장의 차왕수는 포랑족이 심은 것이 맞으며, 수령은 학자에 따라 800년에서 최고 1,200년까지 추정한다. 2010년대 이후 과도한 채엽과 관광객들로 인해 생육이 쇠퇴하고 가지 일부가 죽는 피해를 입었으나 완전히 고사한 것은 아니다. 현재는 채엽을 금지하고 철책을 친 상태로 식물 전문가들이 회복 치료를 진행하며 생존해 있다. (완전히 고사하여 쓰러진 차왕수로는 1994년 남나산(南糯山) 차왕수, 2012년 파달산(巴達山) 야생 차왕수 등이 있다.)","ind":22,"bul":true},{"k":"h2","text":"□ 노반장촌의 자연조건"},{"k":"h3","text":"1. 기후조건"},{"k":"p","html":"연평균 기온 18~21℃","ind":22,"bul":true},{"k":"p","html":"연평균 강수량 1,300~1,500mm","ind":22,"bul":true},{"k":"p","html":"연평균 일조량 2,100시간","ind":22,"bul":true},{"k":"p","html":"사시사철 봄 날씨에 운무가 많이 낀다.","ind":22,"bul":true},{"k":"h3","text":"2. 토양조건"},{"k":"p","html":"철분이 많은 적색토","ind":22,"bul":true},{"k":"p","html":"이무는 고동색, 회색의 토양","ind":22,"bul":true},{"k":"h2","text":"□ 노반장의 연도별 모차 가격 추이"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>가격</b></div></th></tr><tr><td><div>2000년</div></td><td><div>8위안/공근(元/公斤)</div></td></tr><tr><td><div>2001년</div></td><td><div>11~12위안/공근(元/公斤)</div></td></tr><tr><td><div>2005년</div></td><td><div>120~180위안/공근(元/公斤) (맹해차창 수매 기록 기준)</div></td></tr><tr><td><div>2007년</div></td><td><div>800~1,500위안/공근(元/公斤)</div></td></tr><tr><td><div>2008~9년</div></td><td><div>400~600위안/공근(元/公斤)</div></td></tr><tr><td><div>2010년</div></td><td><div>1,200위안/공근(元/公斤)</div></td></tr><tr><td><div>2012년</div></td><td><div>2,000~3,000위안/공근(元/公斤), 1,700위안/공근(元/公斤)</div></td></tr><tr><td><div>2013년</div></td><td><div>3,500위안/공근(元/公斤), 2,800~3,000위안/공근(元/公斤)</div></td></tr><tr><td><div>2015년</div></td><td><div>5,000~10,000위안/공근(元/公斤)</div></td></tr><tr><td><div>2016년</div></td><td><div>6,000~8,000위안/공근(元/公斤), 4,000~6,000위안/공근(元/公斤)</div></td></tr><tr><td><div>2017년</div></td><td><div>4,000~8,000위안/공근(元/公斤)</div></td></tr><tr><td><div>2019년</div></td><td><div>10,000~70,000위안/공근(元/公斤), 4,000~7,000위안/공근(元/公斤)(混采)</div></td></tr></table>"},{"k":"p","html":"<b>농산물에서 럭셔리 자산으로의 변모:</b> 2000년 1kg에 8위안에 불과했던 농산물이 2019년 최고 7만 위안까지 약 8,700배 폭등했다. 이는 노반장 차가 단순한 기호 음료를 넘어 막대한 자본이 집중되는 최고급 사치재이자 투기 자산으로 성격이 완전히 바뀌었음을 의미한다.","ind":22,"bul":true},{"k":"p","html":"<b>맹해차창의 시장 지배력:</b> 2005년 가격이 '맹해차창 때문에 기록이 있다'는 점은, 2004년 민영화 이후 맹해차창이 노반장 등 핵심 산지의 차엽 수매를 본격화하며 시장 가격 형성을 주도했음을 방증한다.","ind":22,"bul":true},{"k":"p","html":"<b>2007년 보이차 거품 붕괴의 직격탄:</b> 2007년 최대 1,500위안까지 치솟았던 가격이 2008~2009년에 400~600위안으로 급락했다. 이는 중국 전역을 휩쓸었던 2007년 보이차 시장의 대폭락 사태가 노반장 산지에도 직접적인 타격을 입혔음을 명확히 보여준다.","ind":22,"bul":true},{"k":"p","html":"<b>품질과 순도에 따른 극단적 가격 양극화:</b> 2019년 지표를 보면 순수 고수차(단주 등)는 최대 7만 위안에 달하지만, 어린나무의 잎을 섞은 혼채는 4천~7천 위안 선에 머물렀다. 이는 산지 이름(노반장)이 같더라도 원료의 수령과 채엽 방식(순도)에 따라 시장에서 매겨지는 프리미엄이 극단적으로 갈림을 시사한다.","ind":22,"bul":true},{"k":"note","html":"※ Part.6 부록 「맹해정창 특강」의 '2007년 보이차 파동, 2년간 암흑기, 2009년 보석람으로 재기'와 같은 흐름이다."},{"k":"h2","text":"□ 노반장 차왕수와 차후수의 독점채엽권"},{"k":"h3","text":"1. 년도별 독점채엽권 협의에 따른 가격 변화"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>금액</b></div></th></tr><tr><td><div>2014년</div></td><td><div>160,000위안(元)</div></td></tr><tr><td><div>2015년</div></td><td><div>202,500위안(元)</div></td></tr><tr><td><div>2016년</div></td><td><div>미상</div></td></tr><tr><td><div>2017년</div></td><td><div>320,000위안(元)</div></td></tr><tr><td><div>2018년</div></td><td><div>차왕수 680,000위안(元) / 차후수 460,000위안(元)</div></td></tr></table>"},{"k":"h3","text":"2. 2017년, 2018년의 차왕수 독점 채엽과 관련한 특이사항"},{"k":"h4","text":"가. 2017년"},{"k":"p","html":"2016년에 체결된 계약에 따라 2017년 3월 3일 채엽이 진행되었으며, 당시 낙찰가는 1kg당 32만 위안이었다. 이 수매는 상해(상하이)의 양상면이라는 인물에게 낙찰되었다.","ind":22,"bul":true},{"k":"p","html":"본래 고차수의 채엽량이 적을 것으로 예상되었기 때문에, 계약 초기부터 차왕수와 차후수를 엄격히 구분하지 않고 묶어서 채엽하기로 합의했다. (참고로 빙도노채의 수매 방식 중에는 차왕수 1그루와 주변 고차수 6그루를 한데 묶어 계약하는 경우가 종종 있는데, 수매가액이 고정된 상태에서 찻잎이 많이 열릴수록 수매자에게 이득이 되는 구조다.)","ind":22,"bul":true},{"k":"p","html":"차나무 주인인 양영평은 봄에 두 번, 가을에 두 번 채엽을 진행했다. 첫 채엽 당시 차왕수에서는 400g, 차후수에서는 1.6kg이 수확되어 총 2kg의 찻잎을 얻었다.","ind":22,"bul":true},{"k":"p","html":"수매자는 수확량이 적어 단독 가공이 어렵자, 차왕수와 차후수의 찻잎을 섞는 병배(Blending) 방식을 택했다. 이를 통해 357g 규격의 둥근 병차 5편과 흩어진 형태의 산차를 조금 만들었으며, 완성된 병차는 수매자 양상면이 운영하는 연간 회원제 찻집에 보관된 것으로 알려져 있다.","ind":22,"bul":true},{"k":"h4","text":"나. 2018년"},{"k":"p","html":"불과 1년 뒤인 2018년 1월 1일, 새로운 수매 계약이 체결되었다. 이번에는 하남성 출신의 녹차 상인이 수매에 나섰는데, 가격이 비정상적으로 폭등하여 차왕수는 1kg당 68만 위안(전년 대비 2배 이상), 차후수는 46만 위안(전년 대비 약 50% 인상)으로 계약이 성사되었다.","ind":22,"bul":true},{"k":"p","html":"2018년 4월 4일 첫 채엽이 진행되었으나, 당일 기상 악화(비와 우박)와 안전사고가 겹치는 참사가 발생했다. 비가 내리는 가운데 무리하게 촬영을 진행하던 중 한 여성이 5m 아래로 추락하는 사고를 당했다. 30분 뒤 아수라장 속에서 정신을 차려 다시 채엽을 시도하자 이번에는 우박까지 쏟아졌다.","ind":22,"bul":true},{"k":"p","html":"가장 심각한 문제는 기상 악화뿐만 아니라 차나무 자체의 컨디션 악화로 인해, 이날 수확된 찻잎의 양이 200g도 채 되지 않았다는 점이다.","ind":22,"bul":true},{"k":"p","html":"이후 한 기자가 2017년 수매자였던 양상면과 진행한 인터뷰에서 이 사태의 근본적인 원인이 밝혀졌다. 양상면은 \"2016년 계약 당시에도 가격 오름폭이 컸는데, 그 이유는 차나무의 컨디션이 이미 좋지 않았기 때문이었다. 그래서 차나무를 보호하고 자생력을 회복시키기 위해 향후 3년 동안은 잎을 따지 않기로 (주인과) 약속하며 비싼 값에 계약했던 것\"이라고 토로했다.","ind":22,"bul":true},{"k":"p","html":"즉, 치솟는 시장 가격의 유혹에 차나무 보호를 위한 3년의 휴지기 약속이 파기되었고, 무리한 채엽이 강행된 결과 생육이 급격히 쇠퇴하여 수확량 급감이라는 결과를 낳은 인재(人災)였다는 것이 차계의 정확한 평가다.","ind":22,"bul":true},{"k":"h2","text":"□ 노반장 차왕수와 차후수의 차엽매수협의서"},{"k":"h2","text":"□ 맹해차창의 노반장 차엽 수매와 반장유기차의 탄생"},{"k":"h3","text":"불해차창의 설립과 맹해차창으로의 개칭"},{"k":"p","html":"1939년 설립 준비를 거쳐 1940년 국영 &#x27;중국차엽무역주식유한공사 불해실험차창&#x27;으로 정식 설립되었다(초대 창장 범화균).","ind":22,"bul":true},{"k":"p","html":"1953년 불해현이 맹해현으로 개칭되며 이름이 여러 번 바뀌다가, 1956년 2월 '사모전구맹해차창'으로 개칭되며 '맹해차창'이라는 명칭이 정식 확정되었다.","ind":22,"bul":true},{"k":"h3","text":"완전용 창장의 부임과 유기농 인증 추진"},{"k":"p","html":"1998년 11월 부임한 제6대 창장 완전용(阮殿蓉)은 위생 및 농약 문제로 수출이 어렵자, 1999년 창립 60주년을 맞아 E.C.(유럽공동체) 유기농 인증 취득을 추진했다.","ind":22,"bul":true},{"k":"p","html":"초기에는 차창 소유의 다원으로 인증을 시도했으나 퇴짜를 맞았고, 농약을 칠 일조차 없이 오지에 방치되어 있던 노반장촌을 찾아내어 유기농 인증 획득에 성공했다.","ind":22,"bul":true},{"k":"h3","text":"'대백채(大白菜)'의 탄생과 하씨 형제의 위탁 가공"},{"k":"p","html":"인증을 바탕으로 2000년 「유기반장차」가 출시되었다. 내피에 &#x27;반장생태&#x27;라고 표기된 이 차는 유기농 인증 마크가 배추를 닮아 &#x27;대백채(大白菜)&#x27;라는 별명으로 불리게 되었다.","ind":22,"bul":true},{"k":"p","html":"실제 대백채 시리즈는 광동성의 차 상인 하씨 형제(하광삼, 하보강)가 노반장 찻잎을 직접 수매해 맹해차창에 위탁 가공한 제품이다.","ind":22,"bul":true},{"k":"p","html":"2004년 맹해차창 민영화 전까지 계속 생산되다 위탁처가 흥해차창으로 바뀌며 중단되었고, 2006년 맹해차창이 남은 유기인증 원료로 3종의 '말(末)대백채'를 생산한 것이 마지막이다.","ind":22,"bul":true},{"k":"h3","text":"이무(강내)와 반장(강외)의 가격 역전 현상"},{"k":"p","html":"전통적으로 부드러운 맛의 강내(이무) 차가 진상품으로 우대받고, 강외(포랑산 반장) 차는 강하고 써서 기피되는 경향이 있었다.","ind":22,"bul":true},{"k":"p","html":"그러나 노반장의 유기농 인증 획득과 하씨 형제의 고급화 마케팅(포장지에 길조를 상징하는 공작 인쇄, 별 개수로 등급화)이 성공하면서 반장차 특유의 맛이 재조명되었고, 결국 강외 지역인 반장차가 강내의 이무 차보다 비싸지는 가격 역전 현상이 발생했다.","ind":22,"bul":true},{"k":"h3","text":"반장생태차의 등급과 천우공작"},{"k":"p","html":"대백채 시리즈 중 최상위 등급의 최고급 제품은 2003년에 출시된 별 6개짜리 &#x27;육성공작 반장생태차&#x27;다.","ind":22,"bul":true},{"k":"p","html":"맹해차창 민영화 이후 대익(大益) 브랜드로 2018년 출시된 '천우공작(칠성공작) 1801'은 출고 직후부터 투기 자본이 몰려 건(件)당 19만~40만 위안 이상에 거래된 대표적인 초고가 한정판 차다.","ind":22,"bul":true},{"k":"h2","text":"□ 노반장촌의 제다표준"},{"k":"h2","text":"□ 노반장 고수차의 특징"},{"k":"h2","text":"□ 노반장촌의 차수 자원과 연간 생산량"},{"k":"table","html":"<table><tr><th><div><b>구분</b></div></th><th><div><b>가격 (100g 기준)</b></div></th></tr><tr><td><div>차왕수지 (원생태고차원, 품종변이 일어남)</div></td><td><div>120만</div></td></tr><tr><td><div>국유림</div></td><td><div>120만</div></td></tr><tr><td><div>4호 단주</div></td><td><div>100만</div></td></tr><tr><td><div>1호 단주</div></td><td><div>55만</div></td></tr></table>"},{"k":"p","html":"고차수의 양 = 가구 수","ind":22,"bul":true},{"k":"p","html":"만송 30가구","ind":40,"bul":true},{"k":"p","html":"노반장 150가구 (재래다원 중 규모가 가장 큼)","ind":40,"bul":true},{"k":"p","html":"빙도 40가구","ind":40,"bul":true},{"k":"h2","text":"□ 진승노반장과 노반장촌의 관계"},{"k":"h3","text":"진승하의 등장과 노반장 진출"},{"k":"p","html":"광동성 출신의 진승하(陳升河)는 원래 철관음을 유통하던 차 상인이었으나, 2006년 시장 정체 후 운남 보이차로 눈을 돌렸다. 그는 사업 경험을 바탕으로 독과점의 경제적 이점을 간파하고 미개발지였던 노반장을 타깃으로 삼았다. 중심지(경홍)와 가까운 교통, 대엽종의 뛰어난 품질, 넉넉한 생산량, 고수차와 대지차의 명확한 구분이 그 이유였다.","ind":22,"bul":true},{"k":"h3","text":"진승차창 설립과 최초의 독점 합작"},{"k":"p","html":"2007년 맹해현에 위생 및 기계화 설비를 갖춘 진승차창을 설립했다. 이듬해인 2008년 초, 노반장 촌민소조와 찻잎 전량을 사들이는 '30년 독점 수매 계약'을 맺었다. 대가로 8km 길이의 도로 포장 등 인프라를 지원했으며, 이는 중국 내 단일 기업과 마을이 맺은 최초의 독점 합작 모델이었다.","ind":22,"bul":true},{"k":"h3","text":"진승노반장의 탄생과 3개 도장"},{"k":"p","html":"2008년 봄 첫 출시된 '진승노반장' 포장지에는 가짜 차와의 구별을 위해 촌민소조, 진승차창, 노반장 합작사까지 총 3개의 인증 도장이 찍혔다.","ind":22,"bul":true},{"k":"h3","text":"계약의 한계와 현재의 협업 형태"},{"k":"p","html":"2010년 이후 고수차 가격이 폭등하자, 위약금을 대납하며 접근한 외부 상인들로 인해 계약 위반이 속출했다. 그 결과 2013년경 독점 계약은 사실상 무너졌으나, 진승차창은 여전히 마을 내 가공기지를 두고 협업을 이어가고 있다.","ind":22,"bul":true},{"k":"h3","text":"'진승노반장'의 병배(Blending) 현실"},{"k":"p","html":"매년 대량 생산되는 진승노반장을 100% 순수 고수차로만 채우는 것은 물리적으로 불가능하다. 저렴한 밭차만 쓴다는 소문은 사실이 아니며, 실제로는 진승차창이 수매한 노반장의 고수차, 대수차, 생태차(대지차)를 진승호만의 고유 비율로 섞어 맛을 낸다.","ind":22,"bul":true},{"k":"h3","text":"차나무 소유권"},{"k":"p","html":"노반장촌의 차나무 소유권은 중국 농촌 정책(포산도호)에 따라 이미 1982~1983년에 가구별 분배가 끝났다. 2018년은 소유권이 나뉜 해가 아니라, 양영평 소유의 1대 차왕수가 역대 최고가로 낙찰되며 화제가 된 해일 뿐이다.","ind":22,"bul":true},{"k":"h3","text":"차왕수의 생육 상태"},{"k":"p","html":"양영평이 차왕수와 차후수를 소유한 것은 맞으나, 1대 차왕수는 2018년부터 흰개미 피해와 무리한 채엽 등으로 급격히 쇠약해져 2019~2020년에는 싹조차 틔우지 못할 만큼 심각한 상태에 처해 있다.","ind":22,"bul":true},{"k":"h1","text":"6강"},{"k":"p","html":"노반장에 이어 포랑산의 다른 산구 및 임창의 노반장이라 불리는 석귀를 살펴보고, 고수차의 품질 저하를 야기할 수 있는 제다와 보관상의 원인들에 관하여 간략하게 정리해본다.","ind":0,"bul":false},{"k":"h2","text":"□ 완성차의 품질 저하 요소"},{"k":"p","html":"원료의 가공, 보관, 운송의 과정에서 완성차의 품질 저하를 야기시키는 대표적인 경우를 정리하면 다음과 같다.","ind":0,"bul":false},{"k":"h3","text":"1. 가공 후의 문제"},{"k":"h4","text":"가. 이잡미/이취미(异雜味)"},{"k":"p","html":"차엽의 가공, 운반 또는 보관 과정에서 발생하는, 품질을 저하시키는 비정상적인 풍미의 총체로서 특히 가공 후에 발생하는 이잡미가 문제된다. 차는 다공질 조직으로 흡향을 하기 때문에 가공 후에 다른 향이 섞이기 쉽다.","ind":0,"bul":false},{"k":"h4","text":"나. 매미(霉味)"},{"k":"p","html":"과도한 온습도에 의해 야기되는 매변에 의한 곰팡이류의 부정적인 풍미.","ind":0,"bul":false},{"k":"p","html":"<b>매변(霉變):</b> 썩어서 생긴 곰팡이에 의한 변화","ind":22,"bul":true},{"k":"p","html":"<b>창미(倉味):</b> 곰팡이 냄새를 포함하여 창고의 안 좋은 냄새.","ind":22,"bul":true},{"k":"h3","text":"2. 가공 중의 문제"},{"k":"h4","text":"가. 수산미(餿酸味)"},{"k":"p","html":"유념을 마친 찻잎을 제때 건조하지 않거나, 병차로 압축(압병)한 후 건조가 제대로 이루어지지 않아 발생하는 부정적인 쉰내와 신맛이다. 기계로 제다할 때는 거의 발생하지 않는다.","ind":0,"bul":false},{"k":"h4","text":"나. 초호미(焦糊味)"},{"k":"p","html":"찻잎이 타거나 눌어붙어 발생하는 탄내다.","ind":0,"bul":false},{"k":"p","html":"살청이나 건조 시 솥의 온도가 너무 높거나 시간이 길 때 발생한다. 기계 살청 시 과도하게 건조된 찻잎이 들어가 타기도 하며, 이 탄내가 다른 찻잎에 배면 정상적인 후변화(발효)를 기대하기 어렵다.","ind":22,"bul":true},{"k":"p","html":"솥 바닥에 눌어붙은 찻잎을 제거하지 않고 새 찻잎을 추가해 덖을 경우 연미가 밸 수 있다. 새로 들어간 찻잎 자체는 익을 수 있으나, 근본적으로 살청 기술에 문제가 있을 확률이 커 후변화가 제대로 일어나지 않을 가능성이 높다.","ind":22,"bul":true},{"k":"h4","text":"다. 고화미(高火味)"},{"k":"p","html":"살청이나 건조 과정에서 온도가 과하게 높거나 시간이 지나치게 길어 발생하는 맛이다. 종종 기계 제다의 특징적인 맛으로 나타나기도 한다.","ind":0,"bul":false},{"k":"h4","text":"라. 청엽미(靑葉味)"},{"k":"p","html":"살청 온도가 낮거나 시간이 짧아 찻잎이 적정 수준으로 덖어지지 않았을 때(설익었을 때) 남게 되는 풀비린내나 풋내 등의 부정적인 맛이다.","ind":0,"bul":false},{"k":"h4","text":"마. 연미(烟味)"},{"k":"p","html":"가공이나 보관 과정에서 연기(훈연향)가 찻잎에 배어 생기는 풍미다. 초호미 현상과 동반되어 발생하거나, 살청 시 젖은 장작을 사용하여 발생한 연기가 원인이 되기도 한다. 때로는 일부러 가향을 하기도 하지만, 인위적인 가향은 세월이 지나면 빠르게 사라지는 특징이 있다.","ind":0,"bul":false},{"k":"note","html":"※ Part.1 「현대 보이차의 가공공정 1」의 살청·유념·쇄청 서술과 짝을 이루는 항목이다."},{"k":"h2","text":"□ 포랑산 차구 개론"},{"k":"h2","text":"□ 노만아채 (포랑)"},{"k":"h3","text":"1. 지리조건"},{"k":"h3","text":"2. 차수분포"},{"k":"h3","text":"3. 노만아 고차의 특징"},{"k":"h2","text":"□ 장가촌 (포랑)"},{"k":"h3","text":"1. 장가촌개론"},{"k":"h3","text":"2. 장가노채"},{"k":"h3","text":"3. 장가삼대"},{"k":"h2","text":"□ 석귀촌 (임창)"},{"k":"h3","text":"1. 입지 및 자연조건"},{"k":"p","html":"운남성 임창시 임상구 방동향 방동행정촌위원회에 속한다. 임창시 쌍강현 맹고 빙도노채를 기준으로 산을 몇 개 넘어 4~5시간 걸린다. 총 면적 4㎢(가로 × 세로 2km), 해발고도 700~800m의 저지대임에도 강 옆이라 운무가 심하다. 자연차양이 되어 찻잎 재배에 환경적으로 이점이 있으며, 찻잎 내 아미노산이 많다.","ind":0,"bul":false},{"k":"h3","text":"2. 석귀차의 역사적 의의"},{"k":"p","html":"석귀차는 임창의 노반장이라고 불린다. 소량 생산으로 귀하기 때문인데, 2012~2013년에 인위적이지만 유명세를 얻기 시작했다.","ind":0,"bul":false},{"k":"h3","text":"3. 망록차와 석귀차의 구별"},{"k":"p","html":"석귀촌은 망록산 뒤에 위치해서 이전에는 망록산차였다가, 지금은 망록산차를 석귀차라고 부른다. 아리고도라는 나루터가 있어서 아리고차라고도 부른다.","ind":0,"bul":false},{"k":"h3","text":"4. 석귀차의 특징"},{"k":"p","html":"고차수가 많지만 나이가 그렇게 많지는 않고, 차왕수는 800살이다. 분포차엽(품종)은 방동대엽종으로 잎이 흑색을 띠고 좁고 길다는 특징이 있다. 석귀와 같은 북부차는 정제가 안 된 느낌이 있다.","ind":0,"bul":false},{"k":"note","html":"※ Part.3 교재 원본 3강 「□ 임창시」의 '임상현(临翔县) — 망록석귀(忙麓昔归)'가 이 석귀(昔歸)다."},{"k":"h2","text":"□ 소호채 (빙도 옆 북부차구)"},{"k":"p","html":"소호채의 차나무 품종은 대설산 야생품종인데, 경사가 높다는 거 외에는 소빙도라고 별명 지을 이유가 없다. 차라리 남박의 대설산 야생품종이 더 좋은 환경에서 자라 품질이 좋다.","ind":0,"bul":false},{"k":"h2","text":"□ 임창차산분포"},{"k":"h2","text":"□ 보이시의 대표적인 15개 차산지"},{"k":"p","html":"안정, 만만, 문용, 금병, 경동, 무량산, 애뢰산, 고총산, 구갑산, 마등, 경곡, 사모, 란창, 경매, 맹연.","ind":0,"bul":false}]}]);
</script>
<script>window.__TEA_LESSONS=(window.__TEA_LESSONS||[]).concat([{"id":"p3","label":"보이차 Part.3","blocks":[{"k":"h1","text":"1강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 오룡차의 개완 심평법에 대해서 설명해 보세요."},{"k":"p","html":"<b>심평 대상:</b> 오룡차","ind":22,"bul":true},{"k":"p","html":"<b>기구와 비율:</b> 개완 / 찻잎 5g / 물 110cc (약 1 : 20)","ind":22,"bul":true},{"k":"p","html":"배화(焙火)를 거친 차를 주로 개완으로 심평한다.","ind":40,"bul":true},{"k":"p","html":"경도가 가장 낮은 물을 쓴다. (삼다수, 역삼투압 정수기 물)","ind":40,"bul":true},{"k":"note","html":"※ 역삼투압수는 Part.1 3강 「순수한 물의 종류 / 심평과 물의 선택」에서 자세히 다룬다.","ind":14,"bul":false},{"k":"p","html":"물 온도는 100℃(끓는 물)를 사용한다.","ind":40,"bul":true},{"k":"p","html":"<b>심평 방법:</b> 타이머 2분 · 3분 · 5분","ind":22,"bul":true},{"k":"note","html":"※ 오룡차의 표준 심평은 Part.1 4강 「포차」에도 정리되어 있다(찻잎 5g / 250ml / 100℃ / 5분). 여기 개완 심평(5g / 110cc / 약 1:20)은 오룡차 전용 방식이다.","ind":14,"bul":false},{"k":"p","html":"1분이 지날 때 뚜껑을 들어 향기를 심평한다.","ind":40,"bul":true},{"k":"p","html":"2분이 지날 때 뚜껑을 들어 향기를 심평한다.","ind":40,"bul":true},{"k":"p","html":"3분이 지났을 때 뚜껑을 들어 향기를 심평한다.","ind":40,"bul":true},{"k":"p","html":"자사호로 차를 우리면 차가 농(濃)하고 시원하며 결이 잘 보인다.","ind":22,"bul":true},{"k":"h3","text":"2. 차마고도의 핵심 경유 지역 중 하나인 샹그릴라의 지명적 연원에 대해서 설명해 보세요."},{"k":"p","html":"1933년 소설 『잃어버린 지평선』에 등장하는 지상낙원. 1차 세계대전이 끝나고 혼란하던 시기에 나온 작품이다.","ind":22,"bul":true},{"k":"p","html":"샹그릴라(티베트어) = 마음의 해와 달 = 영원히 늙지 않는 젊음을 유지할 수 있는 이상향","ind":22,"bul":true},{"k":"p","html":"운남성 중전현(해발 3,200m)이 향격리랍(香格里拉), 곧 샹그릴라로 이름을 바꾸었다.","ind":22,"bul":true},{"k":"h3","text":"3. 1무(畝)를 현대의 면적 단위로 환산해 보세요."},{"k":"p","html":"임야·논·밭을 재는 단위이다.","ind":22,"bul":true},{"k":"p","html":"1무 = 1묘 = 661~793㎡ ≒ 200평","ind":22,"bul":true},{"k":"p","html":"경매산 천년만무(千年萬畝) 고다원 = 아주 넓은 고다원. &#x27;만무(萬畝)·만묘&#x27;는 매우 넓다는 뜻이다.","ind":22,"bul":true},{"k":"p","html":"만무 = 10,000무 → 약 200만 평","ind":40,"bul":true},{"k":"h3","text":"4. 다음 물의 최대 경도를 계산해 보세요."},{"k":"p","html":"무기물질(미네랄) 함량 / Typical Analysis (mg/L)","ind":0,"bul":false},{"k":"p","html":"칼슘 Calcium (Ca) — 9.4 ~ 14.0","ind":22,"bul":true},{"k":"p","html":"나트륨 Sodium (Na) — 11.2 ~ 13.9","ind":22,"bul":true},{"k":"p","html":"칼륨 Potassium (K) — 5.8 ~ 7.0","ind":22,"bul":true},{"k":"p","html":"마그네슘 Magnesium (Mg) — 7.6 ~ 9.1","ind":22,"bul":true},{"k":"p","html":"불소 Fluorine (F) — 0.2 ~ 0.3","ind":22,"bul":true},{"k":"p","html":"경도 = 2.5 × 칼슘(14.0) + 4.1 × 마그네슘(9.1) = 35 + 37.31 = 72.31 → 연수(軟水)","ind":40,"bul":true},{"k":"note","html":"※ 같은 계산식이 Part.1 3강 「물의 경도 측정법」에 활자로 실려 있다. 계수 2.5가 두 자료에서 일치한다.","ind":14,"bul":false},{"k":"h2","text":"□ 4대 보이차 차구"},{"k":"p","html":"보이차의 주요 산지는 지리와 역사적 특성에 따라 크게 네 개의 차구로 나뉜다.","ind":0,"bul":false},{"k":"h3","text":"1. 북부차구 (임창 일대)"},{"k":"p","html":"<b>주요 산지:</b> 임창(臨滄), 남박(南迫), 빙도(氷島) 등","ind":22,"bul":true},{"k":"p","html":"<b>지리적 특징:</b> 란창강의 북쪽 지역이며, 보이시 위쪽에 해당한다. 해발고도가 매우 높고 일교차가 큰 것이 특징이다.","ind":22,"bul":true},{"k":"h3","text":"2. 육대차산차구 (고 6대 차산)"},{"k":"p","html":"<b>지리적 위치:</b> 란창강의 동쪽","ind":22,"bul":true},{"k":"p","html":"<b>역사적 배경:</b> 서쌍판납에서 가장 먼저 차가 상업적으로 유통되기 시작한 지역으로, 1600년대에 본격적으로 발달했다.","ind":22,"bul":true},{"k":"p","html":"<b>구성 지역:</b> 유락(攸樂), 망지(莽枝), 혁등(革登), 의방(倚邦, 만송 포함), 만전(蠻磚), 이무(易武)의 6개 지역이다.","ind":22,"bul":true},{"k":"note","html":"※ 고6대차산·신6대차산 목록은 Part.2 4 &amp; 5강의 서두(“고6대차산…신6대차산…”)와도 대응한다.","ind":14,"bul":false},{"k":"h3","text":"3. 맹해차구 (신 6대 차산)"},{"k":"p","html":"<b>지리적 위치 및 시기:</b> 란창강의 서쪽 지역으로, 구 6대 차산(고 6대 차산)과 시기적으로 300년 이상 차이가 나며 1900년대 초반에 본격적으로 개발되었다.","ind":22,"bul":true},{"k":"p","html":"<b>구성 지역:</b> 맹송(勐宋), 남나(南糯), 하개(賀開), 포랑(布朗, 반장 포함), 파달(巴達), 파사(帕沙)","ind":22,"bul":true},{"k":"p","html":"<b>특징:</b> 운남대엽종의 표준이자 대표적인 맛을 보여주는 산지이며, 그중 최고 상징은 &#x27;노반장&#x27;이다.","ind":22,"bul":true},{"k":"h3","text":"4. 변경차구"},{"k":"p","html":"<b>범위:</b> 앞서 언급한 북부차구, 육대차산차구, 맹해차구를 제외한 나머지 운남의 주변 지역이다.","ind":22,"bul":true},{"k":"p","html":"<b>특징:</b> 사천(四川)이나 호남(湖南) 같은 타 지역의 대다수 흑차 생산지처럼, 찻잎 자체의 품질이 다소 떨어지고 제다 기술이 상대적으로 부족한 편이다.","ind":22,"bul":true},{"k":"p","html":"<b>주요 지역:</b> 홍하(紅河), 보산(保山), 덕굉(德宏)","ind":22,"bul":true},{"k":"h2","text":"□ 고6대 차산 개론"},{"k":"h3","text":"1. 란창강과 서쌍판납의 지명적 연원"},{"k":"h3","text":"란창강과 서쌍판납의 어원"},{"k":"p","html":"<b>란창강(瀾滄江)의 유래:</b> 태족(다이족)의 언어에서 유래한 지명이다. (참고로 이 지역 소수민족들은 찻잎을 '라'라고 부른다.) 과거 태족들이 남하하는 과정에서 야생 코끼리를 무수히 많이 만난 데서 비롯되었는데, 태족어로 '랑(Lan)'은 숫자 100만, '창(Xang)'은 코끼리를 뜻하여 &quot;백만 마리의 코끼리가 있는 강&quot;이라는 의미의 '랑창강'이라 불렀던 것이 한자로 음역된 것이다. 한족들은 이를 '란창강'이라 부른다.","ind":22,"bul":true},{"k":"p","html":"<b>서쌍판납(西雙版納)의 유래:</b> 과거 이 지역에 존재했던 &#x27;맹륵왕국&#x27;이 영토를 효율적으로 관리하기 위해 12개의 구역으로 나눈 데서 유래했다. 태족어로 &#x27;십송(서쌍)&#x27;은 숫자 12를 뜻하고, &#x27;판납&#x27;은 행정구역의 단위를 뜻하므로, &quot;12개의 판납&quot;이라는 의미를 담고 있다. 이 지역의 메인 도시는 경홍(景洪)이며, 태족의 대표적인 전통 행사로 &#x27;발수절(潑水節)&#x27;이 있다.","ind":22,"bul":true},{"k":"h3","text":"태족의 남하와 차의 발견 (소나랍의 이주)"},{"k":"p","html":"<b>이주 과정:</b> 기원전 100년 무렵, 덕굉 지역에 살던 태족의 지도자 소나랍이 소수민족 300여 명을 이끌고 임창 방면으로 이주했다. 이 과정에서 일부 무리는 란창강 일대에 정착했고, 일부는 더 남하하여 '새로운 성'이라는 뜻의 경매산(景邁山)에 정착했다.","ind":22,"bul":true},{"k":"p","html":"<b>경매산과 금색 사슴 설화:</b> 금색 사슴을 쫓아 내려왔다는 설화가 경매산에 전해진다. 흥미롭게도 오늘날까지도 경매산에는 태족의 전통 &#x27;왕(추장)&#x27;이 존재하여, 마치 종갓집 장손과 같은 상징적인 명맥을 유지하고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>차 음용의 기원:</b> 고된 이주 길에 지친 태족들이 주변의 찻잎을 따서 불에 구운 뒤 물에 끓여 마셨더니 피로가 싹 가시더라는 이야기가 전해지며, 이것이 전통적인 차 활용 방식의 뿌리가 되었다.","ind":22,"bul":true},{"k":"h3","text":"주요 소수민족의 분포와 특징"},{"k":"p","html":"<b>포랑족:</b> 노만아(老曼峨) 등에 거주하며 깊은 제다 역사를 지닌 민족이다.","ind":22,"bul":true},{"k":"p","html":"<b>하니족 (애니족):</b> 노반장 등에 거주하며, 하니족의 분파에 해당한다.","ind":22,"bul":true},{"k":"p","html":"<b>태족:</b> 경매산 등의 물가에 주로 터를 잡고 거주하던 소수민족이다. 유동성과 상업적 물자 이동이 곧 부와 권력이 되는 시대에 지역의 지배 세력으로 자리 잡았다.","ind":22,"bul":true},{"k":"h3","text":"2. 고 6대 차산의 지리적 특징과 발전사"},{"k":"h4","text":"가. 지리적 특징"},{"k":"p","html":"<b>위치 및 행정구역 (강내):</b> 란창강을 기준으로 동쪽, 이른바 &#x27;강내(江內)&#x27; 지역에 자리하고 있다. 6개의 차산 중 유락산(기낙산) 한 곳만 경홍시 관할에 속하며, 나머지 다섯 곳(혁등, 망지, 의방, 만전, 이무)은 모두 맹랍현 관할에 속해 있다.","ind":22,"bul":true},{"k":"p","html":"<b>지형 및 고도:</b> 험준한 산과 깊은 계곡이 어우러진 전형적인 산악지대로, 해발고도는 대략 565m에서 1,950m에 이른다.","ind":22,"bul":true},{"k":"p","html":"<b>최적의 기후 조건:</b> 연평균 기온 17~20℃, 연평균 강수량 1,500~1,900mm의 아열대 계절풍 기후를 보인다. 연중 운무(구름과 안개)가 짙게 끼어 차나무 생장에 이상적인 환경을 제공한다.","ind":22,"bul":true},{"k":"p","html":"<b>비옥한 토양:</b> 토양은 찻잎 생장에 매우 유리한 전홍양(磚紅壤) 및 적홍양(赤紅壤) 계열의 산성토(pH 4~6)로 이루어져 있으며, 유기질 함량이 매우 높다.","ind":22,"bul":true},{"k":"p","html":"<b>품종적 차별성 (중소엽종 분포):</b> 란창강 서쪽의 맹해 차구(신 6대 차산)가 대엽종 일색인 것과 달리, 고 6대 차산에 속하는 의방·혁등·망지 일대에는 잎의 크기가 상대적으로 작은 중소엽종이 널리 분포하고 있는 것이 큰 특징이다. (이는 과거 석병 지역에서 이주해 온 한족들이 심고 가꾼 재래종 다원에서 기인한다.)","ind":22,"bul":true},{"k":"h4","text":"나. 고 6대 차산의 개발"},{"k":"p","html":"<b>한대(漢代)의 차 문화와 운남의 고립:</b> 한나라 시기 한족을 중심으로 경질자기(단단한 도자기)의 사용과 함께 차를 마시고(음다) 만드는(제다) 문화가 본격적으로 시작되었다. 그러나 당시 운남성 지역은 지리적으로 너무 구석진 변방에 위치해 있어 이러한 한족 문명의 혜택을 직접적으로 받지 못했다.","ind":22,"bul":true},{"k":"p","html":"<b>원대(元代, 1200~1300년대) 차나무의 식재:</b> 운남의 고 6대 차산에 대규모로 차나무를 심기 시작한 시기는 원나라 초기로 추정된다. 현재 고 6대 차산 일대에 남아 있는 인공 재배형 고차수 중 가장 나이가 많은 나무들의 수령이 약 800살 정도라는 점이 이 역사적 추정을 강력하게 뒷받침한다.","ind":22,"bul":true},{"k":"p","html":"<b>명대(明代) 한족의 운남 정착과 석병 상인의 이주:</b> 원나라가 멸망하고 명나라가 세워진 뒤, 명태조 주원장 시기에 군사적 목적(둔전) 등으로 다수의 한족이 운남에 들어가 정착하기 시작했다. 특히 홍하주(紅河州) 석병현(石屏縣) 출신의 한족 상인들이 차 무역을 위해 의방차산(현재의 의방노가)으로 대거 이주해 정착하면서 고 6대 차산의 개발을 주도했다.","ind":22,"bul":true},{"k":"p","html":"<b>명말청초(明末淸初, 1600년대) 차 시장의 형성:</b> 1600년대에 이르면 의방을 비롯한 고 6대 차산에 이미 거대한 차 시장이 형성되었고, 외지의 상인들이 활발하게 들어와 찻잎을 수매하기 시작했다.","ind":22,"bul":true},{"k":"p","html":"<b>만송 공차지와 박하당의 가치:</b> 의방 인근의 만송(曼松) 대흑산 지역은 황실에 바치는 최고급 찻잎을 생산하던 유명한 공차지(貢茶地)였다. 한편, 현재 이무 지역의 박하당(薄荷塘)은 최고급 고수차 산지로 꼽히며, 2022년 기준으로 100g당 약 120만 원에 거래될 정도로 희소성과 가치를 자랑한다.","ind":22,"bul":true},{"k":"note","html":"※ 만송 공차원의 역사는 이 문서 4 &amp; 5강 「만송촌과 다원관리」에서 다시 다뤄진다.","ind":14,"bul":false},{"k":"p","html":"<b>참고:</b> 중국 4대 명도(名陶)와 건수 자도: 중국의 4대 명품 도자기로는 강소성 의흥의 자사호, 운남성 건수의 자도, 광서성 흠주의 니흥도, 중경 영창의 영도가 꼽힌다. 운남의 건수(建水)는 자도의 생산지로 유명할 뿐만 아니라, 맑은 우물물로 만든 지역 특산물 &#x27;건수 구운 두부&#x27;로도 매우 유명한 곳이다.","ind":22,"bul":true},{"k":"note","html":"※ 의흥 자사호에 대해서는 자사호 길라잡이 Part.4에서 자세히 다룬다.","ind":14,"bul":false},{"k":"h3","text":"3. 19세기 고6대 차산 내 유통 거점의 이동"},{"k":"p","html":"<b>19세기 전반 의방(倚邦)의 전성기:</b> 19세기 전반까지 고 6대 차산의 행정과 유통의 중심지는 지역을 다스리던 관리인 토관(토사)이 거주하던 의방 지역이었다. 특히 유능한 토관이었던 &#x27;조당제(曹當齋)&#x27;의 치세 아래 의방은 차 무역의 황금기이자 최고의 전성기를 누렸다.","ind":22,"bul":true},{"k":"p","html":"<b>두문수의 난과 의방의 타격:</b> 그러나 19세기 중·후반, 운남 일대를 휩쓴 대규모 이슬람 무장 봉기인 &#x27;두문수의 난&#x27;과 대리 전쟁이 발발하면서 상황이 급변했다. 내전의 여파로 황실이 있는 북경이나 서장(티베트)으로 향하는 북방 유통로가 완전히 끊어졌고, 이로 인해 북방 무역의 중심지였던 의방 일대가 회복하기 힘든 큰 타격을 입게 되었다.","ind":22,"bul":true},{"k":"p","html":"<b>이무(易武)로의 중심지 이동과 남방 유통로의 개척:</b> 의방이 몰락한 이후, 차 무역의 중심은 6대 차산 중 가장 남쪽에 위치한 이무 지역으로 완전히 옮겨갔다. 이무는 지리적으로 라오스와 베트남을 거쳐 홍콩 등 동남아시아로 빠져나가는 &#x27;남방 유통로&#x27;를 개척하기에 매우 유리했기 때문이다.","ind":22,"bul":true},{"k":"p","html":"<b>호급차(號級茶) 상호들의 번성:</b> 유통 거점이 이무로 이동하고 남방 무역이 활성화된 이 시기에, 앞서 언급된 차순호(車順號)를 비롯하여 동경호, 송빙호 등 역사에 남은 유명한 민간 &#x27;호급차&#x27; 상호들이 이무 지역에서 찬란하게 번성하게 되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 차순호(車順號)의 서공천조(瑞貢天朝)의 역사적 의미"},{"k":"h3","text":"1. 호급차"},{"k":"p","html":"1950년대 이전에 생산된 차를 가리킨다. 한 통에 내표가 하나 들어간다.","ind":22,"bul":true},{"k":"p","html":"청나라 시기 이무 지역에서 특히 유명했다.","ind":22,"bul":true},{"k":"h3","text":"2. 차순호와 서공천조"},{"k":"p","html":"<b>설립자와 상호명:</b> 청나라 도광(道光) 연간(1839년경), 차창을 설립하여 보이차의 명성을 널리 퍼뜨린 핵심 인물의 이름은 &#x27;차순래(車順來)&#x27;이며, 그가 세운 다장의 상호명이 &#x27;차순호(車順號)&#x27;이다. 현재도 차순래의 후손들이 차순호의 상표권과 가문의 제다 전통을 그대로 이어가고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>관직 진출과 황실 공납:</b> 차순래는 단순히 차를 만드는 상인에 그치지 않고, 향시에 합격해 공생(貢生, 벼슬길에 오를 수 있는 신분)이라는 신분을 얻어 관직에 올랐다. 이를 바탕으로 북경의 황실에 가문의 찻잎을 공물로 바칠 수 있는 기회를 얻게 되었다.","ind":22,"bul":true},{"k":"p","html":"<b>현판 하사와 정치적 의도:</b> 차순래의 민간 차창에서 만든 공납차가 너무나 뛰어나자, 황제(도광제)가 그 맛에 크게 감탄하여 현판을 친히 내려주었다. 황제가 직접 이무 남단에 차창을 세워준 것은 아니지만, 멀고 험한 변방 오지의 민간 상인에게 친필 현판까지 내려준 행위 이면에는 황실의 권력과 통치력이 이무 최남단까지 굳건히 뻗치고 있음을 과시하려는 정치적 의도가 다분히 담겨 있었다.","ind":22,"bul":true},{"k":"p","html":"<b>&#x27;서공천조&#x27;의 의미:</b> 당시 차순래가 황제로부터 하사받은 현판의 글귀가 바로 저명한 &#x27;서공천조(瑞貢天朝)&#x27;이다. 이는 상서로울 서(瑞), 공물 공(貢), 천조(天朝, 청나라 조정)로 이루어져 있으며, &quot;상서로운 공물을 천조(황제)에게 바친 곳&quot;이라는 뜻이다. 이 어사 현판 덕분에 차순호는 최고의 보이차 명가로 역사적인 유명세를 얻게 되었다.","ind":22,"bul":true},{"k":"p","html":"<b>전쟁으로 인한 쇠퇴:</b> 1800년대 중후반은 운남성 일대에 전쟁이 빈번하여 차 산업도 큰 시련을 겪은 시기다. 특히 1856년부터 일어난 대규모 무장 봉기인 &#x27;두문수(杜文秀)의 난&#x27;으로 인해 운남 일대가 큰 전란에 휩싸였고, 이때 이무 지역의 차산과 교역로 역시 극심한 타격을 입고 쇠퇴하는 아픔을 겪었다.","ind":22,"bul":true},{"k":"note","html":"※ 두문수의 난과 홍콩 유통로 개척의 전체 경과는 Part.1 1 &amp; 2강 「※ 회족의 난과 홍콩 유통, 그리고 숙차의 시작」에 자세하다.","ind":14,"bul":false},{"k":"h3","text":"3. 두문수의 난과 그 이후"},{"k":"p","html":"<b>1800년대(청나라 후기) 중심지의 이동과 남방 유통:</b> 1800년대 후반을 기점으로 운남성 보이차의 중심지는 전통적인 산지였던 의방(倚邦)에서 이무(易武) 지역으로 완전히 이동했다. 전성기를 맞은 이무의 찻잎들은 마방(말에 짐을 싣고 다니는 상인)들의 굽이치는 교역로(차마고도)를 따라 라오스, 베트남 등 동남아시아로 수출되었고, 나아가 홍콩까지 진출하며 명성을 떨쳤다.","ind":22,"bul":true},{"k":"p","html":"<b>1930~40년대 중일전쟁과 차 전매제 실시:</b> 활발했던 남방 유통로는 1930년대 들어 서서히 막히기 시작했다. 특히 1937년 중일전쟁이 발발하면서 상황이 급변했다. 중국 국민당 정부는 전쟁을 치르기 위한 막대한 군비를 마련하고자 차(茶) 수출로 외화를 벌어들이기로 결정했다. 이를 위해 1938년 &#x27;운남 차업공사(성차사)&#x27;를 설립했고, 1939년에는 차 전매제(국가가 독점 판매)를 전격 실시했다. 또한 1939년 설립 준비를 거쳐 1940년에 현대식 공장인 불해실험차창(맹해차창의 전신)을 세웠다. 국가의 철저한 통제와 전매제 실시에 더해 전쟁의 여파가 겹치면서, 민간 상인들이 주도하던 이무의 전통적인 유통로는 완전히 끊어지게 되었다.","ind":22,"bul":true},{"k":"note","html":"※ 성차사 설립과 불해실험차창 설립 경위는 Part.1 5강 「성차사의 역사」·「운남 지역 국영차창의 설립 배경」, Part.2 4 &amp; 5강 「맹해차창의 노반장 차엽 수매」, Part.6 부록 「맹해정창 특강」에서도 다룬다.","ind":14,"bul":false},{"k":"p","html":"<b>1950년대 이무 차창의 몰락과 강외(강 밖)의 성행:</b> 1949년 신중국(중화인민공화국)이 수립된 후, 1950년대부터 공사합영(민간 기업의 국유화) 정책이 강력하게 추진되었다. 이 과정에서 가내수공업 형태로 운영되던 이무 지역의 전통 민간 차창(호급차창)들은 전부 문을 닫고 몰락했다. 그 빈자리를 맹해차창을 비롯한 란창강 바깥쪽(강외) 지역의 대형 국영 차창들이 차지하며 보이차 산업을 주도하게 되었다.","ind":22,"bul":true},{"k":"p","html":"<b>1980~90년대 개혁개방과 차순호 상표권 분쟁:</b> 시간이 흘러 1980~90년대 중국에 개혁개방 열풍이 일면서 민간 차 산업이 다시 기지개를 켰다. 이때 과거의 명성을 되찾고자 차순래의 후손들이 &#x27;차순호&#x27;의 상표권을 두고 분쟁을 벌였다. 형인 차지신(車智信)과 동생인 차지결(車智潔)이 정통성을 두고 다투었는데, 법적 공방 끝에 최종적으로 동생 차지결이 승리하여 현재까지 차순호의 상표권과 가업을 잇고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>1996년 호급차 복원과 2010년 이후 이무의 화려한 부활:</b> 오랜 기간 잊혔던 이무 차산이 다시 주목받은 것은 대만 차인들의 노력 덕분이었다. 대만의 보이차 애호가들은 과거 이무 지역에서 생산되던 최고급 골동보이차인 &#x27;호급차(號級茶)&#x27;들의 전통 방식을 복원하고 싶어 했다. 그 출발점으로 1996년 대만의 유명 차인 여례진(呂禮臻) 등이 이무로 직접 찾아가 현지인들과 함께 전통 방식의 차인 &#x27;진순아호(眞淳雅號)&#x27;를 성공적으로 만들어냈다. 이 사건을 계기로 전통 수공업 제다에 대한 관심이 폭발했고, 2010년 이후 옛 차의 본연의 맛을 재현하기 위해 수많은 자본과 사람들이 &quot;다시 이무로!&quot;를 외치며 몰려들면서 이무 지역은 화려하게 부활했다.","ind":22,"bul":true},{"k":"note","html":"※ 진순아호와 이무차의 부활은 보이차 길라잡이 Part.6 시대차품 1강 「이무차의 부활」에서 자세히 다룬다.","ind":14,"bul":false},{"k":"h1","text":"2강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 운남성 내의 태족 자치주와 자치현을 각각 기술해 보세요."},{"k":"p","html":"자치주 2개, 자치현 7개","ind":22,"bul":true},{"k":"p","html":"서쌍판납 태족자치주","ind":40,"bul":true},{"k":"p","html":"덕굉태족경파족 자치주","ind":40,"bul":true},{"k":"p","html":"자치현 7개 — ⟨경곡태족이족자치현 · 맹련태족랍호족와족자치현(이상 보이시) / 신평이족태족자치현 · 원강하니족이족태족자치현(이상 옥계시) / 경마태족와족자치현 · 쌍강랍호족와족포랑족태족자치현(이상 임창시) / 금평묘족요족태족자치현(홍하주)⟩","ind":22,"bul":true},{"k":"h3","text":"2. 중국의 1무(묘)는 오늘날의 면적 단위로 환산했을 때 어떤 넓이에 해당하는지 설명해 보세요."},{"k":"p","html":"1무 = 1묘 = 200평","ind":22,"bul":true},{"k":"note","html":"※ 1강 「복습 Quiz 3」에 같은 내용이 더 자세히 정리되어 있다.","ind":14,"bul":false},{"k":"h3","text":"3. 란창강과 서쌍판납의 지명적 연원을 태족의 남하설과 연관하여 설명해 보세요."},{"k":"p","html":"<b>태족의 남하와 정착:</b> 기원전 100년 무렵, 덕굉 일대에 살던 태족(다이족)의 지도자 '소나랍'이 300여 명의 무리를 이끌고 임창 방면으로 남하했다. 이들 중 일부가 강 유역에 짐을 풀고 정착했는데, 이는 고대 태족의 조상들이 수백 년에 걸쳐 북에서 남으로 이동해 정착촌을 형성해 나간 거대한 이주 역사의 일환이다.","ind":22,"bul":true},{"k":"p","html":"<b>'란창강(瀾滄江)' 지명의 유래:</b> 이들이 남하하는 과정에서 야생 코끼리를 무수히 많이 만났다고 한다. 그래서 자신들의 언어로 이 강을 '랑창강'이라고 부르기 시작했다. 태족어로 '랑(Lan)'은 숫자 100만을 뜻하고, '창(Xang)'은 코끼리를 뜻한다. 즉, &quot;백만 마리의 코끼리가 있는 강&quot;이라는 의미다. 이 태족어 발음을 한자로 소리 나는 대로 적은 것이 바로 오늘날의 '란창강'이 되었다. (참고: 국경을 맞대고 있는 라오스의 역사적인 '란상(Lan Xang) 왕국' 역시 &quot;백만 마리의 코끼리&quot;라는 완벽히 똑같은 어원을 공유하고 있다.)","ind":22,"bul":true},{"k":"p","html":"<b>&#x27;서쌍판납(西雙版納)&#x27; 지명의 유래:</b> 란창강 유역에서 더 남쪽으로 내려간 무리들은 훗날(1180년경) 경홍 일대를 중심으로 &#x27;맹륵(勐泐) 왕국&#x27;이라는 거대한 나라를 세웠다. 시간이 흘러 1570년(명나라 시기), 이 왕국은 세금을 효율적으로 걷기 위해 영토를 12개의 행정구역으로 나누었다. 태족 언어로 &#x27;십송(서쌍, Sipsong)&#x27;은 숫자 12를 뜻하고, &#x27;판납(Panna)&#x27;은 행정구역의 단위(정확히는 세금을 바치는 1,000개의 논)를 뜻한다. 즉, 이 나라가 12개로 나뉜 것을 &#x27;서쌍&#x27;이라 하고, 그 구역 하나하나를 &#x27;판납&#x27;이라 불렀기 때문에, 이 둘이 합쳐져 &quot;12개의 판납(행정구역)&quot;이라는 뜻의 &#x27;서쌍판납&#x27;이라는 지명이 탄생하게 된 것이다.","ind":22,"bul":true},{"k":"h3","text":"4. 황편차의 당뇨에 대한 효능을 설명해 보세요."},{"k":"p","html":"인슐린 저항성은 모든 당뇨에 효과가 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 보이차에 관한 문헌자료"},{"k":"p","html":"현실적으로 의미가 없다.","ind":0,"bul":false},{"k":"h3","text":"1. 당대 (618년~907년)"},{"k":"p","html":"번작(樊綽)의 『만서(蠻書)』","ind":0,"bul":false},{"k":"p","html":"<i>「은생성 경내의 여러 산에서 차가 나는데 야생차를 채취하며 산차로 만들어 보관하고 별도의 채엽, 제다 방법 등의 제조법이 없다. 몽사의 만인들은 화초, 생강, 계피 등과 함께 끓여 마신다.」</i>","ind":25,"bul":false},{"k":"p","html":"번작의 『만서(蠻書)』에 운남 차에 대한 역사상 첫 기록이 등장한다. 당시 운남(남조국)에서는 야생차를 채취해 산차 형태로 보관하다가 산초, 생강, 계피 등과 끓여 마셨다. 육우의 『다경』이 출간되며 차 문화가 발달했던 중원과 달리 정교한 제다법은 없었다. ","ind":22,"bul":true},{"k":"h3","text":"2. 송대 (960년~1279년)"},{"k":"p","html":"범성대의 『계해우형지(桂海虞衡志)』","ind":0,"bul":false},{"k":"p","html":"이석의 『속박물지(續博物志)』","ind":0,"bul":false},{"k":"p","html":"범성대의 『계해우형지』에 서남부 소수민족과의 차마무역(말과 차의 교환) 기록이 등장한다. 그러나 이석의 『속박물지』 등 운남 차의 제다 기술에 대한 묘사는 당나라 때와 차이가 없어 뚜렷한 발전은 없었다. 원나라 시기에도 특별한 기록은 남아있지 않다. ","ind":22,"bul":true},{"k":"h3","text":"3. 명대 (1368년~1644년)"},{"k":"p","html":"사조절의 『전략(滇略)』 / 서하객의 『전유일기(滇遊日記)』","ind":0,"bul":false},{"k":"p","html":"한족의 운남 지배 체계가 확고해진 시기다. 사조절의 『전략(滇略)』에 역사상 처음으로 보이차의 원형인 &#x27;보차(普茶)&#x27;라는 단어가 기록되었다. 찻잎을 쪄서 뭉치는 중청(덩이차) 형태로 소비했다. 한편 중원에서는 정덕 연간(1506~1521년)에 공춘이 자사(紫砂) 차호를 처음 만들며 차 문화가 극도로 발달했다. ","ind":22,"bul":true},{"k":"h3","text":"4. 청대"},{"k":"p","html":"방이지의 『물리소식』 / 악이태의 『운남통지』 / 『전운력년지』 / 장홍의 『전남신어』 / 조학민의 『본초강목습유』 / 왕창의 『전행일록』 / 오대훈의 『전남견문록』 / 단체의 『전해우형지』 / 사범의 『전계산수기』 / 완복의 『보이차기』 / 『보이부지』","ind":0,"bul":false},{"k":"p","html":"<i>「보이차의 명성이 천하에 유명한 까닭에 차를 생산함이 이익이 되어 이곳에서는 산에 들어가 차를 재배하는 사람이 수십만 인이고, 차상인들이 차를 사서 각지로 운반하느라 길이 비좁을 지경이다. … 보이차가 나는 곳은 육대차산에 속해 있는데 그 주위가 팔백리에 이르며 첫째가 유락(攸樂), 둘째가 혁등(革登), 셋째가 의방(倚邦), 넷째가 망지(莽枝), 다섯째가 만전(蠻磚), 여섯째가 만살(曼撒)이다.」</i>","ind":25,"bul":false},{"k":"p","html":"방이지의 『물리소식』 등 수많은 문헌에 보이차가 기록된 최전성기다. 완복은 『보이차기』에서 차를 재배하고 운반하는 수십만 인파를 묘사했으며, 고 6대 차산(유락, 혁등, 의방, 망지, 만전, 만살)을 명확히 기록했다. ","ind":22,"bul":true},{"k":"p","html":"만송 공차","ind":22,"bul":true},{"k":"p","html":"의방 지역의 만송(曼松)은 첫 새싹만 따서 큼직하게 긴압해 황실에 바치던 유명한 공차(貢茶) 산지다. 1500~1600년대(명대)에 석병 한족들이 들어와 조성한 재래종 다원이 1700~1800년대(청대)에 이르러 최고급 진상품이 되었다. ","ind":40,"bul":true},{"k":"p","html":"서공천조","ind":22,"bul":true},{"k":"p","html":"이무 지역의 민간 차창인 차순호가 도광제로부터 받은 이 현판은, 멀고 험한 변방 오지까지 중원 황실의 통치력과 영향력이 굳건히 미치고 있음을 대내외에 과시하는 정치적 의도도 내포하고 있었다. ","ind":40,"bul":true},{"k":"p","html":"두문수의 난","ind":22,"bul":true},{"k":"p","html":"19세기 중후반 &#x27;두문수의 난&#x27;과 연이은 청나라의 멸망으로 황실(북경)로 향하던 북방 유통로가 완전히 끊어졌다. 이후 약 100여 년간 홍콩, 동남아 등지로 향하는 남방 유통로에만 의존하다가, 2000년대 고차수 열풍 이후 북방 유통이 재개되었다. ","ind":40,"bul":true},{"k":"p","html":"1950년대 이전 호급차","ind":22,"bul":true},{"k":"p","html":"재래종, 혼채, 1아 3엽으로 고급차라고 하기는 어렵다. 1950년대 이전 남방으로 유통되던 전통 호급차들은 여러 다원의 찻잎을 섞는 혼채 방식과 1아 3엽의 채엽 기준을 주로 사용했다. 반면 현대 보이차 시장은 2008년 진승차창과 노반장촌의 30년 독점 계약(2013년 파기) 및 2011년 프리미엄 차 출시 등을 기점으로 단일 산지(순료)의 가치를 극대화한 고수차 중심으로 재편되었다. ","ind":40,"bul":true},{"k":"h2","text":"□ 서쌍판납의 역사"},{"k":"p","html":"서쌍판납 일대의 역사는 남조국 및 대리국의 그것과 깊이 관련되어 있다. 이를 살펴보면 다음과 같다.","ind":0,"bul":false},{"k":"h3","text":"1. 남조국 (738년~902년)"},{"k":"p","html":"<b>성립 배경:</b> 운남 얼하이(이해) 호수 일대에 흩어져 있던 6개의 부족 국가(육조, 六詔) 중, 가장 남쪽에 있던 몽사조가 나머지 부족을 통일하여 세운 나라가 바로 &#x27;남조국(南詔國)&#x27;이다. 중원(당나라)과는 완전히 별개의 독자적인 국가였다.","ind":22,"bul":true},{"k":"p","html":"<b>외교 정책:</b> 당시 티베트 지역의 강력한 제국이었던 토번(吐蕃)은 당나라와 치열한 패권 경쟁을 벌이고 있었다. 토번은 남조국을 지원하고 키워 당나라를 견제하려 했고, 남조국은 이 두 강대국 사이에서 뛰어난 줄타기 외교를 전개하며 약 200년 동안 국가를 존속시켰다.","ind":22,"bul":true},{"k":"p","html":"<b>중원의 인식:</b> 운남 일대는 1250년대 몽골족의 원나라에 공식 편입되기 전까지 중원 한족의 관점에서는 철저히 남의 땅(이민족의 땅)이자 지배력이 닿지 않는 미개척지로 취급되었다.","ind":22,"bul":true},{"k":"h3","text":"2. 대리국 (937년~1254년)"},{"k":"p","html":"<b>건국:</b> 남조국이 902년에 멸망한 후 짧은 혼란기를 거쳐, 937년 단사평(段思平)이 대리(大理) 지역을 수도로 삼아 새롭게 건국한 나라다.","ind":22,"bul":true},{"k":"p","html":"<b>불교의 융성:</b> 국가 차원에서 불교를 매우 숭상하여 &#x27;묘향불국(妙香佛國, 훌륭한 향기가 나는 부처의 나라)&#x27;이라 불릴 정도로 사찰과 불교문화가 화려하게 발달했다.","ind":22,"bul":true},{"k":"p","html":"<b>송나라와의 교역 (마차무역):</b> 동시대 중원의 송나라와는 지배-피지배 관계가 아닌 조공 및 교역 관계를 유지했다. 특히 국방력이 약했던 송나라가 대리국의 우수한 말을 얻기 위해 찻잎과 교환하는 마차(馬茶) 무역이 매우 활발했다. (앞서 언급된 범성대의 『계해우형지』 속 차 교역 기록이 바로 이 시기의 시대상을 반영한다.)","ind":22,"bul":true},{"k":"p","html":"<b>멸망과 중원 편입:</b> 1253년 몽골 제국 쿠빌라이 칸의 대대적인 남정(원정)을 받아 수도가 함락되며 멸망했다. 이듬해인 1254년 원나라에 완전히 편입되면서, 운남 지역은 역사상 처음으로 중원 왕조의 직접적인 행정 지배 영역(운남행성) 안으로 들어가게 되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 옹정제의 개토귀류"},{"k":"h3","text":"1. 토사와 류관"},{"k":"p","html":"<b>토사(토관):</b> 현지인에게 지역을 통치하도록 하고 관직을 주는 제도이다.","ind":22,"bul":true},{"k":"p","html":"<b>류관:</b> 중앙에서 내려보내는 사람. 암행어사처럼 임명직이며, 류관 중 가장 높은 지위는 도독이다.","ind":22,"bul":true},{"k":"p","html":"원(元)","ind":22,"bul":true},{"k":"p","html":"처음 선위사(宣慰司)를 두어 중원의 지배 영역에 들어갔다. 몽골의 시기이다.","ind":40,"bul":true},{"k":"p","html":"명(明)","ind":22,"bul":true},{"k":"p","html":"원말명초에 석병 한족들이 진입했다. (몽골의 잔재를 없애기 위해서였다.) 주원장 친족의 나라이다.","ind":40,"bul":true},{"k":"p","html":"의방노가에 터를 잡고 우곤당까지 확장했다.","ind":40,"bul":true},{"k":"p","html":"청(淸)","ind":22,"bul":true},{"k":"p","html":"차산 무역이 시작되었다. 명말청초에 6대차산이 지금처럼 성립되었다.","ind":40,"bul":true},{"k":"h3","text":"2. 류관제도 도입과 유락동지"},{"k":"h4","text":"개토귀류(改土歸流)의 실행"},{"k":"p","html":"기존 원주민 지도자(토사, 토관)의 권력을 빼앗고, 중앙에서 관리(류관)를 직접 파견한 정책이다.","ind":22,"bul":true},{"k":"p","html":"이를 통해 변방의 험한 차산을 통제하는 강력한 중앙집권 체제를 만들어냈다.","ind":22,"bul":true},{"k":"p","html":"청나라 옹정제(재위 1722~1735년) 때, 정권이 안정되자 본격적으로 실행했다.","ind":22,"bul":true},{"k":"p","html":"차산의 지배 구조가 원주민에서 한족 중심으로 바뀌며 차 산업에 엄청난 영향을 주었다.","ind":22,"bul":true},{"k":"h4","text":"우곤당 치정 사건과 2년의 전쟁"},{"k":"p","html":"강서성(경덕진) 출신의 한족 상인이 망지차산 우곤당에 머물며 차 무역에 매진하고 있었다.","ind":22,"bul":true},{"k":"p","html":"이 한족 상인이 그 지역을 다스리던 망지 토관의 부인과 불륜(바람)이 났다.","ind":22,"bul":true},{"k":"p","html":"분노한 토사가 이 강서성 상인의 목을 베어 내걸자, 한족 상인들이 중앙 정부에 강력히 항의했다.","ind":22,"bul":true},{"k":"p","html":"중앙 정부는 이를 개토귀류의 완벽한 빌미로 삼았다.","ind":22,"bul":true},{"k":"p","html":"&quot;토사가 한족의 재산을 빼앗고 무고하게 죽였다&quot;는 누명을 씌워 토벌 군대를 내려보냈다.","ind":22,"bul":true},{"k":"p","html":"무려 2년 동안 이어진 끔찍한 전쟁 끝에 결국 토사 세력이 궤멸하고 패배했다.","ind":22,"bul":true},{"k":"h4","text":"유락동지 설치와 선유우곤당 후유보이부"},{"k":"p","html":"전쟁에서 승리한 청나라 정부는 권력을 빼앗고 &#x27;유락동지(攸樂同知)&#x27;라는 관청을 세웠다.","ind":22,"bul":true},{"k":"p","html":"중앙에서 동지(류관, 파견 관리)를 내려보내 유락 일대의 권력을 장악하게 했다.","ind":22,"bul":true},{"k":"p","html":"차 무역을 통제하기 위해 이듬해(1729년) 정식으로 국가 관청인 &#x27;보이부&#x27;까지 설치했다.","ind":22,"bul":true},{"k":"p","html":"선유우곤당 후유보이부(先有牛滾塘 後有普洱府): &quot;먼저 우곤당의 끔찍한 사건이 있었고, 그로 인해 보이부가 설치되었다&quot;는 뼈아픈 역사의 흐름을 가리키는 유명한 옛말이다.","ind":22,"bul":true},{"k":"h3","text":"3. 개토귀류의 수정과 차산의 발전"},{"k":"p","html":"<b>파견 관리(동지)의 착취와 차산의 황폐화:</b> 중앙에서 파견된 유락(攸樂) 지역의 관리인 &#x27;동지&#x27;는 원주민들의 찻잎 개인 판매를 엄격히 금지했다. 오직 관의 허락을 통해서만 판매할 수 있었고, 막대한 세금도 부과되었다. 무엇보다 관리들은 찻잎을 강제로 징발(착취)하면서도 정당한 값을 지불하지 않았고, 이러한 가혹한 수탈로 인해 번성하던 차산은 급격히 황폐해졌다.","ind":22,"bul":true},{"k":"p","html":"<b>원주민의 반란과 풍토병의 악순환:</b> 생존권을 위협받은 현지 원주민들은 결국 반란을 일으켰다. 설상가상으로 이 지역은 덥고 습한 열대 환경으로 인해 전염병이 창궐했으며, 반란과 질병이 겹치며 수많은 사람이 목숨을 잃는 비극이 반복되었다.","ind":22,"bul":true},{"k":"p","html":"<b>보이부(普洱府) 설립과 정책의 한계:</b> 1729년(옹정 7년), 청나라 정부는 운남 차산을 효율적으로 통제하기 위해 &#x27;보이부&#x27;를 설립하고 유락 지역에 &#x27;유락동지&#x27;를 파견했다. 하지만 파견된 관리들의 부패와 폭정으로 인해 통치가 불가능해지자, 1735년경 결국 유락동지를 철수시키게 되었다. (원문 노트의 1920년대는 1720년대의 명백한 오기이다.)","ind":22,"bul":true},{"k":"p","html":"<b>개토귀류 정책의 수정:</b> 직접 지배(개토귀류)가 실패하자, 청나라 정부는 결국 정책을 수정하였다. 중앙 관리의 직접 파견을 포기하는 대신, 기존의 현지 원주민 지도자인 토관(토사)에게 다시 유락 지역의 관리를 맡겼다. 이후 토관이 책임지고 세금과 공물용 차를 거두어 행정 중심지인 보이부로 직접 운송해 납품하도록 지시하며 타협점을 찾았다.","ind":22,"bul":true},{"k":"h4","text":"진순아호(眞淳雅號)"},{"k":"p","html":"<b>홍콩 및 대만에서의 위상:</b> 홍콩과 대만의 정통 보이차 애호가 및 수집가들 사이에서 매우 깊게 인정받는 명가이다.","ind":22,"bul":true},{"k":"p","html":"<b>중국 본토에서의 인지도:</b> 대중적인 상업 시장에서는 인지도가 다소 낮으나, 본토의 고급 보이차 및 고수차 마니아층 사이에서는 확고한 위상을 차지하고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>역사적 의미와 가치:</b> 단순히 개인이 차를 소량 제작한 수준을 넘어선다. 1950년대 이후 몰락했던 이무(易武) 지역의 전통 제다 맥이 끊겼을 때, 대만 차인(여례진 등)들이 직접 건너와 옛 호급차(號級茶)의 제다 철학을 복원하고 현대적인 &#x27;순료(단일 산지) 고수차&#x27; 열풍의 불씨를 지폈다는 점에서 현대 보이차 역사상 매우 중요한 기념비적 가치를 지닌다.","ind":22,"bul":true},{"k":"h1","text":"3강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 하관차창의 긴차형 긴압차 생산의 중단과 86년 재생산 결정의 배경을 설명해 보세요."},{"k":"h4","text":"가. 배경 — 긴차와 반선(판첸)라마"},{"k":"p","html":"긴차 = 마고차 = 마고타차","ind":22,"bul":true},{"k":"p","html":"반선(판첸)라마는 티베트 불교의 2인자(아미타불의 화신)로, 중국에 볼모로 잡혀 있었다.","ind":22,"bul":true},{"k":"p","html":"1인자는 관음보살의 화신인 달라이라마이다.","ind":40,"bul":true},{"k":"h4","text":"나. 시간 순 경과"},{"k":"p","html":"1955년 — 1941년에 설립된 하관차창은 기존 초코송이(버섯) 모양의 긴차 생산을 중단하고, 형태를 벽돌 모양의 전차(磚茶)로 바꾼다. 그럼에도 티베트인들은 차마고도를 통해 유입된 이 차로 계속 수유차(밀크티)를 만들어 마신다. ","ind":22,"bul":true},{"k":"p","html":"1986년 — 판첸라마가 전국인민대표대회 부위원장(공산당 고위 간부) 신분으로 하관차창을 시찰한다. 시찰 중 그가 과거 즐기던 버섯 모양 긴차의 재생산을 요청한다. 하관차창은 이를 거절할 수 없었고, 중국 정부 역시 소수민족을 존중하며 수출도 장려한다는 선전 효과를 노려 재생산을 결정한다. ","ind":22,"bul":true},{"k":"note","html":"※ 하관차창의 연혁(1941년 강장차창 설립~2004년 민영화)은 Part.1 6강 「하관차창의 역사」에 정리되어 있다.","ind":14,"bul":false},{"k":"p","html":"1980년대 후반 — 하관차창은 고급 원료를 사용해 100여 개 한정판 긴차를 만들어 판첸라마에게 선물한다. ","ind":22,"bul":true},{"k":"p","html":"1989년 — 판첸라마가 독살 의혹 속에 사망한다. 이후 달라이라마가 진짜 후계자를 지목했으나, 중국 정부가 그를 납치하고 가짜 후계자를 내세우는 사건이 발생한다. ","ind":22,"bul":true},{"k":"p","html":"1990년대 — 경제 개방으로 개인 차창이 성행하고 잉여 생산물이 많아지면서 시장에 가짜 차가 대량으로 유통된다. 이 시기의 노수원차 등 오래된 차는 반드시 공식 도록에 실려 있어야 진품으로 인정받는다.","ind":22,"bul":true},{"k":"h4","text":"다. 정리 — 진위 판별의 기준"},{"k":"p","html":"긴차 생산은 1955년에 중단되어 1986년에 재개되었다.","ind":22,"bul":true},{"k":"p","html":"따라서 70년대 하관 긴차는 역사적으로 존재할 수 없다.","ind":22,"bul":true},{"k":"p","html":"80년대(86년 이후) 긴차부터 진품으로 존재할 수 있다.","ind":22,"bul":true},{"k":"h3","text":"2. 칠자병차의 유래에 대해 설명해 보세요."},{"k":"p","html":"<b>기본 개념:</b> &#x27;칠자(일곱 개)&#x27;는 둥근 병차 7개를 한 묶음(통)으로 포장한 단위이자, 무게를 달고 세금을 매기는 기준이었다.","ind":22,"bul":true},{"k":"p","html":"<b>청나라 차법(茶法)의 규정:</b> 1735년(옹정제 13년), 청나라 정부는 차법을 정비하면서 둥근 차 일곱 개를 대나무 껍질로 싸서 한 통(筒)으로 묶도록 아예 법으로 못 박았다.","ind":22,"bul":true},{"k":"p","html":"<b>표준화의 목적:</b> 이렇게 단위를 통일해서 차의 무게와 세액을 표준화해야만, 먼 길을 운송하고 국가가 세금을 거두기 훨씬 쉬웠기 때문이다.","ind":22,"bul":true},{"k":"p","html":"<b>오늘날의 규격 관행:</b>","ind":22,"bul":true},{"k":"p","html":"현재 병차 1편(개)은 357g이다.","ind":40,"bul":true},{"k":"p","html":"이것을 7편 묶은 1통은 약 2.5kg이다.","ind":40,"bul":true},{"k":"p","html":"이 통포장 12통을 모은 대포장(대건)은 약 30kg이다. (말 한 마리가 보통 양쪽에 30kg씩, 총 60kg을 싣고 차마고도를 걸었다.)","ind":40,"bul":true},{"k":"note","html":"※ 같은 규격(357g·2.5kg·30kg)이 Part.1 1 &amp; 2강 「가공공정 2 — 생차」 포장 섹션에도 정리되어 있다.","ind":14,"bul":false},{"k":"p","html":"<b>문화적 상징:</b> 숫자 &#x27;7(칠)&#x27;과 아들 &#x27;자(子)&#x27;를 써서, 자손이 끝없이 번성하고 복이 많기를 바라는 &#x27;다자다복(多子多福)&#x27;의 좋은 뜻도 포장지에 함께 담았다.","ind":22,"bul":true},{"k":"h3","text":"3. 선유우곤당, 후유보이부의 의미를 개토귀류와 관련하여 설명해 보세요."},{"k":"p","html":"<b>옛말의 의미:</b> &quot;먼저 우곤당이 있었고, 그 후에 보이부가 생겼다&quot;는 뜻이다.","ind":22,"bul":true},{"k":"p","html":"<b>우곤당의 번성:</b> 청나라 정부가 차 무역을 관리하려고 &#x27;보이부&#x27;를 세우기 한참 전부터, 망지 차산의 &#x27;우곤당&#x27;은 이미 6대 차산 최대의 차 거래 시장으로 엄청나게 번성해 있었다.","ind":22,"bul":true},{"k":"p","html":"<b>개토귀류와의 연결 고리:</b>","ind":22,"bul":true},{"k":"p","html":"돈이 몰리던 이 우곤당에서 한족 상인과 원주민 지도자(토관) 부인 사이에 치정 사건이 터졌다.","ind":40,"bul":true},{"k":"p","html":"이 사건이 원주민과 한족 상인 간의 피바람 부는 전쟁으로 커지자, 청나라 중앙 군대가 이를 진압하러 산속으로 밀고 내려왔다.","ind":40,"bul":true},{"k":"p","html":"청나라 정부는 이 기회에 원래 지역을 다스리던 원주민 지도자(토사)들의 권력을 빼앗고, 중앙에서 직접 관리(류관)를 파견하는 &#x27;개토귀류(改土歸流)&#x27; 정책을 강제로 밀어붙였다.","ind":40,"bul":true},{"k":"p","html":"그 후 차 무역을 철저히 통제하고 세금을 걷기 위해 정식 국가 관청인 &#x27;보이부(1729년)&#x27;를 세우게 된 것이다.","ind":40,"bul":true},{"k":"p","html":"<b>결론:</b> 즉, 우곤당의 엄청난 번성과 그곳에서 터진 사건이 중앙 정부의 무력 개입(개토귀류)을 불렀고, 결과적으로 보이부가 탄생하는 결정적 계기가 되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 기낙족 개론"},{"k":"p","html":"55번째로 등록된 소수민족이다.","ind":22,"bul":true},{"k":"h3","text":"1. 지리적 위치"},{"k":"p","html":"기낙산(유락산) 내 40여 개 촌락으로 이뤄진 기낙족향은 운남성 서쌍판납태족자치주의 주도인 경홍시에서 동북 방향 24km에 위치한다. 동서로 75km, 남북으로 50km가 넘는 넓은 면적을 가진 유락산은 도로망이 촘촘히 발달되어 다른 차산으로의 산길이 연계되며(사통팔달) 도로 포장률도 60%에 육박한다. 일 최고기온 40도, 연평균기온 20도, 연 강수량 1,400mm로 아열대 기후에 속하며 575m~1,691m의 해발고도에 일교차가 큰 산악지대 기후 특성을 갖는다.","ind":0,"bul":false},{"k":"p","html":"운남성 서쌍판납태족자치주","ind":22,"bul":true},{"k":"p","html":"1시 2현 (하나의 시와 2개의 현)","ind":40,"bul":true},{"k":"p","html":"경홍시","ind":56,"bul":true},{"k":"p","html":"<b>맹해현:</b> 강 왼쪽. 노반장, 노만아 등","ind":56,"bul":true},{"k":"p","html":"<b>맹랍현:</b> 강 오른쪽. 만송 등","ind":56,"bul":true},{"k":"h3","text":"2. 기낙족의 탄생설화와 전통문화"},{"k":"h4","text":"가. 탄생설화와 홍수설화"},{"k":"p","html":"탄생설화 — 아모요부의 천지창조","ind":22,"bul":true},{"k":"p","html":"태초에 메마른 땅에 생긴 알에서 창조주 여신 아모요부가 태어나, 알을 반으로 쪼개어 하늘(달과 별)과 땅을 만들었다. 자신과 닮은 최초의 인간인 마흑(남)과 마뉴(여)를 창조하고 세상 모든 생명체에게 각자의 언어를 나누어 주었으나, 서로 말이 통하지 않아 다툼과 혼란만 가득했다.","ind":40,"bul":true},{"k":"p","html":"홍수설화 — 마흑과 마뉴의 생존","ind":22,"bul":true},{"k":"p","html":"끝없는 다툼에 분노한 아모요부는 세상을 처음으로 되돌리기 위해 7일 밤낮으로 비를 내려 대홍수를 일으켰다. 배를 타고 유일하게 살아남은 이들이 바로 마흑과 마뉴였는데, 여신은 다시 혼란이 생기는 것을 막고자 이들에게서 언어를 빼앗았다. 홍수가 끝난 후 살아남은 두 남녀가 결합해 인류를 이었고, 그 후손이 바로 오늘날의 기낙족이 되었다.","ind":40,"bul":true},{"k":"h4","text":"나. 전통문화"},{"k":"p","html":"신화 재현 (큰 북)","ind":22,"bul":true},{"k":"p","html":"홍수 때 조상들이 큰 북에 숨어 살아남았다는 설화를 재현한다.","ind":40,"bul":true},{"k":"p","html":"마을 광장에 큰 북을 걸어놓고 치면서 춤을 춘다.","ind":40,"bul":true},{"k":"p","html":"장방(長房)과 대가족","ind":22,"bul":true},{"k":"p","html":"가장을 중심으로 긴 형태의 집(장방)에 모여 사는 토착 부계 사회이다.","ind":40,"bul":true},{"k":"p","html":"아버지가 돌아가시면 이듬해에 작은 집을 지어 바치는 풍습이 있다.","ind":40,"bul":true},{"k":"p","html":"특모절(特懋克)","ind":22,"bul":true},{"k":"p","html":"기낙족 최대 명절이다. (양력 2월 6일부터 3일간)","ind":40,"bul":true},{"k":"p","html":"태족의 &#x27;발수절&#x27;에 비견되며, 농신에게 풍년을 기원하며 잔치를 열고 북춤을 춘다.","ind":40,"bul":true},{"k":"p","html":"유락산 민속 문화","ind":22,"bul":true},{"k":"p","html":"기낙족 여성들은 방직과 자수 솜씨가 뛰어나다.","ind":40,"bul":true},{"k":"p","html":"유락산(기낙산) 민속촌에서 전통 음식과 행사 등을 선보인다.","ind":40,"bul":true},{"k":"h3","text":"3. 제갈공명과 기낙족"},{"k":"h3","text":"무후유종(武侯遺種)과 차조회(茶祖會)"},{"k":"p","html":"<b>무후유종:</b> &#x27;무후(제갈공명)가 남긴 차나무 종자&#x27;라는 뜻이다.","ind":22,"bul":true},{"k":"p","html":"현지 원주민들은 자신들이 키우는 차나무를 제갈공명이 주었다고 굳게 믿는다.","ind":22,"bul":true},{"k":"p","html":"하지만 실제 역사를 보면, 제갈공명의 부대가 운남 남부(서쌍판납) 깊숙이까지 직접 내려간 적은 없다.","ind":22,"bul":true},{"k":"p","html":"<b>차조회:</b> 6대 차산 지역에서 제갈공명이 떠났다고 전해지는 날에 맞추어 열리는 전통 행사이다.","ind":22,"bul":true},{"k":"p","html":"이날 사람들은 불전(사찰)에 귀한 차를 바치며 차의 시조인 공명의 은혜를 기린다.","ind":22,"bul":true},{"k":"h3","text":"남만정벌(南蠻征伐)과 차 문화의 유입"},{"k":"p","html":"유비가 세상을 떠난 후, 제갈공명은 본격적인 중원 진출(북벌)을 꾀했다.","ind":22,"bul":true},{"k":"p","html":"북벌에 앞서 후방의 위협을 없애고 부족한 병력과 자원을 확보하기 위해 남쪽(맹획 세력)을 정벌했다.","ind":22,"bul":true},{"k":"p","html":"<b>칠종칠금(七縱七擒):</b> 정벌 과정에서 적장 맹획을 일곱 번 잡고 일곱 번 풀어주어 마침내 진심 어린 항복을 받아냈다.","ind":22,"bul":true},{"k":"p","html":"이 남만정벌을 결정적 계기로, 태족 등 남방의 소수민족들이 한족의 선진 문화를 수용하게 되었다.","ind":22,"bul":true},{"k":"p","html":"이때 한족의 문화를 받아들이면서 중원의 차(茶) 문화도 함께 유입되어 뿌리내리게 되었다.","ind":22,"bul":true},{"k":"h3","text":"4. 기낙족의 수난사"},{"k":"p","html":"1720년대 청나라 옹정제 시기, 평화롭던 유락산에 &#x27;개토귀류(외지 관리 파견)&#x27; 정책이 떨어지며 비극의 막이 오름.","ind":22,"bul":true},{"k":"p","html":"탐욕스러운 외지 관리와 상인들이 몰려와 기낙족의 땀이 밴 찻잎을 헐값에 강탈했다.","ind":22,"bul":true},{"k":"p","html":"엎친 데 덮친 격으로 전염병까지 창궐하며 촌락의 인구와 차밭이 무참히 파괴되었다.","ind":22,"bul":true},{"k":"p","html":"생존의 벼랑 끝에 몰린 기낙족은 무기를 들었으나, 잔혹한 진압과 처절한 반란만이 피투성이로 반복되었다.","ind":22,"bul":true},{"k":"p","html":"끈질긴 사투 끝에 마침내 관청(유락동지)이 두 손을 들고 철수했고, 상처 입은 땅의 지배권은 다시 토착 관리에게 되돌아감.","ind":22,"bul":true},{"k":"p","html":"류관의 수탈은 끝났으나, 계속되는 전란과 가혹한 세금이 그들의 남은 숨통을 조였다.","ind":22,"bul":true},{"k":"p","html":"한때 푸르렀던 삶의 터전인 차산은 18세기 개토귀류 이후 약 200년이 넘는 기나긴 세월 동안 척박한 땅으로 방치됨. (청나라 건국 기준 약 300년의 암흑기)","ind":22,"bul":true},{"k":"p","html":"1949년 새로운 국가(중화인민공화국)가 수립되며 거대한 사회 체제의 격변을 온몸으로 겪어냄.","ind":22,"bul":true},{"k":"p","html":"오랜 고통과 인내의 시간 끝에, 1979년 마침내 중국의 56개 공인 민족 중 마지막인 &#x27;55번째 소수민족&#x27;으로 호명되었다.","ind":22,"bul":true},{"k":"p","html":"약 250년에 걸친 핍박과 수난의 굴곡을 넘어, 잃어버렸던 민족의 정체성과 이름을 당당히 되찾으며 마침표를 찍었다.","ind":22,"bul":true},{"k":"h2","text":"□ 유락산의 고차수 현황"},{"k":"p","html":"차나무를 심은 지 천년이 되었다.","ind":22,"bul":true},{"k":"h3","text":"1. 유락산의 행정구역"},{"k":"p","html":"<b>공식 명칭:</b> 행정구역상 서쌍판납 태족자치주 경홍시(景洪市)에 속하며, 현재의 공식 명칭은 &#x27;기낙산 기낙족향(基諾山基諾族鄕)&#x27;이다. (&#x27;유락&#x27;은 &#x27;기낙&#x27;의 옛 음역이다.)","ind":22,"bul":true},{"k":"p","html":"<b>관할 촌락:</b> 산하에 사토(司土), 파아(巴亞), 파잡(巴卡), 낙특(洛特) 등 여러 촌위원회(마을 자치 조직)가 있으며, 그 아래로 40여 개의 자연촌(실제 거주 마을)이 딸려 있다.","ind":22,"bul":true},{"k":"h3","text":"2. 유락산의 일반적인 지리 조건"},{"k":"p","html":"<b>지형 및 기후:</b> 해발 575~1,691m에 이르는 산악지대다. 연평균 기온 약 20℃, 연평균 강수량 1,400mm 수준의 전형적인 아열대 기후에 속하며, 일교차가 커서 차나무가 훌륭한 향기를 머금기에 좋은 조건을 갖추고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>면적 및 교통:</b> 동서 75km, 남북 50km가 넘는 매우 넓은 면적을 차지하고 있다. 도로망이 사통팔달로 발달해 있어, 산길을 통해 다른 주요 차산들과 긴밀하게 연계된다.","ind":22,"bul":true},{"k":"h3","text":"3. 유락산 내 고차수 분포 현황"},{"k":"p","html":"유락산의 고차수들은 한곳에 집중되어 있기보다는, 아락, 파표, 사토노채, 락특노채 등 산비탈과 능선을 따라 여러 고다원(옛 차밭)을 중심으로 넓게 흩어져 분포하는 특징을 보인다. ","ind":0,"bul":false},{"k":"h3","text":"4. 고차원별 지리 조건 및 고차수 분포 현황"},{"k":"h4","text":"가. 아락(亞諾) 고다원"},{"k":"p","html":"유락산 전체에서 가장 널리 알려진 핵심 고다원이다. 해발 고도가 높은 편에 속하며, 유락산의 주인이자 원주민인 기낙족의 대표적인 마을과 함께 자리 잡고 있어 기낙족 차 문화의 중심지 역할을 한다. ","ind":0,"bul":false},{"k":"h4","text":"나. 파표(巴漂) 고다원"},{"k":"h4","text":"다. 사토노채(司土老寨) 고다원"},{"k":"h4","text":"라. 락특노채(洛特老寨) 고다원"},{"k":"h2","text":"□ 소수민족의 기원 — 복족"},{"k":"h3","text":"1. 소수민족의 기원으로써의 복족"},{"k":"p","html":"아주 먼 옛날, 고대 진나라와 한나라 시절에 중국 서남쪽 일대를 누비며 살던 여러 부족 집단이 있었다. 이들을 통틀어 &#x27;복족(濮族)&#x27;이라 부르며, 무리가 많아 &#x27;백복(百濮)&#x27;이라고도 했다. 딱 하나의 단일 부족이라기보다는 비슷한 문화를 공유하던 고대 무리들을 뭉뚱그려 부르는 명칭이다. ","ind":0,"bul":false},{"k":"h3","text":"2. 복족에 관한 문헌기록"},{"k":"p","html":"<i>『상서·목서(尙書·牧誓)』 / 『화양국지(華陽國志)』</i>","ind":25,"bul":false},{"k":"p","html":"<b>『상서·목서(尙書·牧誓)』 :</b> 고대 주나라 무왕이 은나라를 물리치기 위해 동맹군을 모을 때 참여한 8개 연합 부족 중 하나로 &#x27;복(濮)&#x27;이 등장한다. 이것이 역사 문헌에 복족의 이름이 처음으로 확인되는 기록이다. ","ind":22,"bul":true},{"k":"p","html":"<b>『화양국지(華陽國志)』 :</b> 사천성과 운남성 지역의 지리를 기록한 동진 시대의 책이다. 이 책에는 서남부 곳곳에 수많은 복족 사람들이 흩어져 살고 있다는 내용이 상세히 적혀 있다. ","ind":22,"bul":true},{"k":"h3","text":"3. 고복인(古濮人)과 관계된 소수민족"},{"k":"p","html":"<b>오늘날의 후손들:</b> 이 옛 복족의 핏줄을 이어받은 소수민족이 바로 오늘날의 포랑족, 덕앙족, 와족이다. 이 세 민족은 사용하는 언어(남아시아어족 몽-크메르어파) 계통이 같아, 고대부터 한 뿌리였음을 알 수 있다.","ind":22,"bul":true},{"k":"p","html":"<b>차를 가장 먼저 이용한 사람들:</b> 복족의 후손들은 운남 지역에서 역사상 가장 먼저 차나무를 발견하고 차를 만들어 마신 선구적인 집단으로 꼽힌다. 특히 포랑족은 수천 년이 지난 지금까지도 포랑산과 노만아 일대의 깊은 옛 차밭(고차원)을 묵묵히 지키며 오랜 차 문화를 이어오고 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 맹랍현(勐臘縣, 서쌍판납)"},{"k":"p","html":"서쌍판납 태족자치주의 남동쪽에 위치한 현으로, 란창강을 기준으로 동쪽(강내, 江內)에 자리한다. 고 6대 차산 중 유락산을 제외한 나머지 다섯 곳(의방, 혁등, 망지, 만전, 이무)과 황실 공차 산지인 만송이 모두 이 현에 속해 있다. ","ind":0,"bul":false},{"k":"h2","text":"□ 경홍시(景洪市, 서쌍판납)"},{"k":"p","html":"주도(州都)이자 행정 중심지다. 태족 문화의 심장부로서 유명한 전통 축제인 &#x27;발수절(물뿌리기 축제)&#x27;이 열리는 곳이다. 고 6대 차산 가운데 유일하게 유락산(기낙산)만이 이곳 경홍시 관할에 속한다. ","ind":0,"bul":false},{"k":"h2","text":"□ 맹해현(勐海縣, 서쌍판납)"},{"k":"p","html":"란창강 서쪽(강외, 江外)에 위치하며, 신 6대 차산(맹해 차구)의 핵심 무대이다. 운남 대엽종 찻잎의 표준이자 최고급 산지로 꼽히는 노반장과 노만아 등이 이곳에 있다. 또한 1940년에 세워진 현대식 대형 공장인 맹해차창이 자리 잡고 있는 차 산업의 중심지다. ","ind":0,"bul":false},{"k":"h2","text":"□ 임창시(臨滄市)"},{"k":"p","html":"란창강 북쪽의 북부 차구를 대표하는 지역이다. 해발 고도가 높고 일교차가 커서 향이 아주 뛰어난 차가 생산된다. 대표적인 명품 산지로 남박(南迫)과 빙도(氷島)가 있으며, 이름이 매우 긴 &#x27;쌍강 랍호족 와족 포랑족 태족 자치현&#x27;의 맹고진 빙도촌이 바로 이곳에 위치해 있다. ","ind":0,"bul":false},{"k":"h2","text":"□ 보이시(普洱市, 구 사모시)"},{"k":"p","html":"과거 이름은 사모(思茅)였다. 청나라 옹정제 때(1729년) 이곳에 보이부(普洱府)가 설치되어 차 무역과 물류를 총괄하는 집산지 역할을 했던 역사적 배경이 있다. 이 상징성을 바탕으로 2007년에 행정구역 명칭을 아예 &#x27;보이시&#x27;로 바꾸었다. ","ind":0,"bul":false},{"k":"p","html":"공부차포다","ind":22,"bul":true},{"k":"p","html":"<b>차필무이(茶必武夷):</b> 차는 반드시 복건성 무이산에서 나는 &#x27;무이암차&#x27;를 으뜸으로 친다.","ind":40,"bul":true},{"k":"p","html":"<b>배필약침(杯必若琛):</b> 찻잔은 반드시 바닥에 &#x27;약침진장(若琛珍藏)&#x27;이라는 글귀가 적힌 청나라 시대의 명품 백자 찻잔(약침배)을 써야 한다.","ind":40,"bul":true},{"k":"p","html":"<b>호필맹신(壺必孟臣):</b> 찻주전자(다호)는 반드시 &#x27;맹신호&#x27;를 써야 한다. 맹신호는 명나라 시대 자사호의 거장인 혜맹신(惠孟臣)이 만든 붉은빛의 주니(朱泥) 소호를 말한다.","ind":40,"bul":true},{"k":"note","html":"※ 혜맹신과 맹신호는 자사호 길라잡이 Part.4 7강 「공부차의 시대를 연 혜맹신(惠孟臣)」에서 자세히 다룬다.","ind":14,"bul":false},{"k":"h1","text":"4 & 5강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 과거 석병에서 고 6대 차산 등으로의 한족의 이주 배경을 설명해 보세요."},{"k":"p","html":"<b>명나라의 변방 장악 (이주 배경):</b> 원나라가 멸망한 후, 명나라는 몽골족의 잔재를 완전히 몰아내고 서남부 변방 지역에 대한 지배력을 확고히 다지기 위해 다수의 한족을 운남 지역으로 이주시켰다(둔전). 명나라 초기에 홍하주 석병현(石屏縣) 일대에 한족들이 대거 이주하여 정착하기 시작한 것이 그 출발점이다.","ind":22,"bul":true},{"k":"p","html":"<b>석병 상인들의 차산 진출:</b> 시간이 흘러 석병현에 자리 잡았던 한족 상인들은 본격적인 차 무역을 위해 험준한 무량산과 애뢰산을 넘어 서쌍판납 북부 지역으로 진출했다. 이들은 고 6대 차산 중에서도 지리적으로 가까운 의방(倚邦)과 망지(莽枝) 일대에 깊숙이 정착했다.","ind":22,"bul":true},{"k":"p","html":"<b>우곤당(牛滾塘)과 차 산업의 본격화:</b> (참고: '우곤당'은 망지 차산에 있던 역사적으로 매우 유명한 찻잎 교역 거점인 우곤당(牛滾塘)을 뜻한다.) 석병 출신의 한족 상인들이 이 우곤당을 핵심 거래 거점으로 삼아 원주민들로부터 찻잎을 수매하고 대규모 차 무역에 나서면서, 비로소 고 6대 차산의 상업적인 차 산업이 본격적으로 형성되고 발전하게 되었다.","ind":22,"bul":true},{"k":"h3","text":"2. 무후유종과 차조회에 대해 설명해 보세요."},{"k":"p","html":"<b>무후유종(武侯遺種)의 의미와 진실:</b> '무후'는 삼국지의 제갈공명(제갈무후)을 뜻하며, '유종'은 남겨둔 씨앗을 뜻한다. 즉 &quot;제갈공명이 남기고 간 차나무 종자&quot;라는 의미다. 고 6대 차산 일대의 현지인(기낙족 등)들은 과거 제갈공명이 남정(南征)을 왔을 때 자신들에게 차나무 씨앗과 다구를 주어 생계를 잇게 해주었다고 굳게 믿는다. (참고: 하지만 실제 역사 기록을 보면, 제갈공명의 남정 부대가 운남성 남부 깊숙한 서쌍판납 일대까지 직접 진출한 적은 없다. 이는 훗날 한족의 차 문화와 통치력이 유입되는 과정에서 현지 토착 신앙과 결합하여 생겨난 상징적인 전설이다.)","ind":22,"bul":true},{"k":"p","html":"<b>차조회(茶祖會):</b> 고 6대 차산 지역의 사람들이 &#x27;차의 시조(차조)&#x27;로 떠받드는 제갈공명을 기리기 위해 여는 전통 행사다. 전설 속에서 제갈공명이 차산 사람들에게 차나무를 남겨주고 떠났다고 전해지는 날에 맞추어 열리며, 불전(사찰)에 귀한 차를 바치며 공명의 은혜를 기리고 차 농사의 풍요를 기원한다.","ind":22,"bul":true},{"k":"h3","text":"3. 기낙족, 랍족의 탄생설화에 대해 설명해 보세요."},{"k":"h4","text":"가. 기낙족 — 여신 아모요부와 대홍수 전설"},{"k":"p","html":"기낙족은 창조주 여신이 세상을 열고, 끔찍한 재난 속에서 살아남은 남녀가 부족의 기원이 되었다고 믿는다.","ind":0,"bul":false},{"k":"p","html":"<b>알에서 태어난 천지창조:</b> 기낙족 신화에 따르면, 창조주 여신인 &#x27;아모요부&#x27;가 거대한 알에서 태어났다. 그녀가 그 알을 두 쪽으로 쪼개자 위쪽 껍데기는 하늘이 되고, 아래쪽 껍데기는 땅이 되었다.","ind":22,"bul":true},{"k":"p","html":"<b>마흑과 마뉴, 그리고 대홍수:</b> 세상을 만든 아모요부는 인류의 시조가 될 남성 &#x27;마흑&#x27;과 여성 &#x27;마뉴&#x27;를 만들었다. 이후 거대한 대홍수가 온 세상을 덮쳤으나, 마흑과 마뉴가 극적으로 살아남았다. 홍수가 끝난 뒤 이 두 사람의 후손이 번성하여 오늘날의 기낙족이 되었다고 전해진다.","ind":22,"bul":true},{"k":"h4","text":"나. 랍호족 — 최고신 액사와 조롱박 신화"},{"k":"p","html":"랍호족은 기낙족의 홍수 전설과는 전혀 다른, 우주 만물의 창조신과 생명의 씨앗을 상징하는 조롱박 신화를 간직하고 있다.","ind":0,"bul":false},{"k":"p","html":"<b>최고신 액사(厄莎):</b> 랍호족은 &#x27;액사&#x27;라는 최고신이 우주와 세상을 창조하고 다스린다고 믿는다.","ind":22,"bul":true},{"k":"p","html":"<b>조롱박에서 태어난 인류:</b> 액사가 세상을 만든 뒤, 거대한 조롱박에서 인류의 시조가 되는 첫 남녀가 태어났다. 이 조롱박 안에서 나온 사람들이 세상 곳곳으로 뻗어 나가 오늘날 랍호족의 조상이 되었다는 생명력 넘치는 신화를 고유하게 이어오고 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 상명이족향 개요"},{"k":"p","html":"서쌍판납 유일의 이족향인 맹랍현 상명이족향은 고 6대 보이차 생산의 중심지로(의방, 만전, 혁등, 망지의 4대 차산을 포함함) 의방(倚邦)·만공(曼拱)·만림(曼林)·만장(曼庄)·신발(新發)·안락(安樂)·용곡(龍谷)·대하변(大河邊)의 8개 촌을 관할한다.","ind":0,"bul":false},{"k":"p","html":"동쪽이 높고 남쪽이 낮은 지형으로 1,200m의 평균 해발고도(최고 해발은 신묘(神廟)의 1,950m, 최저 해발은 만배도구(曼配渡口)의 565m), 17~19℃의 연평균 기온, 1,500~1,900mm의 연평균 강수량을 자연조건으로 가지며 주정부 소재지로부터 약 170km 거리에 위치한다.","ind":0,"bul":false},{"k":"h2","text":"□ 망지차산"},{"k":"p","html":"혁등차산과 공명산에 긴밀히 이어져 있는 망지차산(莽枝茶山)은 혁등차산과 비슷한 면적을 가졌으며, 그 남쪽은 보원강(補遠江)의 물길을 따라 만륜(曼倫), 맹왕(勐旺)에 이른다.","ind":0,"bul":false},{"k":"h3","text":"1. 망지차산의 역사"},{"k":"p","html":"<b>우곤당(牛滾塘)의 번성과 차 무역의 시작:</b> 명나라 말기에서 청나라 초기에 걸쳐, 석병(石屏) 출신의 한족 상인들이 망지 지역으로 대거 들어와 &#x27;우곤당&#x27;을 교역의 거점으로 삼았다. 이곳은 고 6대 차산 전체를 통틀어 가장 먼저 번성했던 최대 규모의 차 무역 중심지였다.","ind":22,"bul":true},{"k":"p","html":"<b>옹정 연간의 치정 사건과 망지의 몰락:</b> 청나라 옹정제 시기, 우곤당에 머물던 강서성(江西省) 출신 한족 상인과 망지 지역 토관(원주민 지도자) 부인 사이에 치정 사건이 벌어졌다. 이 사적인 갈등이 원주민과 한족 상인 간의 대규모 무력 충돌로 번졌고, 이를 진압한다는 명분으로 청나라 중앙군이 내려오면서 2년에 걸친 참혹한 전쟁이 벌어졌다. 그 결과 화려했던 망지차산은 철저하게 파괴되고 몰락하고 말았다.","ind":22,"bul":true},{"k":"p","html":"<b>상권의 이동과 남겨진 옛말:</b> 전쟁 이후 차 무역의 상권과 중심지는 인근의 의방(倚邦)으로 완전히 옮겨갔고, 망지는 6대 차산의 중심 자리를 내주게 되었다. 이 지역에 전해지는 &quot;선유우곤당 후유보이부(先有牛滾塘 後有普洱府, 먼저 우곤당이 있었고 그 후에 보이부가 생겼다)&quot;라는 유명한 옛말은, 청나라가 보이부를 세우기도 전에 우곤당(망지)이 얼마나 압도적인 전성기를 누렸는지를 증명해 준다.","ind":22,"bul":true},{"k":"h3","text":"2. 망지차산의 주요 다원"},{"k":"p","html":"<b>우곤당(牛滾塘):</b> 과거 고 6대 차산 최대의 찻잎 시장이 열렸던 역사적인 교역의 중심지다.","ind":22,"bul":true},{"k":"p","html":"<b>강서만(江西灣):</b> 과거 옹정 연간 전쟁의 원인이 되기도 했던, 강서성 출신 한족 상인들이 집단으로 모여 살았던 상업 구역에서 유래한 지명이다.","ind":22,"bul":true},{"k":"p","html":"<b>망지대채(莽枝大寨):</b> 망지차산의 중심이 되는 가장 큰 옛 마을이다.","ind":22,"bul":true},{"k":"p","html":"<b>홍토파(紅土坡), 만아노채(曼丫老寨), 추림(秋林), 구탈(口奪):</b> 망지의 토양(붉은 흙 등)과 자연환경을 잘 보여주며, 현재까지도 우수한 품질의 망지 고수차가 생산되는 핵심 촌락들이다.","ind":22,"bul":true},{"k":"h3","text":"3. 망지산의 고차수 분포와 차의 특징"},{"k":"p","html":"망지대채(莽枝大寨) · 우곤당(牛滾塘) · 홍토파(紅土坡) · 만아노채(曼丫老寨) · 추림(秋林) · 강서만(江西灣) · 구탈(口奪)","ind":0,"bul":false},{"k":"p","html":"차엽은 중소엽종 위주로 향기는 맑고 깨끗하다. 탕색은 깊은 등황색을 나타내며, 약간의 고삽미에 이어지는 회감이 강렬하며 생진이 많다.","ind":0,"bul":false},{"k":"h2","text":"□ 공명산"},{"k":"h3","text":"1. 공명과 차의 전래"},{"k":"p","html":"<b>차조(茶祖)로 추앙받는 공명:</b> 제갈공명은 고 6대 차산 지역에 차나무 종자와 선진 문명을 전수해 주고, 현지 토착민과 한족 문화를 융합시킨 위대한 지도자이자 &#x27;차의 시조&#x27;로 전해진다. 오늘날까지도 기낙족을 비롯한 여러 소수민족들로부터 극진한 공경의 대상이 되고 있다.","ind":22,"bul":true},{"k":"p","html":"<b>『보이차기』 속 유물 전승:</b> 청나라 학자 완복(阮福)이 쓴 『보이차기(普洱茶記)』에는 &quot;제갈공명이 6대 차산을 돌며 각 산마다 자신의 유물을 남겼다&quot;는 흥미로운 기록이 있다.","ind":22,"bul":true},{"k":"p","html":"<b>역사적 사실:</b> 실제 정사(역사 기록)를 보면 제갈공명의 남정(南征) 부대가 운남성 남부 깊숙한 서쌍판납 일대까지 직접 내려온 적은 없다. 이는 훗날 한족 상인들이 진출하면서 중원의 차 문화 및 제갈공명에 대한 경외심이 현지 원주민들의 토착 신앙과 결합하여 탄생한 거대한 문화적 상징이자 신화이다.","ind":22,"bul":true},{"k":"h3","text":"2. 공명산의 유래"},{"k":"p","html":"<b>공명산의 유래:</b> 제갈공명이 6대 차산을 순방하며 곳곳에 흔적을 남겼다는 전승의 연장선이다. 전설 속에서 제갈공명이 직접 머물렀다고 전해지는 산을 후대 사람들이 그를 기리기 위해 존칭을 담아 &#x27;공명산(孔明山)&#x27;이라 부르게 되었다.","ind":22,"bul":true},{"k":"p","html":"<b>혁등차산(革登茶山)의 특별한 지위:</b> 고 6대 차산 중 하나인 혁등차산은 이 공명산과 지리적으로 가장 가깝게 이어져 있다. 특히 이곳에는 과거 제갈공명이 직접 심었다고 굳게 믿어지는 거대한 &#x27;차왕수(茶王樹, 차나무 왕)&#x27;가 자리 잡고 있었기 때문에, 혁등은 다른 차산들의 부러움을 사며 6대 차산 안에서도 매우 신성하고 특별한 지위를 누릴 수 있었다.","ind":22,"bul":true},{"k":"h2","text":"□ 혁등차산"},{"k":"p","html":"혁등차산은 안락촌과 신발촌을 포함하는 총면적 150k㎡의 고차산이다. 포랑어로 높은 지역을 의미하며, 육대차산 중 면적이 가장 작으나 공명산에서 제일 가깝고 공명이 식재한 것으로 알려진 매우 큰 차왕수가 있었기에 예로부터 6대 차산 내에서도 특수한 지위와 명성을 누렸고 18세기 중·후반 전성기를 맞았다.","ind":0,"bul":false},{"k":"h3","text":"1. 혁등의 태자나무와 고차수 분포"},{"k":"h4","text":"가. 혁등의 차왕수"},{"k":"p","html":"과거 제갈공명이 직접 심었다고 전해지던 전설적이고 거대한 '차왕수'가 자리했던 곳이다. 이 나무 덕분에 혁등차산은 고 6대 차산 안에서도 매우 신성하고 특수한 명성을 누릴 수 있었다. (참고: 아쉽게도 이 웅장했던 차왕수는 중화민국 초기인 1930년대 무렵에 수명을 다해 고사(枯死)하고 말았다. 오늘날에는 나무 본체는 남아 있지 않으며, 거대한 뿌리가 있던 터와 그 자리를 알리는 비석(표지)만이 옛 영광을 전하고 있다.) ","ind":0,"bul":false},{"k":"h4","text":"나. 혁등의 고차수 분포"},{"k":"p","html":"오랜 세월과 역사적 혼란을 겪으며 혁등의 옛 차밭(고다원)은 안타깝게도 많이 훼손되었다. 하지만 다행히도 옛 마을 사람들이 능선 곳곳에 심어둔 고차수들이 차산 사이사이에 아직 다수 생존해 있다. 현재 혁등 지역에서 가장 품질이 우수한 최고급 고차수 군락지는 신주방(新酒房)과 직방(直蚌) 두 마을에 위치해 있다. ","ind":0,"bul":false},{"k":"h3","text":"2. 혁등차산의 자연조건"},{"k":"h4","text":"가. 해발고도와 기후조건"},{"k":"p","html":"혁등고차구는 산이 높고 계곡이 깊으며 마자하(磨者河)와 나사강(羅梭江)이 교차하는 덕분에 겨울철에 운무가 많이 피어오른다. 일년 내내 일조량이 풍부하며 겨울에는 혹한이 없고 여름에는 혹서가 없는 기후가 이어지는데, 연평균 기온은 18~20℃에 이른다.","ind":0,"bul":false},{"k":"h4","text":"나. 토양조건"},{"k":"p","html":"<b>토양:</b> 전홍양(磚紅壤) · 적홍양(赤紅壤) · 황토(黃土) · 자색토(紫色土)","ind":22,"bul":true},{"k":"p","html":"pH 4~6","ind":22,"bul":true},{"k":"p","html":"토양 내 유기질 함량 4.5% 이상","ind":22,"bul":true},{"k":"h3","text":"3. 혁등차의 특징"},{"k":"p","html":"<b>품종:</b> 의방, 망지 등과 마찬가지로 잎의 크기가 다소 작은 중소엽종이 주를 이룬다.","ind":22,"bul":true},{"k":"p","html":"<b>맛과 향:</b> 탕색이 맑고 밝으며, 차를 우리면 중소엽종 특유의 맑고 높은 꽃향기가 난다. 대엽종에 비해 쓴맛과 떫은맛(고삽미)이 강하지 않고 매우 부드러운 것이 특징이다.","ind":22,"bul":true},{"k":"p","html":"<b>여운:</b> 차를 머금고 넘긴 뒤 단맛이 훅 치고 올라오는 회감(回甘)이 매우 빠르며, 입안에 침을 풍부하게 돌게 하는 생진(生津) 작용이 뛰어나 맑고 단아한 매력을 뽐낸다.","ind":22,"bul":true},{"k":"h2","text":"□ 의방차산"},{"k":"p","html":"<b>지리적 위치:</b> 고 6대 차산 가운데 가장 북쪽에 자리 잡고 있으며, 행정구역상으로는 서쌍판납 유일의 이족향인 맹랍현 &#x27;상명이족향(象明彝族鄕)&#x27;에 속한다.","ind":22,"bul":true},{"k":"p","html":"<b>행정과 차 무역의 심장부:</b> 과거 차산 일대를 다스리던 현지 원주민 관리인 토관(토사)이 직접 머물던 곳으로, 자연스럽게 6대 차산을 아우르는 행정과 상업의 절대적인 중심지로 기능했다.","ind":22,"bul":true},{"k":"p","html":"<b>조당제의 치세와 최전성기:</b> 특히 청나라 시기 유능한 토관이었던 &#x27;조당제(曹當齋)&#x27;의 뛰어난 관리와 치세 아래, 의방은 19세기 전반(두문수의 난으로 북방 유통로가 끊기기 전)까지 고 6대 차산 전체의 경제와 차 무역을 이끌며 역사상 가장 화려한 최전성기를 누렸다.","ind":22,"bul":true},{"k":"note","html":"※ 조당제의 3대에 걸친 이력과 '엽(葉)' 성 하사 등은 아래 「□ 조당제의 차산관리」에서 이어진다.","ind":14,"bul":false},{"k":"p","html":"<b>중소엽종의 상징과 만송 공차원:</b> 잎이 크고 묵직한 맹해 지역의 대엽종과 뚜렷하게 대비되는, 잎이 작고 맑은 향을 지닌 중소엽종(中小葉種)의 대표적인 산지다. 무엇보다 황실에 최고급 찻잎을 바치던 전설적인 &#x27;만송(曼松) 공차원&#x27;을 품고 있어 다른 차산들과 구별되는 고귀한 위상을 자랑했다.","ind":22,"bul":true},{"k":"h2","text":"□ 의방차산의 발전사"},{"k":"h3","text":"1. 의방차산의 흥망성쇠"},{"k":"h4","text":"가. 의방 차산내 차산업의 시작"},{"k":"p","html":"6대차산의 가장 북쪽에 위치한다.","ind":22,"bul":true},{"k":"p","html":"토관(토사제도)","ind":22,"bul":true},{"k":"p","html":"맹륵왕국 후손 소수민족들이 지배했다.","ind":40,"bul":true},{"k":"p","html":"토관이 의방에 거주하면서 남을 다스렸다.","ind":40,"bul":true},{"k":"p","html":"여기서 판납은 이무를 제외한 나머지 다섯 판납이다.","ind":40,"bul":true},{"k":"p","html":"한족의 이동","ind":22,"bul":true},{"k":"p","html":"홍하주 석병현에서 출발했다.","ind":40,"bul":true},{"k":"p","html":"무량산과 애뢰산을 통과했다.","ind":40,"bul":true},{"k":"p","html":"서쌍판납 북부에 진입해 의방·망지 일대에 정착했다.","ind":40,"bul":true},{"k":"p","html":"망지 우곤당이 최대 거래처로 번성했다.","ind":40,"bul":true},{"k":"p","html":"치정 사건으로 망지가 몰락했다.","ind":40,"bul":true},{"k":"p","html":"상권이 의방으로 쏠리며 의방이 최종 중심지로 등극했다.","ind":40,"bul":true},{"k":"h4","text":"나. 개토귀류와 의방 차산의 발전"},{"k":"p","html":"토관이라 불리던 사람들이 자치를 했다.","ind":22,"bul":true},{"k":"p","html":"토관을 개혁하고 류관을 파견하여 유락산(경홍)에 유락동지를 만들었다.","ind":22,"bul":true},{"k":"p","html":"찻잎의 교역을 막고 세금을 매기면서 대금은 주지 않아 민란이 일어났고, 결국 철수했다.","ind":22,"bul":true},{"k":"p","html":"다시 권력은 토관에게로 이동했다.","ind":22,"bul":true},{"k":"p","html":"개토귀류를 수정해 토사의 관할로 되돌렸다.","ind":22,"bul":true},{"k":"p","html":"토관들이 의방에 있었으므로 의방이 다시 발전하게 되었다.","ind":22,"bul":true},{"k":"h4","text":"다. 의방차산의 쇠락"},{"k":"p","html":"<b>두문수의 난과 북방 유통로 단절:</b> 19세기(1800년대) 중반, 운남 일대를 휩쓴 대규모 이슬람 무장 봉기인 &#x27;두문수의 난&#x27;과 연이은 대리 전쟁이 발발하면서 의방차산은 결정적인 타격을 입게 되었다. 내전의 여파로 의방에서 황실(북경)이나 티베트 등지로 향하던 핵심 수출 길인 &#x27;북방 유통로&#x27;가 완전히 끊어지고 말았기 때문이다.","ind":22,"bul":true},{"k":"p","html":"<b>전란과 전염병으로 인한 다원 황폐화:</b> 기나긴 전쟁의 참화에 더해 덥고 습한 아열대 기후 특성상 끔찍한 전염병(풍토병)까지 크게 돌았다. 이로 인해 수많은 사람이 목숨을 잃고 인구가 급감하면서, 찻잎을 따고 차를 만들 노동력이 사라진 의방의 화려했던 옛 다원들은 급격히 황폐해지고 말았다.","ind":22,"bul":true},{"k":"p","html":"<b>이무(易武)로의 상권 이동과 호급차의 부상:</b> 북방 유통로가 막히자 차 상인들은 라오스와 베트남을 거쳐 홍콩, 동남아시아로 빠져나가는 &#x27;남방 유통로&#x27;로 눈을 돌릴 수밖에 없었다. 자연스럽게 고 6대 차산 중 가장 남쪽에 위치하여 남방 무역에 지리적으로 훨씬 유리했던 이무(易武) 지역으로 차 유통의 중심지가 완전히 옮겨가게 되었다. 결국 의방이 쇠락하며 내어준 6대 차산의 맹주 자리를 이무 지역의 찻집(차순호, 동경호, 송빙호 등)들이 차지하며 유명한 &#x27;호급차(號級茶)&#x27;의 새로운 전성기를 열게 된 것이다.","ind":22,"bul":true},{"k":"h3","text":"2. 의방차의 유통역사"},{"k":"p","html":"과거 의방과 이무 지역에서 개인 찻집(상호)의 이름을 걸고 만든 명품 보이차를 &#x27;호급차&#x27;라고 부른다. 과거 의방 차산을 주름잡던 대표적인 상호로는 원창호(元昌號), 혜민호(惠民號), 송빙호(宋聘號), 홍창호(鴻昌號), 승의상(升義祥), 양빙호(楊聘號), 경풍호(慶丰號) 등이 있었다.","ind":0,"bul":false},{"k":"p","html":"이들의 흥망성쇠를 시대별로 나누어 보면 다음과 같다.","ind":0,"bul":false},{"k":"p","html":"<b>1850년대 (의방의 화려한 전성기와 몰락):</b> 1850년 무렵만 해도 의방에는 이처럼 이름을 날리던 호급차 상호들이 아주 많았다. 하지만 앞서 언급된 두문수의 난 등 끔찍한 전란과 전염병을 겪으며 다원이 파괴되고 상권이 이무로 넘어가면서, 이 옛 상호들은 대부분 역사 속으로 사라져 현재는 존재하지 않는다.","ind":22,"bul":true},{"k":"p","html":"<b>1911년 전후 (송빙호와 골동차의 전설):</b> 1911년(신해혁명)을 전후로 하여 활약했던 이무차장(이무 지역으로 상권을 옮긴 찻집)의 &#x27;송빙호(宋聘號)&#x27;는 오늘날 매우 중요한 의미를 지닌다. 현재 전 세계 보이차 경매 시장에 온전한 형태로 등장하는 가장 오래되고 상징적인 최고가 골동차가 바로 이 시기의 송빙호이기 때문이다.","ind":22,"bul":true},{"k":"p","html":"<b>1950년 이전 (호급차에서 인급차로의 전환):</b> 보통 1950년대 이전에 만들어진 차들을 진정한 의미의 &#x27;골동차&#x27;라고 부른다. 차순호, 송빙호 등 이무 지역을 중심으로 화려하게 꽃피웠던 이 &#x27;호급차(號級茶)&#x27;의 시대는 1950년대를 기점으로 막을 내린다. 이후 중국 정부가 찻집들을 통폐합하고 국가 주도로 차를 생산하기 시작하면서, 포장지에 찍힌 도장(인)의 색깔로 차를 구분하는 &#x27;인급차(印級茶, 홍인·녹인 등)&#x27;의 새로운 시대로 넘어가게 된다.","ind":22,"bul":true},{"k":"h2","text":"□ 조당제의 차산관리"},{"k":"h3","text":"1. 조대주 — 할아버지 대"},{"k":"p","html":"원래 사천성(쓰촨성) 출신의 한족 가문이다.","ind":22,"bul":true},{"k":"p","html":"조당제의 할아버지로, 무역 수완이 아주 뛰어난 한족 상인이었다.","ind":22,"bul":true},{"k":"p","html":"의방에 들어왔다가 현지 소수민족(이족) 수장의 딸과 결혼했다.","ind":22,"bul":true},{"k":"p","html":"장인이 세상을 떠나자 자연스럽게 처가의 차산을 물려받았다.","ind":22,"bul":true},{"k":"p","html":"한족과 타 민족 사이의 갈등을 훌륭하게 중재했다.","ind":22,"bul":true},{"k":"p","html":"아들 조덕제도 타 민족과 결혼했으며, 그 아들이 바로 조당제이다.","ind":22,"bul":true},{"k":"p","html":"다른 형제들은 사천으로 돌려보내고, 조당제 혼자 차산에 남아 가업을 이었다.","ind":22,"bul":true},{"k":"h3","text":"2. 조당제 — 토천총이 되기까지"},{"k":"p","html":"할아버지 때부터 살아온 의방 지역의 지리와 민심을 잘 알고 있었다.","ind":22,"bul":true},{"k":"p","html":"망지의 치정 사건(개토귀류)을 빌미로 청나라 군대가 들어왔다.","ind":22,"bul":true},{"k":"p","html":"당시 지방 무관이었던 조당제가 군대에 길을 안내하고 토벌에 협조했다.","ind":22,"bul":true},{"k":"p","html":"전쟁 후, 정부는 친정부적이면서 중재가 가능한 사람을 찾다가 조당제를 책임자로 발탁했다.","ind":22,"bul":true},{"k":"p","html":"&#x27;토천총(土千總)&#x27; 지위를 받았으며, 이는 &#x27;천 명을 다스리는 토관&#x27;이라는 뜻이다.","ind":22,"bul":true},{"k":"p","html":"치안을 안정시키기 위해 내려준 정6품 세습 무관직이다.","ind":22,"bul":true},{"k":"note","html":"※ 선위사: 다스리던 현지인에게 관직을 주어 통치하게 하는 제도이다.","ind":40,"bul":false},{"k":"h3","text":"3. 조당제의 치세와 6대 차산의 전성기"},{"k":"p","html":"운남차법을 엄격히 실행하고 자체적인 &#x27;차산관리조례&#x27;를 만들었다.","ind":22,"bul":true},{"k":"p","html":"외부인들이 소수민족을 착취하지 못하도록 강력히 단속하고 보호했다.","ind":22,"bul":true},{"k":"p","html":"험한 산길의 도로를 정비해서 차의 운송을 쉽게 만들었다.","ind":22,"bul":true},{"k":"p","html":"조당제의 통치 아래 차산은 평화와 번영을 누렸다.","ind":22,"bul":true},{"k":"p","html":"청나라 황실에서 조당제 부인(이족)에게 &#x27;엽(葉)&#x27;이라는 한족 성씨를 하사하여 권위를 세워주었다.","ind":22,"bul":true},{"k":"p","html":"조당제의 치세 아래 6대 차산은 최전성기를 맞이했다.","ind":22,"bul":true},{"k":"p","html":"의방이 가장 번성했을 때는 도로 양옆으로 무려 1,000가구가 빽빽하게 들어섰다.","ind":22,"bul":true},{"k":"p","html":"조당제가 60세가 되던 해, 각 차산 대표들이 &#x27;육산일로(六山一老, 6대 차산의 큰어르신)&#x27;라는 현판을 달아주었다.","ind":22,"bul":true},{"k":"p","html":"1800년대 중반까지 화려하게 번성했다.","ind":22,"bul":true},{"k":"p","html":"이후 대리 전쟁과 두문수의 난으로 북방 유통로가 끊기면서 결국 몰락했다.","ind":22,"bul":true},{"k":"p","html":"그 후 차 무역의 중심은 남방 유통에 유리한 이무(易武)로 이동했다.","ind":22,"bul":true},{"k":"h2","text":"□ 만송촌과 다원관리"},{"k":"h3","text":"1. 만송자연촌 (만송신채)"},{"k":"p","html":"오늘날의 만송자연촌은 맹랍현 상명이족향(망지, 의방 등) 만송촌의 관할에 속하는 작은 마을로 향정부소재지 및 촌위원회와 12km의 거리에 위치한다. 총면적 26.52k㎡, 해발고도 900m, 연평균기온 17~20℃, 연평균강수량 1700mm의 자연조건을 갖추며 1개의 촌민소조, 35개의 농호에 186인으로 구성되어 있다.","ind":0,"bul":false},{"k":"p","html":"<b>배응산:</b> 고차수가 거의 없고 밭차가 대부분이다.","ind":22,"bul":true},{"k":"p","html":"<b>왕자산:</b> 만송노채(해발 1,400m, 왕자산 중상부에 위치). 언젠가부터 물이 잘 나오지 않는다.","ind":22,"bul":true},{"k":"h3","text":"2. 만송노채와 황가고차원"},{"k":"p","html":"청나라 시대","ind":22,"bul":true},{"k":"p","html":"<b>황가고차원:</b> 황제에게 공차를 바친 3개 다원 (대흑산, 배응산, 왕자산)","ind":40,"bul":true},{"k":"p","html":"<b>만송노채:</b> 공차채엽관이 관리하던 가장 큰 다원","ind":40,"bul":true},{"k":"p","html":"<b>수탈과 훼손:</b> 황제의 편애로 수탈이 극심해지자, 주민들이 공차나무를 모두 베고 도망쳤다.","ind":40,"bul":true},{"k":"p","html":"1911년 — 청나라 멸망과 함께 공차제도가 소멸했다.","ind":22,"bul":true},{"k":"p","html":"1937~1949년 — 중일전쟁과 국공내전이 이어졌다.","ind":22,"bul":true},{"k":"p","html":"1980년대 이후","ind":22,"bul":true},{"k":"p","html":"강 왼쪽에 맹해차창이 설립되고 일대가 개발되었다. (병배차 위주 생산)","ind":40,"bul":true},{"k":"p","html":"배응산·왕자산 저지대에 밭차를 심었다.","ind":40,"bul":true},{"k":"p","html":"왕자산 고지대 고차수 사이에 소수차를 다수 심었다.","ind":40,"bul":true},{"k":"p","html":"배응산 일대 다원 용지를 대여했다.","ind":40,"bul":true},{"k":"p","html":"1990년대 말 — 이족이 만송노채를 철거하고 만송신채로 이주하여 새 마을을 형성했다.","ind":22,"bul":true},{"k":"p","html":"2008년 — 진승 노반장이 부상했다. 노반장 단일 싱글차 유통으로 크게 유명해졌다. (2012년까지 독점)","ind":22,"bul":true},{"k":"note","html":"※ 진승하와 진승차창의 설립 경위, 노반장촌과의 30년 계약은 Part.2 4 &amp; 5강 「진승노반장과 노반장촌의 관계」에 훨씬 자세히 정리되어 있다.","ind":14,"bul":false},{"k":"p","html":"2010년경 — 칙도(則道) 기업이 개입했다.","ind":22,"bul":true},{"k":"p","html":"불필요한 조사를 진행해 결과적으로 실패했다.","ind":40,"bul":true},{"k":"p","html":"왕자산 고차수 300그루 생존을 발표하고 나무마다 넘버링을 부여했다.","ind":40,"bul":true},{"k":"p","html":"2017년경 — 노반장 유행 이후 과거 명산지를 찾는 흐름과 칙도 기업의 영향으로 만송이 재부상했다.","ind":22,"bul":true},{"k":"p","html":"현재 (만송 현황)","ind":22,"bul":true},{"k":"p","html":"30가구가 거주 중이다.","ind":40,"bul":true},{"k":"note","html":"※ Part.2 4 &amp; 5강 「노반장촌의 차수 자원과 연간 생산량」에도 같은 수치(만송 30가구·노반장 150가구·빙도 40가구)가 있다.","ind":14,"bul":false},{"k":"p","html":"왕자산 고지대에 고차수 200~300그루가 생존해 있다.","ind":40,"bul":true},{"k":"p","html":"단주는 대략 30~50그루이다. (1그루 채엽량 200g~1kg)","ind":40,"bul":true},{"k":"p","html":"왕자산 고차수 사이에 20년 전후의 노수차가 심어져 있어 육안으로 구별하기 어렵다.","ind":40,"bul":true},{"k":"h2","text":"□ 만송 왕자산의 유래"},{"k":"h3","text":"1. 이자성의 난과 왕자산"},{"k":"p","html":"이자성이 농민 반란군을 이끌고 수도 베이징을 함락해 명나라를 멸망시켰다.","ind":22,"bul":true},{"k":"p","html":"북방을 지키던 명나라 장군 오삼계가 애첩(진원원)을 반군에게 빼앗기자 분노했다.","ind":22,"bul":true},{"k":"p","html":"오삼계는 청나라(만주족)에 먼저 투항해 성문을 열어주고 이자성을 몰아냈다.","ind":22,"bul":true},{"k":"p","html":"청나라 장수가 된 오삼계는 남쪽 운남까지 피난 간 황족을 추적했다.","ind":22,"bul":true},{"k":"p","html":"명나라 멸망 후 남은 황족 일가가 숨어 지냈던 산을 &#x27;왕자산&#x27;이라 부르게 되었다.","ind":22,"bul":true},{"k":"p","html":"미얀마까지 도망친 마지막 황제 영력제를 운남으로 인도받았다.","ind":22,"bul":true},{"k":"p","html":"황족에 대한 예우 차원에서 목을 베는 참수 대신 활줄로 목을 졸라 교살했다.","ind":22,"bul":true},{"k":"h3","text":"2. 상표권 논쟁"},{"k":"p","html":"2011년 — 칙도가 왕자산 저지대를 임대했다. (17년 계약)","ind":22,"bul":true},{"k":"p","html":"2013년 — &#x27;만송&#x27; 상표를 등록했다. (노반장 열풍 시기와 맞물린다.)","ind":22,"bul":true},{"k":"p","html":"2018년 — 칙도가 타 차창들에게 &#x27;만송&#x27; 상표 사용료를 내라는 내용증명을 발송해 큰 논란이 발생했다.","ind":22,"bul":true},{"k":"p","html":"분노한 만송 마을 주민들이 광동성 상인(석일용)의 전적인 비용 지원을 받아 상표권 무효 소송을 제기했다.","ind":40,"bul":true},{"k":"p","html":"2020년 — 법원은 &#x27;만송&#x27;이 역사적인 공차 산지이자 지명이므로 특정 기업이 독점할 식별력이 없다며 칙도의 패소를 선고했다.","ind":22,"bul":true},{"k":"p","html":"칙도의 상표 독점은 무효화되었고, 이 소송 과정이 알려지면서 역설적으로 만송차가 더욱 유명해지는 계기가 되었다.","ind":40,"bul":true}]}]);
</script>
<script>window.__TEA_LESSONS=(window.__TEA_LESSONS||[]).concat([{"id":"p4","label":"자사호 Part.4","blocks":[{"k":"h1","text":"1강"},{"k":"h2","text":"□ 복습 Quiz"},{"k":"h3","text":"1. 보이차의 장향 형성 기전에 대해 설명해 보세요."},{"k":"p","html":"장(樟)나무는 곧 녹나무를 뜻하며, 장향은 이 녹나무의 향기를 말한다. 장향은 보이차가 오랜 시간 후발효를 거치면서 만들어지는 특유의 향이다. 진향(陳香)은 차가 익어가며 나는 묵은 향으로, 우디향이나 목질향 계열에 속한다.","ind":22,"bul":true},{"k":"p","html":"보이차가 익어가는 과정에서 진향, 약향, 대추향(조향), 장향, 삼향(蔘香, 인삼향) 등이 다양하게 발현된다. 오래된 노차(老茶)에서는 숙성 환경에 따라 곰팡이 향기와 비슷한 묵은내가 주로 나기도 한다.","ind":22,"bul":true},{"k":"p","html":"차가 훌륭하게 잘 익으면 장향과 삼향 같은 고급스러운 향이 난다. 미생물 발효가 제대로 개입하지 않으면 약향 이상으로 발전하지 못하며, 미생물이 올바르게 작용해야만 대추향, 장향, 삼향 등이 깊게 우러난다.","ind":22,"bul":true},{"k":"p","html":"차의 탕색은 생차 초기의 황록색에서 시작해 시간이 지남에 따라 홍색을 거쳐 갈색과 짙은 검정색으로 점차 변한다. 단, 갓 만든 생차에서 풋풋함 대신 조향, 장향, 삼향이 난다고 해서 이를 무조건 좋은 차라고 평가할 수는 없다.","ind":22,"bul":true},{"k":"h3","text":"2. 호기성 발효와 혐기성 발효의 차이를 구분하고, 각각의 발효법을 이용한 대표적인 차의 예를 들어보세요."},{"k":"p","html":"호기성 발효는 산소가 존재하는 환경에서 생장하는 미생물이 주도하는 발효다. 발효 과정에서 활성산소가 만들어지며 다량의 발효열이 발생한다. 보이 숙차를 단기간에 발효시키는 악퇴(渥堆) 공정 초기가 이 호기성 발효의 대표적인 예다.","ind":22,"bul":true},{"k":"p","html":"반면 혐기성 발효는 산소가 차단된 환경에서 활동하는 유산균 등의 혐기성 미생물이 주도하며, 발효열이 거의 나지 않는다. 차를 완성한 후 오랜 기간 보관하며 서서히 익히는 이단 발효(후숙) 과정이 이에 해당한다.","ind":22,"bul":true},{"k":"p","html":"숙성은 이렇듯 혐기성 미생물들이 작용하여 미생물 대사 과정에서 만들어진 독성이나 자극적인 맛을 없애고 순화시키기 위해 거치는 필수 과정이다. 이는 갓 담근 억센 장(醬)을 냉장고에 넣어 2년 정도 저온 숙성시키면 독성과 짠맛이 둥글게 사라지는 이치와 같다.","ind":22,"bul":true},{"k":"h2","text":"□ 자사호의 정의와 의흥 자사 도예의 발달 배경"},{"k":"h3","text":"1. 자사호의 정의"},{"k":"p","html":"자사호는 의흥에서 나는 자사라는 광물을 이용하여, 전통적으로 계승되고 있는 비물질문화유산인 자사도예기법을 이용해 만든 포차 용도의 호를 의미한다.","ind":0,"bul":false},{"k":"p","html":"경덕진 자기가 철저한 분업으로 만들어지는 것과 달리, 의흥 자사호는 실력 있는 예술가(작가)가 주도하여 제작한다.","ind":22,"bul":true},{"k":"h3","text":"2. 의흥 자사기의 발달 원인"},{"k":"p","html":"의흥 자사기의 발전은 지질, 역사, 경제, 문화적 측면이 종합적으로 작용한 결과이다.","ind":0,"bul":false},{"k":"p","html":"흙도 지역에 따라서 달라진다. 특징이나 개성을 나타낸다.","ind":22,"bul":true},{"k":"h4","text":"가. 지질"},{"k":"p","html":"강 하류에 퇴적된 고운 도토(도자기 흙) 중에서도 핵심 알짜 광물인 &#x27;자사니&#x27;가 의흥에 풍부하게 매장되어 있다.","ind":22,"bul":true},{"k":"p","html":"<b>(명대 이전)</b> 자사 원석을 단일로 쓰지 않고 다른 흙과 섞어서 용기로 사용했다.","ind":22,"bul":true},{"k":"p","html":"<b>(명대 이후)</b> 지방 가마(민요)를 시작으로 다른 흙을 섞지 않고 단일 자사 흙만으로 제호하기 시작했다.","ind":22,"bul":true},{"k":"h4","text":"나. 역사"},{"k":"p","html":"<b>(과거)</b> 의흥은 상하이·항저우·난징 등 대도시와 가까워 시장 접근성이 뛰어났다.","ind":22,"bul":true},{"k":"p","html":"<b>(과거)</b> 황실에 납품되어 박물관에 소장되는 관요(官窯) 제품을 제외하면, 의흥의 민간 자사기가 가장 뛰어난 품질로 시장을 주도했다.","ind":22,"bul":true},{"k":"p","html":"<b>(현대)</b> 탄탄한 기본기를 바탕으로, 국가대사(국가급 명인)들이 예술성을 더해 명맥을 계승하고 있다.","ind":22,"bul":true},{"k":"h4","text":"다. 경제"},{"k":"p","html":"<b>(당대)</b> 의흥의 옛 지명은 &#x27;양선(陽羨)&#x27;으로, 차밭이 많아 당나라 때부터 황실 공차(貢茶) 산지로 이름났다.","ind":22,"bul":true},{"k":"p","html":"<b>(당대 이후)</b> 황실에 차를 납품하게 되면서, 차를 담고 우리는 다구(茶具) 산업도 함께 발전할 수 있었다.","ind":22,"bul":true},{"k":"h4","text":"라. 문화"},{"k":"p","html":"도자기는 본래 잉여생산물을 담는 용기였으나, 의흥 자사기는 오랜 기간 차 문화와 결합하며 문화적·예술적 산물로 발전했다.","ind":22,"bul":true},{"k":"h2","text":"□ 좋은 차호의 조건"},{"k":"p","html":"차호 제작의 기본 공정은 설계(조형과 용량) - 재료(흙과 유약)의 선택 - 제작공예 - 도각 장식 - 소성으로 하나의 체계를 이루는데, 이 과정에서 예술성과 실용성이라는 두 가지 목적을 달성하도록 하는 것이 좋은 차호를 만들어 내기 위한 기본 조건이라고 할 것이다.","ind":0,"bul":false},{"k":"p","html":"형태, 사이즈","ind":22,"bul":true},{"k":"h3","text":"1. 실용성"},{"k":"p","html":"차를 우려내는 데 사용하는 '도구'이기 때문에 실용성이 우선이다.","ind":22,"bul":true},{"k":"p","html":"재현공예란 과거에 만들었던 작품을 새로 만들되, 더 잘 만드는 것을 목표로 하는 것이다.","ind":22,"bul":true},{"k":"p","html":"카피를 했더라도 '더' 잘하면 된다는 것으로, 중국의 특수한 문화이자 예술성을 나타낸다.","ind":22,"bul":true},{"k":"h3","text":"2. 예술성"},{"k":"p","html":"중국에는 예술성만 좋은 작품이 없다","ind":22,"bul":true},{"k":"h2","text":"□ 소성과 소결"},{"k":"h3","text":"1. 소성(Firing)과 소결(Sintering)의 개념"},{"k":"p","html":"<b>소성(Firing):</b> 열을 가해 흙의 결합력을 높이는 과정. (흙마다 융점이 다르므로 적절한 화도 구간을 설정하는 것이 필수다)","ind":22,"bul":true},{"k":"p","html":"<b>소결(Sintering):</b> 소성을 통해 기물이 형태와 결합 구조를 단단하게 유지하게 되는 현상.","ind":22,"bul":true},{"k":"p","html":"<b>자사기의 특성:</b> 유약을 바르지 않으므로, 적정 온도의 소성을 거쳐 기공(통기성)을 유지한 결정체 구조로 소결해 내는 것이 핵심이다.","ind":22,"bul":true},{"k":"h3","text":"2. 도자기 소성 및 자화(자기화) 경과"},{"k":"p","html":"<b>조건 및 원인 (융점의 차이)</b>","ind":22,"bul":true},{"k":"p","html":"태(胎, 유약을 바르기 전의 도자기 몸체)의 녹는점이 유약의 녹는점보다 높아야 한다.","ind":40,"bul":true},{"k":"p","html":"<b>소성 경과 (온도 상승 과정)</b>","ind":22,"bul":true},{"k":"p","html":"<b>정상 구간:</b> 온도가 올라가면 유약이 먼저 녹아 태에 안정적으로 들러붙는다.","ind":40,"bul":true},{"k":"p","html":"<b>초과 구간:</b> 소결 구간을 넘어 온도를 더 높이면 태까지 녹아 흐물흐물해지며 기물의 형태가 무너진다.","ind":40,"bul":true},{"k":"p","html":"<b>소성 결과 (자화 및 유리화)</b>","ind":22,"bul":true},{"k":"p","html":"적절한 소결 구간에서 소성이 완료되면 자화(자기화)가 완벽히 이루어진다.","ind":40,"bul":true},{"k":"p","html":"표면이 유리화(Vitrification)되어 기공이 닫히며, 이 상태가 되면 도자기 자체에 맛과 향이 배어들거나 묻어나지 않게 된다.","ind":40,"bul":true},{"k":"h2","text":"□ 현대 도자기의 분류"},{"k":"p","html":"오늘날 도자기는 용도와 특성에 따라 분류하는 것이 일반적이며, 전자에 의할 때 가정 용품·건축 용품·공업 용품으로 나뉘며, 후자에 의할 때 토기·도기·석기·자기 및 산업용 자기로 분류할 수 있다.","ind":0,"bul":false},{"k":"h3","text":"1. 토기"},{"k":"p","html":"<b>조건:</b> 600~1000도 안팎의 낮은 온도에서 소성한다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 태토가 성글어 자화가 거의 일어나지 않는다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 흡수율이 높아 물이 스미며, 유약을 쓰지 않거나 극히 제한한다. (두드리면 둔탁한 소리가 난다)","ind":22,"bul":true},{"k":"h3","text":"2. 도기"},{"k":"p","html":"<b>조건:</b> 점토질 태토를 800~1200도에서 소성한다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 부분적으로만 자화가 일어나 흡수성이 남는다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 방수를 위해 대개 유약을 입힌다. (예: 옹기, 기와, 도기 타일)","ind":22,"bul":true},{"k":"h3","text":"3. 자기"},{"k":"p","html":"<b>조건:</b> 고령토질 태토를 1300도 이상의 고온에서 소성한다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 완전히 자화(자기화)되어 흡수율이 거의 사라진다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 얇게 빚으면 빛이 투과되며, 두드리면 맑은 금속성 소리가 난다. (예: 백자, 청자)","ind":22,"bul":true},{"k":"h3","text":"4. 산업용 자기"},{"k":"p","html":"<b>조건:</b> 알루미나, 티탄, 활석 등 정제된 특수 원료를 사용한다.","ind":22,"bul":true},{"k":"p","html":"<b>경과:</b> 절연성, 내열성, 경도 등의 물리적 특성을 공업 목적에 맞게 인위적으로 조정한다.","ind":22,"bul":true},{"k":"p","html":"<b>결과:</b> 식기가 아닌
