'로 바뀌면서 포장지가 교체된다. 맥호차(코드네임차) 체계의 배경이 되는 조직 개편이다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1973년</div></td><td><div>악퇴(渥堆) 기술 개발. 홍콩 상인들이 '아예 익은 차를 만들어 보내달라'고 요구한 것이 계기가 되어, 물을 뿌리고 찻잎을 쌓아 미생물 발효를 인위적으로 촉진하는 공법이 완성된다. 오늘날의 숙차가 여기서 태어났고, 맹해차창은 같은 해 수출입 권한도 부여받는다.</div><div>· 이 해에 운남 기술자들이 홍콩·광동으로 파견되어 노주문(1927년생)에게 홍콩식 숙수 기법을 배웠고, 그 공법을 토대로 곤명 기술자들이 현대형 숙차 기술을 완성했다.</div><div class=\"cell-src\">Part.1 1·2강 / Part.6 부록 / Part.6 2강</div></td></tr><tr><td><div>1974년</div></td><td><div>맹해차창이 숙차 시험 생산을 시작한다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1976년</div></td><td><div>맥호차(코드네임차) 표기가 사용되기 시작한다. 앞 두 자리는 배방 연도, 세 번째는 원료 등급, 네 번째는 차창 번호를 뜻한다(7542 등). 이후 숙차 생산량이 크게 늘어난다. 같은 해 하관차창이 프랑스 수출용 7663 숙타차를 제작한다.</div><div class=\"cell-src\">Part.6 부록 / 노트</div></td></tr><tr><td><div>1970년대</div></td><td><div>자사 수출의 시대가 열린다. 홍콩·일본으로 수출이 본격화되며 국가적 외화벌이 수단이 되었고, 대량생산을 위해 터널식 가마를 건설했다. 품질 좋은 창호(廠壺)가 많이 나온 시기다. 보이차 쪽에서는 칠자병차의 시대로, 병급차·숫자차가 등장한다.</div><div>· 이 시기 이무 지역 농가들로부터 칠자병차 원료를 납품받기 시작했다.</div><div class=\"cell-src\">Part.4 7강 / Part.1 4강 / Part.6 부록</div></td></tr><tr><td><div>1979년</div></td><td><div>안휘농학원 진연(陳椽) 교수가 가공 방식과 산화도를 기준으로 6대 다류 분류를 정식 제시한다. 오늘날 녹차·백차·황차·청차·홍차·흑차로 나누는 체계의 출발점이다.</div><div class=\"cell-src\">Part.1 1·2강</div></td></tr><tr><td><div>1980년대</div></td><td><div>자사호의 인기가 높아지며 2창·3창이 설립되고, 고경주 주도로 우수 인재를 기르는 특예반이 개설된다. 다만 후반으로 갈수록 생산량이 과해지며 재료의 질이 떨어졌고, 원광 부족을 메우기 위해 병배니가 널리 쓰이기 시작한다.</div><div>· 보이차 쪽에서도 기계 대량생산과 밀식재배로 수출이 크게 늘고, 신육대차산이 유통 주도권을 넘겨받는다.</div><div class=\"cell-src\">Part.4 7강 / Part.6 1·2강</div></td></tr><tr><td><div>1982년</div></td><td><div>1970년부터 쓰던 '맹해현차창'이라는 이름을 '맹해차창'으로 최종 변경한다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1982~1983년</div></td><td><div>포산도호(包産到戶) 시행으로 중국 농촌의 차나무 소유권이 가구별로 분배된다. 노반장의 차나무도 이때 이미 나뉘었다.</div><div class=\"cell-src\">Part.2 4·5강</div></td></tr><tr><td><div>1985년</div></td><td><div>홍콩 남천공사의 주문 제작 요청으로 8582와 8592 규격을 첫 생산한다. 주문제작의 시작이다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1986년</div></td><td><div>판첸라마가 전국인민대표대회 부위원장 신분으로 하관차창을 시찰하고, 티베트인들이 즐기던 버섯 모양 긴차의 재생산을 요청한다. 하관차창으로서는 거절할 수 없는 요청이었고, 정부로서도 소수민족을 존중한다는 선전 효과를 얻었다. 1980년대 후반 고급 원료로 한정판 100여 개를 만들어 선물한다. 같은 해 여명차창이 준공되어 2000년까지 주로 녹차와 전홍을 생산한다.</div><div class=\"cell-src\">Part.3 3강 / 노트</div></td></tr><tr><td><div>1988년</div></td><td><div>맹해차창이 파달산과 포랑산에 자체 다원을 확보해 원료 공급망을 강화한다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1989년</div></td><td><div>맹해차창이 '대익(大益)' 상표를 정식 등록하고 자체 브랜드를 전면에 내세운다. 같은 해 10대 판첸라마(최키 갤첸)가 티베트 시가체에서 독살 의혹 속에 사망한다.</div><div class=\"cell-src\">Part.6 부록 / Part.3 3강</div></td></tr><tr><td><div>1980년대 중후반</div></td><td><div>상인들이 창고에 오래 쌓여 있던 묵은 물량을 털어 시장에 내놓기 시작한다. 소비자가 처음부터 노차를 즐겨 마셨다기보다, 이 '창고털이'를 계기로 노차 소비가 본격화된 측면이 크다.</div><div class=\"cell-src\">Part.6 2강</div></td></tr><tr><td><div>1990년</div></td><td><div>하관차창이 보염패와 송학패를 정식 등록상표로 사용하기 시작한다.</div><div class=\"cell-src\">노트</div></td></tr><tr><td><div>1991년</div></td><td><div>보이시 방위 지역에서 4세대 과도형고차수가 발견되어 차나무 세대 진화의 연속성이 증명된다. 3세대 야생차수와 5세대 재배형고차수 사이의 빈 고리가 채워지면서 운남기원설이 힘을 얻는다.</div><div class=\"cell-src\">Part.2 1·2강</div></td></tr><tr><td><div>1992년</div></td><td><div>노반장에 전신주가 설치되고 비포장도로가 정비된다. 같은 해 8월 24일 한중수교가 이루어진다. 그 전에는 중국과의 교류가 주로 홍콩을 우회했다.</div><div class=\"cell-src\">Part.2 4·5강 / Part.6 2강</div></td></tr><tr><td><div>1994년</div></td><td><div>맹해차창이 주식회사로 체제를 바꾼다. 운남농대 출신 최연소 차창 병배사 노국령이 이름을 올린 시기다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>1995년</div></td><td><div>달라이라마가 겐뒨 최키 니마를 11대 판첸라마로 지목하자 중국 당국이 이를 인정하지 않고 다른 소년을 세운다. 티베트 쪽에서는 후자를 인정하지 않는다.</div><div class=\"cell-src\">Part.3 3강</div></td></tr></table>"},{"k":"h1","text":"민영화와 고수차의 시대 (1996~현재)"},{"k":"p","html":"국영 시대가 막을 내리고 개인 차창의 시대가 열린다. 홍콩 반환을 앞둔 창고 정리에서 골동 보이차가 쏟아져 나왔고, 이무의 호급차 재현으로 시작된 흐름은 노반장·빙도를 거쳐 오늘날의 고수차 시장으로 이어진다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>내용</b></div></th></tr><tr><td><div>1980~90년대</div></td><td><div>개혁개방으로 민간 차 산업이 되살아나며 차순래의 후손인 형 차지신(車智信)과 동생 차지결(車智潔)이 차순호 상표권을 두고 다툰다. 차지결이 승리해 상표권과 가업을 잇는다.</div><div class=\"cell-src\">Part.3 1강</div></td></tr><tr><td><div>1996년</div></td><td><div>여례진(呂禮臻) 등 대만 차인 연합회가 이무를 직접 찾아가 멸실되었던 호급차 제다법을 재현하고 '진순아호(眞淳雅號)'를 만든다. 반세기 만의 호급차 부활로, 이후 전통 수공업 제다에 대한 관심이 폭발하는 출발점이 된다. 같은 해 7542 매괴자대익이 나오며 대익 상표가 처음 쓰인다.</div><div class=\"cell-src\">Part.6 1강 / Part.6 부록</div></td></tr><tr><td><div>1997년</div></td><td><div>자사1창이 공식 해산하며 국영 자사 시대가 막을 내리고 개인 작가 중심의 민영화 시대로 넘어간다.</div><div class=\"cell-src\">Part.4 7강</div></td></tr><tr><td><div>1997년 7월 1일</div></td><td><div>홍콩 반환. 무역 환경이 바뀌면서 상인들이 기존 허브였던 홍콩 대신 광저우 등을 새로운 유통 허브로 삼기 시작한다. 이 무렵 7542 수람인이 나오는데, 거의 마지막 홍콩 습창 7542로 꼽힌다.</div><div class=\"cell-src\">Part.6 2강 / Part.6 부록</div></td></tr><tr><td><div>1990년대 중후반</div></td><td><div>홍콩 반환을 앞두고 창고를 대대적으로 정리하는 과정에서 수십 년간 잊혀 있던 골동 보이차가 대량으로 발견된다. 처음에는 물량이 적은 줄 알았으나 추가 물량이 쏟아지며 가격이 폭락했다. 오늘날 진년차(노차·골동차)라는 개념 자체가 이 시기 홍콩에서 만들어졌다.</div><div class=\"cell-src\">Part.6 2강</div></td></tr><tr><td><div>1998년</div></td><td><div>MBA 출신 완전용(阮殿蓉)이 맹해차창 창장으로 부임한다. 위생과 농약 문제로 수출이 난항을 겪자 유기농 인증을 추진하며 차창을 되살린다. 같은 해 여명차창이 팔각정 상표를 등록한다.</div><div class=\"cell-src\">Part.6 부록 / Part.2 4·5강</div></td></tr><tr><td><div>1999년</div></td><td><div>맹해차창 60주년을 기념해 유기농 인증을 추진한다. 포랑의 맹해다원이 유럽공동체(E.C) 심사에서 퇴짜를 맞자, 차엽수매관의 추천으로 노반장촌을 찾아 인증에 성공한다.</div><div class=\"cell-src\">Part.2 4·5강</div></td></tr><tr><td><div>2000년</div></td><td><div>맹해차창이 유럽 수출용 유기농 인증차(대백채 시리즈)를 만들기 위해 노반장에서 수매를 시작한다. 「유기반장차」를 출시하며 배추 도장을 찍고 내피에 '반장생태'라 적었다. 오지 마을이던 노반장이 자본과 만나는 결정적 전환점으로, 훗날 노반장이 최고급 산지로 알려지는 계기가 된다. 같은 해 남박신채가 건설되어 대다수 주민이 이주한다.</div><div>· 반장5채는 노반장·신반장·노만아·파카나(坝卡囡)·파카룡(坝卡龍)을 가리킨다.</div><div class=\"cell-src\">Part.2 4·5강 / Part.2 2·3강</div></td></tr><tr><td><div>2000년 전후</div></td><td><div>자사에서 정구호(整口壺)가 시작된다. 예전 골동 자사호들은 소성을 한 번만 했기에 입구를 갈아내는 정구 과정이 없었으나, 이 무렵부터 여러 번 소성하며 어긋난 입구를 갈아내고 흙물을 다시 바르는 방식이 자리 잡는다.</div><div class=\"cell-src\">Part.4 1강</div></td></tr><tr><td><div>2000년대 초반</div></td><td><div>보이차 산화보관차(건창차)가 만들어지기 시작한다. 그 이전 차들은 홍콩·대만의 습창에서 불가피하게 미생물 발효를 거친 것들이었다. 자사 쪽에서는 자사창 해산 후의 과도기적 시행착오가 이어진 시기다.</div><div class=\"cell-src\">Part.1 4강 / Part.4</div></td></tr><tr><td><div>2001년</div></td><td><div>소삼통(小三通) 공식 시행. 대만 본섬이 아닌 금문도·마조도를 제한적으로 거쳐 대만과 본토가 오가게 된다.</div><div class=\"cell-src\">Part.6 2강</div></td></tr><tr><td><div>2002년</div></td><td><div>노반장 국도(향촌로)가 정비되며 외부 접근이 쉬워진다.</div></td></tr><tr><td><div>2003년</div></td><td><div>육성공작 반장생태차 출시. 대백채보다 상위 제품으로 꼽힌다.</div><div class=\"cell-src\">Part.2 4·5강</div></td></tr><tr><td><div>2004년</div></td><td><div>맹해차창이 운남박문투자유한공사(雲南博聞投資有限公司)에 매각되어 민영화되고 대익그룹 체제로 넘어간다. 창립 64년 만이다(1940년 정식 발족 기준).</div><div>· 하씨 형제가 원료 조달을 이어가며 2004년 하반기까지 유기반장차(대백채 시리즈)는 계속 생산되었고, 그 이후 유기인증 자격이 끊겼다.</div><div>· 같은 해 4월 하관차창도 민영화되며 국영 하관차창의 역사가 끝난다. 자사 쪽에서는 4호정 등 핵심 심층 갱구의 채광이 금지된다. 역사상 가장 좋은 자사니가 나오던 곳이다.</div><div class=\"cell-src\">Part.6 부록 / Part.2 4·5강 / 노트 / Part.4 4강</div></td></tr><tr><td><div>2005년</div></td><td><div>7542 백포조번체병·간체병 출시. 민영화 이후 대익패를 본격적으로 쓰기 시작한다. 같은 해 7542의 업그레이드 버전인 7742가 나온다.</div><div class=\"cell-src\">Part.6 부록</div></td></tr><tr><td><div>2005~2010년</div></td><td><div>대만 상인들의 집중적인 주문이 자사 재료와 시장 생산에 큰 영향을 미친다. 끊겼던 순주니 제작이 이 시기 수요에 힘입어 다시 부활한다.</div><div class=\"cell-src\">Part.4</div></td></tr><tr><td><div>2006년</div></td><td><div>진승하(陳升河)가 차 시장 정체를 계기로 보이차로 눈을 돌려 차산을 다니기 시작한다. 광동성 심천에서 철관음 수출 60% 점유율을 가졌던 인물이다.</div><div class=\"cell-src\">Part.2 4·5강</div></td></tr><tr><td><div>2007년</div></td><td><div>보이차 파동. 갑자기 사가는 사람이 없어지며 2년 동안 암흑기가 이어진다. 같은 해 사모시(思茅市)가 보이시(普洱市)로 이름을 바꾸는데, 1729년 이곳에 보이부가 섰던 역사적 상징성을 살린 개칭이다. 자사 쪽에서는 황룡산 도로 공사 중 포크레인으로 파다가 강파니(降坡泥)가 우연히 발견된다.</div><div class=\"cell-src\">Part.6 부록 / Part.3 2강 / Part.4 7강</div></td></tr><tr><td><div>2008년</div></td><td><div>진승 노반장 출시. 왕자산 고지대 빈 곳에 밭차 다주를 많이 식재하던 시기다. 2월에는 노반장 촌민소조와 진승차창이 30년 계약을 맺는데, 중국 내 기업과 단일 마을이 계약한 유일한 경우였다. 6월 17일에는 지리표시상품 보이차 국가표준(GB/T 22111-2008)이 공표되고, 12월에는 대삼통이 전면 시행되어 대만과 대륙을 오갈 때 홍콩을 경유할 필요가 없어진다.</div><div class=\"cell-src\">Part.3 4·5강 / Part.2 4·5강 / Part.1 1·2강 / Part.6 2강</div></td></tr><tr><td><div>2009년</div></td><td><div>빙도노채 차가 시장에 갑작스럽게 등장한다. 그 전까지 1kg에 몇십 위안이던 것이 이 시점부터 수백 위안에 거래되기 시작했다. 같은 해 7542 보석람이 나오며 대익이 재기하고, 관능 심평 국가표준(GB/T 23776-2009)이 제정된다.</div><div class=\"cell-src\">Part.2 2·3강 / Part.6 부록 / 노트</div></td></tr><tr><td><div>2010년</div></td><td><div>노반장 붐이 본격적으로 일기 시작한다. 다원차 개념이 생기면서 특정 산지와 고차수를 따지는 흐름이 자리 잡는다. 자사 쪽에서는 자원 고갈과 환경 보호를 이유로 황룡산 일대 전체의 채굴이 전면 금지된다(2004년 4호정 등 특정 갱구 금지에 이은 확대 조치다).</div><div class=\"cell-src\">Part.2 4·5강 / Part.4 5강</div></td></tr><tr><td><div>2010년 이후</div></td><td><div>옛 차의 맛을 재현하기 위해 다시 이무로 향하는 흐름이 생긴다. 사람의 발길이 닿지 않은 국유림이나 빛을 보기 위해 높게 자란 고간(高杆) 차나무 등 원생태 환경의 차가 최고급품으로 각광받는다. 자사 쪽에서는 중국 내수 시장의 급성장으로 생산이 늘면서 품질 편차가 매우 심해진다.</div><div class=\"cell-src\">Part.3 1강 / Part.6 1강 / Part.4</div></td></tr><tr><td><div>2011년</div></td><td><div>진승 노반장 프리미엄 출시. 진승차창이 노반장 원료로 만든 상위 등급 제품으로, 노반장이 최고급 산지로 굳어지는 흐름을 보여준다. 같은 해 칙도(雲南則道茶業)가 만송 왕자산 저지대를 17년간 임차한다.</div><div class=\"cell-src\">Part.3 2강 / Part.3 4·5강</div></td></tr><tr><td><div>2012~2013년</div></td><td><div>석귀차(昔歸茶)가 유명세를 얻기 시작한다. 소량 생산으로 귀해 '임창의 노반장'이라 불린다.</div><div class=\"cell-src\">Part.2 6강</div></td></tr><tr><td><div>2013년</div></td><td><div>진승차창과 노반장촌의 30년 계약이 5년 만에 파기된다. 다른 차창들이 벌금을 대신 내주겠다며 찻잎을 요청했기 때문이다. 이후로는 협업 관계를 유지했다. 같은 해 칙도가 왕자산 고차수 300그루를 조사해 넘버링하고 만송 상표를 등록한다.</div><div class=\"cell-src\">Part.2 4·5강 / Part.3 4·5강</div></td></tr><tr><td><div>2014~2018년</div></td><td><div>노반장 차왕수 독점채엽권 가격이 16만 위안에서 68만 위안으로 오른다. 2018년에는 차왕수 1kg당 68만 위안, 차후수 1kg당 46만 위안에 계약이 이루어졌다.</div><div class=\"cell-src\">Part.2 4·5강</div></td></tr><tr><td><div>2017년</div></td><td><div>만송이 유명해진다. 노반장이 뜨면서 예전에 이름났던 공차지 만송을 다시 찾게 된 흐름이다.</div><div class=\"cell-src\">Part.3 4·5강</div></td></tr><tr><td><div>2018년</div></td><td><div>62호 양영평이 차왕수와 차후수를 모두 소유한 상태에서 독점채엽권 계약이 이루어진다. 같은 해 칙도가 만송 마을에 내용증명을 보내 상표 사용료를 요구하자, 8월 23일 만송 촌민소조가 석일용에게 상표 무효소송을 위임하고 성명서를 낸다.</div><div class=\"cell-src\">Part.2 4·5강 / Part.3 4·5강</div></td></tr><tr><td><div>2019년</div></td><td><div>대익이 이무의 고급 원료로 만든 '전심(傳心)'을 출시한다. 11월 23일에는 빙도노채 차왕수의 2020년도 독점 채엽권이 99만 위안에 낙찰된다. 차왕수와 주변 고차수 6그루를 묶은 1년 계약이었다.</div><div class=\"cell-src\">Part.6 2강 / Part.2 2·3강</div></td></tr><tr><td><div>2020년 4월 21일</div></td><td><div>북경지식재산법원이 칙도의 만송 상표 소송 청구를 기각한다. 만송이 지명이므로 상표로서 식별력이 없다는 판단이었다. 결과적으로 이 분쟁으로 만송이 더 유명해졌다.</div><div class=\"cell-src\">Part.3 4·5강</div></td></tr><tr><td><div>2021년 10월</div></td><td><div>빙도노채가 신채 마을로 이주를 시작한다. 노채는 공원화되어 관광지가 된다.</div><div class=\"cell-src\">Part.2 2·3강</div></td></tr><tr><td><div>2022년</div></td><td><div>이무 지역의 박하당(薄荷塘)이 최고급 고수차 산지로 꼽히며 100g당 약 120만 원에 거래된다.</div><div class=\"cell-src\">Part.3 1강</div></td></tr><tr><td><div>2022년 11월 30일</div></td><td><div>운남성 고차수보호조례 통과(2023년 3월 1일 시행). 고수차 기준이 200년에서 100년으로 낮아지면서 대수차와 고수차가 사실상 같은 뜻이 된다. 늘어나는 수요에 대응해 고수차로 분류될 원료의 공급을 넓히려는 의도로 읽히며, 역설적으로 200년·300년 이상의 나무는 더 희소한 최상위 등급으로 분화되었다.</div><div class=\"cell-src\">Part.2 1·2강</div></td></tr></table>"},{"k":"h1","text":"부록 1 — 7542 판본 연표"},{"k":"p","html":"7542는 1975년 배방, 4급 원료, 맹해차창(2번) 제품이라는 뜻이다. 같은 이름이라도 만든 해와 포장에 따라 전혀 다른 차로 취급되기 때문에, 도록에서 판본을 가려내는 것이 곧 진위와 가치를 판별하는 일이 된다.","ind":0,"bul":false},{"k":"h2","text":"맹해계열 7542 — 국영 정창 시절"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>품명</b></div></th><th><div><b>비고</b></div></th></tr><tr><td><div>1970년대</div></td><td><div>칠자소녹인 / 칠자소황인 / 73청병</div></td><td><div>73청병은 자료에 따라 1970년대와 1973년으로 갈린다</div></td></tr><tr><td><div>1985년</div></td><td><div>후기 7542</div></td><td><div>맛이 좋다고 평가받는 판본</div></td></tr><tr><td><div>1988~92년</div></td><td><div>7542 88청병 (진국의 차예낙원)</div></td><td><div>드물게 건창 보관된 차라 비싸게 거래된다</div></td></tr><tr><td><div>1992·1993·1994년</div></td><td><div>92청병 / 93청병 / 94(업)청병</div></td><td></td></tr><tr><td><div>1996년</div></td><td><div>7542 매괴자대익</div></td><td><div>대익 상표를 처음 쓴 판본</div></td></tr><tr><td><div>1997년</div></td><td><div>7542 수지녹인 / 수람인</div></td><td><div>수람인은 거의 마지막 홍콩 습창 7542</div></td></tr><tr><td><div>1997·1998년</div></td><td><div>7542 등중록</div></td><td></td></tr><tr><td><div>1999년</div></td><td><div>7542 구구대도문청병</div></td><td></td></tr><tr><td><div>2000년</div></td><td><div>7542 무(無)R홍대익</div></td><td></td></tr><tr><td><div>2001년</div></td><td><div>7542 팔중 간체운 후지 / 박지</div></td><td><div>종이 두께로 구분한다</div></td></tr><tr><td><div>2003년</div></td><td><div>7542 팔중차자판 / 홍대익판</div></td><td></td></tr><tr><td><div>2004년</div></td><td><div>7542 홍대익간체병</div></td><td><div>민영화 직전 판본</div></td></tr></table>"},{"k":"h2","text":"대익계열 7542 — 민영화 이후"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>품명</b></div></th><th><div><b>비고</b></div></th></tr><tr><td><div>2005년</div></td><td><div>7542 백포조번체병 / 백포조간체병 대익(大益)</div></td><td><div>유명해서 복각품도 있다</div></td></tr><tr><td><div>2009년</div></td><td><div>7542 보석람(寶石藍)</div></td><td><div>남색 포장은 이것뿐이다. 2007년 파동 이후 재기의 계기가 되었으나 생산량이 지나치게 많아졌다</div></td></tr></table>"},{"k":"h1","text":"부록 2 — 산지별 모차 가격 추이"},{"k":"p","html":"한 지역의 차가 알려지고 나면 가격이 어떤 속도로 움직이는지 보여주는 자료다. 빙도는 2004년 38위안에서 2019년 최고 7만 위안으로 15년 만에 약 1,800배, 노반장은 2000년 8위안에서 2019년 최고 7만 위안으로 20년 만에 약 8,700배 올랐다.","ind":0,"bul":false},{"k":"h2","text":"빙도노채 모차"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>가격 (위안/공근(元/公斤))</b></div></th></tr><tr><td><div>2004년</div></td><td><div>38</div></td></tr><tr><td><div>2007년</div></td><td><div>360</div></td></tr><tr><td><div>2009년</div></td><td><div>180 (古樹)</div></td></tr><tr><td><div>2011년</div></td><td><div>1,500~1,800 (古樹)</div></td></tr><tr><td><div>2013년</div></td><td><div>8,000 (古樹)</div></td></tr><tr><td><div>2014년</div></td><td><div>18,000~20,000 (古樹)</div></td></tr><tr><td><div>2017년</div></td><td><div>30,000~50,000 (古樹)</div></td></tr><tr><td><div>2019년</div></td><td><div>40,000~70,000 (古樹)</div></td></tr></table>"},{"k":"h2","text":"노반장 모차"},{"k":"table","html":"<table><tr><th><div><b>연도</b></div></th><th><div><b>가격 (위안/공근(元/公斤))</b></div></th></tr><tr><td><div>2000년</div></td><td><div>8</div></td></tr><tr><td><div>2001년</div></td><td><div>11~12</div></td></tr><tr><td><div>2005년</div></td><td><div>120~180</div></td></tr><tr><td><div>2007년</div></td><td><div>800~1,500</div></td></tr><tr><td><div>2008~9년</div></td><td><div>400~600</div></td></tr><tr><td><div>2010년</div></td><td><div>1,200</div></td></tr><tr><td><div>2012년</div></td><td><div>2,000~3,000 / 1,700</div></td></tr><tr><td><div>2013년</div></td><td><div>3,500 / 2,800~3,000</div></td></tr><tr><td><div>2015년</div></td><td><div>5,000~10,000</div></td></tr><tr><td><div>2016년</div></td><td><div>6,000~8,000 / 4,000~6,000</div></td></tr><tr><td><div>2017년</div></td><td><div>4,000~8,000</div></td></tr><tr><td><div>2019년</div></td><td><div>10,000~70,000 / 4,000~7,000 (混采)</div></td></tr></table>"},{"k":"p","html":"시장 국면 — 보이차 극성수기(~2007) → 불경기(2007~2009) → 호황(2010~, 고차수 단일 지역 붐) → 불경기(2016). 대익차 시세에 7년 주기설이 있으나 신뢰할 만한 근거는 없다.","ind":0,"bul":false}]}]);

<script>
// 화면 설정(글자 크기·펼친 상태·목차 숨김·최근 읽은 곳)은 이번 방문 동안만 기억한다.
const viewerStorage = (() => {
  const values = Object.create(null);
  return {
    getItem(key){
      return Object.prototype.hasOwnProperty.call(values,key) ? values[key] : null;
    },
    setItem(key,value){
      values[key] = String(value);
    },
    removeItem(key){
      delete values[key];
    }
  };
})();

const SOURCE_LESSONS = window.__TEA_LESSONS || [];
const CHRONOLOGY_DATA = SOURCE_LESSONS.filter(d=>d.id==='chr');
const DATA = SOURCE_LESSONS.filter(d=>d.id!=='chr');
const LESSON_DATA = DATA;
const TASTING_DATA = window.__TEA_TASTINGS || [];
const ALL_DATA = LESSON_DATA.concat(TASTING_DATA, CHRONOLOGY_DATA);
const $ = s => document.querySelector(s);
const toc = $('#toc'), inner = $('#inner'), crumb = $('#crumb'), crumbPath = $('#crumbPath'), sideResults = $('#sideResults'), q = $('#q');
const appScroller = document.scrollingElement || document.documentElement;
const pageTop = () => window.scrollY || appScroller.scrollTop || 0;
const pageMax = () => Math.max(0, appScroller.scrollHeight - window.innerHeight);
function setPageTop(top){ window.scrollTo(0, Math.max(1, Math.min(Number(top)||0, pageMax()))); }
function pageScrollTo(top, behavior){ window.scrollTo({top:Math.max(1, Number(top)||0), behavior:behavior||'auto'}); }
let curDoc = DATA[0].id, hits = [], hitIdx = -1, searching = false;
let matchList = [], matchPos = -1, lastTerm = '';
const scrollPositions = Object.create(null);
let secIndex = [];   // [{level, idx, title}] 현재 문서의 h1/h2 목록(문서 내 등장 순서)

const strip = h => { const d=document.createElement('div'); d.innerHTML=h; return d.textContent||''; };
const cleanText = s => String(s).replace(/^[\u25a1\u2610\s]+/,'').replace(/\s*\([\u3260-\u327f,\s]+\)\s*$/,'').trim();
const escFull = s => String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const esc = s => escFull(cleanText(s));

/* ---------- 상단 탭 ---------- */
/* ---------- 문서 선택 + 목차 통합 사이드바 (아코디언) ---------- */
let activeCollection = 'lessons';
const searchTerms = {lessons:'', tasting:'', chronology:''};
// 글자 크기: 기본(가장 작게) → 조금 크게 → 크게. 보는 사람이 직접 고른 것만 기억한다.
// (예전 판은 열 때마다 '중간'을 저장해 두었으므로 새 이름으로 저장하고, 예전에 '크게'를 골라 둔 것만 이어받는다)
const TEXT_SIZE_KEY = 'teaNote.fontSize';
function setTextSize(size, save){
  const allowed = ['small','medium','large'];
  if(!allowed.includes(size)) size = 'small';
  document.documentElement.setAttribute('data-text-size', size);
  if(save){ try{ viewerStorage.setItem(TEXT_SIZE_KEY, size); }catch(e){} }
  Array.prototype.forEach.call(document.querySelectorAll('.text-size-option'), function(btn){
    const selected = btn.dataset.size===size;
    btn.setAttribute('aria-pressed', selected ? 'true' : 'false');
    btn.setAttribute('aria-label', (selected ? '선택됨, ' : '') + (btn.dataset.size==='small' ? '기본 글자' : btn.dataset.size==='medium' ? '조금 큰 글자' : '큰 글자'));
  });
}
function bindTextSizeControl(root){
  if(!root || root.dataset.boundTextSize==='true') return;
  root.dataset.boundTextSize='true';
  root.addEventListener('click', function(e){
    const btn=e.target.closest('.text-size-option');
    if(!btn || !root.contains(btn)) return;
    e.preventDefault();
    e.stopPropagation();
    setTextSize(btn.dataset.size, true);
  });
}
bindTextSizeControl(document.querySelector('.text-size-control'));
(function(){
  let saved = '';
  try{
    saved = viewerStorage.getItem(TEXT_SIZE_KEY) || '';
    const old = viewerStorage.getItem('teaNote.textSize');
    if(!saved && old==='large') saved = 'large';
    if(old!==null) viewerStorage.removeItem('teaNote.textSize');
  }catch(e){}
  setTextSize(saved || 'small', !!saved);
})();
function collectionName(name){
  if(name==='tasting') return '시음노트';
  if(name==='chronology') return '연대기';
  return '수업노트';
}
function updateSearchScope(){
  const scope = collectionName(activeCollection);
  const ss=document.getElementById('sideScope'); if(ss) ss.textContent='· '+scope;
  q.setAttribute('aria-label', scope+' 검색');
  q.placeholder = scope+' 검색';
}
function setCollection(name, focusTab){
  const changed = activeCollection!==name;
  if(changed) searchTerms[activeCollection] = q.value;
  activeCollection = name;
  Array.prototype.forEach.call(toc.querySelectorAll('.toc-tab'), function(tab){
    const on = tab.dataset.collection===name;
    tab.setAttribute('aria-selected', on ? 'true' : 'false');
    tab.tabIndex = on ? 0 : -1;
    if(on && focusTab) tab.focus();
  });
  Array.prototype.forEach.call(toc.querySelectorAll('.toc-panel'), function(panel){
    panel.hidden = panel.dataset.collection!==name;
  });
  if(changed){
    q.value = searchTerms[name] || '';
    updateSearchScope();
    search(q.value);
  } else {
    updateSearchScope();
  }
  updateTocExpandButton();
}

function updateTocExpandButton(){
  const btn=toc.querySelector('.toc-expand-all');
  const panel=toc.querySelector('.toc-panel[data-collection="'+activeCollection+'"]');
  if(!btn || !panel) return;
  btn.hidden = false;
  const groups=panel.querySelectorAll('.doc-group, .lesson-section-nav');
  const allOpen=groups.length>0 && Array.prototype.every.call(groups, function(g){ return g.classList.contains('open'); });
  btn.textContent=allOpen?'전체 접기':'전체 펼치기';
  btn.setAttribute('aria-expanded',allOpen?'true':'false');
}

/* 기록 가격과 단위로 100g 기준 가격을 계산한다. 계산할 수 없으면 빈 문자열 */
function per100(doc){
  const u=String(doc.unit||'').trim().match(/^(\d+(?:\.\d+)?)\s*g?$/);
  const p=String(doc.price||'').trim().match(/^(\d+(?:\.\d+)?)만\s*원/);
  if(!u||!p||!+u[1]) return '';
  const v=(+p[1])/(+u[1])*100;
  const r=Math.round(v*10)/10;
  return r.toLocaleString('ko-KR')+'만';
}

/* 좁은 화면에서는 표를 행 카드로 바꾸되, 각 값에 원래 열 제목을 붙인다. */
function enhanceTables(){
  Array.prototype.forEach.call(inner.querySelectorAll('table'), function(table){
    const first = table.querySelector('tr');
    if(!first) return;
    const labels = Array.prototype.map.call(first.cells, function(cell){ return cell.textContent.trim(); });
    Array.prototype.forEach.call(table.querySelectorAll('tr'), function(row, rowIndex){
      if(rowIndex===0) return;
      Array.prototype.forEach.call(row.cells, function(cell, i){
        cell.setAttribute('data-label', labels[i] || ('항목 '+(i+1)));
        /* 텍스트 노드도 값 열에 고정되도록 셀 내용을 하나의 요소로 감싼다. */
        const value = document.createElement('div');
        value.className = 'cell-value';
        while(cell.firstChild) value.appendChild(cell.firstChild);
        cell.appendChild(value);
      });
    });
  });
}

/* 본문에서 펼친 강(부)은 기억해 두었다가 다시 열어도 펼친 채로 보여 준다 */
let OPEN_SECS = {};
try{ OPEN_SECS = JSON.parse(viewerStorage.getItem('teaNote.openSecs')||'{}') || {}; }catch(e){ OPEN_SECS = {}; }
function isSecOpen(docId, idx){ return !!(OPEN_SECS[docId] && OPEN_SECS[docId].indexOf(+idx)>=0); }
function rememberSec(docId, idx, open){
  const list = OPEN_SECS[docId] || (OPEN_SECS[docId]=[]);
  const k = list.indexOf(+idx);
  if(open && k<0) list.push(+idx);
  if(!open && k>=0) list.splice(k,1);
  try{ viewerStorage.setItem('teaNote.openSecs', JSON.stringify(OPEN_SECS)); }catch(e){}
}
function setLessonSectionState(section, open){
  if(!section || !section.hasAttribute('data-collapsible')) return;
  rememberSec(curDoc, section.dataset.h1, open);
  section.classList.toggle('collapsed',!open);
  const btn=section.querySelector(':scope > h1 .lesson-toggle');
  if(btn) btn.setAttribute('aria-expanded',open?'true':'false');
}
function updateLessonExpandButton(){
  const btn=$('#toggleAllLessons');
  if(!btn) return;
  const sections=inner.querySelectorAll('.sec1[data-collapsible]');
  const allOpen=sections.length>0 && Array.prototype.every.call(sections,function(s){ return !s.classList.contains('collapsed'); });
  btn.textContent=allOpen?'전체 접기':'전체 펼치기';
  btn.setAttribute('aria-expanded',allOpen?'true':'false');
}
function expandLessonForElement(el){
  if(!el) return;
  const section=el.closest('.sec1[data-collapsible]');
  if(section && section.classList.contains('collapsed')){
    setLessonSectionState(section,true);
    updateLessonExpandButton();
  }
}

/* ---------- 본문 렌더 (h1/h2 구간을 감싸는 wrapper 포함) ---------- */
function render(docId, scrollMode){
  /* 본문 뷰를 교체하기 전에 문서 스크롤 위치를 저장하고, 돌아올 때 복원한다. */
  if(curDoc && inner.childNodes.length) scrollPositions[curDoc] = pageTop();
  curDoc = docId;
  curH1 = null; curH2 = null;   // 문서를 새로 그릴 때는 이전 활성 구간 기록을 반드시 비운다
  const doc = ALL_DATA.find(d=>d.id===docId);
  secIndex = [];

  let h = '';
  if(doc.kind==='tasting'){
    h += '<div class="doc-title">'+escFull(doc.label)+'</div>';
    h += '<div class="doc-sub">부생반일 · 시음노트</div>';
    const per=per100(doc), is100=/^100\s*g?$/.test(String(doc.unit||'').trim());
    let price='';
    if(per){
      price='<span class="fp-per">100g당 '+escFull(per)+' 원</span>';
      if(!is100) price+='<span class="fp-rec">'+escFull(doc.unit)+'당 '+escFull(doc.price)+'</span>';
    } else if(doc.price || doc.unit){
      price=escFull([doc.price,doc.unit].filter(Boolean).join(' / '));
    }
    const facts=[['연도',doc.year ? escFull(doc.year+'년') : '미상'],['계절',escFull(doc.season||'')],['다류',escFull(doc.sort||'')],['등급',escFull(doc.grade||'')],['가격',price]].filter(x=>x[1]);
    h += '<dl class="tasting-facts">'+facts.map(x=>'<div><dt>'+x[0]+'</dt><dd>'+x[1]+'</dd></div>').join('')+'</dl>';
    if(doc.images && doc.images.length){
      h += '<div class="tasting-gallery">'+doc.images.map((src,i)=>'<figure><img src="assets/'+encodeURIComponent(src)+'" alt="'+escFull(doc.label)+' 테이스팅 기록 사진 '+(i+1)+'" onerror="var g=this.closest(\'.tasting-gallery\');this.closest(\'figure\').remove();if(g&&!g.children.length)g.remove();"></figure>').join('')+'</div>';
    }
  }

  else {
    const heads = doc.blocks.filter(b=>b.k==='h1').map(b=>b.text);
    let sub;
    if(doc.id==='chr'){
      const apps = heads.filter(t=>/^부록/.test(t)).length, parts = heads.length-apps;
      sub = '연대기 · 시대 '+parts+'개'+(apps?' · 부록 '+apps+'편':'');
    } else {
      const lectures = heads.filter(t=>!/^부록/.test(t)), apps = heads.length-lectures.length;
      sub = '수업노트 · '+lectures.map(cleanText).join(' · ')+(apps?' · 부록':'');
    }
    h += '<div class="doc-title">'+escFull(doc.label)+'</div>';
    h += '<div class="doc-sub">'+escFull(sub)+'</div>';
  }

  let openH2 = false, openH1 = false, lessonNumber = 0;
  doc.blocks.forEach((b,i)=>{
    if(b.k==='h1'){
      if(openH2){ h+='</div>'; openH2=false; }
      if(openH1){ h+='</div>'; }
      const collapsible=doc.kind!=='tasting';
      h += '<div class="sec1'+(collapsible && !isSecOpen(doc.id,i)?' collapsed':'')+'" data-h1="'+i+'"'+(collapsible?' data-collapsible':'')+'>';
      openH1 = true;
      if(collapsible){
        h += '<h1 class="b" id="b'+i+'"><button class="lesson-toggle" type="button" aria-expanded="'+(isSecOpen(doc.id,i)?'true':'false')+'"><span>'+escFull(b.text)+'</span><span class="lesson-toggle-arrow" aria-hidden="true">&#9662;</span></button></h1>';
        lessonNumber++;
      } else {
        h += '<h1 class="b" id="b'+i+'">'+escFull(b.text)+'</h1>';
      }
      secIndex.push({level:1, idx:i, title:cleanText(b.text)});
      return;
    }
    if(b.k==='h2'){
      if(openH2){ h+='</div>'; }
      h += '<div class="sec2" data-h2="'+i+'">';
      openH2 = true;
      h += '<h2 class="b'+(/^\s*※/.test(b.text)?' memo':'')+'" id="b'+i+'">'+escFull(b.text)+'</h2>';
      secIndex.push({level:2, idx:i, title:cleanText(b.text)});
      return;
    }
    const id = ' id="b'+i+'"';
    if(b.k==='table'){ h += '<div class="tbl-wrap" data-block="'+i+'">'+b.html+'</div>'; return; }
    if(b.k==='h3' || b.k==='h4'){ h += '<'+b.k+' class="b"'+id+'>'+escFull(b.text)+'</'+b.k+'>'; return; }
    if(b.k==='note'){
      const nc = b.ind>=56?' i3':b.ind>=40?' i2':b.ind>=20?' i1':'';
      const noteHtml = doc.kind==='tasting' ? String(b.html||'').replace(/^\s*※\s*/, '') : b.html;
      h += '<p class="note'+(doc.kind==='tasting'?' tasting-memo':'')+nc+'"'+id+'>'+noteHtml+'</p>'; return;
    }
    const ic = b.ind>=56?'i3':b.ind>=40?'i2':b.ind>=20?'i1':'';
    h += '<p class="b '+ic+' '+(b.bul?'bul':'')+'"'+id+'>'+b.html+'</p>';
  });
  if(openH2) h += '</div>';
  if(openH1) h += '</div>';

  inner.dataset.doc = doc.id;
  inner.innerHTML = h;
  Array.prototype.forEach.call(inner.querySelectorAll('.lesson-toggle'),function(btn){
    btn.onclick=function(){
      const section=btn.closest('.sec1[data-collapsible]');
      setLessonSectionState(section,section.classList.contains('collapsed'));
      updateLessonExpandButton();
      requestAnimationFrame(syncActive);
    };
  });
  enhanceTables();
  if(doc.id==='chr'){
    Array.prototype.forEach.call(inner.querySelectorAll('.tbl-wrap[data-block]'),function(wrap){
      const blockIndex=wrap.dataset.block;
      Array.prototype.forEach.call(wrap.querySelectorAll('tr'),function(row,rowIndex){
        if(rowIndex>0) row.id='chrono-'+blockIndex+'-'+rowIndex;
      });
    });
  }
  syncSidebar();
  const restoreTop = scrollMode===true ? 0
    : (typeof scrollMode==='number' ? scrollMode : (scrollPositions[doc.id] || 0));
  setPageTop(restoreTop);
  requestAnimationFrame(syncActive);
}

/* ---------- 현재 읽고 있는 구간 동기화: 본문 강조 + 목차 강조 + breadcrumb ---------- */
let curH1 = null, curH2 = null;
function syncActive(){
  const THRESH = 96;
  let h1 = null, h2 = null;
  secIndex.forEach(s=>{
    const el = document.getElementById('b'+s.idx);
    if(!el || el.offsetParent===null) return;
    if(el.getBoundingClientRect().top < THRESH){
      if(s.level===1){ h1=s; h2=null; }
      else h2=s;
    }
  });
  // 수업노트에서는 h2가 h1보다 앞선 섹션 것이지 않게 하고,
  // h1 없이 h2로만 구성된 연대기는 h2 자체를 현재 목차 항목으로 쓴다.
  if(h1===null && curDoc!=='chr') h2=null;

  if(h1!==curH1 || h2!==curH2){
    if(curH1){ const e=document.querySelector('.sec1[data-h1="'+curH1.idx+'"]'); if(e){ e.classList.remove('active-solo'); } }
    if(curH2){ const e=document.querySelector('.sec2[data-h2="'+curH2.idx+'"]'); if(e){ e.classList.remove('active'); } }
    curH1 = h1; curH2 = h2;
    if(h2){ const e=document.querySelector('.sec2[data-h2="'+h2.idx+'"]'); if(e){ e.classList.add('active'); } }
    else if(h1){ const e=document.querySelector('.sec1[data-h1="'+h1.idx+'"]'); if(e){ e.classList.add('active-solo'); } }
  }

  // 목차 강조 (검색 중일 때는 목차가 숨어있으므로 건드리지 않는다)
  if(!searching){
    const items = toc.querySelectorAll('.toc-item');
    items.forEach(it=>{
      const idx = +it.dataset.idx;
      const currentSection = h2 || h1;
      const on = it.dataset.doc===curDoc && (it.dataset.note==='true' || (currentSection && idx===currentSection.idx));
      it.classList.toggle('on', !!on);
      if(on){
        const section=it.closest('.lesson-section-nav');
        const top=it.offsetTop, bottom=top+it.offsetHeight;
        if(top<toc.scrollTop) toc.scrollTop=top;
        else if(bottom>toc.scrollTop+toc.clientHeight) toc.scrollTop=bottom-toc.clientHeight;
      }
    });
    Array.prototype.forEach.call(toc.querySelectorAll('.lesson-section-nav'),function(section){
      const parentGroup=section.closest('.doc-group');
      const isChronology=section.classList.contains('chronology-section-nav');
      const on=(isChronology ? curDoc==='chr' : !!parentGroup && parentGroup.dataset.doc===curDoc) && h1 && +section.dataset.idx===h1.idx;
      const sh=section.querySelector(':scope > .lesson-section-head');
      if(sh) sh.classList.toggle('on',!!on);
    });
    updateTocExpandButton();
  }

  // breadcrumb
  const docLabel = (ALL_DATA.find(d=>d.id===curDoc)||{}).label || '';
  const segs = [docLabel];
  if(h1) segs.push(h1.title);
  if(h2) segs.push(h2.title);
  crumbPath.innerHTML = segs.map((s,i)=>{
    const cur = i===segs.length-1;
    return (i>0?'<span class="sep">&#8250;</span>':'') + '<span class="seg'+(cur?' cur':'')+'">'+escFull(s)+'</span>';
  }).join('');
}

function gotoChronologyRow(docId, blockIndex, rowIndex){
  const moved=docId!==curDoc;
  if(moved) render(docId,false);
  const el=document.getElementById('chrono-'+blockIndex+'-'+rowIndex);
  if(el){
    expandLessonForElement(el);
    const clearance=crumb.offsetHeight+18;
    const top=el.getBoundingClientRect().top+pageTop();
    pageScrollTo(top-clearance, moved?'auto':'smooth');
    setTimeout(syncActive,420);
  }
  if(window.innerWidth<=860) closeSide();
}

// 다른 문서로 넘어갈 때는 문서 처음부터 훑어 내려가지 않고 바로 그 자리로 간다(같은 문서 안에서는 부드럽게)
function goto(docId, idx, how){
  const moved = docId!==curDoc;
  if(moved) render(docId,false);
  const el = document.getElementById('b'+idx);
  if(el){
    expandLessonForElement(el);
    // 상단에 breadcrumb 바가 고정돼 있으므로 그 높이만큼 더 내려서 제목이 가려지지 않게 한다
    const clearance = crumb.offsetHeight + 18;
    const top = el.getBoundingClientRect().top + pageTop();
    pageScrollTo(top - clearance, how || (moved?'auto':'smooth'));
    setTimeout(syncActive, 420);
  }
  if(window.innerWidth<=860) closeSide();
}

/* ---------- 검색 ---------- */
function search(term){
  term = term.trim();
  lastTerm = term;
  searchTerms[activeCollection] = term;
  if(term.length<1){
    searching = false;
    $('#side').classList.remove('searching');
    sideResults.style.display = 'none'; sideResults.innerHTML = '';
    Array.prototype.forEach.call(toc.querySelectorAll('.toc-panel'), function(panel){ panel.hidden = panel.dataset.collection!==activeCollection; });
    $('#searchnav').style.display = 'none';
    matchList=[]; matchPos=-1; updateNavCount();
    syncActive();
    return;
  }
  const low = term.toLowerCase();
  const found = [];
  const source = activeCollection==='tasting' ? TASTING_DATA : (activeCollection==='chronology' ? CHRONOLOGY_DATA : DATA);
  source.forEach(doc=>{
    let h1='', h2='';
    if(doc.kind==='tasting'){
      const title=doc.label || '';
      const pos=title.toLowerCase().indexOf(low);
      if(pos>=0){
        const snip=escFull(title.slice(0,pos))+'<mark>'+escFull(title.slice(pos,pos+term.length))+'</mark>'+escFull(title.slice(pos+term.length));
        found.push({doc:doc.id,label:doc.label,idx:-1,h1:'시음노트',h2:'',snip:snip});
      }
      return;
    }
    doc.blocks.forEach((b,i)=>{
      if(b.k==='h1') h1=b.text;
      if(b.k==='h2') h2=b.text;
      const text = b.k.charAt(0)==='h' ? b.text : strip(b.html||'');
      if(!text) return;
      const pos = text.toLowerCase().indexOf(low);
      if(pos<0) return;
      const s = Math.max(0,pos-30), e = Math.min(text.length,pos+term.length+50);
      const snip = (s>0?'…':'') + escFull(text.slice(s,pos))
                 + '<mark>' + escFull(text.slice(pos,pos+term.length)) + '</mark>'
                 + escFull(text.slice(pos+term.length,e)) + (e<text.length?'…':'');
      found.push({doc:doc.id, label:doc.label, idx:i, h1:h1, h2:h2, snip:snip});
    });
  });
  matchList = found; matchPos = -1;
  updateNavCount();
  showResults(found, term);
}

function updateNavCount(){
  const nc = $('#navcount'), pv = $('#prev'), nx = $('#next');
  if(!matchList.length){ nc.textContent=''; pv.disabled=nx.disabled=true; return; }
  pv.disabled = nx.disabled = false;
  nc.textContent = (matchPos>=0 ? (matchPos+1) : '–') + ' / ' + matchList.length;
}

/* 검색 결과를 사이드바(목차 자리)에 그대로 나열한다. 본문(main)은 건드리지 않으므로
   지금 보고 있던 문서 내용이 계속 보이고, 카드를 누르면 바로 그 위치로 이동한다. */
function showResults(found, term){
  searching = true;
  $('#side').classList.add('searching');
  Array.prototype.forEach.call(toc.querySelectorAll('.toc-panel'), function(panel){ panel.hidden = true; });
  sideResults.style.display = 'block';
  $('#searchnav').style.display = found.length ? '' : 'none';
  if(!found.length){ sideResults.innerHTML = '<div id="empty" style="padding:30px 16px">‘'+escFull(term)+'’에 대한 결과가 없습니다.</div>'; return; }
  const byDoc = {};
  found.forEach(f=>{ (byDoc[f.label]=byDoc[f.label]||[]).push(f); });
  const scopeName = collectionName(activeCollection);
  let h = '<div id="reshead">'+scopeName+'에서 '+found.length+'곳을 찾았습니다</div>';
  Object.keys(byDoc).forEach(label=>{
    h += '<div class="res-doc-label">'+escFull(label)+' <span>('+byDoc[label].length+')</span></div>';
    byDoc[label].forEach(f=>{
      const loc = [f.h1,f.h2].filter(Boolean).map(esc).join(' › ');
      const gi = matchList.indexOf(f);
      h += '<div class="res" data-doc="'+f.doc+'" data-idx="'+f.idx+'" data-gi="'+gi+'">'
         + '<div class="rtop"><span class="rnum">'+(gi+1)+'</span><span class="loc">'+(loc||'—')+'</span></div>'
         + '<div class="snip">'+f.snip+'</div></div>';
    });
  });
  sideResults.innerHTML = h;
  Array.prototype.forEach.call(sideResults.querySelectorAll('.res'), function(el){
    el.onclick = function(){
      const d=el.dataset.doc, i=+el.dataset.idx;
      matchPos = matchList.findIndex(function(x){ return x.doc===d && x.idx===i; });
      gotoMatch(matchList[matchPos]);
      updateNavCount();
      markCurrentResult();
      closeSide(); // 모바일: 결과를 눌러 실제 이동했으면 서랍을 닫아 본문이 바로 보이게 한다
    };
  });
  markCurrentResult();
}

/* 화살표로 이동했을 때도 결과 카드 목록에서 지금 보고 있는 항목이 눈에 띄게 표시한다 */
function markCurrentResult(){
  const list = sideResults.querySelectorAll('.res');
  if(!list.length) return;
  let curEl = null;
  list.forEach(function(el){
    const on = (+el.dataset.gi === matchPos);
    el.classList.toggle('cur', on);
    if(on) curEl = el;
  });
  if(curEl){
    const top=curEl.offsetTop, bottom=top+curEl.offsetHeight;
    if(top<sideResults.scrollTop) sideResults.scrollTop=top;
    else if(bottom>sideResults.scrollTop+sideResults.clientHeight) sideResults.scrollTop=bottom-sideResults.clientHeight;
  }
}

/* 기존에 붙여둔 <mark> 를 걷어내 원래 텍스트 노드로 되돌린다 (재검색 시 중첩 방지) */
function clearMarks(){
  Array.prototype.forEach.call(inner.querySelectorAll('mark'), function(m){
    m.replaceWith(document.createTextNode(m.textContent));
  });
  inner.normalize();
}

function highlight(term){
  clearMarks();
  hits=[]; hitIdx=-1;
  if(!term) return;
  const low=term.toLowerCase();
  const walk = document.createTreeWalker(inner, NodeFilter.SHOW_TEXT);
  const nodes=[]; let n;
  while(n=walk.nextNode()){ if(n.nodeValue.toLowerCase().indexOf(low)>=0) nodes.push(n); }
  nodes.forEach(function(node){
    const frag=document.createDocumentFragment();
    let s=node.nodeValue, i;
    while((i=s.toLowerCase().indexOf(low))>=0){
      frag.appendChild(document.createTextNode(s.slice(0,i)));
      const m=document.createElement('mark'); m.textContent=s.slice(i,i+term.length);
      frag.appendChild(m); hits.push(m);
      s=s.slice(i+term.length);
    }
    frag.appendChild(document.createTextNode(s));
    node.parentNode.replaceChild(frag,node);
  });
}

/* 검색 결과 하나(문서+블록)로 실제 이동한다. 문서가 다르면 먼저 전환한다. */
function gotoMatch(f){
  if(!f) return;
  const moved = f.doc!==curDoc, how = moved ? 'auto' : 'smooth';
  if(moved){ render(f.doc, false); }
  highlight(lastTerm);
  let blockEl = f.idx<0
    ? inner.querySelector('.doc-title')
    : (document.getElementById('b'+f.idx) || inner.querySelector('[data-block="'+f.idx+'"]'));
  // 표는 찾은 줄(행)로 바로 간다
  if(blockEl && f.row!=null){ const rows=blockEl.querySelectorAll('tr'); if(rows[f.row]) blockEl=rows[f.row]; }
  expandLessonForElement(blockEl);
  let target=null, targetPos=-1;
  if(blockEl){
    for(let i=0;i<hits.length;i++){ if(blockEl.contains(hits[i])){ target=hits[i]; targetPos=i; break; } }
  }
  if(target){
    hitIdx = targetPos; target.classList.add('cur');
    const top = target.getBoundingClientRect().top + pageTop();
    pageScrollTo(top - window.innerHeight/2, how);
  } else if(blockEl && f.row!=null){
    pageScrollTo(blockEl.getBoundingClientRect().top + pageTop() - crumb.offsetHeight - 18, how);
  } else if(blockEl){
    goto(f.doc, f.idx, how);
  }
}

/* 위/아래 버튼과 Enter — 전역 결과 목록을 그대로 순환한다. 이전에 결과를 안 눌러도 바로 작동한다. */
function stepMatch(dir){
  if(!matchList.length) return;
  matchPos = matchPos<0 ? (dir>0 ? 0 : matchList.length-1)
                        : ((matchPos+dir)+matchList.length)%matchList.length;
  if(hitIdx>=0 && hits[hitIdx]) hits[hitIdx].classList.remove('cur');
  gotoMatch(matchList[matchPos]);
  updateNavCount();
}

}

  // 마지막으로 읽던 수업노트·연대기 위치 기억 (시음노트는 제외, 보는 사람마다 따로 저장)

  // 전체 검색: 강·대제목별로 묶고, 찾은 문장을 통째로 보여 준다(앞뒤를 '…'로 자르지 않음)

  const emptyHint = '';

  let searchIndex = null;     // 첫 검색 때 한 번 만든다
  function plainText(html){ const d=document.createElement('div'); d.innerHTML=html; return (d.textContent||'').replace(/\s+/g,' ').trim(); }
  function splitSentences(text){
    const out=[]; let start=0;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(ch!=='.' && ch!=='!' && ch!=='?' && ch!=='。') continue;
      let j=i+1;
      while(j<text.length && '"\'」』)]”’'.indexOf(text[j])>=0) j++;
      if(j>=text.length || /\s/.test(text[j])){ const s=text.slice(start,j).trim(); if(s) out.push(s); start=j; i=j-1; }
    }
    const rest=text.slice(start).trim(); if(rest) out.push(rest);

  }
  // 찾은 말이 든 문장 하나를 통째로 고른다. 너무 짧으면(25자 미만) 앞 문장(없으면 뒤 문장)을 붙여 뜻이 통하게 한다.
  function sentenceWith(parts, low){
    for(let p=0;p<parts.length;p++){
      const ss=splitSentences(parts[p]);
      for(let s=0;s<ss.length;s++){
        if(ss[s].toLowerCase().indexOf(low)<0) continue;
        if(ss[s].length<25){
          if(s>0) return ss[s-1]+' '+ss[s];
          if(s+1<ss.length) return ss[s]+' '+ss[s+1];
        }
        return ss[s];
      }
    }
    return '';
  }
  function markAll(text, term){
    const t=String(text).toLowerCase(), low=term.toLowerCase();
    let out='', pos=0, i;
    while((i=t.indexOf(low,pos))>=0){ out+=escFull(text.slice(pos,i))+'<mark>'+escFull(text.slice(i,i+term.length))+'</mark>'; pos=i+term.length; }
    return out+escFull(text.slice(pos));
  }
  // 띄어 쓴 여러 말을 각각 표시한다(시음노트용)
  function markTokens(text, toks){
    const s=String(text||''), low=s.toLowerCase(), hit=[];
    toks.forEach(function(k){ if(!k) return; let i=0; while((i=low.indexOf(k,i))>=0){ for(let j=i;j<i+k.length;j++) hit[j]=true; i+=k.length; } });
    let out='', open=false;
    for(let i=0;i<s.length;i++){

  function buildSearchIndex(){
    const holder=document.createElement('div'), docs=[];
    const cellText=function(el){ return (el.textContent||'').replace(/\s+/g,' ').trim(); };
    LESSON_DATA.concat(CHRONOLOGY_DATA).forEach(function(doc){
      const isChr=doc.id==='chr', entries=[], titles={};
      let h1='', h1i=-1, h2i=-1;
      doc.blocks.forEach(function(b,i){
        if(b.k==='h1'){ h1=cleanText(b.text); h1i=i; h2i=-1; titles[i]=[h1]; entries.push({kind:'title',idx:i,sec:i,text:h1}); return; }
        if(b.k==='h2'){ const h2=cleanText(b.text); h2i=i; titles[i]=[h1,h2].filter(Boolean); entries.push({kind:'title',idx:i,sec:i,text:h2}); return; }
        const sec = h2i>=0 ? h2i : h1i;
        if(b.k==='table'){
          holder.innerHTML=b.html;

          const heads=trs.length ? Array.prototype.map.call(trs[0].cells, cellText) : [];

          if(!isChr && heads.some(Boolean)) entries.push({kind:'row',idx:i,row:0,sec:sec,text:heads.filter(Boolean).join(' · '),pairs:[{k:'',v:heads.filter(Boolean).join(' · ')}]});

            } else {

              const pairs=cells.map(function(c,ci){ return {k:heads[ci]||'', v:c.join(' ')}; }).filter(function(x){ return x.v; });

  function findHits(term){

      const secs=[], map={};

    return res;
  }

  }
  const bbtn=document.createElement('button');
  bbtn.id='backBtn'; bbtn.type='button'; bbtn.disabled=true; bbtn.setAttribute('aria-label','뒤로');
  bbtn.title='뒤로'; bbtn.innerHTML='&#8678;';
  const hbtn=document.createElement('button');
  hbtn.id='homeBtn'; hbtn.type='button'; hbtn.setAttribute('aria-label','홈');
  hbtn.title='홈'; hbtn.innerHTML='<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>';
  hbtn.onclick=function(){ if(curDoc!=='home') renderHome(); };
  $('#nav').insertBefore(hbtn, $('#nav').firstChild);
  $('#nav').insertBefore(bbtn, $('#top'));
  function updBack(){ bbtn.disabled=!backStack.length; armGuard(); }
  function pushNav(){
    if(restoring || !curDoc) return;
    const e={doc:curDoc, top:pageTop()};
    const t=backStack[backStack.length-1];
    if(t && t.doc===e.doc && Math.abs(t.top-e.top)<40) return;
    backStack.push(e); if(backStack.length>50) backStack.shift(); updBack();
  }
  function wrapNav(fn){ return function(){ if(navBusy) return fn.apply(this,arguments); pushNav(); navBusy=true; try{ return fn.apply(this,arguments); } finally{ navBusy=false; updBack(); } }; }
  render=wrapNav(render);
  goto=wrapNav(goto);
  gotoChronologyRow=wrapNav(gotoChronologyRow);
  gotoMatch=wrapNav(gotoMatch);
  const _home=window.renderHome;
  window.renderHome=function(first){ if(!first && curDoc!=='home') pushNav(); _home(first); updBack(); };
  function goBackInApp(){
    const e=backStack.pop(); if(!e){ updBack(); return; }
    restoring=true; navBusy=true;
    try{
      if(e.doc==='home'){ if(curDoc!=='home') _home(); }
      else if(e.doc!==curDoc) render(e.doc, e.top);
      setPageTop(e.top);
      if(isMobile()) closeSide();
    } finally{ restoring=false; navBusy=false; updBack(); }
  }
  bbtn.onclick=goBackInApp;
  window.addEventListener('popstate', function(){
    if(!tnGuard) return;
    tnGuard=false;
    if(isMobile() && $('#side').classList.contains('open')){ closeSide(); armGuard(); return; }
    if(backStack.length){ goBackInApp(); return; }
    try{ history.back(); }catch(e){}
  });
  const _openSideG=openSide;
  openSide=function(){ _openSideG(); armGuard(); };
  // 목차 묶음 이름 통일: 수업노트 n권 · 시음노트 (100g 기준) n건 · 연대기 n개
  (function(){
    const tl=toc.querySelector('.toc-panel[data-collection="tasting"] .collection-label span');
    if(tl) tl.textContent='시음노트 (100g 기준)';
    toc.querySelectorAll('.per100-note').forEach(e=>e.remove());
    const cp=toc.querySelector('.toc-panel[data-collection="chronology"]');
    if(cp && !cp.querySelector('.collection-label')){
      const n=cp.querySelectorAll('.chronology-section-nav').length;
      const lb=document.createElement('div'); lb.className='collection-label';
      lb.innerHTML='<span>연대기</span><span class="collection-count">'+n+'개</span>';
      cp.insertBefore(lb, cp.firstChild);
    }
  })();
  // 목차 안의 홈 탭은 쓰지 않는다 (홈은 머리줄 버튼으로)
  st.remove(); sp.remove();
  search('');
  renderHome(true);
  updateHeaderHeight();
})();

</script>

</body></html>
