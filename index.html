<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:var(--fs-m) -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
</head><body>
<title>차 노트</title>
<style>
/* 차 노트 — 장식보다 정보 위계를 앞세운 단정한 단일 테마
   레이아웃: 데스크톱은 왼쪽 목차 + 가운데 본문(최대 560px), 휴대폰은 목차 서랍 */
:root{
  color-scheme:light dark;
  --bg:#F7F7F8; --surface:#FFFFFF; --row:#F0F1F2; --row-hover:#E7E9EB; --line:#D8DADD;
  --ink:#202225; --ink2:#3F4348; --sub:#70757C;
  --accent:#A44763; --accent-soft:#F7E8ED;
  --hit:#FDE68A; --hit-cur:#FBBF24; --hit-ring:transparent; --shadow:rgba(22,25,29,.10); --scrim:rgba(20,23,27,.34);
  --font:"Pretendard","Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --hdr-h:52px;
  --hdr-top:calc(env(safe-area-inset-top, 0px) + var(--hdr-h));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#191C1F; --row:#24282C; --row-hover:#2D3237; --line:#343A40;
    --ink:#F0F1F2; --ink2:#D3D6DA; --sub:#9DA4AC;
    --accent:#E08AA4; --accent-soft:#3A232D;
    --hit:#6B5A1E; --hit-cur:#8F6F10; --hit-ring:var(--accent); --shadow:rgba(0,0,0,.38); --scrim:rgba(0,0,0,.54);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#191C1F; --row:#24282C; --row-hover:#2D3237; --line:#343A40;
  --ink:#F0F1F2; --ink2:#D3D6DA; --sub:#9DA4AC;
  --accent:#E08AA4; --accent-soft:#3A232D;
  --hit:#6B5A1E; --hit-cur:#8F6F10; --hit-ring:var(--accent); --shadow:rgba(0,0,0,.38); --scrim:rgba(0,0,0,.54);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{
  margin:0; min-height:100%; height:auto; overflow-x:clip; overflow-y:auto;
  overscroll-behavior:none;
}
body{
  margin:0; min-height:calc(100vh + 1px); height:auto; overflow:visible;
  overscroll-behavior:none;
  font-family:var(--font); font-size:var(--fs-m); line-height:1.8; letter-spacing:-.01em;
  background:var(--bg); color:var(--ink);
}
button{font-family:inherit}
b{font-weight:700}
i{font-style:italic}
.mark-green{color:var(--accent);font-weight:650}

/* ---------- 뼈대 ---------- */
#wrap{
  display:flex; min-height:100vh; height:auto; overflow:visible; position:relative;
  overscroll-behavior:none;
}
#wrap{align-items:flex-start}
#main{flex:1; min-width:0; position:relative; min-height:100%}
/* 글자 크기 토큰 4단계(--fs-xl 24 · --fs-l 18 · --fs-m 16 · --fs-s 14). font-size에는 이 토큰만 쓴다.
   읽기 글자 크기 3단계: 기본 16px → 조금 크게 18px → 크게 24px
   --ts는 목차·홈 목록·검색 결과에 쓰는 배율(기본에서는 지금 크기 그대로) */
html{--fs-xl:24px; --fs-l:18px; --fs-m:16px; --fs-s:14px; --ts:1.12; --reading-size:var(--fs-m)}
html[data-text-size="medium"]{--ts:1.28; --reading-size:var(--fs-l)}
html[data-text-size="large"]{--ts:1.44; --reading-size:var(--fs-xl)}
#inner{max-width:560px; margin:0 auto; padding:28px 24px 160px; font-size:var(--reading-size); --fs:var(--reading-size)}

/* ---------- 상단 머리줄(현재 위치) ---------- */
#crumb{
  position:sticky; top:0; z-index:5; background:var(--bg);
  border-bottom:1px solid var(--line); padding:10px 24px;
  display:flex; flex-direction:row; align-items:center; gap:12px;
}
#tocToggle{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 12px;
  border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--accent);
  font-size:var(--fs-m); font-weight:700; cursor:pointer;
}
#tocToggle:hover{background:var(--row)}
#backBtn[hidden],#homeBtn[hidden]{display:none}
#nav #homeBtn{display:inline-flex; align-items:center; justify-content:center}
body.side-hidden #side{display:none}
#crumbPath{
  display:block; flex:1; min-width:0;
  font-size:var(--fs-s); color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#crumb .seg{color:var(--sub)}
#crumb .seg.cur{color:var(--accent); font-weight:700}
#crumb .sep{color:var(--line); margin:0 4px}
#mSearch{display:none!important}

/* ---------- 왼쪽 목차(데스크톱) / 서랍(휴대폰) ---------- */
#side{
  width:300px; flex:0 0 300px; background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden; height:100vh; position:sticky; top:0; align-self:flex-start;
}
#searchbar{order:1; flex:0 0 auto; display:flex; flex-direction:column; gap:10px; padding:16px 16px 14px; border-bottom:1px solid var(--line)}
#toc{order:2; flex:1; overflow-y:auto; overscroll-behavior:none; touch-action:pan-y; padding:0 14px 40px}
#sideResults,#searchResults{order:2; flex:1; overflow-y:auto; overscroll-behavior:none; touch-action:pan-y; padding:6px 14px 40px; display:none}
#side.searching #toc{flex:0 0 auto; overflow:visible; padding-bottom:0}
#side.searching .toc-panel,#side.searching .toc-actions{display:none!important}
#side.searching .toc-toolbar{margin-bottom:0; border-bottom:0}

/* 글자 크기 */
.text-size-control{display:flex; justify-content:flex-end}
.text-size-options{display:flex; gap:3px; padding:3px; background:var(--row); border-radius:9px}
.text-size-option{min-width:38px; height:30px; padding:0 8px; border:0; border-radius:7px; background:transparent; color:var(--sub); font-weight:700; cursor:pointer}
.text-size-option[data-size="small"]{font-size:var(--fs-m)}
.text-size-option[data-size="medium"]{font-size:var(--fs-l)}
.text-size-option[data-size="large"]{font-size:var(--fs-xl)}
.text-size-option[aria-pressed="true"]{background:var(--surface); color:var(--accent)}

/* 검색창 */
.searchbox{position:relative; width:100%}
.searchbox svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--sub); pointer-events:none}
#q{
  width:100%; min-height:42px; padding:10px 12px 10px 36px; border:1px solid var(--line); border-radius:10px;
  font:inherit; font-size:var(--fs-m); background:var(--surface); color:var(--ink); -webkit-appearance:none; appearance:none;
}
#q::placeholder{color:var(--sub)}
#q:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
#searchnav{display:flex; align-items:center; gap:8px}
#searchnav button{
  width:34px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink2); font-size:var(--fs-m); cursor:pointer;
}
#searchnav button:disabled{opacity:.35; cursor:default}
#navcount{flex:1; text-align:center; font-size:var(--fs-s); color:var(--sub); font-variant-numeric:tabular-nums}

/* 목차 머리: 탭 + 전체 펼치기 */
.toc-toolbar{position:sticky; top:0; z-index:3; background:var(--surface); padding:14px 0 8px; margin-bottom:6px; border-bottom:1px solid var(--line)}
.toc-tabs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:3px; padding:3px; background:var(--row); border-radius:10px}
.toc-tab{min-height:38px; padding:0 2px; white-space:nowrap; border:0; border-radius:8px; background:transparent; color:var(--sub); font-size:var(--fs-s); font-weight:700; cursor:pointer}
.toc-tab[aria-selected="true"]{background:var(--surface); color:var(--accent)}
.toc-actions{display:flex; justify-content:flex-end; padding:8px 0 0}
.toc-expand-all{border:0; background:transparent; color:var(--accent); font-size:var(--fs-s); font-weight:700; cursor:pointer; padding:4px 6px; border-radius:6px}
.toc-panel[hidden]{display:none}
.collection-label{display:flex; justify-content:space-between; padding:12px 4px 8px; color:var(--sub); font-size:var(--fs-s); font-weight:700}
.collection-count{font-weight:500; font-variant-numeric:tabular-nums}

/* 펼치는 줄(목차): 모두 회색 바탕 */
.doc-group{margin-bottom:8px}
.doc-group-head,.lesson-section-head{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
  padding:12px 14px; border:0; border-radius:10px; background:var(--row); color:var(--ink);
  font-size:var(--fs-l); font-weight:700; line-height:1.5; text-align:left; cursor:pointer;
}
.doc-group-head:hover,.lesson-section-head:hover{background:var(--row-hover)}
.doc-group.open>.doc-group-head,.doc-group.current>.doc-group-head{color:var(--accent)}
.dgh-arrow{flex:0 0 auto; font-size:var(--fs-s); color:var(--sub); transition:transform .15s}
.doc-group.open>.doc-group-head .dgh-arrow,
.lesson-section-nav.open>.lesson-section-head .dgh-arrow{transform:rotate(180deg); color:var(--accent)}
.doc-group-list{display:none; padding:8px 0 4px}
.doc-group.open .doc-group-list{display:block}
.lesson-section-nav{margin:0 0 6px 24px}
.lesson-section-head{padding:10px 12px; font-size:var(--fs-m); font-weight:650}
.lesson-section-head.on{color:var(--accent)}
.lesson-section-nav.open>.lesson-section-head{color:var(--accent)}
.lesson-section-list{display:none; margin:4px 0 6px 6px; padding-left:10px; border-left:2px solid var(--line)}
.lesson-section-nav.open>.lesson-section-list{display:block}
.chronology-section-nav{margin-left:0}

.toc-item{
  padding:9px 10px; margin:1px 0; border-radius:8px; font-size:var(--fs-m); line-height:1.5; color:var(--ink2);
  cursor:pointer; overflow-wrap:break-word;
}
.toc-item:hover{background:var(--row)}
.toc-item.lv2{font-size:var(--fs-m); color:var(--ink2)}
.toc-item.on{background:var(--accent-soft); color:var(--accent); font-weight:700}
.tasting-year>.doc-group-head small{margin-left:6px; color:var(--sub); font-size:var(--fs-s); font-weight:500}
.tasting-item{display:flex; align-items:baseline; gap:10px; padding-left:12px}
.tasting-item .note-season{flex:0 0 auto; min-width:26px; color:var(--sub); font-size:var(--fs-s); font-weight:700}
.tasting-item .t-label{flex:1; min-width:0; overflow-wrap:anywhere}
.tasting-item .per100{flex:0 0 auto; margin-left:8px; color:var(--sub); font-size:var(--fs-s); font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap}
.tasting-item.on .per100{color:var(--accent)}
.per100-note{padding:0 4px 8px; color:var(--sub); font-size:var(--fs-s)}

/* 목차 맨 아래: 글자 크기 */
#sideFoot{order:3; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:10px 14px calc(14px + env(safe-area-inset-bottom, 0px)); border-top:1px solid var(--line); background:var(--surface)}
#sideFoot .sf-label{font-size:var(--fs-s); color:var(--sub)}
#sideFoot .text-size-options{padding:3px; border-radius:9px}
#sideFoot .text-size-option{min-width:44px; height:34px; padding:0 8px; border-radius:7px}
#sideFoot .text-size-option[data-size="small"]{font-size:var(--fs-m)}
#sideFoot .text-size-option[data-size="medium"]{font-size:var(--fs-l)}
#sideFoot .text-size-option[data-size="large"]{font-size:var(--fs-xl)}
/* 검색 탭 */
.search-panel{padding:6px 0 30px}
.search-panel .searchbox{margin:4px 0 8px}
.search-panel #searchnav{margin:0 0 6px}
#searchResults{display:block; padding:0; overflow:visible}
/* 검색 결과 */
#reshead{font-size:var(--fs-s); color:var(--sub); padding:10px 4px}
.res-doc-label{font-size:var(--fs-s); font-weight:700; color:var(--accent); padding:14px 4px 6px}
.res-doc-label span{color:var(--sub); font-weight:500}
.res{padding:12px 8px; border-bottom:1px solid var(--line); cursor:pointer; font-size:var(--fs-m)}
.res:hover{background:var(--row)}
.res.cur{background:var(--accent-soft)}
.res .rtop{display:flex; gap:8px; align-items:flex-start; margin-bottom:4px}
.res .rnum{flex:0 0 auto; min-width:22px; color:var(--sub); font-size:var(--fs-s); font-weight:700; font-variant-numeric:tabular-nums}
.res .loc{flex:1; min-width:0; font-size:var(--fs-s); color:var(--sub); line-height:1.5; overflow-wrap:anywhere}
.res .snip{color:var(--ink); line-height:1.6; overflow-wrap:break-word}
.res .snip mark{font-weight:700}
#empty{padding:36px 14px; text-align:center; color:var(--sub); font-size:var(--fs-m)}

/* ---------- 본문 ---------- */
.doc-title{font-size:1.47em; font-weight:800; line-height:1.3; letter-spacing:-.03em; margin:4px 0 6px; text-wrap:balance}
.doc-sub{font-size:.9em; color:var(--sub); margin:0 0 26px}

.sec1{position:relative}
.sec2{position:relative; padding-left:0}
.sec2.active::before,.sec1.active-solo::before{
  content:""; position:absolute; left:-12px; top:6px; bottom:6px; width:3px; border-radius:2px; background:var(--accent); opacity:.55;
}

/* 강(부) 제목: 누르면 접히는 줄이므로 회색 바탕 */
h1.b{font-size:1.2em; font-weight:800; line-height:1.4; margin:28px 0 16px; scroll-margin-top:calc(var(--hdr-h) + 12px)}
h1.b:has(.lesson-toggle){margin:22px 0 14px; font-size:1.07em; font-weight:700}
.lesson-toggle{
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
  padding:13px 16px; border:0; border-radius:10px; background:var(--row); color:inherit;
  font:inherit; font-weight:inherit; text-align:left; cursor:pointer;
}
.lesson-toggle:hover{background:var(--row-hover)}
.lesson-toggle-arrow{flex:0 0 auto; font-size:.65em; color:var(--accent); transition:transform .15s}
.sec1.collapsed .lesson-toggle-arrow{transform:rotate(-90deg)}
.sec1.collapsed>.b:not(h1),.sec1.collapsed>.sec2,.sec1.collapsed>.tbl-wrap,.sec1.collapsed>.note{display:none}
/* 시음노트의 '테이스팅 기록'처럼 접지 않는 제목 */
.sec1:not([data-collapsible])>h1.b{font-size:1.07em; font-weight:700; padding-bottom:10px; border-bottom:1px solid var(--line)}

h2.b{font-size:1.07em; font-weight:700; line-height:1.5; margin:32px 0 10px; color:var(--ink); text-wrap:balance; scroll-margin-top:calc(var(--hdr-h) + 12px)}
h2.b.memo{color:var(--sub); padding-top:18px; border-top:1px dashed var(--line)}
h3.b{font-size:1em; font-weight:700; line-height:1.55; margin:24px 0 8px; color:var(--ink)}
h4.b{font-size:.95em; font-weight:700; line-height:1.55; margin:18px 0 6px; color:var(--ink2)}

p.b{margin:8px 0; line-height:1.85}
p.bul{position:relative; padding-left:16px}
p.bul::before{content:"\2022"; position:absolute; left:2px; color:var(--accent)}
p.i1{margin-left:4px}
p.i2{margin-left:22px}
p.i2.bul::before{content:"\25E6"; color:var(--sub)}
p.i3{margin-left:40px}
p.i3.bul::before{content:"\2013"; color:var(--sub)}
p.note,p.note.i1,p.note.i2,p.note.i3{margin-left:0}
p.note{font-size:.88em; line-height:1.75; color:var(--sub); margin:12px 0 16px; padding-left:12px; border-left:2px solid var(--line)}
p.tasting-memo{font-size:1em; line-height:1.85; color:var(--ink); margin:8px 0; padding-left:0; border-left:0}

/* 표 */
.tbl-wrap{overflow-x:auto; margin:18px 0 22px; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:.9em; line-height:1.65; background:var(--surface)}
th,td{border:1px solid var(--line); padding:10px 12px; vertical-align:top; text-align:left}
th{background:var(--row); font-weight:700; white-space:nowrap}
td div+div{margin-top:3px}
.cell-src{font-size:.85em; color:var(--sub); font-style:normal}
#inner[data-doc="chr"] table{table-layout:fixed; font-size:var(--reading-size)}
#inner[data-doc="chr"] td>.cell-value>div:not(.cell-src){font-size:var(--reading-size)}
#inner[data-doc="chr"] .cell-src{font-size:.88em}
#inner[data-doc="chr"] th:first-child,#inner[data-doc="chr"] td:first-child{width:128px}

mark{background:var(--hit); color:inherit; padding:1px 0; border-radius:2px}
mark.cur{background:var(--hit-cur); box-shadow:0 0 0 1.5px var(--hit-ring)}

/* 시음노트 */
.tasting-facts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; margin:0 0 24px; background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden}
.tasting-facts>div{padding:12px 14px; background:var(--surface)}
.tasting-facts dt{font-size:.87em; color:var(--sub); margin:0 0 2px}
.tasting-facts dd{font-size:1em; font-weight:700; margin:0; font-variant-numeric:tabular-nums}
.tasting-gallery{margin:0 0 24px}
.tasting-gallery figure{margin:0}
.tasting-gallery img{display:block; max-width:100%; height:auto; border-radius:10px}

/* ---------- 떠 있는 버튼 ---------- */
#nav{position:fixed; right:22px; bottom:24px; z-index:10; display:flex; gap:10px}
#nav button{
  width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
  color:var(--ink2); font-size:var(--fs-l); cursor:pointer; box-shadow:0 2px 8px var(--shadow);
}
#menu{display:none!important}
#scrim{display:none; position:fixed; inset:0; background:var(--scrim); z-index:19}
#scrim.show{display:block}
#sideHead{display:none}

button:focus-visible,input:focus-visible,.doc-group-head:focus-visible,.toc-item:focus-visible,.res:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ---------- 좁은 데스크톱 ---------- */
@media (min-width:621px) and (max-width:900px){
  #side{width:250px; flex-basis:250px}
}

/* ---------- 휴대폰 ---------- */
@media (max-width:620px){
  #crumb{padding:8px 14px}
  #inner{padding:22px 18px calc(96px + env(safe-area-inset-bottom, 0px))}
  .sec2.active::before,.sec1.active-solo::before{left:-10px}

  /* 목차 서랍: 상단 머리줄 아래 화면을 채운다 */
  #side{
    position:fixed; left:0; top:var(--hdr-top); z-index:20;
    width:min(86vw,340px); flex:none; border-right:1px solid var(--line);
    height:calc(100% - var(--hdr-top)); max-height:calc(100% - var(--hdr-top));
    box-shadow:8px 0 28px var(--shadow);
    visibility:hidden; pointer-events:none; transform:translateX(-100%);
    transition:transform .18s, visibility 0s linear .18s;
  }
  body.side-hidden #side{display:flex}
  #side.open{visibility:visible; pointer-events:auto; transform:none; transition-delay:0s}
  #scrim{top:var(--hdr-top); bottom:0}
  #sideHead{
    order:0; display:flex; align-items:center; gap:8px; flex:0 0 auto;
    padding:12px 16px; background:var(--accent); color:#fff; font-size:var(--fs-l); font-weight:700;
  }
  #sideHead .sh-scope{font-weight:500; opacity:.85}
  #sideHead button{margin-left:auto; border:0; background:transparent; color:#fff; font-size:var(--fs-m); font-weight:700; padding:4px 6px; cursor:pointer}
  #side{border-top:0}
  #side .doc-group-head,#side .lesson-section-head{font-size:var(--fs-m)}
  .toc-toolbar{display:flex; flex-direction:column}
  .toc-actions{justify-content:flex-end; align-items:center; padding-top:6px}
  #side.searching #searchbar,#side.searching .toc-toolbar{display:none!important}
  #searchbar{display:none}
  .toc-toolbar{padding-top:6px}

  #nav{right:16px; bottom:calc(14px + env(safe-area-inset-bottom, 0px))}

  /* 표는 행마다 카드로 */
  .tbl-wrap{overflow:visible}
  .tbl-wrap table,.tbl-wrap tbody{display:block; width:100%; background:transparent}
  .tbl-wrap tr{display:block; margin:0 0 12px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
  .tbl-wrap tr:first-child{display:none}

<script>window.__TEA_LESSONS=(window.__TEA_LESSONS||[]).concat([{"id":"p1","label":"보이차 Part.1","blocks":[{"k":"h1","text":"1 & 2강"},{"k":"p","html":"암차에 암운, 고산오룡차에 고산운, 철관음에 관음운, 보이차에 진운(월진월향)이 있다고 하듯이, 각 다류 별로 골격이 있다. 보이차의 특징은 월진월향이라고 하는데, 어떤 차가 월진월향이 나는지, 어떻게 보관해야 나는지, 어떤 차를 사야 하는지 알아보자.","ind":0,"bul":false},{"k":"h2","text":"□ 완성차의 가격 지표"},{"k":"p","html":"X [찻잎의 품질] · Y [가공] · Z [보관(시간, 환경)]의 세 축으로 그린 지표. 햇차의 지표와 2~3년 넘은 다류의 지표를 나란히 놓고 비교한다.","ind":0,"bul":false},{"k":"p","html":"찻잎의 품질이 좋으면 가공의 완성도가 좋을 수밖에 없다.","ind":22,"bul":true},{"k":"p","html":"<b>원료를 보는 기준:</b> 회감(날숨의 향), 생진(침 고임), 목넘김, 체감(열감/차기)","ind":22,"bul":true},{"k":"p","html":"배저향 = 내재물질의 향 = 날숨의 향 → 후변화가 기대되는 차","ind":40,"bul":true},{"k":"p","html":"체감은 소화전달과 신경전달(신경자극)으로 인한 반응","ind":40,"bul":true},{"k":"p","html":"향미(들숨의 향)는 가공의 영향을 받은 부분이며, 타격감과 바디감 또한 구분해야 한다.","ind":22,"bul":true},{"k":"p","html":"햇차는 Z의 영향을 최소화하고 X를 최대로 느낄 수 있다.","ind":22,"bul":true},{"k":"h2","text":"□ 차(茶)의 정의와 발음"},{"k":"p","html":"차가 되려면 세 가지 요소가 있어야 한다. ①차나무 ②잎 ③가공(제다) 육로를 통해 수입되면 '차', 해로(복건성 하문)를 통해 수입되면 '테/다'로 읽힌다.","ind":0,"bul":false},{"k":"p","html":"마카오·홍콩은 '차'를 사용하기 때문에 마카오를 점령한 포르투갈도 '차'를 쓴다.","ind":22,"bul":true},{"k":"p","html":"우리나라에서는 '차'라고 하지만 차와 관련된 단어들은 '다'를 쓴다.","ind":22,"bul":true},{"k":"p","html":"각 차에는 세월의 흔적을 담은 독특한 향이 있고, 이를 운(韻)이라 표현한다. 무이암차의 암운(巖韻)과 암골화향(巖骨花香), 고산오룡차의 고산운, 철관음의 관음운, 보이차의 진운과 월진월향이 그것이다.","ind":22,"bul":true},{"k":"h2","text":"□ 차나무의 재배한계선"},{"k":"p","html":"추위에 약해 북방한계선이 있다.","ind":22,"bul":true},{"k":"p","html":"장강을 기준으로 나뉜다. (강북/강남/화남/서남)","ind":22,"bul":true},{"k":"p","html":"중국의 가장 북단에 위치한 차밭은 산동성(칭따오) 노산차밭이다.","ind":22,"bul":true},{"k":"p","html":"몽정감로","ind":22,"bul":true},{"k":"p","html":"사천성 아안 몽정산의 몽정감로가 제일 먼저 나온다.","ind":40,"bul":true},{"k":"p","html":"중국 차의 인공 재배는 서한 감로 연간(기원전 53년경) 사천성 아안 몽정산에서 비롯되었다고 전한다. 오리진(吳理眞)이 산 정상에 차나무 일곱 그루를 심었다는 전승으로, 그 차는 선차(仙茶)라 불렸고 오늘날 몽정감로(蒙頂甘露)로 이어진다.","ind":40,"bul":true},{"k":"p","html":"흔히 쓰이는 &#x27;보혜선사&#x27;는 남송 효종이 그에게 내린 시호 감로보혜선사에서 온 후대의 호칭이며, 인도에서 차씨를 가져왔다는 설도 있으나 정설은 아니다.","ind":40,"bul":true},{"k":"p","html":"다만 이는 어디까지나 전승이고, 재배차의 중국 기원을 뒷받침하는 실제 사료는 왕포의 『동약(僮約)』(기원전 59년)이다. 사천에서 노비의 업무를 열거한 이 글에는 무도에 가서 차를 사 오고(武都買茶) 차를 달여 다구를 갖춘다(烹荼盡具)는 대목이 있어, 당시 차가 이미 시장에서 거래되고 전용 도구로 마시던 음료였음을 보여준다.","ind":40,"bul":true},{"k":"h2","text":"□ 중국 국가표준 7대 차류의 분류"},{"k":"h3","text":"1. 산화와 발효"},{"k":"h4","text":"가. 중국 제차학에서의 발효의 정의"},{"k":"p","html":"『茶叶中的多酚類物質与空气中的氧气相結合, 在氧化酵素的作用下, 氧化變紅的結果。』 차엽 내의 폴리페놀 물질과 공기 중의 산소가 서로 결합하여 효소의 작용 하에 홍변의 결과를 낳는 것.","ind":0,"bul":false},{"k":"p","html":"6대 다류 기본 분류(발효) ← 발효의 전제는 미생물! 그래서 사실상 효소산화라고 정의해야 맞다.","ind":22,"bul":true},{"k":"p","html":"오늘날 통용되는 중국차의 6대 다류(육대다류) 분류는 안휘농학원(현 안휘농업대학)의 진연(陳椽, 1908~1999) 교수가 정립했다. 1979년 5월 『차업통보』에 실린 논문 「차엽분류의 이론과 실제」 에서 정식으로 제시되었으며, 차를 녹차·황차·흑차·백차·청차·홍차의 여섯으로 나눈다. 분류 근거는 제다법과 품질의 계통성, 내질의 주요 변화에 차의 발전 과정을 결합한 것으로, 핵심은 폴리페놀(다엽 성분)의 산화 정도다. 탕색(찻물 색)은 가장 직관적인 지표이지만 그 자체가 기준이라기보다 제다 공정의 결과로 나타나는 현상이다.","ind":22,"bul":true},{"k":"h4","text":"나. 산화와 발효의 구분"},{"k":"p","html":"차에서 말하는 &#x27;발효&#x27;는 관행적 표현으로, 실제 내용은 대부분 산화다. 광의(廣義)의 발효는 아래 두 가지를 포괄한다.","ind":0,"bul":false},{"k":"p","html":"<b>협의(狹義)의 발효:</b> 미생물에 의한 대사 → 흑차의 악퇴","ind":22,"bul":true},{"k":"p","html":"산화(산소와 결합)","ind":22,"bul":true},{"k":"p","html":"<b>자동산화:</b> 효소 없이 진행, 느려서 제다에는 쓰이지 않는다","ind":40,"bul":true},{"k":"p","html":"<b>효소산화:</b> 제다공정에 이용된다","ind":40,"bul":true},{"k":"p","html":"효소산화를 일으키는 폴리페놀 산화효소는 효소의 일종이다. 효소란 자신은 변하지 않으면서 다른 물질의 변화를 돕는 단백질로, 반응에 필요한 활성화 에너지를 낮춰 속도를 높인다. 제다 공정에서는 유념으로 세포를 파괴해 카테킨과 효소가 만나면서 산화가 시작되고, 살청으로 효소를 실활(失活, 열에 의해 효소가 기능을 잃음)시키면 산화가 멈춘다. 녹차가 녹색을 유지하는 원리다. 산화가 진행되면 다황소·다홍소가 생성되어 홍차의 붉은 탕색을 만든다.","ind":22,"bul":true},{"k":"h4","text":"다. 발효와 부패(=산화와 산패)의 구분"},{"k":"p","html":"같은 반응이라도 결과가 사람에게 이로우면 발효, 해로우면 부패라 부른다. 화학적 구분이 아니라 인간 기준의 구분이며, 그만큼 문화·관습에 따라 갈린다.","ind":0,"bul":false},{"k":"p","html":"<b>발효 ↔ 부패(腐敗):</b> 미생물 대사의 결과가 유익한가 유해한가","ind":22,"bul":true},{"k":"p","html":"<b>산화 ↔ 산패(酸敗):</b> 산화의 결과가 유익","ind":22,"bul":true},{"k":"h3","text":"2. 7대 다류의 분류 (판단의 기준 시점과 산화도)"},{"k":"p","html":"산화발효도에 따라 수색이 달라지므로, 다류를 결정하는 요인은 산화발효도가 기준이 된다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>녹차</b></div></th><th><div><b>백차</b></div></th><th><div><b>황차</b></div></th><th><div><b>청차</b></div></th><th><div><b>홍차</b></div></th><th><div><b>흑차</b></div></th></tr><tr><td><div>10% 이하</div></td><td><div>5~15%</div></td><td><div>10~25%</div></td><td><div>15~70%</div></td><td><div>70~95%</div></td><td><div>80%</div></td></tr></table>"},{"k":"p","html":"산화도는 위조 과정에서 결정되며, 가공에서 건조가 끝난 시점까지를 다류 판단의 기준 시점으로 삼는다. 보관 후 산화도의 변화로 인한 향맛의 변화는 판단의 기준이 되지 않는다.","ind":0,"bul":false},{"k":"p","html":"다즐링 퍼스트플러쉬는 백차 제다 방식이지만 홍차다. (위조-건조-끝, but 열건조)","ind":22,"bul":true},{"k":"h3","text":"3. 보이차의 6대 혹은 7대 다류상의 분류"},{"k":"p","html":"1차 가공 다류를 기준으로 하면 6대 다류, 재가공 다류까지 포함하면 7대 다류가 된다.","ind":0,"bul":false},{"k":"p","html":"보이생차는 녹차(대엽종 쇄청녹차) ↔ 강남·강북차구(중원) 녹차는 소엽종 초청녹차","ind":22,"bul":true},{"k":"h2","text":"□ 산화 및 발효에 따른 차색소(차탕 색)의 종류"},{"k":"table","html":"<table><tr><th><div><b>차색소</b></div></th><th><div><b>해당 물질</b></div></th><th><div><b>색 / 특징</b></div></th></tr><tr><td><div>차황소</div></td><td><div>테아플라빈</div></td><td><div>녹·노 계열 / 산화발효도 낮음</div></td></tr><tr><td><div>차홍소</div></td><td><div>테아루비긴</div></td><td><div>갈 계열</div></td></tr><tr><td><div>차갈소</div></td><td><div>테아브라우닌</div></td><td><div>검은 계열 / 고분자물질</div></td></tr></table>"},{"k":"h2","text":"□ 보이차라는 명칭의 유래(지명)"},{"k":"p","html":"보이부에서 세금을 책정해 도장을 찍어 유통했기 때문이다. 보이차 명성이 자자했던 건 청나라 때였고(왕자산 만송이 가장 유명), 청나라가 망한 뒤 사그라들다가 나중에 다시 부흥한다.","ind":0,"bul":false},{"k":"note","html":"※ Part.3 4 &amp; 5강 「만송촌과 다원관리」·「만송 왕자산의 유래」에서 왕자산 만송을 자세히 다룬다."},{"k":"h2","text":"□ 보이차의 현대적 정의"},{"k":"p","html":"08년 6월 17일 공표된 지리표시상품인 보이차에 관한 국가 표준(GB/T 22111-2008)은 보이차를 다음과 같이 정의한다. 『보이차는 / ㉮ 지리표시 보호구역 내의 ㉯ 운남대엽종 ㉰ 쇄청모차를 ㉱ 원료로 하여 / ㉲ 특정한 가공 방법을 거쳐 만드는 / ㉳ 독특한 품질 특징을 가지는 차를 말한다. 이는 가공 방법과 특징에 따라 ㉴ 생차와 숙차로 구분한다.』","ind":0,"bul":false},{"k":"p","html":"국가표준상 보이차는 생차의 경우 긴압을 해야 하고(산차는 모차로 봄), 숙차는 산차여도 가공한 상태이므로 인정받는다.","ind":22,"bul":true},{"k":"h2","text":"□ 지리표시보호구역(㉮)"},{"k":"p","html":"운남성 보이시, 서쌍판납, 임창시, 곤명시, 대리주, 보산시, 덕굉주, 초웅주, 홍하주, 옥계시, 문산주 등 11개 주와 시, 75개의 현 및 그에 소속된 639개의 향진의 관할행정구역 내의 지역.","ind":0,"bul":false},{"k":"h2","text":"□ 운남대엽종(㉯)"},{"k":"p","html":"소엽종, 중엽종도 많지만 다른 지역 특산품과 구분하기 위해 대엽종이라고 특정한다.","ind":0,"bul":false},{"k":"h2","text":"□ 쇄청모차(㉰, ㉱)"},{"k":"p","html":"쇄청(晒靑, 햇볕에 말림)은 보이차를 일반 운남 녹차와 가르는 핵심 요건으로, 쇄청모차를 만드는 과정이 보이차 제다의 초제(初製)에 해당한다. 다만 이는 규정상의 기준이고 실제와는 거리가 있다.","ind":0,"bul":false},{"k":"p","html":"운남성은 5월부터 우기에 들어 햇볕에 말릴 수 있는 기간이 짧고, 대량 생산에서는 홍건(烘乾) 등 다른 건조법이 쓰이는 경우가 많다. 실제로 온전히 쇄청을 거치는 것은 순료 고수차 등 일부에 그친다.","ind":22,"bul":true},{"k":"h2","text":"□ 특정한 가공방법(㉲)"},{"k":"p","html":"쇄청모차를 가공하는 재제의 단계.","ind":0,"bul":false},{"k":"h2","text":"□ 보이차의 최종적인 성형 형태"},{"k":"p","html":"긴압차(병차, 전차, 타차, 인두차, 긴차, 소입차)와 산차(숙산차, 해산차).","ind":0,"bul":false},{"k":"note","html":"※ Part.3 3강 복습 Quiz 1의 하관차창 긴차, Part.6 부록 「맹해정창 특강」의 전차·타차·긴차 서술과 연관."},{"k":"h2","text":"□ 현대 보이차의 가공공정 1 — 모차(초제차) : 원료가 되는 차"},{"k":"p","html":"현대 보이차의 가공 공정은 쇄청 모차를 만드는 초제 + 이를 다시 선별 등 가공하는 복제(정제)의 두 단계로 나뉜다.","ind":0,"bul":false},{"k":"h3","text":"1. 초제의 과정"},{"k":"p","html":"채엽(선엽) → 위조 → 살청 → 유념 → 쇄청(쇄건)","ind":0,"bul":false},{"k":"p","html":"단계마다 달성 목적과 다음 단계 준비 목적이 있다.","ind":22,"bul":true},{"k":"h3","text":"2. 채엽(선엽) — 잎 골라 따기"},{"k":"h3","text":"3. 위조 — 대나무채반에 담아 시들리기"},{"k":"p","html":"위조 과정에서 세포막이 파괴되어 폴리페놀과 폴리페놀 효소가 만나 화학반응이 일어난다. 또한 숨이 죽어서 다음 단계인 살청으로 넘어갈 준비가 된다. 보통 보이차는 음지에 두고 반나절에서 한나절, 12시간쯤 위조하는데 (백차는 1~2일) 90년대 이후부터 밭차는 위조할 시간이 없어 과정을 생략한다. 위조 과정 중 풀 향에서 꽃 향으로 변하며 향미가 생긴다.","ind":0,"bul":false},{"k":"p","html":"짧게 시들리는 걸 탄량/탄방이라고 하며, 화학반응이 거의 없게 한다.","ind":22,"bul":true},{"k":"p","html":"홍차는 시들리기 후 유념을 해서 전산화차라고 한다. 산화 속도를 올리기 위함이다.","ind":22,"bul":true},{"k":"h3","text":"4. 살청(덖기)"},{"k":"p","html":"6kg 생엽을 담아 기울어진 가마솥을 300도 언저리로 데워서 덖는다. 6kg 생엽을 솥에 넣으면 300도였던 온도가 70도까지 일시적으로 떨어지며 수증기가 많이 생긴다. 살청 과정은 충분히 익혀서 숨을 죽이고, 효소 활동을 멈춰 산화를 늦춘다. 효소(단백질)는 열에 약해 살청을 하면 효소가 변성된다(60~70% 실활).","ind":0,"bul":false},{"k":"p","html":"녹차는 살청에서 건조가 끝나며, 살청 시 보이차보다 양을 적게 넣는다. 이로 인해 '선상미'라고 하는 푸릇한 맛이 생긴다. 보이차는 후발효를 위해 어느 정도 살청 시간을 조절하기 때문에 풀비린내가 난다. 그러나 공장차는 기계제다에 세팅 값이 높아 녹차처럼 다 건조되어버려 익지 않고 3~4년 후 쩐내가 난다.","ind":22,"bul":true},{"k":"h3","text":"5. 유념"},{"k":"p","html":"대나무채반 위에서 손으로 밀며 비비기. 살청 후 폴리페놀 효소는 30%만 남는다.","ind":0,"bul":false},{"k":"h3","text":"6. 쇄청(쇄건, 일광건조)"},{"k":"p","html":"효소 살리기. 자외선 때문에 오존 계통의 안 좋은 향이 생긴다(고추 같은 매운 향).","ind":0,"bul":false},{"k":"p","html":"<b>초청(솥건조) / 홍청(열풍건조):</b> 초청과 홍청은 효소를 죽이는 방식이고, 쇄청은 햇빛으로 말리므로 효소가 살아남는다. 살청에서 효소의 60~70%가 사라지고 30~40% 정도만 남는데, 보이차는 후발효를 위해 일부러 이 일부를 남긴다.","ind":22,"bul":true},{"k":"h2","text":"□ 현대 보이차의 가공공정 2 — 생차"},{"k":"p","html":"초제를 거친 쇄청모차를 다시 가공하는 재제 과정으로, 생차와 숙차로 나누어 각각의 공정이 이루어진다. 『쇄청모차 (→ 사분, 간척 → 병배, 균퇴) → 증기긴압(증압성형) → 건조 → 포장』 병배차 과정. 고차수는 싹이 자주 나지 않기 때문에 차나무가 풍성히 자란 뒤 일아삼엽~오엽을 채엽하지만, 밭차는 일창이기(일아이엽)를 채엽해 11등급으로 나눠 병배한다(등급병배).","ind":0,"bul":false},{"k":"h3","text":"1. 사분, 간척"},{"k":"p","html":"사분은 큰 잎과 작은 잎을 분류하는 것, 간척은 이물질을 제거하는 것.","ind":0,"bul":false},{"k":"h3","text":"2. 병배, 균퇴"},{"k":"p","html":"병배는 블렌딩 비율 정하기, 균퇴는 균질하게 섞기.","ind":0,"bul":false},{"k":"h3","text":"3. 증기긴압"},{"k":"h3","text":"4. 건조"},{"k":"p","html":"응달건조.","ind":0,"bul":false},{"k":"h3","text":"5. 포장"},{"k":"p","html":"편포장(내포장) 357g, 통포장(중포장/7편) 2.5kg, 외포장(건포장/28편-4통, 42편-6통, 84편-12통). 전통적 포장은 12통 대건으로 30kg이다. (말 한 필당 60kg, 총 2건을 실을 수 있음)","ind":0,"bul":false},{"k":"note","html":"※ Part.3 3강 복습 Quiz 2(칠자병차의 유래 — 세금 징수 단위), Part.6 시대차품 1강 복습 Quiz 3(말 한 필에 60kg)과 직접 연관."},{"k":"h2","text":"□ 현대 보이차의 가공공정 2 — 숙차"},{"k":"p","html":"숙차의 재제 공정은 다음과 같다. 『쇄청모차 → 악퇴(발효) (→ 사분, 간척 → 병배, 균퇴) → 증기긴압(증압성형) → 건조 → 포장』","ind":0,"bul":false},{"k":"h3","text":"1. 인공악퇴법의 개발"},{"k":"p","html":"보이차는 원래 다 생차였으나 익혀 먹기 오래 걸리기 때문에(우리나라에서 숙차만큼 익으려면 30년이 걸리고, 미생물발효가 아닌 효소산화임) 국영차창에서 1973년에 생차를 원료로 곰팡이류 미생물을 키워서 발효시키는 방식을 개발했다.(인공쾌속발효)","ind":0,"bul":false},{"k":"note","html":"※ Part.6 부록 「맹해정창 특강」의 '1973년 악퇴 기술 개발', Part.6 시대차품 2강의 노주문 관련 필기와 연관."},{"k":"h3","text":"2. 발효 공정"},{"k":"p","html":"① 창고(통풍 X) ② 60~80cm까지 찻잎을 쌓음 ③ 물을 뿌림 ④ 광목천을 덮어둠 ⑤ 찻잎을 뒤집어서 물을 뿌리고 천을 덮음 ⑥ 원하는 정도가 되면 건조시키고 완성","ind":0,"bul":false},{"k":"p","html":"퇴적(①~④) - 번퇴(⑤) - 건조. 퇴적과 번퇴를 7~10일에 한 번씩 하며 이 과정을 4~6번 반복한다. 짧게는 1달, 길게는 2달이 걸린다.","ind":22,"bul":true},{"k":"p","html":"광목천을 덮어두는 이유는 운남이 동남아 기후라 덥기 때문이다. 온도가 너무 높아지면 찻잎이 타고 곰팡이도 죽기 때문에 주의해야 한다.","ind":22,"bul":true},{"k":"h3","text":"3. 발효에 사용되는 균종"},{"k":"p","html":"검은곰팡이, 푸른곰팡이, 효모, 기타 세균 등.","ind":0,"bul":false},{"k":"p","html":"자연발효는 자연균을 이용하며 발효도가 균질하지 않다. 균을 통제하는 발효를 균종발효라고 하며, 탱크발효/저수발효와 같이 탱크가 돌면서 발효시키는 방법도 있다.","ind":22,"bul":true},{"k":"p","html":"발효균에 따라 생성되는 향미를 숙향숙미라고 하는데, 요즘은 숙미가 없는 균을 사용한다. 숙차는 바로 마셔야 하는 차이지만 보관하는 이유는 숙미를 제거하기 위함이다.","ind":22,"bul":true},{"k":"p","html":"주홍걸 교수가 추천하는 로바스타틴 보이차(과기보이차). 로바스타틴은 노차에 많다.","ind":22,"bul":true},{"k":"note","html":"※ Part.6 시대차품 1강 복습 Quiz 1(균종 발효의 장점), 2강 복습 Quiz 2(곰팡이와 효모의 역할)와 연관."},{"k":"h3","text":"4. 발효의 성부 판단 — 미발효와 과발효"},{"k":"p","html":"미발효 60% 이하 – 경발효 – 적정발효 70~75% – 중발효 – 과발효 85% 이상","ind":0,"bul":false},{"k":"p","html":"악퇴 발효는 총 1~2달, 곧 28일에서 60일이 소요된다.","ind":22,"bul":true},{"k":"p","html":"숙차의 개발은 수십 년의 시간을 단축시켜 상업적 가치를 극대화했고, 그 결과 보이차의 가치가 시간에서 기술로 이동하게 되었다.","ind":22,"bul":true},{"k":"p","html":"이전에 유행했던 반생반숙은 발효를 균질하게 시키지 못해서 생긴 차다.","ind":22,"bul":true},{"k":"h3","text":"5. 악퇴를 마친 숙차의 함유물질 분석"},{"k":"p","html":"차폴리페놀(TP), 차다당류(TPS), 올리고당(TOS), 차갈소(TB), 진향물질, 물침출물, 기타 당류 등.","ind":0,"bul":false},{"k":"p","html":"생차는 10%, 숙차는 75% 차폴리페놀 함유","ind":22,"bul":true},{"k":"p","html":"산화발효가 활발할 때 대추향(조향), 약향, 당귀향(당향) 등이 발생","ind":22,"bul":true},{"k":"note","html":"※ Part.6 시대차품 1강 「보이차의 유통 시대 구분」의 향 논의, 자사호 Part.4 1강 복습 Quiz 1(장향 형성 기전)과 연관."},{"k":"h2","text":"□ 보이차의 후변화와 보관 조건의 검토"},{"k":"p","html":"가공이 끝난 시점부터 후변화가 진행된다. (6대 다류와 관계 없음) 후변화의 4대 메커니즘은 다음과 같다.","ind":0,"bul":false},{"k":"h3","text":"1. 자동산화 (온도, 습도 ↑)"},{"k":"p","html":"효소의 도움이 없기 때문에 변화 속도가 느리다. 무조건 일어나는 산화.","ind":0,"bul":false},{"k":"h3","text":"2. 효소산화 (온도, 습도 ↑)"},{"k":"p","html":"자동산화와 동시에 일어나며 여름에 잘 일어난다. 겨울에는 자동산화만 일어난다.","ind":0,"bul":false},{"k":"h3","text":"3. 가수분해 (물에 의한 분해 작용 / 온도, 습도 ↑)"},{"k":"p","html":"가수분해 효소가 존재하며(아밀레이스 같은) 습도가 높아야 일어난다.","ind":0,"bul":false},{"k":"h3","text":"4. 미생물발효 (직사광선은 없고 통풍은 되어야 함 / 온도, 습도 ↑)"},{"k":"p","html":"산화와 풍미가 다르며, 미생물발효로 인한 향은 숙미라고 부른다. 통제된 상황이 아니므로 유해균이 생길 확률이 높고, 통풍이 안 되면 곰팡이가 핀다.","ind":0,"bul":false},{"k":"p","html":"홍콩에서 녹차를 보관하면 미생물 발효가 일어나 보이차와 유사한 풍미가 난다. 후발효가 반드시 원산지에서만 가능한 현상은 아니라는 뜻이다.","ind":22,"bul":true},{"k":"h2","text":"□ 보관과 관련하여 사용되는 창(倉)의 의미"},{"k":"table","html":"<table><tr><th><div><b>창의 종류</b></div></th><th><div><b>온도 · 습도 · 통풍</b></div></th><th><div><b>주된 후변화</b></div></th></tr><tr><td><div>습창</div></td><td><div>30℃, 80%, 통풍 X</div></td><td><div>미생물 발효</div></td></tr><tr><td><div>자연창</div></td><td><div>30℃ 전후, 60~80%, 통풍 O</div></td><td><div>자연산화 · 효소산화 · 가수분해</div></td></tr><tr><td><div>적창</div></td><td><div>20℃ 이상, 60%</div></td><td><div>자연산화 · 효소산화 · 가수분해</div></td></tr><tr><td><div>건창</div></td><td><div>10~20℃, 50% 전후</div></td><td><div>자연산화</div></td></tr><tr><td><div>극건창</div></td><td><div>10℃, 30~40%</div></td><td><div>자연산화</div></td></tr></table>"},{"k":"p","html":"습도 50~60% 부근이 경계다. 그 위에서는 효소 활성과 가수분해가 유지되어 후변화가 계속되고, 아래로 내려가면 반응이 사실상 멈춰 느린 자연산화만 남는다. 습창은 고온 다습에 통풍을 막아 미생물 발효를 유도하는 방식이나, 곰팡이와 잡내 문제로 논란이 있다.","ind":22,"bul":true},{"k":"p","html":"숙차는 건조하게, 생차는 적창 이상으로 보관하는 것이 좋다. 생차는 세월과 함께 변해가는 차이므로 반응이 멈추지 않을 습도가 필요한 반면, 숙차는 이미 악퇴로 발효를 마쳤으므로 추가 변화보다 잡내 방지가 중요하기 때문이다.","ind":22,"bul":true},{"k":"note","html":"※ Part.6 시대차품 2강의 습창·건창 논의, 「무창불성차」와 직접 연관."},{"k":"h2","text":"※ 회족의 난과 홍콩 유통, 그리고 숙차의 시작"},{"k":"p","html":"청대 운남의 차는 보이부(현 보이시)에 집산된 뒤 크게 두 갈래 길로 흘러나갔다. 하나는 북쪽으로 곤명을 거쳐 북경에 이르는 관마대도(官馬大道)였고, 다른 하나는 서쪽으로 대리(大理)를 지나 티베트와 히말라야로 향하는 길이었다. 오늘날 이 교역로망 전체를 묶어 &#x27;차마고도(茶馬古道)&#x27;라 부르지만, 사실 이는 1990년대에 이르러서야 붙여진 현대의 명칭이다.","ind":0,"bul":false},{"k":"p","html":"차를 내어주던 핵심 산지는 서쌍판납(시솽반나)이었다. 명나라 말기에서 청나라 초기에 고육대차산(古六大茶山)이 먼저 열려 다원이 자리를 잡았고, 이후 란창강 건너편이 개발되며 신육대차산(新六大茶山)으로 불렸다. 훗날 발발한 회족의 난으로 기존 차산이 무너지게 된 것도, 역설적으로 이 새로운 산지의 비중이 커지는 배경이 되었다.","ind":0,"bul":false},{"k":"p","html":"당시 운남의 회족은 농사를 짓는 대신 탄광과 주석광을 열어 캐낸 광물을 유통하며 부를 쌓았는데, 바로 이 광산이 화근이 되었다. 청나라 말기 곤명에 부임한 총독은 회족의 광산을 차지하기 위해 한족과 회족 사이를 이간질했고, 향파회(香把會) 같은 한족 조직을 앞세워 회족을 몰아붙였다. 후임 총독대에 이르러 탄압은 한층 노골적이 되어, 회족이 모든 화근이니 씨를 말리라는 명령까지 내려지기에 이른다.","ind":0,"bul":false},{"k":"p","html":"대리 지역에 두문수(杜文秀)라는 인물이 있었다. 장사를 하면서도 글공부를 놓지 않던 그는 한족들이 회족 마을에 불을 지르고 약혼녀마저 죽이자, 북경까지 올라가 억울함을 호소했다. 그러나 조정은 사건을 저지른 한족 몇 명을 처형해 입을 막았을 뿐, 회족을 향한 핍박은 거두지 않았다. (두문수 개인의 이 비극적인 사연은 사료로 명확히 확증되지 않은 전승이나, 당시 봉기의 억울한 배경을 설명하는 이야기로 오랜 시간 전해져 왔다.)","ind":0,"bul":false},{"k":"p","html":"1856년 곤명에서 대규모 회족 학살이 벌어지자, 두문수는 마침내 대리를 근거지로 군사를 일으켰다. 불길은 운남 전역으로 번져 1873년까지 무려 17년을 이어갔고, 그 기나긴 전란 속에 북쪽의 관마대도도 서쪽 길도 모두 끊어지고 말았다. 찻잎을 실어 나를 옛길이 완전히 사라진 것이다.","ind":0,"bul":false},{"k":"p","html":"막힌 길을 대신해 1800년대 후반, 베트남을 거쳐 홍콩으로 가는 새로운 우회 경로가 열렸다. 덥고 습한 기후를 뚫고 여덟 달에 걸쳐 운송되던 찻잎(생차)은 도중에 자연스러운 미생물 발효를 일으켰고, 홍콩에 닿았을 때는 이미 붉게 익어 있었다고 한다. 이 경로상의 자연 발효 이야기 역시 사료로 완벽히 뒷받침되지는 않으나, 홍콩 소비자들이 그 부드럽게 익은 노차의 맛에 깊이 길들여졌다는 사실만은 이후의 뚜렷한 시장 전개가 증명한다.","ind":0,"bul":false},{"k":"p","html":"1910년 전월철도(滇越鐵路)가 놓이면서 유통의 판이 다시 한번 완전히 바뀌었다. 곤명에서 출발해 하노이를 지나 하이퐁에 이르는 이 철도는 여전히 베트남을 통과했지만, 여러 달이 걸리던 운송 기간을 단 며칠로 획기적으로 줄여놓았다. 문제는 찻잎이 길 위에서 자연스레 익을 시간이 사라졌다는 점이다. 갓 만든 떫은 생차 상태로 도착한 차는 이미 붉은 차에 익숙해진 홍콩 사람들의 입맛에 몹시 설었고, 결국 그들은 스스로 창고를 지어 인위적으로 차를 묵히기 시작했다. 이것이 바로 홍콩 특유의 &#x27;습창(濕倉)&#x27; 보관이 태동한 계기다.","ind":0,"bul":false},{"k":"p","html":"그러나 좁은 홍콩의 창고에서 차가 익기를 10년씩 마냥 기다리는 일도, 천정부지로 치솟는 땅값을 감당하는 일도 한계가 있었다. 결국 견디다 못한 홍콩 상인들은 운남 산지에 사람을 보내 아예 처음부터 발효되어 익은 차를 만들어 보내달라고 요청했다. 그 절실한 요구가 마침내 1973년 곤명차창 등을 위시한 운남 기술자들의 &#x27;악퇴(渥堆)&#x27; 공법 개발로 결실을 맺으며, 오늘날 우리가 널리 마시는 &#x27;숙차(熟茶)&#x27;가 세상에 태어나게 되었다.","ind":0,"bul":false},{"k":"note","html":"※ Part.3 1강 「차순호(車順號)의 서공천조(瑞貢天朝)」와 2강 「4. 청대」의 두문수의 난, Part.6 시대차품 2강 「홍콩으로의 보이차 유통」이 모두 이 서술과 이어진다."},{"k":"h1","text":"3강"},{"k":"p","html":"당나라 육우는 『다경』에서 “산의 물이 으뜸이고, 강의 물이 중간이며, 우물 물이 가장 좋지 않다”고 했다. 차에 있어 물이 얼마나 중요한지, 물의 종류는 어떤 것이 있는지, 모든 물에 적용되는지 알아본다.","ind":0,"bul":false},{"k":"p","html":"『다경』은 8세기 후반, 초고는 760년 무렵이고 완성은 780년 전후로 본다.","ind":22,"bul":true},{"k":"h2","text":"□ 감관 심평의 준비"},{"k":"p","html":"차, 물, 다구 + 심평자. 앞의 셋은 조건을 통일해야 비교가 성립하고, 심평자는 개인의 기호에 치우치지 않는 객관성과 차에 대한 이해도를 갖추어야 한다.","ind":22,"bul":true},{"k":"p","html":"<b>감관 심평:</b> 사람의 오감(미각·촉각·후각·시각·청각)으로 차를 평가하는 방법이다.","ind":22,"bul":true},{"k":"p","html":"<b>이화 심평:</b> 물리·화학·기계적 분석으로 성분을 객관적으로 측정하는 방법이다. 다만 어떤 성분이 얼마나 들어가야 인간이 좋게 느끼는가를 추구하기 때문에 결국 감관 심평으로 귀결된다.","ind":22,"bul":true},{"k":"h2","text":"□ 일반적으로 사용되는 물의 종류"},{"k":"p","html":"산천수(약수), 민물(상수로), 우물물(지하수/15~20m 지표수), 생수(먹는샘물/깊은 지하수 150~200m 대수암반층), 혼합음료(용암수).","ind":0,"bul":false},{"k":"h2","text":"□ 심평과 물의 선택"},{"k":"table","html":"<table><tr><th><div><b>음용수</b></div></th><th><div><b>심평수</b></div></th><th><div><b>기능수</b></div></th></tr><tr><td><div>상시 마시는 물. 영양분이 많아도 상관없다.</div></td><td><div>심평에 사용하는 물. 객관성이 중요하다.</div></td><td><div>건강 기능상 목적. 특수한 영양소를 섭취하기 위해 만든 물이다.</div></td></tr></table>"},{"k":"h3","text":"1. 심평에 사용되는 물의 선택 기준"},{"k":"p","html":"물의 객관성, 중립성 → 특정한 차에 유리하게 작용하지 않는다. 왜곡이 없는 물(물 안에 미네랄 물질이 적은 것).","ind":0,"bul":false},{"k":"h3","text":"2. 순수한 물의 종류"},{"k":"p","html":"증류수 / 이온교환수지수 / 역삼투압수. 순수한 물(H₂O)은 증류수다. 글로벌 음료회사는 각 나라에서 이온교환수지필터를 여러 개 통과시켜 순수한 물을 얻으나 설치비가 비싸다. 대신 역삼투막을 통과시킨 역삼투압수는 이온교환수지보다 과정이 간단해 가정에서도 역삼투압 정수기를 이용할 수 있다.","ind":0,"bul":false},{"k":"h3","text":"3. 순수한 물의 음용과 관련한 문제"},{"k":"p","html":"미네랄 및 용존 산소의 부족 등 → 순수한 물에는 영양소가 없다.","ind":0,"bul":false},{"k":"h3","text":"4. 순수한 물의 판단기준"},{"k":"p","html":"차의 심평에서는 순수한 물을 사용하는 것이 가장 좋으나, 심평 시에 이러한 물을 얻을 수 없는 경우에는 경도가 낮은 물을 선택하는 것이 가장 중립적인 결과를 얻을 수 있다.","ind":0,"bul":false},{"k":"h2","text":"□ 물의 경도 측정법"},{"k":"h3","text":"1. 경도의 의미"},{"k":"p","html":"물의 단단한 정도. 환산법으로 구한다. (이화 분석: 총량법을 환산법으로 치환한다)","ind":0,"bul":false},{"k":"p","html":"<b>이화(理化):</b> 물리학과 화학을 아울러 이르는 말로, 이화 분석은 물리·화학적 방법으로 성분을 재는 분석이다.","ind":22,"bul":true},{"k":"h3","text":"2. 경도의 계산식"},{"k":"h4","text":"가. 공식 (환산법)"},{"k":"p","html":"대표성분인 칼슘, 마그네슘을 기준으로 계산한다. 경도 = 2.5 × 칼슘의 함량(mg/L) + 4.1 × 마그네슘의 함량(mg/L)","ind":0,"bul":false},{"k":"h4","text":"나. 시중에서 판매되는 생수의 경도"},{"k":"table","html":"<table><tr><th><div><b>번호</b></div></th><th><div><b>제조사</b></div></th><th><div><b>상표</b></div></th><th><div><b>수원</b></div></th><th><div><b>TDS(ppm)</b></div></th><th><div><b>경도(중간치 ppm)</b></div></th></tr><tr><td><div>1</div></td><td><div>수입</div></td><td><div>게롤슈타이너</div></td><td><div>독일(천연탄산수)</div></td><td></td><td><div>1323.6</div></td></tr><tr><td><div>2</div></td><td><div>수입</div></td><td><div>산펠레그리노</div></td><td><div>이탈리아</div></td><td></td><td><div>650.88</div></td></tr><tr><td><div>3</div></td><td><div>롯데칠성</div></td><td><div>에비앙</div></td><td><div>프랑스 오트사부아</div></td><td><div>242</div></td><td><div>272</div></td></tr><tr><td><div>4</div></td><td><div>엔케이씨엘바이오</div></td><td><div>NK 이뮨워터</div></td><td><div>강원 속초 외옹치</div></td><td></td><td><div>200</div></td></tr><tr><td><div>5</div></td><td><div>오리온</div></td><td><div>제주용암수</div></td><td><div>제주 구좌읍 한동리</div></td><td><div>230(추정치)</div></td><td><div>199.4</div></td></tr><tr><td><div>6</div></td><td><div>코리아세븐</div></td><td><div>깊은산속옹달샘</div></td><td><div>경기 양주</div></td><td><div>139</div></td><td><div>85.9</div></td></tr><tr><td><div>7</div></td><td><div>스파클</div></td><td><div>스파클</div></td><td><div>충남 천안</div></td><td><div>116</div></td><td><div>140.6</div></td></tr><tr><td><div>8</div></td><td><div>글로벌심층수</div></td><td><div>Deeps 그린</div></td><td><div>강원 속초 외옹치</div></td><td></td><td><div>100</div></td></tr><tr><td><div>9</div></td><td><div>일화(수입원)</div></td><td><div>피지워터</div></td><td><div>피지</div></td><td></td><td><div>93.35</div></td></tr><tr><td><div>10</div></td><td><div>이마트</div></td><td><div>노브랜드 미네랄워터</div></td><td><div>경기 연천</div></td><td></td><td><div>85.69</div></td></tr><tr><td><div>11</div></td><td><div>광동</div></td><td><d <div>37.5</div></td></tr><tr><td><div>25</div></td><td><div>네슬레</div></td><td><div>퓨어라이프</div></td><td><div>경기 포천 이동면</div></td><td></td><td><div>35.5</div></td></tr><tr><td><div>26</div></td><td><div>농부산천</div></td><td><div>포차(泡茶)</div></td><td></td><td></td><td><div>31.9</div></td></tr><tr><td><div>27</div></td><td><div>한국청정음료</div></td><td><div>크리스탈</div></td><td><div>경기 포천</div></td><td><div>48</div></td><td><div>30.7</div></td></tr><tr><td><div>28</div></td><td><div>롯데칠성</div></td><td><div>아이시스</div></td><td></td><td></td><td><div>30.1</div></td></tr><tr><td><div>29</div></td><td><div>한국청정음료</div></td><td><div>몽베스트</div></td><td><div>경기 포천</div></td><td></td><td><div>29.9</div></td></tr><tr><td><div>30</div></td><td><div>코스트코</div></td><td><div>커클랜드</div></td><td><div>연천</div></td><td></td><td><div>28.0</div></td></tr><tr><td><div>31</div></td><td><div>농심</div></td><td><div>백산수</div></td><td><div>길림성 안도현</div></td><td><div>45</div></td><td><div>26.4</div></td></tr><tr><td><div>32</div></td><td><div>네슬레</div></td><td><div>Poland spring</div></td><td><div>메인주(Maine)</div></td><td></td><td><div>21.8</div></td></tr><tr><td><div>33</div></td><td><div>나라지엔비</div></td><td><div>VOSS Artesian Water</div></td><td><div>노르웨이 보스빙하퇴적층</div></td><td><div>44</div></td><td><div>16.6</div></td></tr><tr><td><div>34</div></td><td><div>광동</div></td><td><div>삼다수</div></td><td><div>제주</div></td><td><div>33</div></td><td><div>18.8</div></td></tr></table>"},{"k":"h3","text":"3. 일시적 경도(Temporary Hardness)와 영구 경도(Permanent Hardness)"},{"k":"p","html":"일시적 경도는 녹아 있는 미네랄 성분에 의해 용출되기도 하고 남아 있기도 한다. ex) 물을 끓였을 때 하얀 가루가 떠다니는 경우, 물 자체의 경도는 줄어든다. 영구 경도는 물을 끓여도 변하지 않는다.","ind":0,"bul":false},{"k":"h3","text":"4. 경수와 연수의 구분 기준 및 경수의 특징"},{"k":"h4","text":"가. 경수와 연수의 구분 기준"},{"k":"p","html":"Soft(연수) → Slightly Hard(약경수) → Moderately Hard(중경수) → Hard(경수/75ppm 이상) → Very Hard(강경수/300ppm 이상)","ind":0,"bul":false},{"k":"h4","text":"나. 경수의 특징"},{"k":"p","html":"미네랄이 늘어나면 맛이 달아진다. → 일정 이상으로 늘면 비리고 느끼해진다.","ind":22,"bul":true},{"k":"p","html":"물이 생동감 있다(상쾌함). → 일정 이상으로 늘어나면 쓰고 떫어진다.","ind":22,"bul":true},{"k":"h3","text":"5. 지하수와 지표수"},{"k":"p","html":"<b>암석의 생성 과정과 물의 변화:</b> 암석은 마그마가 굳어 만들어진 화성암(화강암 등), 기존 암석이 풍화 및 퇴적되어 형성된 퇴적암(석회암 등), 그리고 열과 압력으로 성질이 변한 변성암 등 크게 세 가지로 나뉜다. 물은 어떤 암반을 거쳐 흘러가느냐에 따라 머금게 되는 성분이 확연히 달라진다.","ind":22,"bul":true},{"k":"p","html":"<b>화강암 지대와 부드러운 물 (연수):</b> 화강암은 물에 잘 녹지 않는 단단한 성질을 지녀 천연 필터처럼 작용한다. 따라서 화강암 지대를 통과한 물은 불순물만 걸러지고 미네랄은 적게 녹아들어 부드러운 '연수'가 된다. 한국의 물이 대체로 연수인 이유가 바로 이 지질적 특성 때문이며, 생수 중에서는 화산암 지대에서 생산되어 경도가 낮은 볼빅이 대표적이다.","ind":22,"bul":true},{"k":"p","html":"석회암 지대와 미네랄이 풍부한 물 (경수): 반면 석회암은 주성분인 탄산칼슘이 빗물에 쉽게 녹아든다. 그 결과 칼슘과 마그네슘이 풍부하게 함유된 묵직한 &#x27;경수(센물)&#x27;가 만들어진다. 유럽 상당 지역의 물이 경수인 것은 이러한 지질 차이에서 비롯되며, 경도가 높은 에비앙이 석회암 지대의 대표적인 생수다. 참고로, 석회암 지대의 호수가 특유의 에메랄드빛을 띠는 현상 역시 물에 녹았던 탄산칼슘이 미세 입자로 침전되면서 빛을 산란시키기 때문이다.","ind":22,"bul":true},{"k":"h3","text":"6. 심평에 적합한 물"},{"k":"p","html":"순수한 물을 쓰는 것이 가장 좋고, 그렇지 못할 경우 경도가 낮은 물을 선택한다. 심평수는 객관성이 가장 중요한 물이므로, 특정한 차에 유리하게 작용하거나 맛을 왜곡해서는 안 된다.","ind":0,"bul":false},{"k":"h3","text":"7. 경도 측정법의 한계"},{"k":"p","html":"경도는 총량법이 아니라 칼슘·마그네슘만 놓고 환산하는 방식이므로, 그 둘을 뺀 나머지 미네랄이 많은 물은 경도가 낮게 나와도 실제로는 용존물질이 많을 수 있다.","ind":0,"bul":false},{"k":"h2","text":"□ TDS 측정법 (총 용존 고형물)"},{"k":"h3","text":"1. TDS의 개념"},{"k":"p","html":"물에 녹아 있는 고형물의 총량을 ppm 단위로 나타낸 값이다. 칼슘과 마그네슘 수치만 보는 &#x27;경도&#x27;와 달리, 이온 상태로 녹아 있는 모든 물질을 합산하여 측정한다. 측정이 간편해 물의 경도를 가늠하는 보조 지표로도 쓰이지만, 어디까지나 간접적인 방식이므로 오차가 존재한다. 즉, 칼슘·마그네슘 외의 다른 미네랄 함량이 높을 경우 경도와 TDS 수치 간에 차이가 발생한다.","ind":0,"bul":false},{"k":"h3","text":"2. 측정의 방법과 한계점(추정)"},{"k":"p","html":"휴대용 TDS 측정기는 물에 녹아 있는 물질을 하나하나 재는 것이 아니라, 물의 &#x27;전기전도도&#x27;를 측정한 뒤 일정한 계수를 곱해 환산하는 방식을 쓴다. 고형물의 총량을 직접 계측하는 것이 아니기 때문에, 실제로는 칼슘이나 마그네슘이 아닌 전혀 다른 미네랄 성분이 TDS 수치를 끌어올리고 있을 가능성(한계점)이 있다. Super Low → Low → Medium → High → Very High","ind":0,"bul":false},{"k":"h3","text":"3. 물의 경도와 TDS의 관계"},{"k":"p","html":"두 값은 대체로 비례하여 함께 움직인다. 녹아 있는 물질의 상당 부분이 칼슘과 마그네슘인 일반적인 물에서는 TDS가 높으면 경도도 높게 나온다. 다만 이 비례가 어긋나는 경우도 있는데, 시판 생수인 &#x27;기픈물&#x27;이 대표적인 예다. 기픈물은 TDS가 71로 측정되지만 경도는 15에 그친다. 이는 물에 녹아 있는 전체 성분 중에서 칼슘과 마그네슘이 차지하는 비중이 상대적으로 매우 작다는 것을 의미한다.","ind":0,"bul":false},{"k":"h2","text":"□ 물의 순환 단계에 따른 경도와 TDS 수치"},{"k":"p","html":"물은 땅을 통과하며 암석의 미네랄을 녹여내므로, 순환 단계를 거칠수록 점차 경도가 높아진다.","ind":0,"bul":false},{"k":"h3","text":"1. 빗물"},{"k":"p","html":"대기 중에서 바로 떨어져 미네랄이 거의 없는 가장 순수한 상태이다.","ind":0,"bul":false},{"k":"h3","text":"2. 계곡물(산수)"},{"k":"p","html":"암석과 접촉한 시간이 짧아 미네랄이 적고 물의 성질이 가볍다. 육우가 산수를 으뜸으로 친 것도 이 때문으로 볼 수 있다.","ind":0,"bul":false},{"k":"h3","text":"3. 강물/정수물"},{"k":"p","html":"물이 여러 지층과 암반을 오랜 시간 지나오면서 점차 미네랄이 축적된다.","ind":0,"bul":false},{"k":"h3","text":"4. 수돗물"},{"k":"p","html":"상수원의 원수가 가진 본래의 지질적 성질을 그대로 이어받는다.","ind":0,"bul":false},{"k":"h4","text":"가. 우리나라의 경우(경도)"},{"k":"p","html":"물에 잘 녹지 않는 화강암 지대가 넓어 대체로 미네랄이 적은 연수가 흐른다. 수질 기준 역시 경도로 표시하는 것이 익숙하다.","ind":0,"bul":false},{"k":"h4","text":"나. 중국의 경우(TDS)"},{"k":"p","html":"차 산지가 몰려 있는 남부 산간 지역은 우리나라와 마찬가지로 연수가 많다. 다만, 중국 차 업계에서는 측정 기기로 간편하게 확인할 수 있는 TDS를 수질 지표로 흔히 사용한다.","ind":0,"bul":false},{"k":"h4","text":"다. 영국의 경우(경도)"},{"k":"p","html":"석회암 지대가 넓은 유럽은 미네랄이 풍부하게 녹아든 경수가 흔하며, 백악층 위에 자리한 런던 일대가 대표적인 경수 지역이다.","ind":0,"bul":false},{"k":"h2","text":"□ 물과 찻물의 연관성 관능실험"},{"k":"h3","text":"1. 저경도의 물에 차를 우릴 때"},{"k":"p","html":"탕색이 맑고 밝게 우러난다.","ind":22,"bul":true},{"k":"p","html":"차 고유의 향기가 선명하게 살아나지만, 동시에 잡향과 잡맛도 함께 도드라진다.","ind":22,"bul":true},{"k":"p","html":"맛의 결이 뚜렷하고 명확하게 느껴진다.","ind":22,"bul":true},{"k":"h3","text":"2. 고경도의 물에 차를 우릴 때"},{"k":"p","html":"탕색이 흐리고 탁해진다.","ind":22,"bul":true},{"k":"p","html":"미네랄 반응으로 인해 향기가 크게 반감된다.","ind":22,"bul":true},{"k":"p","html":"맛의 뾰족한 결이 사라지고, 묵직하면서도 두툼하고 흐린 단맛이 남는다.","ind":22,"bul":true},{"k":"h3","text":"3. 왜곡 포인트"},{"k":"p","html":"찻잎 속 폴리페놀(카테킨 등)은 반응성이 매우 높아 다른 성분과 쉽게 결합한다. 고경도의 물로 차를 우리면 물속의 칼슘·마그네슘 이온이 폴리페놀과 결합해 잘 녹지 않는 침전물 형태를 이룬다. 이 때문에 우러나야 할 유효 성분이 줄어들며 맛이 둔해지는 것이다. 차의 색소 물질 역시 미네랄과 결합하므로 탕색이 짙고 탁하게 변한다. 경수로 홍차를 우렸을 때 수면 위에 얇은 막이 뜨는 현상이 바로 이 결합물이 눈에 보이는 형태로 나타난 것이다. 즉, 연수로 우린 차가 맑고 향이 또렷한 반면, 경수에서 풍미가 크게 왜곡되는 것은 이러한 성분 간의 화학적 결합 반응 때문이다.","ind":0,"bul":false},{"k":"h3","text":"4. 물의 용존도, 포화도"},{"k":"p","html":"물의 온도가 높을수록 분자 운동이 활발해져 찻잎의 성분이 빠르고 풍부하게 우러나오며, 온도가 낮으면 우러나는 속도가 느려지고 양도 적어진다. 차가운 물에 우려내는 &#x27;냉침&#x27;이 부드러운 이유는, 저온에서는 쓴맛을 내는 성분들이 상대적으로 덜 우러나오기 때문이다. 흔히 미네랄 함량이 높은 물에서 차 성분이 적게 우러나는 이유를 &#x27;물 자체가 이미 포화 상태여서&#x27;라고 오해하기 쉽다. 하지만 실제로는 물이 포화되어서가 아니라, 칼슘과 마그네슘이 폴리페놀과 결합하여 녹기 힘든 형태로 변하기 때문이다.","ind":0,"bul":false},{"k":"note","html":"※ 자사호 Part.4 6강 「입자와 점토의 배열 구조가 차의 포다에 미치는 영향」의 “경도 높은 물 + 자사 + 은잔 = 왜곡의 최고봉” 서술이 이 항목과 이어진다."},{"k":"h2","text":"□ 광물질이 차맛에 미치는 영향"},{"k":"table","html":"<table><tr><th><div><b>광물질</b></div></th><th><div><b>저농도</b></div></th><th><div><b>고농도</b></div></th></tr><tr><td><div>칼슘</div></td><td><div>단맛</div></td><td><div>느끼함</div></td></tr><tr><td><div>마그네슘</div></td><td><div>쌉싸름, 활력감</div></td><td><div>쓰고 떫음</div></td></tr><tr><td><div>철과 망간</div></td><td><div>단맛</div></td><td><div>비린맛 (망간은 차의 색깔이 짙어짐)</div></td></tr><tr><td><div>염소화합물</div></td><td><div>차탕 기름기가 적다</div></td><td><div>차탕 기름기가 많다</div></td></tr></table>"},{"k":"h2","text":"□ 물의 pH"},{"k":"p","html":"pH는 물의 산성·알칼리성 정도를 0에서 14까지의 숫자로 나타내는 척도다. 7을 중성으로 기준 삼아 이보다 낮으면 산성, 높으면 알칼리성으로 분류한다. pH는 로그 척도로 계산되므로 수치 1의 차이가 실제로는 10배의 산도 차이를 의미한다. 차를 우린 물은 찻잎에 포함된 카테킨과 유기산 성분 때문에 본래 pH 5~6 정도의 약산성을 띤다. 불순물이 없는 증류수 역시 갓 증류한 직후에는 중성이지만, 공기 중의 이산화탄소가 자연스럽게 녹아들면서 점차 약산성으로 변한다. 이러한 물의 산도는 차의 풍미와 직결된다. 알칼리성이 강한 물로 차를 우리면 카테킨의 산화가 촉진되어 탕색이 어두워지고 향과 맛이 무뎌진다. 홍차에 산성인 레몬을 넣었을 때 탕색이 밝고 옅어지는 것이 이 원리를 거꾸로 보여주는 대표적인 예다. 따라서 차 고유의 색과 풍미를 온전히 이끌어내기 위해서는 중성에서 약산성을 띠는 물이 가장 적합하다.","ind":0,"bul":false},{"k":"h2","text":"□ O-index, K-index"},{"k":"p","html":"일본에서 제안된 물 평가 지표는 미네랄의 총량이 아닌 성분 간의 비율을 기준으로 삼는다.","ind":0,"bul":false},{"k":"p","html":"<b>O-index(오이시, 맛 지수):</b> 칼슘, 칼륨, 규산 등 맛을 좋게 하는 성분과 마그네슘, 황산이온 등 맛을 해치는 성분의 비율을 따진다.","ind":22,"bul":true},{"k":"p","html":"<b>K-index(겐코, 건강 지수):</b> 칼슘이 많고 나트륨이 적을수록 수치가 높게 나타난다.","ind":22,"bul":true},{"k":"p","html":"실제 사찰 약수를 분석한 사례를 보면 이 두 지표가 엇갈릴 수 있음을 알 수 있다. 해당 약수는 평균 경도 13.4ppm으로 제주 삼다수와 비슷한 매우 연한 연수였는데, 미네랄 총량 자체가 적어 K-index는 충족하지 못했지만 O-index는 충족했다.","ind":0,"bul":false},{"k":"p","html":"한편, 물속의 용존산소는 끓이는 과정에서 모두 날아가기 때문에 차를 우리는 물을 평가할 때는 애초에 고려 대상이 아니다.","ind":0,"bul":false},{"k":"h1","text":"4강"},{"k":"h2","text":"□ 차우림의 3요소"},{"k":"p","html":"차를 우리는 데 가장 중요한 세 가지 요소는 투차량(投茶量), 물 온도, 침출시간이다. 보이차의 경우 평균 투차량은 찻잎 대 물의 비율이 1:40이며, 물의 온도는 95℃ 이상, 침출시간은 10초 내외로 우려내는 것이 기본이다. 이 세 가지 요소의 표준화는 차 자체의 품질을 객관적으로 평가하는 감관 심평의 전제 조건이 된다.","ind":0,"bul":false},{"k":"h2","text":"□ 물의 온도와 시간"},{"k":"p","html":"물의 온도는 차의 내포 물질이 녹아나는 양과 속도, 종류를 결정하며 향기의 휘발도에도 직접적인 영향을 미친다. 찻잎의 성분 중 쓰고 떫은맛을 내는 폴리페놀은 주로 95℃ 이상의 고온에서 용출되는 반면, 감칠맛을 내는 아미노산은 40~50℃의 비교적 낮은 온도에서도 쉽게 우러나온다. 또한 차의 향기를 결정짓는 알코올류 성분 역시 온도가 높을수록 용출과 휘발이 활발해져 향이 풍부하게 피어오르는 특성이 있다. 이러한 성분별 용출 차이 때문에, 차를 우리는 최적의 온도는 찻잎의 품질과 가공 상태에 따라 전략적으로 조절해야 한다. 품질이 좋은 고급 차는 찻잎 본연의 긍정적인 쓰고 떫은맛과 향을 지니고 있으므로, 고온으로 우려내야 차의 본질적인 풍미를 제대로 끌어낼 수 있다. 반면 저렴한 차는 고온으로 우리면 단점이 크게 도드라지므로, 의도적으로 온도를 낮춰 폴리페놀 용출을 억제하고 아미노산의 감칠맛을 살리는 것이 유리하다. 아울러 기계 채엽 등으로 찻잎에 상처가 많은 경우에도, 뜨거운 물에 의해 내포 물질이 순식간에 과도하게 쏟아져 나오는 것을 막기 위해 저온을 이용해 용출 속도를 부드럽게 조절한다.","ind":0,"bul":false},{"k":"h2","text":"□ 차우림의 방법"},{"k":"p","html":"차를 우리는 방법은 크게 물을 붓고 우려내는 포다법(泡茶法)과 주전자에 찻잎을 직접 넣고 끓이는 자차법(煮茶法)으로 나뉜다. 포다법은 퇴수기의 유무에 따라 건식 포다법과 습식 포다법으로 구분되며, 여러 번 우려내는 공부차(工夫茶) 포다가 대표적이다. 반면 자차법은 주전자에 차를 넣고 끓임으로써 영양물질을 많이 섭취할 수 있어 유목민족이 주로 사용했던 방식이다. 특히 밀크티처럼 우유에 찻잎을 넣고 끓이게 되면 물에는 녹지 않던 지용성 물질까지 함께 우러나오게 된다.","ind":0,"bul":false},{"k":"note","html":"※ 공부차 문화와 자사 소호의 관계는 보이차 Part.3 「공부차포다」, 자사호 Part.4 7강 「공부차의 시대를 연 혜맹신(惠孟臣)」에서 더 자세히 다룬다."},{"k":"h2","text":"□ 일반적인 포다법의 차우림 순서"},{"k":"p","html":"일반적인 포다법의 순서는 다구의 준비, 차엽의 준비, 다구의 예열, 투차, 성차(醒茶), 포차, 따르기, 나누기, 음차의 흐름으로 진행된다. 이때 다구를 뜨거운 물로 미리 예열해 두는 것은 차를 우릴 때 물의 온도가 뺏기지 않고 유지되도록 하기 위함이다. 본격적인 우림 전에 거치는 성차(세차 또는 윤차)는 잠든 차를 깨우는 행위다. 첫 포에서 집중적으로 우러나는 카페인을 일부 제거하거나 단단하게 뭉친 찻잎을 풀어내고, 좋지 않은 차의 이물질을 씻어낼 목적으로 이루어진다.","ind":0,"bul":false},{"k":"h2","text":"□ 포다 동작 시의 주의사항"},{"k":"p","html":"차를 우릴 때는 물줄기의 높이를 낮춰 다구와 주전자의 거리를 가깝게 하는 것이 중요하다. 이는 공기 중에서 물의 온도가 떨어지는 것을 방지하고, 물의 낙하 에너지로 인해 찻잎이 물리적으로 부서지는 것을 막기 위해서다. 반대로 물높이가 너무 높으면 온도가 빨리 떨어질 뿐만 아니라 찻물에 공기 방울이 생기게 된다. 이렇게 되면 차의 구감(口感, 입에 닿는 느낌)이 인위적으로 부드러워져, 찻잎이 지닌 본래의 품질보다 맛이 왜곡되어 더 좋게 느껴질 수 있으므로 주의해야 한다.","ind":0,"bul":false},{"k":"h2","text":"□ 포다의 기본 다구"},{"k":"p","html":"포다(泡茶)는 찻잎 자체를 우려내어 차 고유의 맛과 향, 색을 즐기는 방식으로, 명나라 시대에 단차 공납이 금지된 이후 지금까지 널리 애용되고 있다. 포다의 기본 다구는 재질과 특성에 따라 크게 자사호, 자기(개완), 유리 다구의 셋으로 나눌 수 있다.","ind":0,"bul":false},{"k":"h3","text":"1. 자사호(紫砂壺)"},{"k":"p","html":"중국 강소성 의흥 지역의 특수한 광물인 자사를 원료로 만든 다구다. 유약을 바르지 않고 1,200℃ 안팎에서 구워낸 무유도기로, 강한 흡착성과 보온성, 통기성, 내열성을 두루 갖추고 있다. 특히 자사니 특유의 이중 기공 구조(쌍중기공결구) 덕분에 그릇 자체가 숨을 쉴 수 있어 차의 맛을 한층 부드럽고 농밀하게 만들어 준다. 이러한 발달된 기공 구조 때문에 향보다는 묵직한 맛이 중요한 숙차나 노차, 농향 계열의 차(흑차 등)를 우릴 때 주로 사용된다. 형태적으로는 부위에 따라 뉴(뚜껑 손잡이), 개(뚜껑), 구(입구), 견(어깨), 신 또는 복(몸통), 취(부리), 파(손잡이), 저(바닥), 족(다리) 등 고유의 명칭으로 세분화하여 부른다.","ind":0,"bul":false},{"k":"h3","text":"2. 자기 및 개완(蓋碗)"},{"k":"p","html":"높은 온도에서 자기질 흙을 구워 만든 다구다. 뚜껑, 몸통, 받침으로 이루어져 있어 흔히 하늘, 사람, 땅을 상징하는 삼재완(三才碗) 또는 삼재배라고도 불린다. 자사호와 달리 표면에 유약이 발라져 있어 흡착성과 통기성이 없다. 그 덕분에 다구가 차의 성분이나 향을 전혀 흡수하지 않으므로, 차 본연의 맛을 왜곡 없이 가장 객관적으로 평가하기에 좋아 전문가들의 관능 심평 시에도 표준 다구로 자주 사용된다.","ind":0,"bul":false},{"k":"h3","text":"3. 유리 다구"},{"k":"p","html":"통기성이 없고 열전도가 매우 빨라 보온성은 떨어지지만, 강한 내산성을 가지고 있다. 투명한 재질 덕분에 찻잎이 물속에서 피어나며 우러나는 역동적인 모습이나 맑은 수색(탕색)을 시각적으로 관찰하기에 매우 좋아, 섬세한 잎을 지닌 황차나 녹차 등을 우릴 때 특히 유용하게 쓰인다.","ind":0,"bul":false},{"k":"note","html":"※ 자사호 길라잡이 Part.4 「자사 니료의 특징 — 쌍중기공결구」, 「입자와 점토의 배열 구조가 차의 포다에 미치는 영향」, 「자사호의 부위별 호칭」과 직접 연관 — 자사호 교재 내용과 연관."},{"k":"h2","text":"□ 관능심평의 의의와 대상"},{"k":"p","html":"관능 심평(官能審評)은 차의 품질을 사람의 오감을 통해 종합적으로 평가하는 방법으로, 2009년에 제정된 국가 표준(GB/T 23776-2009)에 그 명확한 기준이 담겨 있다. 심평은 평가를 수행하는 주체인 사람과 평가 대상인 객체(찻잎)로 구성된다. 구체적인 평가 항목은 크게 &#x27;5항 8인자(五項八因子)&#x27;로 나뉜다.","ind":0,"bul":false},{"k":"p","html":"<b>5항(五項):</b> 차를 평가하는 가장 큰 5가지 범주다. (외형, 향기, 탕색, 맛, 엽저)","ind":22,"bul":true},{"k":"p","html":"<b>8인자(八因子):</b> 이 5항을 구체적으로 채점하기 위해 8가지로 나눈 세부 지표다.","ind":22,"bul":true},{"k":"p","html":"<b>외형(건차)의 4인자:</b> 조주(모양), 색택(색과 윤기), 정쇄(부서짐 정도), 정도(불순물 여부)","ind":40,"bul":true},{"k":"p","html":"<b>내질(우린 차)의 4인자:</b> 향기, 탕색, 맛, 엽저","ind":40,"bul":true},{"k":"h2","text":"□ 외형 평가"},{"k":"p","html":"외형 평가는 물에 우리지 않은 마른 찻잎(건차)의 상태를 꼼꼼히 살피는 과정이다. 찻잎의 전반적인 모양을 비롯해 겉면의 색과 윤기를 뜻하는 색택(色澤), 불순물 없이 깨끗한가를 보는 정도(淨度), 잎이 온전한지 부서졌는지를 확인하는 정쇄(整碎) 등을 평가한다. 이는 마른 찻잎의 겉모습을 관찰하는 것만으로도 해당 차의 원료 품질과 가공(제다) 상태를 짐작할 수 있는 심평의 중요한 첫걸음이 된다.","ind":0,"bul":false},{"k":"h2","text":"□ 시료 채취"},{"k":"p","html":"심평을 위해 찻잎을 덜어내는 시료 채취 방식은 차가 만들어진 형태에 따라 다르게 적용된다. 뭉쳐있지 않고 흩어진 잎차 형태의 산차는 세 손가락으로 가볍게 쥐어 잡힐 만큼의 양을 덜어내어 사용한다. 반면 단단하게 뭉쳐진 긴압차, 특히 여러 찻잎이 병배(블렌딩)된 차의 경우에는 일부분만 떼어내면 오차가 생길 수 있으므로 전체 품질을 고르게 대표할 수 있도록 채취해야 한다. 따라서 차의 위아래를 세로로 깊게 갈라내어 잘게 부순 다음, 이를 골고루 섞어 그중에서 약 5g 정도를 추려내어 평가에 사용한다.","ind":0,"bul":false},{"k":"h2","text":"□ 포차"},{"k":"p","html":"표준 심평에서 차를 우려내는 포차(泡茶) 과정은 일상적인 다도와 달리, 차의 장단점을 한계치까지 끌어내어 명확히 평가하기 위해 매우 엄격한 기준을 따른다. 100℃로 끓인 물을 5g의 찻잎이 들어 있는 250ml 표준 품평배(品評杯)에 따르고, 뚜껑을 닫은 뒤 5분간 우려낸다. 우러난 찻물은 삼키지 않고 입안에서 굴리며(롤링) 맛과 향을 감지한 뒤 뱉어내는 것이 일반적이다.","ind":0,"bul":false},{"k":"p","html":"표준 심평의 기본 조건","ind":22,"bul":true},{"k":"p","html":"<b>비율 및 용량:</b> 찻잎 5g을 250ml 규격의 표준 품평배(品評杯)에 담아 물과 차의 비율을 1:50으로 맞춘다.","ind":40,"bul":true},{"k":"p","html":"<b>온도 및 횟수:</b> 100℃로 끓인 뜨거운 물을 붓고 뚜껑을 닫은 상태로, 원칙적으로 단 한 번만 우려낸다.","ind":40,"bul":true},{"k":"p","html":"<b>차류별 표준 포차 시간:</b> 차의 발효도나 찻잎의 뭉쳐진 형태에 따라 성분이 빠져나오는 속도가 다르므로, 표준 우림 시간에 약간씩 차이를 둔다. 오룡차, 특히 무이암차의 경우 개완 심평법을 사용하며, 3번에 걸쳐 가공·보관·원료 상태를 심평한다.","ind":22,"bul":true},{"k":"table","html":"<table><tr><th><div><b>차류</b></div></th><th><div><b>시간</b></div></th></tr><tr><td><div>보통 녹차</div></td><td><div>5분</div></td></tr><tr><td><div>명우 녹차 / 어린 잎</div></td><td><div>4분</div></td></tr><tr><td><div>홍차</div></td><td><div>5분</div></td></tr><tr><td><div>오룡차 (줄기형, 뭉친형, 나사형)</div></td><td><div>5분</div></td></tr><tr><td><div>오룡차 (알갱이형)</div></td><td><div>6분</div></td></tr><tr><td><div>백차</div></td><td><div>5분</div></td></tr><tr><td><div>황차</div></td><td><div>5분</div></td></tr></table>"},{"k":"note","html":"※ Part.3 1강 복습 Quiz 1(오룡차의 개완 심평법)이 이 대목을 묻는 것이다."},{"k":"h2","text":"□ 관능품평의 순서"},{"k":"p","html":"관능 품평은 향기를 먼저 맡는 선문향(先聞香), 우러난 탕색을 관찰하는 후관색(後觀色), 마지막으로 맛을 깊이 음미하는 재품기미(再品其味)의 순서로 진행된다. 이 중 심평의 첫 단계인 향기 평가는 온도 변화에 따라 세 단계로 나뉘어 세밀하게 이루어진다.","ind":0,"bul":false},{"k":"p","html":"<b>열향(熱香, 55℃ 전후):</b> 뜨거울 때 맡는 향으로, 차에 섞인 불쾌한 잡내와 잡향을 1차로 가려낸다.","ind":22,"bul":true},{"k":"p","html":"<b>온향(溫香):</b> 온도가 적당히 내려가면서 본격적으로 드러나는 차 고유의 향으로, 품종과 계절, 산지의 특성을 살핀다.","ind":22,"bul":true},{"k":"p","html":"<b>냉향(冷香, 30℃ 전후):</b> 찻물이 차게 식은 뒤에 남은 향으로, 향이 얼마나 오래 머무는지(지속력)를 평가한다.","ind":22,"bul":true},{"k":"p","html":"후각은 시각이나 미각 등 다른 감각과 달리 뇌의 간뇌(시상)를 거치지 않고 정서와 기억을 담당하는 대뇌 영역에 곧바로 연결된다. 그만큼 외부 자극에 즉각적이고 미세한 차이에도 대단히 예민하게 반응하기 때문에, 차의 품질과 내재 물질의 특성을 직관적으로 파악하는 데 가장 중요한 단서가 된다.","ind":0,"bul":false},{"k":"h2","text":"□ 보이차 외형 품평 용어 1 — 긴압차 외형"},{"k":"p","html":"긴압차(병차, 타차 등 단단하게 뭉친 차)의 뭉쳐진 밀도와 형태의 온전함을 평가하는 용어","ind":0,"bul":false},{"k":"p","html":"<b>송긴도(松緊度):</b> 긴압된 차의 느슨하고 단단한 밀도","ind":22,"bul":true},{"k":"p","html":"<b>단정(端正):</b> 전체적인 모양이 찌그러짐 없이 반듯한 상태","ind":22,"bul":true},{"k":"p","html":"<b>평활(平滑):</b> 차의 표면이 고르고 매끄러운 상태","ind":22,"bul":true},{"k":"p","html":"<b>기층(起層):</b> 표면이 얇게 층을 이루며 일어나는 현상","ind":22,"bul":true},{"k":"p","html":"<b>구열(龜裂):</b> 표면이 거북이 등껍질처럼 갈라진 상태","ind":22,"bul":true},{"k":"p","html":"<b>결구(缺口):</b> 찻잎 덩어리의 가장자리가 부서져 떨어져 나간 흠집","ind":22,"bul":true},{"k":"p","html":"<b>포송(泡松):</b> 차가 너무 느슨하게 뭉쳐져 만지면 푹신하거나 쉽게 바스러지는 상태","ind":22,"bul":true},{"k":"p","html":"<b>왜뉴(歪扭):</b> 둥근 모양 등이 원래 형태를 잃고 일그러지거나 비틀린 상태","ind":22,"bul":true},{"k":"h2","text":"□ 보이차 외형 품평 용어 2 — 산차, 해괴한 찻잎의 외형"},{"k":"p","html":"흩어진 잎차(산차)나 뭉친 차를 잘게 부순(해괴한) 찻잎 낱알의 형태를 평가하는 용어","ind":0,"bul":false},{"k":"h3","text":"1. 찻잎의 생김새와 부위"},{"k":"p","html":"<b>신골(身骨):</b> 찻잎이나 싹의 전체적인 뼈대와 형태 (주로 장대하다/왜소하다로 표현)","ind":22,"bul":true},{"k":"p","html":"<b>아두(芽頭):</b> 가장 여리고 뾰족한 어린싹","ind":22,"bul":true},{"k":"p","html":"<b>봉묘(鋒苗):</b> 아두보다는 조금 크지만 여전히 부드럽고 가늘며 끝이 뾰족한 찻잎","ind":22,"bul":true},{"k":"p","html":"<b>단장편(單張片):</b> 뭉치지 않고 낱장으로 펴진 큰 잎 (주로 늙은 황편)","ind":22,"bul":true},{"k":"h3","text":"2. 찻잎 표면의 솜털 — 호(毫)"},{"k":"p","html":"<b>금호(金毫):</b> 진화를 거쳐 황금빛을 띠는 솜털","ind":22,"bul":true},{"k":"p","html":"<b>은호(銀毫):</b> 찻잎 표면에 덮인 은빛 솜털","ind":22,"bul":true},{"k":"p","html":"<b>현호(顯毫):</b> 솜털이 유독 뚜렷하고 빽빽하게 많은 상태","ind":22,"bul":true},{"k":"h3","text":"3. 찻잎의 무게와 부피감"},{"k":"p","html":"<b>중실(重實):</b> 찻잎이 두툼하고 무게감이 있으며 영양분이 많은 상태","ind":22,"bul":true},{"k":"p","html":"<b>비석(肥碩):</b> 전체적으로 찻잎이 크고 튼튼한 상태","ind":22,"bul":true},{"k":"p","html":"<b>경표(輕飄):</b> 찻잎이 얇고 가벼우며 비실비실한 상태","ind":22,"bul":true},{"k":"h3","text":"4. 제다 및 블렌딩 상태"},{"k":"p","html":"<b>송포(松泡):</b> 유념(비비기) 과정이 제대로 되지 않아 잎이 조여지지 않고 느슨하게 부푼 상태","ind":22,"bul":true},{"k":"p","html":"<b>탈당(脫檔):</b> 줄기와 잎의 비율이 적당하지 않아 등급의 균형이 무너진 상태 (어린 아두나 늙은 황편이 지나치게 많이 섞인 경우)","ind":22,"bul":true},{"k":"h2","text":"□ 보이차 탕색 품평 용어"},{"k":"p","html":"보이차를 우려냈을 때 나타나는 탕색(수색)은 찻잎이 세월과 함께 얼마나 후변화(익어감)를 거쳤는지 직관적으로 보여주는 매우 중요한 시각적 지표다. 생차와 숙차는 각각 익어가는 원리가 다르므로 탕색이 변해가는 단계도 뚜렷하게 구분된다.","ind":0,"bul":false},{"k":"p","html":"<b>생차 (효소 산화 및 가수분해):</b> 황녹색 → 녹황색 → 밝은 황색 → 등황색(주황빛 노란색) → 등홍색 → 밝은 홍색의 순서로 점차 붉고 깊게 변해간다.","ind":22,"bul":true},{"k":"p","html":"<b>숙차 (미생물 발효):</b> 엷은 홍색 → 진한 홍색 → 갈홍색(갈색빛 붉은색) → 홍갈색 → 흑갈색의 순서로 점차 어둡고 진하게 변해간다.","ind":22,"bul":true},{"k":"h2","text":"□ Z에 따른 차의 구분"},{"k":"p","html":"보이차는 만들어진 후 흘러간 시간(진기)에 따라 풍미가 극적으로 변하며, 숙성 정도에 따라 크게 다섯 단계로 나눈다.","ind":0,"bul":false},{"k":"p","html":"<b>햇차 (갓 만든 차 ~ 2·3년):</b> 햇볕에 말린 찻잎 특유의 쇄청향과 아직 덜 빠진 풋풋한 풀 비린내가 주된 풍미를 이룬다.","ind":22,"bul":true},{"k":"p","html":"<b>신차 (3 ~ 7년 무렵):</b> 풀 향이 걷히고 차 고유의 향긋한 꽃 향과 단 향, 꿀 향이 매력적으로 드러나기 시작한다.","ind":22,"bul":true},{"k":"p","html":"<b>중기차 (10년 안팎):</b> 꿀 같은 밀향이 더욱 도드라지며, 세월의 더께가 앉은 묵직한 목질향(나무 향)과 약향이 생겨난다.","ind":22,"bul":true},{"k":"p","html":"<b>준노차 (20년 안팎):</b> 화려했던 꽃 향은 뒤로 물러나고, 깊은 밀향과 목질향, 약향이 전면에 나서며 중후한 느낌을 준다.","ind":22,"bul":true},{"k":"p","html":"<b>노차 (20년 이상):</b> 20년 이상 오랜 세월에 걸쳐 깊게 진화된 차를 말한다.","ind":22,"bul":true},{"k":"h4","text":"노차(老茶)의 기준 연도와 보관 방식의 변화"},{"k":"p","html":"진정한 노차의 기준을 몇 년도 생산분까지로 볼 것인가에 대해서는 오랫동안 논의가 갈려왔다. 대만 차계에서는 전통적으로 1970년 이전에 생산된 차만을 노차로 인정해왔으나, 그 엄격한 기준이 세워진 뒤로도 이미 30년 가까운 세월이 더 흘렀으므로 이제는 2000년대 이전 생산분까지 노차의 범위를 넓혀 보아야 한다는 견해가 지배적이다.","ind":0,"bul":false},{"k":"p","html":"이러한 시대적 구분은 보관 방식의 역사적 변화와도 깊게 맞물려 있다. 찻잎이 쾌적한 환경에서 공기와 만나 서서히 익어가는 &#x27;건창 보관(산화 중심)&#x27;이 시장의 표준으로 완전히 자리 잡은 것은 2000년 이후의 일이다. 반면 1990년대 이전의 골동 차들은 대부분 홍콩과 대만의 고온다습한 &#x27;습창&#x27; 환경에서 미생물 발효를 거치며 묵혀진 경우가 많아, 시대별로 찻잎이 진화해 온 궤적이 확연히 다르다.","ind":0,"bul":false},{"k":"h2","text":"□ 보이차의 시대구분"},{"k":"p","html":"보이차는 생산된 시기와 역사적 배경에 따라 크게 호급차, 인급차, 병급차의 세 시대로 구분한다. 차가 세월을 거치며 진화한(후변화) 정도가 곧 시장 가치를 결정하기 때문에, 이 시대 구분은 골동 차를 감정하고 거래하는 가장 중요한 척도로 쓰인다.","ind":0,"bul":false},{"k":"p","html":"호급차(號級茶, 청 말 ~ 1949년 무렵)","ind":22,"bul":true},{"k":"p","html":"&#x27;골동보이(古董普洱)&#x27;라고도 불리는 가장 오래된 시대의 차다. 국가가 아닌 개인 상인이나 민간 차장들이 만들었으며, 동경호, 복원창호, 송빙호처럼 상호 이름이 &#x27;~호(號)&#x27;로 끝나기 때문에 호급차라는 이름이 붙었다. 이 시기의 차들은 주로 이무 지역의 찻잎으로 만들어졌다.","ind":40,"bul":true},{"k":"p","html":"낱개의 차를 감싸는 하얀 종이 포장(외피) 없이 일곱 편의 떡차를 한꺼번에 죽순 껍질로 싼 뒤 대나무 통에 넣고, 차통 안에 내비(상표) 한 장만 넣는 전통 방식을 따랐다.","ind":40,"bul":true},{"k":"p","html":"시대 말기인 1939년에 불해차창(현재의 맹해차창)이 설립되면서 훗날 국영 생산으로 넘어가는 기틀이 마련되었다.","ind":40,"bul":true},{"k":"p","html":"인급차(印級茶, 1952년 ~ 1972년)","ind":22,"bul":true},{"k":"p","html":"민간 상호가 사라지고 철저히 국영화된 체제에서 생산된 시대의 차다. 겉포장지에 번체자로 &#x27;중차패원차(中茶牌圓茶)&#x27; 및 &#x27;중국차엽공사 운남성공사&#x27;라는 문구가 인쇄되었고, 한가운데에는 여덟 개의 &#x27;중(中)&#x27; 자가 둥글게 둘러싼 &#x27;팔중차&#x27; 상표가 들어갔다.","ind":40,"bul":true},{"k":"p","html":"특히 그 상표 가운데 놓인 &#x27;차(茶)&#x27; 글자를 수작업으로 찍어낸 도장(인쇄) 색깔에 따라 홍인, 녹인, 남인, 황인으로 구분하여 불렀는데, &#x27;인급차&#x27;라는 명칭 역시 이 도장(인)에서 유래했다.","ind":40,"bul":true},{"k":"p","html":"대표적인 명차로는 &#x27;대홍인&#x27;이 있으며, 이 시기부터 찻잎 원료의 중심지가 이무에서 맹해 지역으로 옮겨가게 된다.","ind":40,"bul":true},{"k":"p","html":"병급차(餠級茶, 1972년 이후)","ind":22,"bul":true},{"k":"p","html":"1972년 &#x27;중국토산축산수출입공사 운남차엽분공사&#x27;가 설립되어 운남성이 독자적인 차 수출권을 획득하게 된 때를 기점으로 한다. 이때부터 포장지의 표기가 기존의 &#x27;중차패원차&#x27;에서 오늘날 우리에게 익숙한 &#x27;운남칠자병차(雲南七子餠茶)&#x27;로 바뀌었다.","ind":40,"bul":true},{"k":"p","html":"가장 큰 특징은 수출용 차에 맥호(唛號)라는 고유 번호가 붙기 시작했다는 점이다. 맥호는 보통 &#x27;7542&#x27;처럼 네 자리 숫자로 표기되는데, 여기에는 다음과 같은 규칙이 숨어 있다.","ind":40,"bul":true},{"k":"p","html":"<b>앞 두 자리 (75):</b> 해당 찻잎 배합(블렌딩 레시피)이 처음 만들어진 연도","ind":56,"bul":true},{"k":"p","html":"<b>세 번째 자리 (4):</b> 사용된 찻잎 원료의 종합적인 등급","ind":56,"bul":true},{"k":"p","html":"<b>네 번째 자리 (2):</b> 차를 생산한 국영 차창의 고유 번호 (1번: 곤명차창, 2번: 맹해차창, 3번: 하관차창, 4번: 보이차창)","ind":56,"bul":true},{"k":"h1","text":"5강"},{"k":"h2","text":"□ 보이차 향기 품평의 순서"},{"k":"p","html":"보이차의 향기 심평은 배저향(날숨의 향)을 주된 대상으로 하며, 열향·온향·냉향의 3단계로 나누어 3초 내외로 향을 맡은 후 이를 종합적으로 평가한다.","ind":0,"bul":false},{"k":"p","html":"열향(熱香, 55℃ 전후)","ind":22,"bul":true},{"k":"p","html":"가장 뜨거울 때 맡는 향","ind":40,"bul":true},{"k":"p","html":"주로 차에 섞인 불쾌한 잡내나 이취를 1차로 가려냄","ind":40,"bul":true},{"k":"p","html":"온향(溫香)","ind":22,"bul":true},{"k":"p","html":"온도가 적당히 내려가며 드러나는 차 고유의 향","ind":40,"bul":true},{"k":"p","html":"해당 차의 품종 고유의 향(품종향), 채엽 시기(계절향), 산지의 특성(지역향)을 중점적으로 파악","ind":40,"bul":true},{"k":"p","html":"냉향(冷香, 30℃ 전후)","ind":22,"bul":true},{"k":"p","html":"찻물이 차게 식은 뒤에 남은 향","ind":40,"bul":true},{"k":"p","html":"향기가 얼마나 오래 머무르는가 하는 &#x27;향의 지속력&#x27;을 평가","ind":40,"bul":true},{"k":"h2","text":"□ 보이차 향기 품평 용어 1 — 향기의 종류 표현"},{"k":"h3","text":"1. 청향(淸香) 계열 : 맑고 신선한 느낌의 향"},{"k":"p","html":"<b>청향(淸香):</b> 맑고 깨끗한 향","ind":22,"bul":true},{"k":"p","html":"<b>청순향(淸純香):</b> 순정함을 강조한 맑은 향","ind":22,"bul":true},{"k":"p","html":"<b>눈향(嫩香):</b> 어린싹에서 나는 부드러운 향","ind":22,"bul":true},{"k":"p","html":"<b>호향(毫香):</b> 솜털(백호)이 덮인 잎에서 나는 신선한 향","ind":22,"bul":true},{"k":"h3","text":"2. 첨향(甛香) 계열 : 달콤한 향"},{"k":"p","html":"<b>첨향(甛香):</b> 단 향","ind":22,"bul":true},{"k":"p","html":"<b>첨순향(甛純香):</b> 순수하게 단 향","ind":22,"bul":true},{"k":"p","html":"<b>청첨향(淸甛香):</b> 맑고 단 향","ind":22,"bul":true},{"k":"p","html":"<b>과첨향(果甛香):</b> 과일처럼 달콤한 향","ind":22,"bul":true},{"k":"p","html":"<b>밀첨향(蜜甛香):</b> 꿀처럼 달콤한 향","ind":22,"bul":true},{"k":"p","html":"<b>밀향(蜜香):</b> 꿀 향","ind":22,"bul":true},{"k":"p","html":"<b>당향(糖香):</b> 단 향 (설탕 계열)","ind":22,"bul":true},{"k":"p","html":"<b>초당향(焦糖香):</b> 불에 태운 듯한 단 향 (카라멜 향)","ind":22,"bul":true},{"k":"p","html":"<b>빙당향(氷糖香):</b> 얼음사탕처럼 깔끔하고 맑은 단 향 (다소 인공적인 단 향)","ind":22,"bul":true},{"k":"h3","text":"3. 화향(花香) 계열 : 꽃 향"},{"k":"p","html":"<b>화향(花香):</b> 일반적인 꽃 향","ind":22,"bul":true},{"k":"p","html":"<b>화분향(花粉香):</b> 짙고 농후한 꽃 향","ind":22,"bul":true},{"k":"p","html":"<b>야화향(野花香):</b> 야생적인 꽃 향","ind":22,"bul":true},{"k":"p","html":"<b>난화향(蘭花香):</b> 난초처럼 순정하고 깨끗한 향","ind":22,"bul":true},{"k":"p","html":"<b>유향(幽香):</b> 은은하고 그윽한 향","ind":22,"bul":true},{"k":"p","html":"<b>계화향(桂花香):</b> 짙은 노란 꽃(금목서) 향","ind":22,"bul":true},{"k":"note","html":"※ 발현 예시: 이 계열은 다양한 차에서 발현되며, 만송 차에서는 흰 꽃 느낌이, 석문감 차에서는 노란 꽃 느낌과 밀첨향·첨순향이 섞여 나타남","ind":22,"bul":false},{"k":"h3","text":"4. 화과향(花果香) 계열 : 꽃과 과일이 어우러진 향"},{"k":"p","html":"<b>화과향(花果香):</b> 찻잎에서 꽃 향과 과일 향이 복합적으로 어우러져 나는 향 (대만의 동방미인, 운남 이무 지역 차 등에서 주로 발현)","ind":22,"bul":true},{"k":"h3","text":"5. 과소향(果蔬香) 계열 : 과일 및 곡물 향"},{"k":"p","html":"<b>두향(豆香):</b> 고소한 콩 향","ind":22,"bul":true},{"k":"p","html":"<b>옥미향(玉米香):</b> 옥수수 향","ind":22,"bul":true},{"k":"p","html":"<b>홍서향(紅薯香):</b> 구수한 고구마 향 (주로 운남 홍차인 전홍에서 두드러짐)","ind":22,"bul":true},{"k":"p","html":"<b>나향(糯香):</b> 구수한 찹쌀 향","ind":22,"bul":true},{"k":"p","html":"<b>건과향(乾果香):</b> 고소한 견과류 향","ind":22,"bul":true},{"k":"p","html":"<b>과향(果香) / 야과향(野果香):</b> 일반적인 과일 향 / 야생 과일 향","ind":22,"bul":true},{"k":"p","html":"<b>매자향(梅子香):</b> 기분 좋은 산도가 있는 매실(자두) 향 (주로 찻잎이 진화하며 후천적으로 생성됨)","ind":22,"bul":true},{"k":"h3","text":"6. 진향(陳香) 계열 : 세월이 지나며 묵으면서 생기는 향 (주로 노차)"},{"k":"p","html":"<b>진향(陳香):</b> 장향, 조향, 삼향이 복합적으로 어우러진 스파이시하면서도 시원한 묵은 향","ind":22,"bul":true},{"k":"p","html":"<b>장향(樟香):</b> 녹장나무에서 나는 맵고 시원한 멘톨 향 (파스 향)","ind":22,"bul":true},{"k":"p","html":"<b>약향(藥香):</b> 나무의 목질 향과 꿀 향이 결합된 한약재 향","ind":22,"bul":true},{"k":"p","html":"<b>목향(木香):</b> 나무 자체의 묵직한 목질 향","ind":22,"bul":true},{"k":"p","html":"<b>조향(棗香):</b> 달큰한 대추 향","ind":22,"bul":true},{"k":"p","html":"<b>삼향(蔘香):</b> 깊은 인삼 향","ind":22,"bul":true},{"k":"p","html":"<b>밀산향(蜜酸香):</b> 꿀 향(밀향)과 산도가 결합된 향 (주로 잘 익은 차에서 발현)","ind":22,"bul":true},{"k":"h3","text":"7. 연향(烟香) 계열 : 훈연(스모키) 향"},{"k":"p","html":"<b>연향(烟香):</b> 긍정적으로 평가되는 기분 좋은 연기 향","ind":22,"bul":true},{"k":"p","html":"<b>연미(烟味):</b> 가공 시의 문제로 인해 부정적으로 평가되는 탄내나 매연 향","ind":22,"bul":true},{"k":"p","html":"<b>송향(松香):</b> 소나무 장작 연기 향","ind":22,"bul":true},{"k":"h2","text":"□ 보이차 향기 품평 용어 2 — 향기의 정도 표현"},{"k":"h3","text":"1. 지나치게 짙고 자극적인 상태 (부정적 뉘앙스)"},{"k":"p","html":"<b>농렬(濃烈):</b> 향기가 과도하게 진하고 강렬하여 오히려 불쾌하게 찌르는 듯한 상태","ind":22,"bul":true},{"k":"p","html":"<b>농욱(濃郁):</b> 향기가 지나치게 짙고 무거워 꽉 막힌 듯 답답하게 느껴지는 상태","ind":22,"bul":true},{"k":"h3","text":"2. 맑고 풍부하게 뻗어나가는 상태 (긍정적 뉘앙스)"},{"k":"p","html":"<b>복욱(馥郁):</b> 우아하고 그윽한 향기가 매우 풍부하게 오래 지속되는 상태","ind":22,"bul":true},{"k":"note","html":"※ 가장 좋은 최고조의 표현","ind":22,"bul":false},{"k":"p","html":"<b>고양(高揚):</b> 향기가 밖으로 높이 솟아오르는 듯 시원하고 강렬하게 발산되는 상태","ind":22,"bul":true},{"k":"p","html":"<b>청고(淸高):</b> 향기가 티 없이 맑고 순수하며 기품 있게 위로 뻗어나가는 상태","ind":22,"bul":true},{"k":"h3","text":"3. 안정적이거나 가라앉는 상태 (차분한 뉘앙스)"},{"k":"p","html":"<b>순정(純正):</b> 어떠한 잡향도 섞이지 않고 순수하며 깨끗하게 느껴지는 상태","ind":22,"bul":true},{"k":"p","html":"<b>평순(平純):</b> 향기가 크게 튀지 않고 안정적이며, 부드럽고 조화로운 상태","ind":22,"bul":true},{"k":"p","html":"<b>저평(低平):</b> 향기의 강도가 낮고 은은하여 위로 피어오르지 못하고 평탄하게 깔리는 듯한 상태","ind":22,"bul":true},{"k":"p","html":"<b>저침(低沈):</b> 향기가 무겁고 깊어 밖으로 발산되지 못한 채 아래로 가라앉는 듯한 상태","ind":22,"bul":true},{"k":"h2","text":"□ 보이차 엽저 품평 용어"},{"k":"h3","text":"1. 엽저의 색상 표현 (바탕색과 띠는 빛깔)"},{"k":"p","html":"<b>녹황(綠黃):</b> 녹색 빛이 도는 황색 (바탕이 황색)","ind":22,"bul":true},{"k":"p","html":"<b>황녹(黃綠):</b> 황색 빛이 도는 녹색 (바탕이 녹색)","ind":22,"bul":true},{"k":"p","html":"<b>홍갈(紅褐):</b> 붉은 빛이 도는 갈색 (바탕이 갈색)","ind":22,"bul":true},{"k":"p","html":"<b>갈홍(褐紅):</b> 갈색 빛이 도는 붉은색 (바탕이 붉은색)","ind":22,"bul":true},{"k":"h3","text":"2. 엽저의 균일도와 부정적 상태 (제다 및 선별 불량)"},{"k":"p","html":"<b>화청(花靑):</b> 엽저의 색이 고르지 못하고 알록달록한 상태 (제다 과정의 균질성이 떨어지거나, 서로 다른 품질의 잎이 섞여 있음을 지적하는 부정적 용어)","ind":22,"bul":true},{"k":"p","html":"<b>화잡(花雜):</b> 찻잎과 줄기의 배합이 고르지 않고 지저분한 상태 (가공 과정에서 크기를 분류하고 이물질을 솎아내는 '사분간척(篩分揀剔)'이 제대로 이루어지지 않았음을 의미)","ind":22,"bul":true},{"k":"h3","text":"3. 엽저의 여린 정도와 긍정적 상태"},{"k":"p","html":"<b>눈균(嫩均):</b> 어린싹이 고르고 균질하게 우러나온 상태 (잎이 전체적으로 여리고 부드러우며 형태가 가지런함)","ind":22,"bul":true},{"k":"p","html":"<b>눈연(嫩軟):</b> 어린싹이 뻣뻣하지 않고 유연하며 부드럽게 우러나온 상태","ind":22,"bul":true},{"k":"h2","text":"□ 성차사의 역사"},{"k":"p","html":"&#x27;성차사&#x27; 또는 &#x27;성공사&#x27;는 1938년부터 오늘날에 이르기까지 각 시기별 운남성국영차엽회사를 간략히 통칭하여 부르는 용어이다. 과거 융성했던 시절의 명칭으로, 중앙의 &#x27;총공사&#x27; 밑에 소속된 &#x27;운남성 지사(운남성공사)&#x27; 격의 지위를 갖는다. 1938년 항일전쟁 당시, 국가의 자금을 마련하기 위한 목적으로 처음 세워졌다.","ind":0,"bul":false},{"k":"p","html":"시기별 명칭 변경 타임라인","ind":22,"bul":true},{"k":"p","html":"<b>1938년 12월 16일:</b> 운남중국차엽무역고분유한공사","ind":40,"bul":true},{"k":"p","html":"처음 업무를 시작했을 당시의 명칭이다.","ind":56,"bul":true},{"k":"p","html":"<b>1944년:</b> 운남중국차엽무역공사","ind":40,"bul":true},{"k":"p","html":"<b>1950년 9월:</b> 중국차업공사 운남성공사","ind":40,"bul":true},{"k":"p","html":"중화인민공화국(신중국) 성립 이후 개명되었다.","ind":56,"bul":true},{"k":"p","html":"<b>구조:</b> '중국차업공사'가 중앙 총공사, '운남성공사'가 지사","ind":56,"bul":true},{"k":"p","html":"<b>1972년 6월:</b> 중국토산축산진출구총공사 운남차엽분공사","ind":40,"bul":true},{"k":"p","html":"대약진운동과 문화대혁명의 혼란기를 거친 후 재탄생한 명칭이다.","ind":56,"bul":true},{"k":"p","html":"<b>구조:</b> '~총공사'가 중앙 본사, '~분공사'가 지사","ind":56,"bul":true},{"k":"p","html":"<b>1992년 이후 ~ 현재:</b> 중국토산축산운남차엽진출구공사 (약칭: 중차공사)","ind":40,"bul":true},{"k":"p","html":"1991년에 개명되어 1992년부터 현재까지 사용 중인 명칭이다. 이 역시 운남성의 지사 역할을 수행한다.","ind":40,"bul":true},{"k":"note","html":"※ Part.6 부록 「맹해정창 특강」의 '1972년 중국토산축산 진출구 총공사 운남차엽분공사로 개칭', Part.6 시대차품 1강의 '운남성차엽공사 — 이름이 계속 바뀜'과 직접 연관."},{"k":"h2","text":"□ 운남 지역 국영차창의 설립 배경"},{"k":"p","html":"운남 지역의 국영차창 설립은 단순한 기업 창립을 넘어, 차엽 수출을 통해 전시 재정을 메우고자 한 중앙정부의 전략적 결정이었다. 1939년 중국차엽공사는 맹해 지역에 불해실험차창(佛海實驗茶廠) 건립에 착수했으며, 프랑스 유학파 범화균(范和鈞)과 청화대 출신 장식성(張石城)을 파견하여 이를 주도하게 했다. 1940년에 공장이 완공되어 첫 &#x27;중차패 원차&#x27;를 시제했고, 1950년대부터 본격적인 생산 궤도에 올랐다. 이후 1990년대에 접어들면서 민영 차창들이 다시 등장하기 시작했다.","ind":0,"bul":false},{"k":"note","html":"※ Part.6 부록 「맹해정창 특강」의 설립 초기 서술과 겹친다."},{"k":"h2","text":"□ 곤명차창"},{"k":"p","html":"운남성 성도에 위치한 곤명차창(1번 차창)은 상급 기관인 성차사 바로 옆에 자리하여 주로 연구 개발을 담당했다. 성차사에 의해 1939년 10월 &#x27;복흥차창&#x27;으로 설립되었으나, 신중국 성립 과정에서 여러 차례의 가동 중지와 개명을 거쳐 1960년 &#x27;운남곤명차창&#x27;으로 새로이 출발하게 되었다. 초기에는 생산량이 극히 적었고, 1965년에 이르러서야 비로소 250g의 방차와 전차를 운남 북부의 소수민족과 서장 지역에 공급했다. 이후 다른 국영차창들과 연합하여 1973년 숙차 만들기 등의 조수악퇴기술을 개발했다. 1994년 이전까지는 &#x27;7581 숙전&#x27;을 주 생산품으로 하였고 &#x27;금개패&#x27;를 주요 수출 품편으로 이용했다. 그러나 92년 원가 상승과 차청 조달의 어려움으로 영업 중단을 선언하였고 94년부터 공장은 폐쇄되었다가, 06년을 전후하여 공장을 재가동시켜 보이차를 다시 생산하기 시작했다.","ind":0,"bul":false},{"k":"h2","text":"□ 맹해차창"},{"k":"p","html":"맹해차창(2번 차창)은 핵심 생산 시설로서 홍콩 등지로의 수출 수요가 많아 연장 근무를 할 만큼 대량 생산을 도맡았다. 맹해차창은 1939년 운남중국차엽공사가 당시의 불해에 실험차창을 설립한 것에서 시작된다. 1940년 정식으로 불해실험차창을 발족하였으나 1941년 태평양전쟁으로 생산이 중단되었고, 신중국 성립 후인 51년부터 소량의 차엽 생산을 재개했다. 54년 &#x27;운남성공사서쌍판납차창&#x27;으로 이름을 바꾸었으며, 56년 &#x27;사모전구 맹해차창&#x27;으로 개명한 뒤에는 청모차 등을 광동성차엽공사로 보내어 수출 및 재가공 판매하였다. 1957년부터 설비를 개혁하고 가공능력을 증가시킨 맹해차창은 새로운 긴압차 신제품을 본격적으로 출시했다. 73년 악퇴 기술이 개발된 이후 74년에 숙차를 시험 생산하였고, 76년부터는 맥호의 표시가 사용되었으며 이후 숙차의 생산량이 급등했다. 1982년에는 1970년부터 사용해 오던 &#x27;맹해현차창&#x27;이라는 이름을 &#x27;맹해차창&#x27;으로 바꾸었고, 85년에는 홍콩 남천공사의 요청으로 8582와 8592를 처음 생산했다. 88년 파달과 포랑에 자체 다원을 확보하였고, 89년에는 &#x27;대익&#x27; 상표를 정식 등록함으로써 자체 상표를 사용하기 시작했다. 이후 성공사는 04년 운남박문투자유한공사에 차창을 매각함으로써 맹해차창은 창립 64년 만에 민영화의 길로 접어든다.","ind":0,"bul":false},{"k":"h1","text":"6강"},{"k":"h2","text":"□ 하관차창의 역사"},{"k":"p","html":"하관차창은 1941년 대리시 하관에 세워진 강장차창(康藏茶廠)을 전신으로 한다. 초기에는 보염패(寶焰牌) 상표를 달고 티베트와 사천으로 보내는 긴차와 타차를 주로 생산했다. 이때 긴차를 만들며 축적한 증기 후발효 경험은 훗날 숙차 발효의 핵심인 악퇴 기술의 중요한 밑거름이 되었다. 1976년에는 프랑스 수출용 숙타차 &#x27;7663&#x27;을 생산했고, 같은 해 제정된 맥호 체계에 따라 하관차창 제품에는 끝자리 번호 &#x27;3&#x27;이 부여되었다. 1990년 보염패와 송학패(松鶴牌)를 정식 상표로 등록해 사용하다가, 2004년 4월에 민영화되면서 국영 차창으로서의 역사를 마감했다.","ind":0,"bul":false},{"k":"note","html":"※ Part.3 3강 복습 Quiz 1(하관차창의 긴차형 긴압차 생산 중단과 86년 재생산)의 배경이 되는 내용이다."},{"k":"h2","text":"□ 여명차창의 역사"},{"k":"p","html":"여명차창은 1955년 홍군 출신 노병들이 세워 군에 보급품을 조달하던 국영여명농장(國營黎明農場)에서 출발했다. 1986년에 차창을 준공한 뒤 2000년까지는 주로 녹차와 전홍(운남 홍차) 생산에 주력했다. 1998년 팔각정(八角亭) 상표를 등록했으며, 2000년 말에 이르러서야 보이차를 시험 제작하여 본격적으로 시장에 내놓기 시작했다.","ind":0,"bul":false},{"k":"p","html":"&lt;현대숙차의 성립&gt; 1973년 운남성차엽공사는 홍콩 시장에서 붉은 탕색으로 발효된 차를 선호한다는 점을 파악하고, 곤명·맹해·하관 세 차창에서 7인 소조를 꾸려 광주차창으로 악퇴 발효 기술을 배우러 보냈다. 같은 시기 곤명차창의 노차사 진패인(陳佩仁)은 해방 전의 경험을 살려 독자적인 시제를 자청했고, 전통 방식으로 1톤가량의 찻잎을 발효해 내며 선제적으로 수출에 성공했다. 광주에서 배워온 발효 방식은 곤명의 건조한 기후와 맞지 않아 여러 차례 조정을 거쳐야 했다. 이 첫 시도를 기점으로 1973년을 &#x27;숙차 원년&#x27;으로 부르지만, 이때 공정이 완전히 정립된 것은 아니었다. 이후 2년간의 지속적인 개량을 거친 끝에 1975년에 이르러서야 세 차창의 숙차 발효 기술이 각자의 자리를 확고히 잡게 되었다.","ind":0,"bul":false},{"k":"h2","text":"□ 맛에 대한 기본적 이해"},{"k":"p","html":"인간이 느끼는 맛은 단맛, 신맛, 쓴맛, 짠맛, 그리고 1900년대 이후 일본에서 우마미로 정의된 감칠맛의 다섯 가지로 구성된다. 감칠맛은 주로 아미노산에 의해 느껴지며, 아미노산은 낮은 온도에서 잘 우러난다. 떫은맛은 맛이라기보다는 카테킨이나 탄닌이 유기물과 결합하여 느껴지는 입안의 저릿한 감촉에 가깝다.","ind":0,"bul":false},{"k":"h2","text":"□ 맛의 전달 과정"},{"k":"p","html":"차의 수용성 물질은 미각 세포(미각 수용체)를 자극하고, 이는 미각 신경을 거쳐 신경 중추와 대뇌피층으로 전달되어 미각을 인지하게 된다. 미각 신경부터 전기적 반응이 일어나는 것이다.","ind":0,"bul":false},{"k":"h2","text":"□ 맛의 품평 요령"},{"k":"p","html":"맛을 품평할 때는 찻물의 온도를 45~55℃ 정도로 식혀서 마시는 것이 가장 좋으며, 이보다 뜨거우면 맛을 잘 느끼기 어렵다. 음차량은 5~10g이 적당하며, 40cc 잔에 담아 살짝 머금고 입 전체에 굴려 맛을 본다.","ind":0,"bul":false},{"k":"h2","text":"□ 보이차 맛 품평의 대상과 기준"},{"k":"p","html":"보이차 맛 심평의 주된 대상은 탕질(湯質)과 차탕의 맛이며, 여러 층차감(層次感)을 종합적으로 판단해야 한다.","ind":0,"bul":false},{"k":"h2","text":"□ 보이차 맛 품평 용어 1 — 탕질의 표현"},{"k":"p","html":"<b>농강(濃强):</b> 농도와 강도가 모두 높은 상태로, 수령이 낮은 차에서 주로 나타난다.","ind":22,"bul":true},{"k":"p","html":"<b>농순(濃醇):</b> 농도는 높고 강도는 낮은 상태다.","ind":22,"bul":true},{"k":"p","html":"<b>순후(醇厚):</b> 두터우면서도 부드러운 여운이 일정 시간 느껴지는 자극도를 가진 상태다.","ind":22,"bul":true},{"k":"p","html":"<b>순정(純正):</b> 이질적인 잡맛 없이 맑고 바르며 부드러운 상태다. (좋은 차의 주요 기준이 된다.)","ind":22,"bul":true},{"k":"p","html":"<b>선상(鮮爽):</b> 일반적인 느낌에서 신선하고 상쾌한 정도를 나타낸다.","ind":22,"bul":true},{"k":"p","html":"<b>순화(醇和):</b> 자극성이 없고 입안에서 매우 순하고 부드럽게 느껴지는 상태다.","ind":22,"bul":true},{"k":"p","html":"<b>평화(平和):</b> 맛이 평범하고 밋밋하여 찻물로서의 자극성이나 특징이 다소 부족한 상태다.","ind":22,"bul":true},{"k":"p","html":"<b>평담(平淡):</b> 개성이 뚜렷하지 않고 묽으며 평이한 상태를 의미한다.","ind":22,"bul":true},{"k":"p","html":"<b>수미(水味):</b> 차라리 맹물이 더 낫다고 느껴질 정도로 차의 유효 성분과 맛이 부족한 상태를 뜻한다.","ind":22,"bul":true},{"k":"h2","text":"□ 보이차 맛 품평 용어 2 — 맛의 종류 표현"},{"k":"p","html":"<b>고미(苦味):</b> 쓴맛을 나타낸다.","ind":22,"bul":true},{"k":"p","html":"<b>삽미(澁味):</b> 입이 저릿한 느낌의 떫은맛을 나타낸다.","ind":22,"bul":true},{"k":"p","html":"<b>청미(靑味):</b> 찻물이 엷어 풀 비린 맛이 강하게 올라오는 상태를 말하며, 살청이 잘못되어 시간이 지나도 없어지지 않는 부정적인 맛이다.","ind":22,"bul":true},{"k":"note","html":"※ Part.2 6강 「완성차의 품질 저하 요소 — 라. 청엽미(靑葉味)」와 같은 개념이다."}]}]);
</script>
<script>window.__TEA_LESSONS=(window.__TEA_LESSONS||[]).concat([{"id":"p2","label":"보이차 Part.2","blocks":[{"k":"h1","text":"1 & 2강"},{"k":"p","html":"차나무의 수령과 관련하여 다양하게 사용되는 용어의 의미를 이해하고, 고수차의 정의 및 순료 고수차가 가져야 할 품질 기준을 정립한다.","ind":0,"bul":false},{"k":"h2","text":"□ 고수차의 정의"},{"k":"p","html":"X[원료] · Y[가공] · Z[보관(시간, 환경)]의 세 축으로 본다.","ind":0,"bul":false},{"k":"p","html":"<b>원료:</b> 회감, 생진, 목넘김, 체감이 좋다. 수령과 환경, 품종의 영향을 받는다.","ind":22,"bul":true},{"k":"p","html":"찻잎(X) + 제다(Y) = 차(X, Y)","ind":22,"bul":true},{"k":"p","html":"일반적으로 「100년 이상 수령을 가진, 유성생식에 의한 재래종 차나무」를 고차수라고 부르며, 이러한 고차수의 잎을 채엽하여 만든 차를 고수차라고 한다. 즉 고수차는 고수 모료를 기초로 하여 각종의 차류의 재차법을 적용하여 가공한 차의 총체이다.","ind":22,"bul":true},{"k":"p","html":"운남성 고차수보호조례 2022년 11월 30일 통과, 23년 3월 1일부터 시행. 고차수는 운남성에 90%, 나머지 중국 지역에 10% 존재. 대엽종 고차수는 '-주'라고 하고, 중소엽종 고차수는 '-총'이라고 한다. ex) 단주, 노총","ind":22,"bul":true},{"k":"h3","text":"1. 관련 규정과 6대 다류 분류법과의 구분"},{"k":"h3","text":"2. 보이차의 생산 및 유통에 관한 패러다임의 변화"},{"k":"note","html":"※ 2항은 Part.6 시대차품 1강 「차에 대한 접근 관점」·「보이차 이해의 기본 index」에서 다시 다뤄진다. 창고 중심에서 원료 중심으로 넘어가는 흐름이 그것이다."},{"k":"h2","text":"□ 차나무의 분류"},{"k":"p","html":"라틴 학명은 Camellia sinensis L. / 동백나무속 차나무과 진달래목에 속하는 속씨식물.","ind":0,"bul":false},{"k":"p","html":"분류학의 기초를 만들어낸 칼 폰 린네의 약자 ⟨Carl von Linné, 1707~1778⟩","ind":22,"bul":true},{"k":"p","html":"린네가 Thea sinensis를 발표한 것은 『식물의 종』 초판이 나온 1753년이고, 오토 쿤츠가 Camellia sinensis (L.) Kuntze로 재분류한 것은 1887년이다.","ind":22,"bul":true},{"k":"h3","text":"1. 테아 시넨시스 Thea sinensis"},{"k":"p","html":"1700년대 칼 폰 린네가 단순히 '중국에서 차로 마시는 나무'라는 뜻으로 지었다.","ind":0,"bul":false},{"k":"h3","text":"2. 카멜리아 시넨시스 (L) 오토 쿤츠"},{"k":"p","html":"오토 칼 에른스트 쿤츠가 동백나무와 유전적으로 유사함을 밝혀내서 이명법(종속의 개념으로 명명)으로 재구분했다.","ind":0,"bul":false},{"k":"h2","text":"□ 차나무의 기원"},{"k":"p","html":"차수일원 — 차나무의 기원은 하나이다.","ind":22,"bul":true},{"k":"p","html":"차나무의 세대 진화","ind":22,"bul":true},{"k":"p","html":"<b>1~2세대:</b> 화석으로만 존재 (관/중엽 목란)","ind":40,"bul":true},{"k":"p","html":"<b>3세대 야생고차수:</b> 향이 많지만 독성이 있고 맛이 없다. → 5세대와의 개량용으로 쓴다. 야생고차수는 수령이 높아도 의미가 없기 때문에 값이 싸다.","ind":40,"bul":true},{"k":"p","html":"<b>4세대 과도형고차수:</b> 뿌리는 3세대, 생식기관은 5세대.","ind":40,"bul":true},{"k":"p","html":"<b>5세대 재배형고차수:</b> 유성생식 또는 개량을 통해 맛이 풍성해지고 독성이 줄어든다.","ind":40,"bul":true},{"k":"p","html":"cf) 역사적으로 다원 조성은 800~1000년 이내에 이루어졌기 때문에 차왕수는 최대 800년 정도이다.","ind":22,"bul":true},{"k":"note","html":"※ Part.3 1강 「나. 고 6대 차산의 개발」의 “800년 전, 원나라 초기에 차나무를 심었다고 추정”과 같은 근거다."},{"k":"h2","text":"□ 차나무의 세대 진화"},{"k":"p","html":"5세동당, 5세차조","ind":0,"bul":false},{"k":"p","html":"<b>인도 아쌈 기원설 제기:</b> 1823년 영국 로버트 브루스 소령이 아쌈에서 600년 수령의 야생 차나무를 발견했다. (1830년대 동생 찰스를 통해 학계에 정식 보고됨)","ind":22,"bul":true},{"k":"p","html":"<b>중국 기원설 반격:</b> 차 종주국의 위상을 되찾기 위해 1960년대부터 1,000~1,500년 수령의 오래된 차나무를 잇달아 발표하여 중국 기원설에 힘을 실었다.","ind":22,"bul":true},{"k":"p","html":"<b>진화의 미싱링크:</b> 당시 발표된 나무들은 3세대 차나무였으므로, 현재 인류가 마시는 5세대 재배형 차나무로 이어지는 유전적 연결고리를 찾아야 하는 과제가 남았다.","ind":22,"bul":true},{"k":"p","html":"<b>4세대 과도형 고차수 발견:</b> 1991년 초, 보이시 방위(邦崴) 지역에서 차농의 제보로 특이한 차나무가 발견되었다. 이를 '4세대 과도형 고차수'로 명명하며 3세대와 5세대를 잇는 진화의 연속성을 완벽히 증명해 냈다.","ind":22,"bul":true},{"k":"p","html":"<b>운남 기원설 확립:</b> 현재 운남성은 차나무의 세대 진화 과정을 입증할 수 있는 유일한 지역이 되었고, 이를 통해 운남 기원설이 학계에서 확고하게 인정받게 되었다.","ind":22,"bul":true},{"k":"h2","text":"□ 교목과 관목의 구분"},{"k":"p","html":"나무가 성숙했을 때의 수고에 따라 구분하는데, 정확한 기준은 없으며 수목 생태를 연구하는 연구자에 따라 약간씩의 차이를 보인다.","ind":0,"bul":false},{"k":"h3","text":"1. 교목"},{"k":"p","html":"주간이 쭉 뻗어 있고 2차 가지인 지간이 나는 형태. 그 모양을 왕관처럼 생겼다고 해서 수관(樹冠)이라고도 한다. 4~5m 이상의 큰 키 나무. 뿌리도 주뿌리+곁뿌리로 이루어져 있다. 주로 대엽종이 많다.","ind":0,"bul":false},{"k":"h3","text":"2. 관목"},{"k":"p","html":"주간이 없고 2차 가지만 있다. 3~5m 이내의 작은 떨기 나무. 주로 중소엽종이 많다.","ind":0,"bul":false},{"k":"h3","text":"3. 만경목 (차나무는 아님)"},{"k":"p","html":"덩굴성 수목.","ind":0,"bul":false},{"k":"h2","text":"□ 차구의 분류"},{"k":"p","html":"중국의 다원은 크게 강북, 강남, 화남, 서남 차구로 구분된다.","ind":0,"bul":false},{"k":"h3","text":"1. 강북차구"},{"k":"h3","text":"2. 강남차구"},{"k":"h3","text":"3. 화남차구"},{"k":"h3","text":"4. 서남차구"},{"k":"p","html":"북고남삽(北苦南澁), 서강동유(西强東柔)","ind":0,"bul":false},{"k":"note","html":"※ Part.1 1 & 2강 「차나무의 재배한계선」의 “장강을 기준으로 나뉜다(강북/강남/화남/서남)”와 같은 분류다."},{"k":"h2","text":"□ 차나무와 관련한 용례의 정의 1"},{"k":"h3","text":"1. 차나무의 수령에 따른 구분"},{"k":"p","html":"차나무의 수령에 따른 구분은 굵은 원줄기인 주간(主幹)의 두께에 의한 구분과 거의 일치한다.","ind":0,"bul":false},{"k":"h4","text":"가. 대수차(大樹茶) 및 고수차(古樹茶)"},{"k":"p","html":"성인이 손으로 주간을 잡았을 때 한 뼘 정도의 둘레가 나오는 크기다. 본래 대수차 중 수령 200년 이상 된 것만 고수차로 엄격히 구분했으나, &#x27;고차수보호조례&#x27; 제정 이후 고수차의 기준이 100년 수령으로 낮아지면서 현재는 사실상 &#x27;대수차 = 고수차&#x27;로 통용된다. 세부적인 수령 구분은 다음과 같다.","ind":0,"bul":false},{"k":"p","html":"<b>100년 이상:</b> 대수","ind":22,"bul":true},{"k":"p","html":"<b>200년 이상:</b> 고수 (과거의 엄격한 기준)","ind":22,"bul":true},{"k":"p","html":"<b>200~300년:</b> 단주급","ind":22,"bul":true},{"k":"p","html":"<b>300~400년:</b> 단주","ind":22,"bul":true},{"k":"p","html":"<b>400~600년 이상:</b> 차왕수","ind":22,"bul":true},{"k":"h4","text":"나. 중수차(中樹茶) 및 노수차(老樹茶)"},{"k":"p","html":"평균적으로 보았을 때 수령 50년 이상을 중수차로 보며, 80년 이상 된 나무는 노수차(또는 준대수차)로 분류한다.","ind":0,"bul":false},{"k":"h4","text":"다. 소수차(小樹茶)"},{"k":"p","html":"평균 수령 20~30년 정도의 차나무다. 1980년대부터 수확량을 늘리기 위해 밀식 재배를 시작한 운남 지역 차나무의 대부분이 이 소수차에 해당한다.","ind":0,"bul":false},{"k":"h3","text":"2. 차나무의 재배 환경에 따른 구분"},{"k":"p","html":"다원의 형태와 사용하는 농법에 따른 분류다.","ind":0,"bul":false},{"k":"table","html":"<table><tr><th><div><b>큰 분류</b></div></th><th><div><b>작은 분류</b></div></th><th><div><b>설명</b></div></th></tr><tr><td><div>재래식다원</div></td><td><div>야화다원</div></td><td><div>소수민족이 필요한 만큼만 키우다가 이주하여 버려진(야생화된) 다원</div></td></tr><tr><td><div>재래식다원</div></td><td><div>원생태다원</div></td><td><div>재래식으로 키우며 사람들이 떠난 적 없이 지속해서 관리해 온 다원</div></td></tr><tr><td><div>재래식다원</div></td><td><div>국유림</div></td><td><div>다원이 위치한 지역이 국가 소유의 산림으로 지정되어 보호받는 곳</div></td></tr><tr><td><div>현대 개량다원</div></td><td><div>밀식재배</div></td><td><div>비료, 농약, 생장촉진제를 사용하여 촘촘하게 기르는 다원 → 대지차(밭차)</div></td></tr><tr><td><div>현대 개량다원</div></td><td><div>소식재배</div></td><td><div>간격을 두고 띄엄띄엄 솎아서 기르는 다원 → 유기농 인증이 가능한 생태차</div></td></tr></table>"},{"k":"h4","text":"가. 대지차"},{"k":"p","html":"현대 개량 다원에서 밀식 재배를 통해 대량 생산한 차로, 흔히 &#x27;밭차&#x27;라고도 부른다.","ind":0,"bul":false},{"k":"h4","text":"나. 생태차"},{"k":"p","html":"현대 개량 다원에서 간격을 넓혀 심는 소식(疏植) 재배 방식으로 기른 차다.","ind":0,"bul":false},{"k":"h4","text":"다. 유기차"},{"k":"p","html":"현대 개량 다원의 소식 재배 중에서도 화학 비료나 농약 없이 유기농법을 적용하여 기른 차다.","ind":0,"bul":false},{"k":"h4","text":"라. 국유림차"},{"k":"p","html":"국가자연보호구역 내의 재래식 다원에서 채엽한 차다. 국가의 사전 허가를 받아야 하며, 산림감독원 동행하에 주로 봄 시즌에만 출입과 채엽이 허용된다. (예: 유명 산지인 노반장 지역에도 이러한 국유림이 일부 존재한다.)","ind":0,"bul":false},{"k":"h3","text":"3. 가지치기 여부에 따른 구분"},{"k":"p","html":"차나무는 가지치기를 하면 생장이 촉진되어 싹이 많이 나는 특성이 있으며, 이러한 인위적인 전지(剪枝) 여부에 따라 다음과 같이 구분한다.","ind":0,"bul":false},{"k":"p","html":"<b>고간차(高杆茶):</b> 가지치기를 하지 않고 자연 상태 그대로 키가 높게 자라도록 둔 교목형 차나무다.","ind":22,"bul":true},{"k":"p","html":"<b>왜화차(矮化茶):</b> 채엽을 쉽게 하고 수확량을 늘리기 위해 주간(원줄기)을 잘라 인위적으로 키를 낮춘(矮化) 교목형 차나무다.","ind":22,"bul":true},{"k":"p","html":"<b>특징:</b> 사람의 접근과 관리가 쉬운 마을 인근일수록 왜화된 나무가 많이 분포한다.","ind":40,"bul":true},{"k":"p","html":"<b>식물학적 성질:</b> 주간을 잘라내어 겉보기에는 키가 작은 관목처럼 보일지라도, 그 가지를 꺾꽂이하여 새로 키우면 본래의 유전적 성질에 따라 다시 교목으로 높게 자라난다.","ind":40,"bul":true},{"k":"p","html":"<b>지역 사례:</b> 이무 마흑(易武 麻黑) 지역의 다원에는 왜화된 차나무가 많고, 상대적으로 고간 형태의 나무는 적은 편이다.","ind":40,"bul":true},{"k":"h2","text":"□ 차나무와 관련한 용례의 정의 2"},{"k":"p","html":"수령 / 재배환경에 따른 활용례.","ind":0,"bul":false},{"k":"h3","text":"1. 수령에 따른 분류"},{"k":"p","html":"<b>유수차(幼樹茶):</b> 수령 2~3년부터 9~10년 이내의 차나무다. 생장 속도가 매우 활발하다.","ind":22,"bul":true},{"k":"p","html":"<b>신수차(新樹茶):</b> 수령 10~30년 이내의 차나무다. 현대 공장차 원료의 대부분을 차지하며 생산 총량이 가장 많다.","ind":22,"bul":true},{"k":"p","html":"<b>소수차(小樹茶):</b> 수령 30~60년 이내의 차나무다. 60~70년대에 심은 생태차가 이에 해당하나, 80년대부터 밀식 재배가 본격화되면서 그 분류적 의미가 다소 퇴색했다.","ind":22,"bul":true},{"k":"p","html":"<b>노수차(老樹茶):</b> 수령 60년 이상 100년 미만의 차나무다.","ind":22,"bul":true},{"k":"p","html":"<b>고수차(古樹茶):</b> 수령 100년 이상의 차나무다. 한 그루당 채엽량이 많지 않아 일반적으로 6그루 정도를 묶어서 함께 제다한다.","ind":22,"bul":true},{"k":"p","html":"<b>단주급(單株級):</b> 수령 200~300년 이내의 차나무다. 나무의 덩치가 커져 단주급 1그루에서 일반 고수차 3그
